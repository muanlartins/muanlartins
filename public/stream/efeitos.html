<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Efeitos · muanlartins</title>
    <link rel="stylesheet" href="stream.css" />
    <!--
      OBS: Custom browser dock (Docks → Custom Browser Docks), off stream; keep it docked where it stays visible,
      since a hidden dock's timers slow down. It drives the stream's effects through obs-websocket, like Partidas:

      - Lance ruim (F2): OBS cuts to the "Lance ruim" scene (the game's, with the camera on top, its sting and
        lance.html's bars); this dock then zooms the camera from its frame to the whole screen, shakes it a little,
        holds 4 s, shrinks it back and cuts to the scene it came from. With "No gol deles", it also fires on
        their goals (Partidas sends them).
      - Terapia (F3): the calm scene (terapia.html), faded in; "Voltar ao jogo" (F4, the main game scene)
        leaves it, faded from here.
      - Sons: the effects made by sons.js, each a media source with its own hotkey (F5–F9, F11, F12), restarted here.

      The scenes' and sounds' hotkeys are OBS's own (brand/twitch/obs.py sets them), so they work with the game
      focused. The OBS websocket password is kept in the dock's storage; #obs=<password> in the URL fills it.
    -->
    <style>
      html,
      body {
        overflow: auto;
        background: var(--navy);
      }
      body {
        padding: 14px;
        font-size: 15px;
        line-height: 1.35;
      }
      h2 {
        margin: 18px 0 8px;
        color: var(--klein-claro);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .status {
        margin: 0;
        color: rgb(244 245 247 / 0.6);
        font-size: 12px;
      }
      .status::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 6px;
        border-radius: 50%;
        background: #ff5a5a;
      }
      .status.on::before {
        background: var(--klein-claro);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
        gap: 6px;
      }
      button {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        font: inherit;
        font-size: 14px;
        color: var(--paper);
        background: rgb(0 47 167 / 0.45);
        border: 1px solid rgb(133 167 255 / 0.4);
        padding: 8px 10px;
        cursor: pointer;
        text-align: left;
      }
      button:hover {
        border-color: var(--klein-claro);
      }
      button.primary {
        background: var(--klein);
        border-color: var(--klein);
      }
      button.active {
        border-color: var(--paper);
        box-shadow: 0 0 0 2px rgb(244 245 247 / 0.35);
      }
      kbd {
        flex: none;
        font: inherit;
        font-size: 11px;
        color: var(--klein-claro);
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        font-size: 14px;
      }
      .note {
        margin: 8px 0 0;
        color: rgb(244 245 247 / 0.55);
        font-size: 12px;
      }
      details {
        margin-top: 18px;
        font-size: 13px;
      }
      details input {
        font: inherit;
        color: var(--paper);
        background: rgb(0 47 167 / 0.45);
        border: 1px solid rgb(133 167 255 / 0.4);
        padding: 6px 9px;
        width: 100%;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <p class="status" id="obs">OBS desconectado</p>

    <h2>Cenas</h2>
    <div class="grid">
      <button class="primary" id="lance">Lance ruim <kbd>F2</kbd></button>
      <button id="terapia">Terapia <kbd>F3</kbd></button>
      <button id="voltar">Voltar ao jogo <kbd>F4</kbd></button>
    </div>
    <label class="check"><input type="checkbox" id="auto-gol" /> Lance ruim no gol deles</label>

    <h2>Sons</h2>
    <div class="grid" id="sons"></div>
    <p class="note">Os atalhos são do próprio OBS: funcionam com o jogo em foco. O volume de cada som fica no mixer.</p>

    <details>
      <summary>Conexão com o OBS</summary>
      <input id="password" type="password" placeholder="Senha do obs-websocket" autocomplete="off" />
    </details>

    <script>
      const $ = (id) => document.getElementById(id)
      const LANCE = "Lance ruim"
      const TERAPIA = "Terapia"
      const MAIN = "Jogo + chat"
      const GAME_SCENES = ["Jogo", "Jogo + chat"]
      const CAMERA = "Câmera"
      const HOLD = 4000
      // Name on the button, OBS's media source (brand/twitch/obs.py) and its hotkey.
      const SONS = [
        ["Palmas", "Som · Palmas", "F5"],
        ["Uuuh", "Som · Uuuh", "F6"],
        ["Buzina", "Som · Buzina", "F7"],
        ["Suspense", "Som · Suspense", "F8"],
        ["Tambor", "Som · Tambor", "F9"],
        ["Ba-dum-tss", "Som · Ba-dum-tss", "F11"],
        ["Boing", "Som · Boing", "F12"],
      ]

      const KEY = "efeitos"
      const state = { obsPassword: "", autoGol: false, ...JSON.parse(localStorage.getItem(KEY) || "{}") }
      const save = () => localStorage.setItem(KEY, JSON.stringify(state))
      const fromHash = new URLSearchParams(location.hash.slice(1)).get("obs")
      if (fromHash) {
        state.obsPassword = fromHash
        save()
        history.replaceState(null, "", location.pathname + location.search)
      }
      $("password").value = state.obsPassword
      $("password").onchange = (e) => {
        state.obsPassword = e.target.value
        save()
        obs?.close()
      }
      $("auto-gol").checked = state.autoGol
      $("auto-gol").onchange = (e) => {
        state.autoGol = e.target.checked
        save()
      }

      // --- obs-websocket --------------------------------------------------------------------------------------
      let obs = null
      let ready = false
      let requests = 0
      const pending = new Map()
      const GENERAL = 1 << 0
      const SCENES = 1 << 2
      const sha256 = async (text) => btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)))))
      function connect() {
        const ws = new WebSocket("ws://127.0.0.1:4455")
        obs = ws
        ws.onmessage = async ({ data }) => {
          const { op, d } = JSON.parse(data)
          if (op === 0) {
            const identify = { rpcVersion: 1, eventSubscriptions: GENERAL | SCENES }
            if (d.authentication) {
              const { challenge, salt } = d.authentication
              identify.authentication = await sha256((await sha256(state.obsPassword + salt)) + challenge)
            }
            ws.send(JSON.stringify({ op: 1, d: identify }))
          } else if (op === 2) {
            ready = true
            status()
            const scene = await request("GetCurrentProgramScene")
            if (scene) changed(scene.sceneName)
          } else if (op === 5) {
            if (d.eventType === "CurrentProgramSceneChanged") changed(d.eventData.sceneName)
            if (d.eventType === "CustomEvent" && d.eventData?.efeito === "golDeles") theirGoal()
          } else if (op === 7) {
            pending.get(d.requestId)?.(d.requestStatus.result ? (d.responseData ?? {}) : null)
            pending.delete(d.requestId)
          }
        }
        ws.onerror = () => ws.close()
        ws.onclose = () => {
          ready = false
          for (const resolve of pending.values()) resolve(null)
          pending.clear()
          status()
          setTimeout(connect, 3000)
        }
      }
      function request(requestType, requestData) {
        if (!ready) return Promise.resolve(null)
        const requestId = String(++requests)
        return new Promise((resolve) => {
          pending.set(requestId, resolve)
          obs.send(JSON.stringify({ op: 6, d: { requestType, requestId, requestData } }))
        })
      }
      function status() {
        $("obs").className = ready ? "status on" : "status"
        $("obs").textContent = ready ? "OBS conectado" : state.obsPassword ? "OBS desconectado" : "OBS desconectado: falta a senha (abaixo)"
      }

      // --- Scenes ---------------------------------------------------------------------------------------------
      let current = null
      let before = MAIN // the last scene that wasn't an effect, to go back to
      let zooming = false
      function changed(scene) {
        current = scene
        if (scene !== LANCE && scene !== TERAPIA) before = scene
        $("lance").classList.toggle("active", scene === LANCE)
        $("terapia").classList.toggle("active", scene === TERAPIA)
        if (scene === LANCE && !zooming) zoom()
      }

      /** Switches with a given transition (Corte, Fade), then puts the usual one back. */
      async function switchWith(transition, scene, ms = 0) {
        const usual = await request("GetCurrentSceneTransition")
        await request("SetCurrentSceneTransition", { transitionName: transition })
        if (ms) await request("SetCurrentSceneTransitionDuration", { transitionDuration: ms })
        await request("SetCurrentProgramScene", { sceneName: scene })
        setTimeout(async () => {
          if (!usual) return
          await request("SetCurrentSceneTransition", { transitionName: usual.transitionName })
          if (usual.transitionDuration) request("SetCurrentSceneTransitionDuration", { transitionDuration: usual.transitionDuration })
        }, ms + 300)
      }

      const easeOutBack = (x) => 1 + 2.2 * (x - 1) ** 3 + 1.2 * (x - 1) ** 2
      const easeInCubic = (x) => x * x * x
      const wait = (ms) => new Promise((r) => setTimeout(r, ms))
      /** Animates the camera's box from `a` to `b` over `ms`; `shake` px of jitter that fades out. */
      function animate(id, a, b, ms, ease, shake = 0) {
        return new Promise((resolve) => {
          const t0 = performance.now()
          const step = () => {
            const x = Math.min(1, (performance.now() - t0) / ms)
            const k = ease(x)
            const jitter = shake * (1 - x)
            const box = {
              positionX: a.positionX + (b.positionX - a.positionX) * k + (Math.random() - 0.5) * jitter,
              positionY: a.positionY + (b.positionY - a.positionY) * k + (Math.random() - 0.5) * jitter,
              boundsWidth: a.boundsWidth + (b.boundsWidth - a.boundsWidth) * k,
              boundsHeight: a.boundsHeight + (b.boundsHeight - a.boundsHeight) * k,
            }
            request("SetSceneItemTransform", { sceneName: LANCE, sceneItemId: id, sceneItemTransform: box })
            if (x < 1) setTimeout(step, 16)
            else resolve()
          }
          step()
        })
      }

      // The camera from its frame to the whole screen, a little past it (on his face), and back.
      async function zoom() {
        zooming = true
        try {
          const video = await request("GetVideoSettings")
          const item = await request("GetSceneItemId", { sceneName: LANCE, sourceName: CAMERA })
          const got = item && (await request("GetSceneItemTransform", { sceneName: LANCE, sceneItemId: item.sceneItemId }))
          if (!video || !got) return
          const id = item.sceneItemId
          const t = got.sceneItemTransform
          const from = { positionX: t.positionX, positionY: t.positionY, boundsWidth: t.boundsWidth, boundsHeight: t.boundsHeight }
          const W = video.baseWidth
          const H = video.baseHeight
          const Z = 1.3 // past the screen's size, so the face fills it
          const to = { boundsWidth: W * Z, boundsHeight: H * Z, positionX: W / 2 - (W * Z) / 2, positionY: H * 0.48 - H * Z * 0.42 }
          const started = performance.now()
          await animate(id, from, to, 300, easeOutBack)
          await animate(id, to, to, 450, (x) => x, 26 * (W / 1920))
          await wait(Math.max(0, HOLD - 300 - (performance.now() - started)))
          await animate(id, to, from, 280, easeInCubic)
          if (current === LANCE) await switchWith("Corte", before)
        } finally {
          zooming = false
        }
      }

      async function theirGoal() {
        if (!state.autoGol || !GAME_SCENES.includes(current)) return
        // After the explosion, while the replay starts.
        await wait(1500)
        if (GAME_SCENES.includes(current)) request("SetCurrentProgramScene", { sceneName: LANCE })
      }

      $("lance").onclick = () => current !== LANCE && request("SetCurrentProgramScene", { sceneName: LANCE })
      $("terapia").onclick = () => current !== TERAPIA && request("SetCurrentProgramScene", { sceneName: TERAPIA })
      $("voltar").onclick = () => switchWith("Fade", current === TERAPIA ? before : MAIN, 1500)

      // --- Sounds ---------------------------------------------------------------------------------------------
      for (const [label, input, key] of SONS) {
        const b = document.createElement("button")
        b.innerHTML = `<span></span><kbd>${key}</kbd>`
        b.firstChild.textContent = label
        b.onclick = () => request("TriggerMediaInputAction", { inputName: input, mediaAction: "OBS_WEBSOCKET_MEDIA_INPUT_ACTION_RESTART" })
        $("sons").append(b)
      }

      status()
      connect()
    </script>
  </body>
</html>
