<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Créditos · muanlartins</title>
    <link rel="stylesheet" href="stream.css" />
    <link rel="stylesheet" href="torcedor.css" />
    <!--
      OBS: Browser source, 1920×1080, above the camera, in the "Fim" scene; it starts over each time the scene goes on
      air. The end of the live as a film's end: the camera where Conversa has it (1280×720 at 64, 64), the credits
      rolling up the right-hand column where Conversa has the chat, and under the camera the stand with everyone who
      watched today, each as their 3D fan (torcedor3d/, their look from /perfil, or their 2D one turned 3D), on
      arquibancada3d.js's stand, 1280×270 (12 to a row, then 16; 64 at most), the channel and who watched longest in
      front. As a name rolls past the middle of the column, its fan in the stand celebrates (their own celebration), so
      the stand ripples along with the list; the little fan by each name is the stand's picture (or, past its last seat,
      one of its own).

      The credits, each section only when it has someone:
        Estrelando · O placar de hoje (Rocket League from the Partidas dock's "muanlartins-partidas", Valorant from
        jogo.html's day kept in this site's storage) · Os números de hoje (the Partidas dock's "muanlartins-numeros":
        each game's totals since the stream began, Rocket League's goals, saves, touches, aerials…, Valorant's K/D/A,
        ACS, headshots…; in the place of the goals and wins the stand dedicated, Luan's call, 2026-11-20) · Raid ·
        Seguiram hoje · Inscritos · Presentearam subs · Bits (the Efeitos dock signed in to Twitch,
        "muanlartins-creditos") · Pix (the mural's, only who chose to be on it) · Primeira
        vez aqui · Na arquibancada (the Σ API's GET /live: who was in today's live, most minutes first) · Próxima live
        (the agenda, the profile API's GET /agenda: the next live after today's) · and the closing
        card, which stays.
      OBS's browser sources share this site's storage, so Valorant's day reaches this page;
      the docks' storage is their own, so the Efeitos dock sends its part as an event (every 5 s, and right as Fim
      goes on air). The page waits ?espera= seconds (default 4) on its title for all of it, then rolls at
      ?velocidade= px/s (default 55).

      The chat still talks: whoever says something comes forward to the stand's rail with it, whoever comes into the chat
      joins the stand, and the stand's commands move their fan as in the live (!pula, !danca, !comemora, !grito,
      !ola: comandos.js). With ?demo, keys p, n, k, h, o send them from someone at random. ?api=, ?sigma=, ?pix= point at stand-ins for the profile, Σ and Pix APIs; ?canal= as in the
      overlays; ?demo fills everything with sample people.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js"
        }
      }
    </script>
    <style>
      .ground {
        /* Everything but the camera's hole, as in conversa.html. */
        clip-path: path(evenodd, "M0 0H1920V1080H0Z M64 64H1344V784H64Z");
      }
      .hole {
        position: absolute;
        left: 64px;
        top: 64px;
        width: 1280px;
        height: 720px;
      }
      #plate {
        left: 48px;
        top: 774px;
        z-index: 70;
      }

      /* --- The credits column ------------------------------------------------------------------------- */
      .side {
        position: absolute;
        left: 1392px;
        top: 64px;
        width: 464px;
        height: 952px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .side > .eyebrow {
        padding-bottom: 14px;
        border-bottom: 1px solid rgb(133 167 255 / 0.4);
      }
      .rolo {
        position: relative;
        flex: 1;
        overflow: hidden;
        mask-image: linear-gradient(transparent 0, #000 90px, #000 calc(100% - 90px), transparent 100%);
      }
      .lista {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        text-align: center;
        will-change: transform;
      }
      .bloco {
        margin: 0 0 84px;
      }
      .bloco.chega {
        animation: rise 0.9s var(--ease) both;
      }
      .papel {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 0 0 22px;
        color: var(--klein-claro);
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .papel::before,
      .papel::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgb(133 167 255 / 0.4);
      }
      .pessoa {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 58px;
        margin: 0 0 10px;
      }
      /* The 3D fan's whole frame is 4.5 × 5.3. */
      .mini {
        position: relative;
        flex: none;
        width: 36px;
        height: 42px;
      }
      .mini .pose {
        position: absolute;
        inset: 0;
      }
      .pessoa .quem {
        min-width: 0;
        text-align: left;
      }
      .pessoa .nome-c {
        display: block;
        max-width: 360px;
        font-size: 32px;
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pessoa .nome-c img {
        height: 0.8em;
        margin-left: 0.3em;
        vertical-align: -0.05em;
      }
      .pessoa .det {
        display: block;
        margin-top: 2px;
        color: var(--klein-claro);
        font-size: 18px;
        font-weight: 500;
      }
      /* The day's long list (everyone in the stand) goes a size smaller. */
      .bloco.muitos .pessoa {
        min-height: 48px;
        margin-bottom: 6px;
      }
      .bloco.muitos .nome-c {
        font-size: 26px;
      }
      .bloco.muitos .det {
        font-size: 16px;
      }
      .grande {
        margin: 0;
        font-size: 44px;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      .grande .accent,
      .accent {
        color: var(--klein-claro);
      }
      .linha {
        margin: 10px 0 0;
        color: var(--klein-claro);
        font-size: 22px;
        font-weight: 500;
      }
      /* The live's numbers: three to a row, the last row centred. */
      .numeros-dia {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        row-gap: 20px;
        margin-top: 4px;
      }
      .numeros-dia .num {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 33.33%;
      }
      .numeros-dia .v {
        font-size: 44px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      .numeros-dia .r {
        margin-top: 2px;
        color: var(--klein-claro);
        font-size: 17px;
        font-weight: 500;
      }
      .linha.jogo-n {
        margin: 30px 0 14px;
        color: var(--paper);
        font-size: 24px;
      }
      .bloco > .linha.jogo-n:nth-child(2) {
        margin-top: 0;
      }
      .numeros-dia + .linha {
        margin-top: 22px;
      }
      .ranque {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
        font-size: 28px;
        font-weight: 500;
      }
      .ranque img {
        width: 56px;
        height: 56px;
      }

      /* The title at the start and the card at the end, each centred in the column when it's there. */
      .abertura .marca {
        width: 150px;
        height: 150px;
        margin: -24px auto -18px;
      }
      .marca svg {
        width: 100%;
        height: 100%;
      }
      .abertura h1 {
        margin: 14px 0 0;
        font-size: 64px;
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .abertura .jogo {
        margin: 16px 0 0;
        color: var(--klein-claro);
        font-size: 28px;
        font-weight: 500;
      }
      .final {
        margin: 0;
      }
      .final .marca {
        width: 230px;
        height: 230px;
        margin: -40px auto -30px;
      }
      .final h2 {
        margin: 14px 0 0;
        font-size: 54px;
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 1.05;
      }
      .final .site {
        margin: 22px 0 0;
        font-size: 26px;
        font-weight: 500;
      }
      .final .site span {
        color: var(--klein-claro);
      }
      .rise {
        animation: rise 0.9s var(--ease) both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
      }

      /* --- The stand under the camera: torcida.html's (arquibancada3d.js), wider ---------------------------- */
      .torcida {
        position: absolute;
        left: 64px;
        width: 1280px;
        bottom: 0;
        height: 300px;
        pointer-events: none;
      }
      .torcida canvas {
        position: absolute;
        left: 0;
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="ground"></div>
      <div class="hole"></div>
      <section class="torcida" id="torcida" aria-label="A torcida de hoje">
        <canvas id="arquibancada"></canvas>
      </section>
      <div id="plate"></div>
      <aside class="side">
        <p class="eyebrow">Créditos</p>
        <div class="rolo" id="rolo">
          <div class="lista" id="lista"></div>
        </div>
      </aside>
    </main>
    <script src="stream.js"></script>
    <script src="sigma.js"></script>
    <script src="comandos.js"></script>
    <script type="module">
      import { criarArquibancada } from "./arquibancada3d.js"
      import { FOTO, lookDe, natal as dezembro, poseDaFesta, retrato } from "./fas3d.js"
      import { torcedorDe } from "./torcedor3d/antigo.js"
      import { MODELOS, sortear as dado } from "./torcedor3d/esquema.js"

      const $ = (id) => document.getElementById(id)
      const DEMO = params.has("demo")
      const API = params.get("api") ?? "https://wtpv8afsak.execute-api.us-east-1.amazonaws.com"
      const SIGMA_API = params.get("sigma") ?? "https://p1rblei1o9.execute-api.us-east-1.amazonaws.com"
      const PIX_API = params.get("pix") ?? "https://g2x6kdnhr0.execute-api.us-east-1.amazonaws.com"
      const PERFIL_API = params.get("perfil") ?? "https://wtpv8afsak.execute-api.us-east-1.amazonaws.com"
      const VELOCIDADE = Number(params.get("velocidade")) || 55
      const ESPERA_MS = (Number(params.get("espera")) || 4) * 1000
      // The name the channel goes by in the credits (copy: Luan's to change).
      const ESTRELA = { nome: "Luan Martins", det: "como ele mesmo" }

      const TZ = "America/Sao_Paulo"
      const diaDe = (t) => new Date(t).toLocaleDateString("sv", { timeZone: TZ })
      const HOJE = diaDe(Date.now())
      const reais = (centavos) => (centavos / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" })
      const horas = (min) => (min >= 60 ? `${Math.floor(min / 60)}h${String(min % 60).padStart(2, "0")}` : `${min} min`)

      // --- Who: everyone credited stands in the stand ------------------------------------------------------
      const gente = new Map() // login → { login, nome, minutos, sigma, sequencia, primeira, el }
      const escolhas = new Map() // login → their look from /perfil
      const nomes = new Map() // login → display name, from Twitch (the dock, the chat)
      const nomeDe = (login) => nomes.get(login) ?? gente.get(login)?.nome ?? login
      const sigma = (login) => gente.get(login)?.sigma ?? 0
      let JOGO = "rocket-league"
      // Their fan, undressed: its celebration (fes) and arrival shout (frase).
      const fa = (login) => torcedorDe(escolhas.get(login) ?? null, login)

      /** Someone to the stand (once): `dados` adds what's known about them. */
      function pessoa(login, dados = {}) {
        if (!login) return null
        login = login.toLowerCase()
        if (BOTS.has(login) || login.startsWith("justinfan")) return null
        let p = gente.get(login)
        if (!p) {
          p = { login, nome: login, minutos: 0, sigma: 0, sequencia: 0 }
          gente.set(login, p)
        }
        Object.assign(p, dados)
        if (dados.nome) nomes.set(login, dados.nome)
        return p
      }

      // Their looks and Σ, for everyone at once, again when people arrive.
      // Asked while the title holds, so the stand bakes each fan once, in their own look.
      let pedido
      let escolhasProntas = false
      function pedirEscolhas() {
        clearTimeout(pedido)
        pedido = setTimeout(async () => {
          const logins = [...gente.keys()].filter((l) => !escolhas.has(l))
          try {
            if (DEMO || !API || !logins.length) return
            for (let i = 0; i < logins.length; i += 100) {
              const r = await fetch(`${API}/torcedores?logins=${logins.slice(i, i + 100).join(",")}`)
              if (!r.ok) return
              const achadas = await r.json()
              for (const [login, escolha] of Object.entries(achadas)) if (escolha) escolhas.set(login, escolha)
            }
            if (montada) arrumar()
          } catch {
            // Offline: everyone keeps the look their login gives.
          } finally {
            escolhasProntas = true
          }
        }, 300)
      }

      // --- The stand ---------------------------------------------------------------------------------------
      const torcida = $("torcida")
      // Bigger than torcida.html's, twelve to a row (then sixteen): the stand has the screen's bottom to itself here.
      const stand = criarArquibancada($("arquibancada"), { largura: 1280, altura: 270, acima: 30, porFila: [12, 16] })
      stand.natal(dezembro())
      let montada = false
      let montouEm = 0

      // The channel in front, then who watched longest today, then Σ; past the last row, no place.
      const ordem = () =>
        [...gente.values()].sort(
          (a, b) => (b.login === CHANNEL) - (a.login === CHANNEL) || b.minutos - a.minutos || b.sigma - a.sigma || (a.login < b.login ? -1 : 1),
        )
      let naArquibancada = new Set()
      function arrumar() {
        const lista = ordem()
        naArquibancada = new Set(lista.slice(0, stand.capacidade).map((p) => p.login))
        stand.dispor(
          lista.map((p) => ({
            login: p.login,
            nome: nomeDe(p.login),
            aparencia: escolhas.get(p.login) ?? null,
            emblema: p.login !== CHANNEL ? Sigma.ranque(p.sigma, "pt", JOGO).emblema : null,
            canal: p.login === CHANNEL,
          })),
          { animar: montada },
        )
        const quantos = lista.filter((p) => p.login !== CHANNEL).length
        placa(quantos ? `A torcida de hoje <span class="accent">· ${quantos}</span>` : `muanlartins<span class="accent">.com.br</span>`)
      }

      /** A fan celebrates their own way, their name lit, as their line rolls by. */
      function comemorar(login) {
        stand.mover(login, "comemora")
      }

      // --- The chat: whoever talks comes forward to the rail, and whoever arrives joins ----------------------
      function falar(p, texto) {
        if (!p || !naArquibancada.has(p.login)) return
        stand.falar(p.login, texto)
      }
      function chegar(login, nome) {
        const novo = !gente.has(login?.toLowerCase())
        const p = pessoa(login, nome ? { nome } : {})
        if (!p) return null
        if (novo) {
          if (montada) arrumar()
          pedirEscolhas()
        } else if (nome && montada) arrumar()
        return p
      }
      // The stand's commands, as in the live (comandos.js).
      const comando = Comandos.criar({
        pessoa: (login) => (naArquibancada.has(login.toLowerCase()) ? gente.get(login.toLowerCase()) : null),
        falar: (p, texto) => falar(p, texto),
        frase: (p) => fa(p.login).frase,
        mover: (p, move) => stand.mover(p.login, move),
        ola: (p) => stand.evento("ola", { de: p.login }),
      })
      function aplicar(line) {
        const { tags, prefix, command, trailing } = parseIrc(line)
        const login = prefix.split("!")[0]
        if (command === "JOIN") chegar(login)
        else if (command === "PRIVMSG") {
          const p = chegar(login, tags["display-name"] || login)
          if (trailing.startsWith("!")) comando(login, trailing)
          else falar(p, trailing.replace(/^\u0001ACTION (.*)\u0001$/, "$1"))
        } else if (command === "353") trailing.split(" ").forEach((name) => name && chegar(name))
      }

      // --- What the day was, from everywhere ---------------------------------------------------------------
      const dia = { live: null, twitch: null, partidas: null, numeros: null, valorant: null, pix: [], agenda: null }

      // The Partidas dock's Rocket League record and the Efeitos dock's Twitch day, every few seconds.
      addEventListener("muanlartins-partidas", ({ detail }) => (dia.partidas = detail))
      addEventListener("muanlartins-numeros", ({ detail }) => detail && (dia.numeros = detail))
      addEventListener("muanlartins-creditos", ({ detail }) => {
        if (detail?.dia !== HOJE) return
        dia.twitch = detail
        for (const lista of ["seguidores", "inscritos", "presentes", "bits"]) for (const x of detail[lista] ?? []) x.login && nomes.set(x.login, x.nome)
        if (montada) acrescentar()
      })

      // What jogo.html kept today in this site's storage (shared by OBS's browser sources).
      function guardados() {
        try {
          const v = JSON.parse(localStorage.getItem("valorant:dia") || "null")
          if (v?.date === new Date().toLocaleDateString("en-CA") && v.wins + v.losses > 0) dia.valorant = v
        } catch {
          // No storage: those sections stay out.
        }
      }

      async function buscar() {
        const json = (url) => fetch(url).then((r) => (r.ok ? r.json() : null)).catch(() => null)
        const [live, mural, agenda] = await Promise.all([
          SIGMA_API ? json(`${SIGMA_API}/live`) : null,
          PIX_API ? json(`${PIX_API}/mural`) : null,
          PERFIL_API ? json(`${PERFIL_API}/agenda`) : null,
        ])
        dia.agenda = agenda
        if (live?.pessoas) {
          dia.live = live
          for (const x of live.pessoas) pessoa(x.login, { minutos: x.minutosLive ?? 0, sigma: x.sigma ?? 0, sequencia: x.sequencia ?? 0, primeira: x.primeira })
        }
        if (mural) {
          const todos = [...(mural.meta?.apoiadores ?? []), ...(mural.metas ?? []).flatMap((m) => m.apoiadores ?? []), ...(mural.pix ?? [])]
          dia.pix = todos.filter((p) => p.nome && p.em && diaDe(p.em) === HOJE).sort((a, b) => (a.em < b.em ? -1 : 1))
        }
      }

      // --- The next live, from the agenda (its lives of the next two weeks, with dates) -------------------------
      const DIAS = ["segunda", "terça", "quarta", "quinta", "sexta", "sábado", "domingo"]
      const dataEm = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(d)
      /** The first live starting after now (today's, on air, is behind it). */
      function proximaLive(agenda) {
        const agora = Date.now()
        const p = agenda?.proximas?.find((o) => Date.parse(o.inicio) > agora)
        if (!p) return null
        const hoje = dataEm(new Date())
        const dias = Math.round((Date.parse(`${p.data}T12:00:00Z`) - Date.parse(`${hoje}T12:00:00Z`)) / 86_400_000)
        const wd = ((new Date(`${p.data}T12:00:00Z`).getUTCDay() + 6) % 7) + 1
        const quando = dias === 0 ? "hoje" : dias === 1 ? "amanhã" : dias < 7 ? DIAS[wd - 1] : `${p.data.slice(8)}/${p.data.slice(5, 7)}`
        return { quando, hora: p.start.replace(":", "h").replace(/h00$/, "h"), jogo: p.nome, titulo: p.titulo }
      }
      /** Today's live by the agenda (on air, or the day's latest that started), for the title and the ranks' emblems. */
      function jogoDeHoje(agenda) {
        const hoje = dataEm(new Date())
        const doDia = (agenda?.proximas ?? []).filter((o) => o.data === hoje && Date.parse(o.inicio) - 3600e3 <= Date.now())
        const o = doDia.at(-1)
        return o ? { game: o.jogo, name: o.nome } : null
      }

      // --- The credits -------------------------------------------------------------------------------------
      const lista = $("lista")
      const rolo = $("rolo")

      function el(tag, classe, html) {
        const e = document.createElement(tag)
        if (classe) e.className = classe
        if (html != null) e.innerHTML = html
        return e
      }
      /** A section: its role, then its people ({ login, nome, det }). */
      function bloco(papel, pessoas, { muitos = false } = {}) {
        if (!pessoas.length) return null
        const b = el("section", "bloco" + (muitos ? " muitos" : ""))
        b.append(el("p", "papel", papel))
        for (const x of pessoas) b.append(linhaDePessoa(x))
        return b
      }
      function linhaDePessoa({ login, nome, det, emblema }) {
        const row = el("div", "pessoa")
        if (login) {
          row.dataset.login = login
          row.append(mini(login))
        }
        const quem = el("div", "quem")
        const n = el("span", "nome-c")
        n.textContent = nome
        if (emblema) {
          const img = document.createElement("img")
          img.alt = ""
          img.src = emblema
          n.append(img)
        }
        quem.append(n)
        if (det) quem.append(el("span", "det", det))
        row.append(quem)
        return row
      }

      // The little fan by a name: the stand's own picture of them, shrunk (no second bake); whoever is past the stand's
      // last seat gets one of their own. They move as the 2D's did (torcedor.css's .comemora), arms up.
      const minis = [] // { login, box, tela, feito, retrato }
      function mini(login) {
        const box = el("div", "mini torcedor", `<div class="pose"><canvas></canvas></div>`)
        const tela = box.querySelector("canvas")
        const dpr = Math.min(2, devicePixelRatio || 1)
        const q = FOTO.inteiro
        tela.height = Math.round(42 * dpr)
        tela.width = Math.round((tela.height * q.w) / q.h)
        Object.assign(tela.style, { position: "absolute", inset: "0", width: "100%", height: "100%" })
        minis.push({ login, box, tela, feito: false, retrato: null })
        return box
      }
      function pintarMini(m, pose) {
        if (m.retrato) return pose === "parado" ? m.retrato.pose("parado") : m.retrato.festa(2600)
        const fotos = stand.fotos(m.login)
        const f = fotos?.[pose] ?? fotos?.parado
        if (!f) return false
        const g = m.tela.getContext("2d")
        const { width: W, height: H } = m.tela
        g.clearRect(0, 0, W, H)
        g.imageSmoothingQuality = "high"
        g.drawImage(f.img, (f.x * W) / f.W, (f.y * H) / f.H, (f.img.width * W) / f.W, (f.img.height * H) / f.H)
        return true
      }
      // Each little fan as soon as their stand picture is there (or, past the last seat, their own baked).
      setInterval(() => {
        if (!montada) return
        for (const m of minis) {
          if (m.feito) continue
          if (naArquibancada.has(m.login)) m.feito = pintarMini(m, "parado")
          else if (escolhasProntas || Date.now() - montouEm > 3000) {
            m.retrato = retrato(m.box, lookDe(escolhas.get(m.login) ?? null, m.login), { altura: 42, poses: ["parado", poseDaFesta(fa(m.login).fes), "cima", "palmas"] })
            m.feito = true
          }
        }
      }, 200)
      function festejarMini(m) {
        m.box.dataset.comemoracao = fa(m.login).fes
        m.box.classList.remove("comemora")
        void m.box.offsetWidth
        m.box.classList.add("comemora")
        const pose = poseDaFesta(fa(m.login).fes)
        pintarMini(m, pose)
        let n = 0
        const palmas = fa(m.login).fes === "palmas" && !m.retrato ? setInterval(() => pintarMini(m, n++ % 2 ? "palmas" : "cima"), 170) : 0
        setTimeout(() => {
          clearInterval(palmas)
          m.box.classList.remove("comemora")
          pintarMini(m, "parado")
        }, 2600)
      }

      function abertura() {
        const b = el("section", "bloco abertura")
        const data = new Date().toLocaleDateString("pt-BR", { timeZone: TZ, day: "numeric", month: "long" })
        b.innerHTML = `<div class="marca" id="marca-abre"></div><p class="eyebrow rise" style="animation-delay:.4s">Fim da live</p>
          <h1 class="rise" style="animation-delay:.5s"></h1><p class="jogo rise" id="jogo-hoje" style="animation-delay:.6s"></p>`
        b.querySelector("h1").textContent = data
        return b
      }

      function placar() {
        const b = el("section", "bloco")
        const vd = (w, l) => `${w} ${w === 1 ? "vitória" : "vitórias"} <span class="accent">·</span> ${l} ${l === 1 ? "derrota" : "derrotas"}`
        const p = dia.partidas
        let tem = false
        if (p && p.wins + p.losses > 0) {
          tem = true
          b.append(el("p", "papel", "O placar de hoje"))
          b.append(el("p", "grande", vd(p.wins, p.losses)))
          const extra = [`Ranqueada ${p.mode}`, p.points ? `${p.points > 0 ? "+" : ""}${p.points} pts` : null]
          b.append(el("p", "linha", extra.filter(Boolean).join(" · ")))
          if (p.tier) {
            const r = el("div", "ranque", `<img alt="" src="/ranks/${p.tier}.webp"><span></span>`)
            r.querySelector("span").textContent = rankName(p.tier) + (hasDivisions(p.tier) && p.division ? `, divisão ${DIVISIONS[p.division - 1]}` : "")
            b.append(r)
          }
        }
        if (dia.valorant) {
          if (!tem) b.append(el("p", "papel", "O placar de hoje"))
          if (tem) b.append(el("p", "linha", "Valorant"))
          b.append(el("p", "grande", vd(dia.valorant.wins, dia.valorant.losses)))
          b.append(el("p", "linha", "Competitiva"))
          tem = true
        }
        return tem ? b : null
      }

      /** The live's numbers, each game's, as a grid: big number, its name under it. */
      function numeros() {
        const rl = dia.numeros?.rocketLeague
        const val = dia.numeros?.valorant
        if (!rl && !val) return null
        const b = el("section", "bloco")
        b.append(el("p", "papel", "Os números de hoje"))
        const grade = (titulo, itens) => {
          if (titulo) b.append(el("p", "linha jogo-n", titulo))
          const g = el("div", "numeros-dia")
          for (const [valor, nome] of itens) if (valor != null) g.append(el("div", "num", `<span class="v">${valor}</span><span class="r">${nome}</span>`))
          b.append(g)
        }
        const n = (v, um, varios) => [v, v === 1 ? um : varios]
        if (rl) {
          grade(val && "Rocket League", [
            n(rl.gols, "gol", "gols"), n(rl.assistencias, "assistência", "assistências"), n(rl.defesas, "defesa", "defesas"),
            n(rl.chutes, "chute", "chutes"), n(rl.toques, "toque", "toques"), n(rl.aereos, "aéreo", "aéreos"),
            n(rl.demolicoes, "demolição", "demolições"), n(rl.mvps || null, "MVP", "MVPs"), [rl.score, "score por partida"],
          ])
          if (rl.golMaisForte) b.append(el("p", "linha", `Gol mais forte <span class="accent">·</span> ${rl.golMaisForte} km/h`))
        }
        if (val)
          grade(rl && "Valorant", [
            n(val.abates, "abate", "abates"), n(val.mortes, "morte", "mortes"), n(val.assistencias, "assistência", "assistências"),
            [val.acs, "ACS"], [val.cabeca != null ? `${val.cabeca}%` : null, "na cabeça"], [val.dano, "dano por rodada"],
            n(val.primeiros, "primeiro abate", "primeiros abates"), [val.mortes ? (val.abates / val.mortes).toFixed(2).replace(".", ",") : null, "K/D"],
          ])
        return b
      }

      function twitch() {
        const t = dia.twitch
        if (!t) return []
        const subs = t.inscritos ?? []
        return [
          bloco((t.raids ?? []).length === 1 ? "Chegou de raid" : "Chegaram de raid", (t.raids ?? []).map((r) => ({ login: r.login, nome: r.nome, det: `com ${r.viewers} ${r.viewers === 1 ? "pessoa" : "pessoas"}` }))),
          bloco("Seguiram hoje", (t.seguidores ?? []).map((s) => ({ login: s.login, nome: s.nome }))),
          bloco("Inscritos", subs.map((s) => ({
            login: s.login,
            nome: s.nome,
            det: [s.presente ? "ganhou de presente" : s.meses > 1 ? `${s.meses} meses` : "primeiro mês", s.tier > 1 ? `nível ${s.tier}` : null].filter(Boolean).join(" · "),
          }))),
          bloco("Presentearam subs", (t.presentes ?? []).map((g) => ({ login: g.login, nome: g.nome, det: `${g.total} ${g.total === 1 ? "sub" : "subs"}` }))),
          bloco("Bits", (t.bits ?? []).sort((a, b) => b.bits - a.bits).map((c) => ({ login: c.login, nome: c.nome, det: `${c.bits} bits` }))),
        ]
      }

      function pix() {
        return bloco("Apoiaram por Pix", dia.pix.map((p) => ({ login: p.login ?? null, nome: p.nome, det: reais(p.centavos) })))
      }

      function estreantes() {
        const novos = [...gente.values()].filter((p) => p.primeira === HOJE && p.login !== CHANNEL)
        return bloco("Primeira vez aqui", novos.map((p) => ({ login: p.login, nome: nomeDe(p.login) })))
      }

      function arquibancada() {
        const todos = ordem().filter((p) => p.login !== CHANNEL)
        return bloco(
          "Na arquibancada",
          todos.map((p) => ({
            login: p.login,
            nome: nomeDe(p.login),
            emblema: Sigma.ranque(p.sigma, "pt", JOGO).emblema,
            det: [p.minutos ? horas(p.minutos) : null, p.sequencia >= 2 ? `${p.sequencia} lives seguidas` : null].filter(Boolean).join(" · ") || null,
          })),
          { muitos: todos.length > 8 },
        )
      }

      function proxima() {
        const n = proximaLive(dia.agenda)
        if (!n) return null
        const b = el("section", "bloco")
        b.append(el("p", "papel", "Próxima live"))
        const g = el("p", "grande")
        g.innerHTML = `${n.quando}, <span class="accent">${n.hora}</span>`
        b.append(g)
        b.append(el("p", "linha", n.titulo && n.titulo !== n.jogo ? `${n.jogo} · ${n.titulo}` : n.jogo))
        return b
      }

      function final() {
        const b = el("section", "bloco final")
        b.innerHTML = `<div class="marca" id="marca-fim"></div><h2>Valeu por assistir!</h2><p class="site">muanlartins<span>.com.br</span></p>`
        return b
      }

      // --- Rolling ----------------------------------------------------------------------------------------
      let y = 0
      let fim = null // where the list stops: the closing card in the middle
      let inicio = 0
      let rolando = false
      const vistos = new WeakSet()

      function centralizar(bloco) {
        return rolo.clientHeight / 2 - (bloco.offsetTop + bloco.offsetHeight / 2)
      }
      function posicionar() {
        lista.style.transform = `translateY(${y}px)`
      }

      function rolar(t) {
        if (!rolando) return
        const alvo = centralizar(fim)
        y = Math.max(alvo, inicio - ((t - rolando) / 1000) * VELOCIDADE)
        posicionar()
        // A line rolling past the middle: its fan in the stand celebrates, and its little fan here too.
        const meio = rolo.clientHeight * 0.55
        for (const row of lista.querySelectorAll(".pessoa")) {
          if (vistos.has(row)) continue
          const centro = row.offsetTop + row.offsetHeight / 2 + y
          if (centro > meio) break
          vistos.add(row)
          if (row.dataset.login) comemorar(row.dataset.login)
          const m = minis.find((x) => x.box === row.querySelector(".mini"))
          if (m) festejarMini(m)
        }
        requestAnimationFrame(rolar)
      }

      // Whoever the docks bring in after the roll began (a follow during the credits) still joins the stand.
      function acrescentar() {
        const t = dia.twitch
        let novos = false
        for (const k of ["seguidores", "inscritos", "presentes", "bits", "raids"])
          for (const x of t?.[k] ?? []) if (x.login && !gente.has(x.login.toLowerCase())) (chegar(x.login, x.nome), (novos = true))
        if (novos) pedirEscolhas()
      }

      function montar() {
        guardados()
        const hoje = jogoDeHoje(dia.agenda)
        if (hoje?.game === "valorant" || (!dia.partidas?.wins && !dia.partidas?.losses && dia.valorant)) JOGO = "valorant"
        if (hoje) $("jogo-hoje").textContent = hoje.name ?? hoje.game
        // The stand: the channel, today's viewers, and everyone the credits name.
        pessoa(CHANNEL, { nome: "muanlartins" })
        for (const k of ["seguidores", "inscritos", "presentes", "bits", "raids"]) for (const x of dia.twitch?.[k] ?? []) pessoa(x.login, { nome: x.nome })
        for (const p of dia.pix) pessoa(p.login)
        montada = true
        montouEm = Date.now()
        arrumar()
        pedirEscolhas()

        const estrela = bloco("Estrelando", [{ login: CHANNEL, nome: ESTRELA.nome, det: ESTRELA.det }])
        const blocos = [estrela, placar(), numeros(), ...twitch(), pix(), estreantes(), arquibancada(), proxima()].filter(Boolean)
        fim = final()
        for (const b of [...blocos, fim]) {
          b.classList.add("chega")
          lista.append(b)
        }
        desenharMarca($("marca-fim"))
        inicio = y
        requestAnimationFrame((t) => {
          rolando = t
          requestAnimationFrame(rolar)
        })
      }

      function desenharMarca(alvo) {
        mark(alvo).then((copies) => {
          const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2)
          const clamp = (x) => Math.min(1, Math.max(0, x))
          const start = performance.now()
          const frame = (now) => {
            const t = ((now - start) / 1000) % 12
            const out = clamp((t - 11.2) / 0.6)
            drawCopy(copies.branco, ease(clamp(t / 0.9)) * (1 - ease(out)))
            drawCopy(copies.claro, ease(clamp((t - 0.3) / 0.9)) * (1 - ease(clamp((t - 11.35) / 0.6))))
            requestAnimationFrame(frame)
          }
          requestAnimationFrame(frame)
        })
      }

      // --- The plate under the camera ------------------------------------------------------------------
      const border = frame(document.querySelector(".hole"), { band: 16, fill: "#001447" })
      let placaFeita = null
      function placa(html) {
        if (!placaFeita) {
          placaFeita = plate($("plate"), html)
          return
        }
        const line = $("plate").querySelector(".line")
        if (line && line.innerHTML !== html) line.innerHTML = html
      }
      setInterval(() => border.glint(), 9000)

      // --- Start: the title, the data (at most ESPERA_MS), then the roll -----------------------------------
      const abre = abertura()
      lista.append(abre)
      desenharMarca($("marca-abre"))
      document.fonts.ready.then(() => {
        y = centralizar(abre)
        posicionar()
      })

      if (DEMO) demo()
      else {
        irc(aplicar, { membership: true })
        Promise.all([buscar().then(pedirEscolhas), new Promise((r) => setTimeout(r, ESPERA_MS))]).then(montar)
      }

      function demo() {
        // Invented people; ?pessoas= how many watched (18 by default), to fill the stand.
        const nomesDemo = ["Bia", "torcedor_da_madrugada_10", "Duda", "Tobias", "Nina", "Raul", "Lívia", "a_lenda_do_rank_ferro_br1", "Malu",
          "Igor", "Sol", "capivara_cansada", "Teca", "Breno", "Iara", "Otto", "Lola", "Enzo", "Cida", "Nando", "Pipa", "mira_de_pao_de_queijo",
          "Aline", "Gui", "Rafa", "Mari", "Juca", "Kika", "Leo", "Val", "Tuca", "Fe", "Bento", "Olga", "Dico", "Manu", "Yuri", "Tina", "Gael",
          "Ivo", "Lara", "Noe", "Jade", "Beto", "Susi", "Ciro", "Pati", "Ravi", "Lucio", "Mel", "Hugo", "Dani", "Tom", "Ester", "Quim", "Rita",
          "Zeca", "Vivi", "Caco", "Dora", "Fabi", "Guto", "Hana", "Jonas", "Kaio", "Luma", "Mauro", "Nara", "Oto", "Paula"]
        const loginDe = (n) => n.toLowerCase().normalize("NFD").replace(/\p{M}/gu, "")
        const quantos = Math.max(2, Math.min(nomesDemo.length, Number(params.get("pessoas")) || 18))
        const um = (l) => l[Math.floor(Math.random() * l.length)]
        const FES = ["pula", "danca", "gira", "acena", "palmas", "bananeira"]
        nomesDemo.slice(0, quantos).forEach((n, i) => {
          const login = loginDe(n)
          // A third made their 3D fan on the site, a third kept their 2D one, the rest never made one.
          if (i % 3 === 0) escolhas.set(login, { t3: { ...(i % 6 === 0 ? MODELOS[(i / 6) % MODELOS.length][1] : dado(7919 * i + 13)), fes: FES[i % 6], frase: "bora Luan!" } })
          else if (i % 3 === 1)
            escolhas.set(login, { cabeca: ["losango", "redonda", "quadrada", "hexagono", "triangulo"][i % 5], roupa: ["lisa", "listra", "faixa", "meio", "numero", "gola", "listras", "listrado", "tricolor", "faixa-dupla"][i % 10],
              acessorio: ["nenhum", "bone", "cachecol", "bandeira", "coroa", "oculos", "fone", "cartola"][i % 8], comemoracao: ["pula", "danca", "gira", "acena", "bananeira"][i % 5], frase: um(["chegueeei", "hoje sobe!"]) })
          pessoa(login, { nome: n, minutos: Math.max(4, Math.round(150 * Math.random() ** 0.7)), sigma: Math.round(20000 * Math.random() ** 3), sequencia: i % 4 === 0 ? 2 + (i % 5) : 0, primeira: i === 6 || i === 15 ? HOJE : undefined })
        })
        dia.partidas = { mode: "2v2", tier: "diamond-2", division: 3, wins: 6, losses: 3, streak: 3, points: 41 }
        dia.numeros = {
          rocketLeague: { partidas: 9, gols: 11, assistencias: 6, defesas: 14, chutes: 27, toques: 236, aereos: 41, demolicoes: 5, mvps: 3, score: 412, golMaisForte: 118 },
          valorant: null,
        }
        dia.twitch = {
          dia: HOJE,
          seguidores: [{ login: "malu", nome: "Malu" }, { login: "igor", nome: "Igor" }, { login: "sol", nome: "Sol" }],
          inscritos: [{ login: "tobias", nome: "Tobias", tier: 1, meses: 3 }, { login: "nina", nome: "Nina", tier: 1, meses: 1, presente: true }],
          presentes: [{ login: "duda", nome: "Duda", total: 5 }],
          bits: [{ login: "raul", nome: "Raul", bits: 500 }],
          raids: [{ login: "capivara_cansada", nome: "capivara_cansada", viewers: 12 }],
        }
        dia.pix = [{ login: "bia", nome: "Bia", centavos: 1000 }, { nome: "Anônimo de Floripa", centavos: 500 }]
        const amanha = new Date(Date.now() + 86_400e3)
        dia.agenda = {
          proximas: [
            { data: dataEm(new Date()), inicio: new Date(Date.now() - 2 * 3600e3).toISOString(), start: "14:30", jogo: "rocket-league", nome: "Rocket League", titulo: "Ranqueadas de Rocket League" },
            { data: dataEm(amanha), inicio: amanha.toISOString(), start: "21:00", jogo: "valorant", nome: "Valorant", titulo: "Aprendendo Valorant" },
          ],
        }
        escolhasProntas = true
        setTimeout(montar, ESPERA_MS)
        const FRASES = ["gg!!", "valeu pela live", "tchau Luan", "até quinta!", "que live", "boa noite pessoal", "ganhamos hoje 🔥"]
        const alguem = () => um([...naArquibancada].filter((l) => l !== CHANNEL))
        if (params.get("demo") !== "parado")
          setInterval(() => {
            const login = alguem()
            if (login) falar(gente.get(login), um(FRASES))
          }, 2600)
        // The stand's commands, from someone at random.
        const COMANDO_DE = { p: "!pula", n: "!dança", k: "!comemora", h: "!grito", o: "!ola" }
        addEventListener("keydown", (e) => {
          const login = alguem()
          if (login && COMANDO_DE[e.key]) comando(login, COMANDO_DE[e.key])
        })
      }
      // For headless checks: the stand's numbers.
      window.estadoCreditos = () => ({ ...stand.medidas, esperando: stand.esperando(), minis: minis.length, minisFeitos: minis.filter((m) => m.feito).length })
    </script>
  </body>
</html>
