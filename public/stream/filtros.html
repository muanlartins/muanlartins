<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Filtros · muanlartins</title>
    <!--
      The stream's camera filters, switched from the "Filtros" dock in OBS (filtros-painel.html), not by gestures.
      It opens the camera itself (NVIDIA Broadcast by default, ?cam=<part of the name> for another), tracks hands,
      body and face with MediaPipe in the browser and draws the camera with the filter on top at 1280×720, the
      camera's own size; in OBS each scene scales the source into its camera box (browser sources need OBS started
      with --enable-media-stream to open a camera).

      The dock sends "muanlartins-filtro" through obs-browser's emit_event: { filtro: "<id>" } is the filter that
      should be on ("nenhum" for none; the dock repeats it every few seconds, so a reloaded page catches up), with
      its switches in opcoes ({ patrulha: true }: Sova's drone flying behind him), and { acao: "flash" } fires a
      one-off. The Efeitos dock sends { visita: { filtro, acao } } for a viewer's channel points: that filter comes on
      (over another or none), takes the ability once his face is found, and the dock's choice comes back when it's
      over. One filter at a time. Every filter is a folder under filtros/ (filtros/index.js lists them in the
      dock's order; filtros/README.md is how to make one): its entry for the dock and this page, and, when it does
      something of its own, a module handed the engine this page gives it (`motor`). The looks on his head and
      shoulders are filtros/visuais.js's entries: a Valorant model, found by its bones, or any model placed by
      numbers (`modo: "fixo"`), fitted on him with ?modo=<id>&ajuste (a panel with each piece's numbers that copies
      the finished entry: filtros/ajuste.js, loaded only then). The ball, the cars, Pop and the lens are still drawn here.

      On the dock:
        Bola  (key 2 in a browser): the ball on the head, turning with it and slowly on itself (a turn in
              about 12 s; ?giro=<turns a second>).
        Phoenix (key 3): Valorant's Phoenix from his model (privado/phoenix.glb, out of git), from the
              front: his hair and faded scalp on the head, his jacket and shirt on the shoulders (?bracos=0
              without the upper arms, ?bracos=2 with the forearms too), Luan's face and hands drawn back over
              them. Its own gestures stay, only while it's on: both palms open and facing each other, as if
              starting a clap, hold a fire between them that grows with the gap (key 5 shows it in the middle);
              a snap with a turn of the hand (thumb on the middle finger, then a quick twist) puts his flash's
              orb in the hand; moving the hand left or right throws it that way, curving, while a ring closes on
              it, and it pops into a warm glare of about 2.5 s (key 4, or the dock's Bola Curva).
              With the game's own effects (vfx.js and filtros/phoenix/, textures in privado/valorant/): the orb is
              Curveball's (dark core, fire shell, its glow, sparks and ribbon, its pop before the glare), and the
              dock has his other abilities: Labareda (C, the Blaze: fire in the left hand, then a wall racing
              across the bottom of the box, 6 s), Mãos Quentes (E, Hot Hands: a fireball from the right hand thrown
              to the bottom of the box, its blast and 4 s of fire there) and Ultimate (X, Run It Back: his shoulders
              and elbows on fire with the marker below him and the box's edge glowing, 10 s or ?ult=<s>, then the
              burst he comes back in). Keys C, Q, E, X in a browser.
        Sova  (key 7): Valorant's Sova the same way (privado/sova.glb, out of git): his slicked-back hair on the
              head, the fur collar, the cape and the folded bow on the back on the shoulders. His abilities are the
              game's own (privado/valorant/sova/, out of git: its bow, arrows and Owl Drone in 3D, its effects
              through vfx.js; the code in filtros/sova/). Two by gesture, only while he's on: the bow (both hands closed, one
              fist against the other, opens it between them; pulling them apart draws it, the hand nearer the face on
              the string and his bow in the other, opening the further the hands part; opening a hand shoots a Recon
              Bolt from it towards the other hand, to the edge of the camera, where it sticks, its head spins and
              two sonar pulses go out; whoever they cross is revealed, in Valorant's red outline with the marker over
              the head) and the Owl Drone (both palms open to the camera, side by side: the drone opens between them,
              flies up beside his head, tags him with its dart, which reveals him twice, and flies off). From the
              dock (or keys E, Q, C, X): Flecha de Reconhecimento (E: the bow drawn and shot by itself), Flecha de
              Choque (Q: the Shock Bolt drawn and shot up, off the top of the box and bursting by his shoulder, the
              camera shakes), Drone Coruja (C) and Ultimate (X, Hunter's Fury: his bow turned to energy, three
              shots charged and fired across the box, the camera darkened a little). The dock's switch "Coruja
              sobrevoando" (or ?patrulha, key P) keeps the drone flying behind him, side to side above his
              shoulders (he covers it as it passes behind him); the drone ability is then that drone coming round
              to his side and going back. ?arco=<scale> (30) and
              ?coruja=<scale> (30) size the bow and the drone.
              With either agent, Luan's own hair around theirs is painted over with what the camera sees behind
              him (NVIDIA Broadcast's virtual background, camera-fundo.png, or ?fundo=<url>, and whatever's been
              seen there since, his chair too), so theirs is the head's outline; off while the background doesn't
              match, or with ?apagar=0. Sova's forehead covers Luan's down to just above the brows.
        Sage (dock only, 2026-11-12): Valorant's Sage the same way (privado/sage.glb, out of git: her
              character-select model): her hair on the head, her collar and coat on the shoulders. Her abilities
              are the game's own (privado/valorant/sage/, out of git: her orb and wall in 3D, the effects through
              vfx.js and filtros/sage/). From the dock (or keys C, Q, E, X): Orbe de Barreira (C: the orb in his right hand,
              then her wall of jade crystal erupting across the bottom of the box in front of him, its top at his
              chest, standing 6 s and crumbling), Orbe de Lentidão (Q: the orb thrown to the bottom of the box, the
              burst, then the slow field there 5.5 s, with frost creeping up him while it lasts), Orbe Curativo (E:
              the orb, then her heal on him, 5 s of jade light, petals and wisps rising off him) and Ressurreição
              (X: both hands glowing, then a column of light down on him, the bloom and the crystals, and he glows a
              while). The barrier also by gesture: forearms crossed in an X in front of the chest brings the orb
              to his right hand, opening the arms casts the wall (the body tracker's wrists, not the hands).
        Octane (key 8) and Fennec (key 9): his face as Rocket League's car, Pixar-style: the car sits on the head
              seen a little from above, turning with it, his own eyes on its windshield and his mouth on its
              bumper (cut from the camera, so it blinks and talks). The dock's Demolição blows it up as in a
              demo and it respawns 2 s later (key D); Flip front-flips it (key F). The dock paints both
              (opcoes.cor: laranja by default, rosa, verde, branco, preto, dourado, roxo, azul) and puts an
              animated decal on them (opcoes.decalque: chamas, neon, arcoiris, listras, nenhum); ?cor= and
              ?decalque= in a browser. Models by Jako (CC BY 4.0),
              public/models/. ?carro=<cm across> (30), ?inclinacao=<degrees from above> (24),
              ?comprimento=<length kept, 0..1> (0.8), ?posicao=x,y,z (cm on the face) to tune.
        Celeste (2026-11-21, filtros/celeste/): Madeline's or Badeline's look on Luan, the game's moves on him, following the game through its mod.
      Kept here but off the dock (Luan, 2026-11-10: only Phoenix and the ball for now):
        Pop   (key 1): the body cut out, in blues, with fire coming off its outline, a pop-art burst behind
              that follows the head, flying shapes the hands push away; it comes in with shards.
        Lente (key 6): two hands in an "L" (thumb and index out): the space between the fingers turns
              psychedelic. It used to work at any time; now only as its own filter.
      Key 0 turns the filter off.

      Sounds (sfx.js, 2026-11-12): every ability plays the game's own, each moment its own cue, panned to where it
      happens in the box: Phoenix's equips, throws, the flash's pop and the flashed ringing as the glare blinds the
      viewers, Hot Hands' blast and fire, the Blaze running across and burning, the ult's cast, burning shoulders and
      the rise to the comeback, and the fire between his palms crackling as big as it is; Sova's bow (out, charging
      with a tick at half and full draw, let go or folded), the Recon Bolt's hit, sonar and pings, the Shock Bolt's
      bounce and burst, the Owl Drone's propellers (quieter behind him), dart and tag, Hunter's Fury charging and
      firing; Sage's orbs coming out, the wall erupting and crumbling, the slow orb's throw, burst and field, her heal
      and its hum, the resurrection's equip and light; the cars' jump and dodge for the flip and the demolition's blast. The cues are made by
      scripts/filtros_sons.py from the games' files (privado/sons/, out of git; without them it's silent).
      OBS hears them only with the source's "Control audio via OBS" on. The dock's "Sons dos filtros" switch
      (opcoes.mudo), key M, ?mudo and ?som=<volume>.

      The Santa hat (gorro.js, 2026-11-15, December's): over any filter or none, on whatever his head is (his hair,
      an agent's hair, the ball, a car's roof), its top swinging as he moves, thrown up by a demolition. The dock's
      "Gorro de Natal" (opcoes.gorro, off until Luan turns it on), key G, ?gorro (=y,z,tilt,size on his own head).

      ?debug shows fps, how long each model takes and the hands seen; ?cpu runs the models on the CPU;
      ?modo=pop|bola|phoenix|sova|octane|fennec|lente starts with a filter on; ?texto=A|B the title's two lines in Pop; it frames the camera as OBS's
      "Enquadramento" crop does (NVIDIA Broadcast's auto frame is off), or ?zoom=1.3 and ?foco=x,y (0..1 of the
      camera's frame, from its top left) for another framing, ?zoom=1 for none; ?phoenix=<url> and ?sova=<url>
      other copies of their models.
    -->

  <body>
    <video id="cam" playsinline muted></video>
    <div id="caixa"><div id="titulo"><small>ao vivo</small><b>muan</b><b>lartins</b></div></div>
    <div id="hud">carregando…</div>
    <script type="module">
      import * as THREE from "three"
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js"
      import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js"
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"
      import { createVfx, TINTS } from "./vfx.js"
      import { VISUAIS } from "./filtros/visuais.js"
      import { lista as listaDeFiltros } from "./filtros/index.js"
      import { createSfx } from "./sfx.js"
      import { createHat } from "./gorro.js"
      import { criarQuadro, SEGURA } from "./quadro.js"

      const q = new URLSearchParams(location.search)
      // The page's size: the camera's own (1280×720 at 60). In OBS each scene scales it into its camera box.
      const W = 1280
      const H = 720
      const MODELS = "https://storage.googleapis.com/mediapipe-models/"
      const hud = document.getElementById("hud")
      const titulo = document.getElementById("titulo")
      if (q.has("debug")) hud.style.display = "block"
      if (q.get("texto")) {
        const [a, b] = q.get("texto").split("|")
        titulo.querySelectorAll("b")[0].textContent = a || ""
        titulo.querySelectorAll("b")[1].textContent = b || ""
      }
      // The page is the camera's box: the camera with the filter fills it, clear while no filter is on, and everything,
      // the flash's glare too, stays in it. In OBS one source sits just above the camera in every scene that has it,
      // placed and scaled over that scene's camera by the scene itself (brand/twitch/obs.py), so during a transition
      // each scene shows it in its own place. (Until 2026-11-13 the page was full screen and moved its box when OBS
      // said the scene changed, which OBS says only once the transition has ended: for a moment after the stinger the
      // game scene showed the filter where the talk scene's camera is.) ?caixa=x,y,w,h draws it in a part of the page,
      // in a 1920×1080 page's pixels (the Shorts collection's source has ?caixa=0,0,1920,1080: the whole page).
      const IN_OBS = !!window.obsstudio
      let box = q.get("caixa") ? q.get("caixa").split(",").map((v) => (Number(v) * W) / 1920) : [0, 0, W, H]
      let showing = true
      if (!IN_OBS) document.body.classList.add("solo")
      {
        const c = document.getElementById("caixa")
        const [bx, by, bw, bh] = box
        Object.assign(c.style, { display: "block", left: `${(bx / W) * 100}%`, top: `${(by / H) * 100}%`, width: `${(bw / W) * 100}%`, height: `${(bh / H) * 100}%` })
      }
      // Off screen (a scene without it), it stops tracking and drawing.
      addEventListener("obsSourceActiveChanged", (e) => (showing = !!e.detail?.active))
      const errors = []
      const fail = (where, e) => {
        console.error(where, e?.name || "", e?.message || e)
        errors.push(`${where}: ${e?.name ? e.name + " " : ""}${e?.message || e}`)
        // On screen only with ?debug: in OBS it would go out on the live (2026-11-09, the camera refused because OBS
        // was opened without its flags). The error is in OBS's log either way, as [obs-browser: 'Filtros'].
      }

      // ---------- camera ----------
      const video = document.getElementById("cam")
      async function openCamera() {
        const want = (q.get("cam") || "NVIDIA Broadcast").toLowerCase()
        // The format OBS's own Câmera uses, since NVIDIA Broadcast's camera serves several apps at once only in one format:
        // 1280×720 at 60 since 2026-11-12 (at 30 a second, the filter's camera stepped beside OBS's own at 60).
        const size = { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60 } }
        const open = (deviceId) => navigator.mediaDevices.getUserMedia({ video: { ...size, deviceId: { exact: deviceId } }, audio: false })
        // The wanted camera by its name, never the system's default first: that's often the physical webcam, which
        // NVIDIA Broadcast holds for itself ("device in use"). Names show only once some camera was opened, so
        // until then each camera is tried in turn.
        let cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput")
        let stream = null
        let failed = null
        // In a browser that hasn't let the site use the camera yet (any but OBS, which allows it by itself), the
        // cameras come without ids, and one asked for by an empty id fails without ever showing the permission prompt
        // (2026-11-15, Brave on localhost). So any camera first, which shows it; once allowed, the names come.
        if (!cams.some((d) => d.deviceId)) {
          try {
            stream = await navigator.mediaDevices.getUserMedia({ video: size, audio: false })
          } catch (e) {
            // Blocked for the site: said as such. Anything else (the webcam NVIDIA Broadcast holds) still unlocked the names.
            if (e.name === "NotAllowedError") throw new Error("o navegador bloqueou a câmera para este site (o cadeado na barra de endereço libera)")
            failed = e
          }
          cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput")
        }
        let pick = cams.find((d) => d.label.toLowerCase().includes(want))
        if (!pick && !stream) {
          for (const c of cams) {
            try {
              stream = await open(c.deviceId)
              break
            } catch (e) {
              failed = e
            }
          }
          cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput")
          pick = cams.find((d) => d.label.toLowerCase().includes(want))
        }
        if (pick && stream?.getVideoTracks()[0].getSettings().deviceId !== pick.deviceId) {
          stream?.getTracks().forEach((t) => t.stop())
          stream = await open(pick.deviceId)
        }
        if (!stream) throw new Error(`nenhuma câmera abriu (${cams.map((c) => c.label || "?").join(", ")}${failed ? `: ${failed.name}` : ""})`)
        video.srcObject = stream
        await video.play()
        await new Promise((r) => (video.videoWidth ? r() : video.addEventListener("loadedmetadata", r, { once: true })))
        return stream.getVideoTracks()[0].label
      }

      // ---------- rendering ----------
      THREE.ColorManagement.enabled = false
      // ?espelho keeps the last frame readable, for ajuste.js to send it to the fitting server (only on localhost:
      // it's his camera).
      const ESPELHAR = q.has("espelho") && ["localhost", "127.0.0.1"].includes(location.hostname)
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance", preserveDrawingBuffer: ESPELHAR })
      renderer.setClearColor(0x000000, 0)
      renderer.outputColorSpace = THREE.LinearSRGBColorSpace
      renderer.setPixelRatio(1)
      renderer.setSize(W, H, false)
      renderer.autoClear = false
      document.body.prepend(renderer.domElement)

      const camTex = new THREE.VideoTexture(video)
      camTex.colorSpace = THREE.NoColorSpace
      camTex.minFilter = camTex.magFilter = THREE.LinearFilter

      // The body mask, 256 wide (rastreio.js); mipmaps blur it for free, which is what the outline and
      // the fire are made of.
      const MW = 256
      let MH = 144
      let maskData = new Uint8Array(MW * MH)
      let maskTex = makeMaskTex(maskData)
      // The same without the chair behind him, while the filter on asks for it (`quer`'s tronco); else the same.
      let troncoData = new Uint8Array(MW * MH)
      let troncoTex = makeMaskTex(troncoData)
      // Where he may be, over the last masks and round his head: not to be learnt as background (quadro.js).
      let foraData = new Uint8Array(MW * MH)
      let foraTex = makeMaskTex(foraData)
      function makeMaskTex(data) {
        const t = new THREE.DataTexture(data, MW, MH, THREE.RedFormat, THREE.UnsignedByteType)
        t.minFilter = THREE.LinearMipmapLinearFilter
        t.magFilter = THREE.LinearFilter
        t.generateMipmaps = true
        t.needsUpdate = true
        return t
      }

      // Screen uv (0..1, y up) ↔ video uv: the video covers the canvas, zoomed in on ?foco by ?zoom.
      const cover = { sx: 1, sy: 1, ox: 0, oy: 0 }
      function fitCover() {
        const va = video.videoWidth / video.videoHeight
        const ca = W / H
        if (va > ca) Object.assign(cover, { sx: ca / va, sy: 1, ox: (1 - ca / va) / 2, oy: 0 })
        else Object.assign(cover, { sx: 1, sy: va / ca, ox: 0, oy: (1 - va / ca) / 2 })
        // By default the same framing as OBS's "Enquadramento" crop (CAMERA_CROP in brand/twitch/obs_shorts.py:
        // 207, 240, 220, 0 of 1280×720, as 310, 360, 330, 0 was of 1920×1080), since the page opens the camera itself,
        // without OBS's filters.
        const zoom = Math.max(1, Number(q.get("zoom") || 1920 / 1280))
        if (zoom > 1) {
          const [fx, fy] = (q.get("foco") || `${(310 + 640) / 1920},${(360 + 360) / 1080}`).split(",").map(Number)
          const sx = cover.sx / zoom
          const sy = cover.sy / zoom
          const clamp = (v, max) => Math.min(Math.max(v, 0), max)
          Object.assign(cover, { sx, sy, ox: clamp(fx - sx / 2, 1 - sx), oy: clamp(1 - fy - sy / 2, 1 - sy) })
        }
        // The 3D camera sees the whole frame at MediaPipe's 63°, and renders only the part on screen.
        const fullW = W / cover.sx
        const fullH = H / cover.sy
        headCam.aspect = fullW / fullH
        headCam.setViewOffset(fullW, fullH, cover.ox * fullW, (1 - cover.oy - cover.sy) * fullH, W, H)
      }
      // A point in the video image (x right, y down, 0..1) to screen uv.
      const toScreen = (x, y) => [(x - cover.ox) / cover.sx, (1 - y - cover.oy) / cover.sy]

      const GLSL_COMMON = /* glsl */ `
        uniform sampler2D uCam;
        uniform sampler2D uMask;
        uniform vec4 uCover;
        uniform float uTime;
        uniform float uAspect;
        varying vec2 vUv;
        vec2 camUv(vec2 uv) { return uv * uCover.xy + uCover.zw; }
        float maskAt(vec2 uv, float lod) { vec2 v = camUv(uv); return textureLod(uMask, vec2(v.x, 1.0 - v.y), lod).r; }
        float hash(float n) { return fract(sin(n * 127.1) * 43758.5453); }
        float hash2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash2(i), hash2(i + vec2(1, 0)), f.x), mix(hash2(i + vec2(0, 1)), hash2(i + vec2(1, 1)), f.x), f.y);
        }
        float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * noise(p); p *= 2.03; a *= 0.5; } return s; }
        float lum(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
        const vec3 YELLOW = vec3(1.0, 0.91, 0.05);
        const vec3 CYAN = vec3(0.1, 0.74, 0.97);
        const vec3 MAGENTA = vec3(1.0, 0.17, 0.58);
        const vec3 NAVY = vec3(0.13, 0.09, 0.42);
        const vec3 ORANGE = vec3(1.0, 0.5, 0.08);
        const vec3 BLUE = vec3(0.17, 0.36, 0.96);
        const vec3 LIME = vec3(0.45, 0.95, 0.4);
        // Halftone dots in pixels: 1 inside a dot of radius r (0..0.5 of a cell).
        float dots(vec2 uv, float cell, float r) {
          vec2 px = uv * vec2(${W}.0, ${H}.0);
          vec2 g = mat2(0.7071, -0.7071, 0.7071, 0.7071) * px / cell;
          return step(length(fract(g) - 0.5), r);
        }
        // The shards Pop comes in with: diagonal bands, each a little ahead or behind.
        float reveal(vec2 uv, float p) {
          vec2 d = normalize(vec2(1.0, 0.55));
          float along = dot(uv, d);
          float band = floor(dot(uv, vec2(-d.y, d.x)) * 9.0);
          return step(along, p * 1.75 - 0.15 - hash(band + 3.0) * 0.3);

      const uniforms = {
        uCam: { value: camTex },
        uMask: { value: maskTex },
        uTronco: { value: troncoTex },
        uCover: { value: new THREE.Vector4(1, 1, 0, 0) },
        uTime: { value: 0 },
        uAspect: { value: W / H },
        uPop: { value: 0 },
        uCenter: { value: new THREE.Vector2(0.55, 0.6) },
        uEnergy: { value: 0 },
        uLens: { value: [0, 1, 2, 3].map(() => new THREE.Vector2()) },
        uLensAmt: { value: 0 },
        // The agents: the face's oval (centre, half width and height, its up direction), around which Luan's own
        // hair is painted over with the camera's background (uPlate, evened out to the frame by uPlateFix).
        uErase: { value: 0 },
        uFace: { value: new THREE.Vector4(0.5, 0.6, 0.1, 0.15) },
        uFaceUp: { value: new THREE.Vector2(0, 1) },
        uPlate: { value: null },
        uPlateFix: { value: new THREE.Vector3() },
        uPlateOk: { value: 0 },

        uEraseLow: { value: new THREE.Vector2(-0.55, -0.3) },
        // How far his head has moved on screen since the mask's frame: the erasing covers him at both places.
        uMaskShift: { value: new THREE.Vector2() },

        uMem: { value: null },
        uKeep: { value: null },

      const GLSL_APAGAR = /* glsl */ `
        uniform float uErase;
        uniform vec4 uFace;
        uniform vec2 uFaceUp;
        uniform sampler2D uPlate;
        uniform vec3 uPlateFix;
        uniform float uPlateOk;
        uniform vec2 uMaskShift;
        uniform vec2 uEraseLow;
        uniform sampler2D uMem;
        uniform sampler2D uKeep;
        vec4 apagarCabelo(vec3 col, vec2 uv) {

            d = vec2(dot(d, vec2(uFaceUp.y, -uFaceUp.x)), dot(d, uFaceUp));

              // the zone's edges, so no line shows where the erasing stops.

              float m = smoothstep(0.03, 0.2, max(maskAt(uv, 2.0), maskAt(uv - uMaskShift, 2.0)));
              float k = (1.0 - smoothstep(0.2, 0.8, texture2D(uKeep, uv).r)) * smoothstep(1.0, 0.9, zone) * smoothstep(uEraseLow.x, uEraseLow.y, d.y / uFace.w);
              vec2 v = camUv(uv);
              vec4 mem = texture2D(uMem, v);

      // Layer 0: the camera, or Pop's burst and fire where its shards have come in.
      const baseMat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: VERT,
        depthTest: false,
        depthWrite: false,
        fragmentShader: /* glsl */ `

          uniform vec2 uCenter;
          uniform float uEnergy;

            float n = 22.0;
            float k = (atan(p.y, p.x) / 6.2831853 + 0.5) * n + t * (0.04 + uEnergy * 0.5);
            k += 0.12 * sin(r * 38.0 + floor(k) * 2.0);
            float id = mod(floor(k), n);
            float h = hash(id + 11.0);
            vec3 c = h < 0.4 ? YELLOW : h < 0.58 ? BLUE : h < 0.7 ? MAGENTA : h < 0.82 ? CYAN : NAVY;
            if (h >= 0.4 && h < 0.58) c = mix(c, NAVY, dots(uv, 13.0, 0.16 + 0.22 * smoothstep(0.1, 0.9, r)));
            if (h >= 0.82) c = mix(c, BLUE, dots(uv, 11.0, 0.3));

            float b = fbm(p * 2.4 + vec2(0.0, -t * 0.18) + 3.0);
            float b2 = fbm(p * 3.1 + vec2(4.0, -t * 0.25));
            if (b > 0.7) c = MAGENTA; else if (b > 0.68) c = NAVY;
            if (b2 > 0.73) c = CYAN; else if (b2 > 0.715) c = LIME;
            return c;
          }
          // Fire off the body's outline: the mask looked up a little below, blurred, through jumpy noise.
          vec4 fire(vec2 uv, float t) {
            float ts = floor(t * 12.0) / 12.0;
            float n1 = noise(vec2(uv.x * 22.0, uv.y * 7.0 - ts * 5.0));
            float n2 = noise(vec2(uv.x * 12.0 + 9.0, uv.y * 4.0 - ts * 3.5));
            float grow = 1.0 + uEnergy * 1.5;
            float near = maskAt(uv + vec2((n1 - 0.5) * 0.04, -0.045 * (0.3 + n1) * grow), 2.2);
            float far = maskAt(uv + vec2((n2 - 0.5) * 0.08, -0.12 * (0.25 + n2) * grow), 3.4);
            float ring = maskAt(uv, 2.6);
            if (near > 0.5) return vec4(mix(ORANGE, YELLOW, step(0.62, n1)), 1.0);
            if (ring > 0.16) return vec4(ORANGE, 1.0);
            if (far > 0.42) return vec4(mix(MAGENTA, ORANGE, step(0.55, n2)), 1.0);
            if (far > 0.34) return vec4(CYAN, 1.0);

          }
          void main() {

            if (uPop > 0.0 && reveal(vUv, uPop) > 0.0) {

              vec4 f = fire(vUv, uTime);

      const bodyMat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: VERT,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform float uPop;

        vertexShader: VERT,

        depthWrite: false,

          ${GLSL_COMMON}

          uniform float uLensAmt;

          }`,
      })

      const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1)
      const quad = (mat) => {
        const s = new THREE.Scene()
        s.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat))
        return s
      }
      const baseScene = quad(baseMat)
      const bodyScene = quad(bodyMat)
      const lensScene = quad(lensMat)

      // What's behind Luan, remembered in the video's own uv: the pixels where he surely isn't (his chair, the
      // background) are kept, so what's painted over his hair is what was really there; where he's never moved away
      // from, the plate (when it matches). Surely: out of the last masks and off his head (quadro.js), and taken from
      // the very frame the mask was made from (`uQuadro`, handed back by its worker), never the one on screen by then.
      const memRT = [0, 1].map(() => new THREE.WebGLRenderTarget(1280, 720, { depthBuffer: false, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter }))
      let memI = 0
      let aprender = null
      let quadroTex = null
      let memZeradaEm = -Infinity
      const memMat = new THREE.ShaderMaterial({
        uniforms: { uQuadro: { value: null }, uFora: { value: foraTex }, uPrev: { value: memRT[1].texture } },
        vertexShader: VERT,
        depthTest: false,
        depthWrite: false,
        fragmentShader: /* glsl */ `
          uniform sampler2D uQuadro;
          uniform sampler2D uFora;
          uniform sampler2D uPrev;

          quadroTex.minFilter = quadroTex.magFilter = THREE.LinearFilter
          quadroTex.userData = { w: bitmap.width, h: bitmap.height }

        quadroTex.needsUpdate = true
        foraData.set(fora)
        foraTex.needsUpdate = true

        renderer.render(memScene, ortho)
        renderer.setRenderTarget(null)
        uniforms.uMem.value = memRT[memI].texture

      }
      // Nothing known of what's behind him: another camera, another background, or the filter on from none.

        quadro.limpa()
        renderer.getClearColor(corLimpa)
        const a = renderer.getClearAlpha()
        renderer.setClearColor(0x000000, 0)
        renderer.setScissorTest(false)
        for (const rt of memRT) {

          renderer.clear()
        }
        renderer.setRenderTarget(null)
        renderer.setClearColor(corLimpa, a)

      }
      const corLimpa = new THREE.Color()

      // inside it), frost creeping up him, the camera darkening round him (Hunter's Fury, so its blasts read) and the
      // marker over a revealed head. Premultiplied: solid things go over, light adds.
      const corpoMat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: VERT,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        blending: THREE.CustomBlending,
        blendSrc: THREE.OneFactor,
        blendDst: THREE.OneMinusSrcAlphaFactor,
        blendSrcAlpha: THREE.OneFactor,
        blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform vec4 uGlow[2];
          uniform vec3 uGlowK[2];
          uniform float uFrost;
          uniform float uDim;
          uniform vec3 uMark;
          const vec3 RED = vec3(1.0, 0.27, 0.33);
          const vec3 FROST = vec3(0.62, 0.95, 1.0);
          void over(inout vec4 o, vec3 c, float a) { o = vec4(c * a, a) + o * (1.0 - a); }
          void main() {
            vec2 A = vec2(uAspect, 1.0);
            vec2 p = vUv * A;
            vec4 o = vec4(0.0);
            vec3 glow = vec3(0.0);
            // The camera darkening round him.
            if (uDim > 0.0) {

            float raw = maskAt(vUv, 0.0);
            float body = smoothstep(0.45, 0.6, raw);

            float rim = body * (1.0 - smoothstep(0.75, 0.95, maskAt(vUv, 1.4)));

        brilho(i, cor, amt, k = [0.2, 0.9, 0.8]) {

        set gelo(v) { uniforms.uFrost.value = v },
        get escuro() { return uniforms.uDim.value },
        set escuro(v) { uniforms.uDim.value = v },
        /** The marker over his head, at x, y on the box (0..1, y up). */
        marca(x, y, amt) { uniforms.uMark.value.set(x, y, amt) },
        limpar() {

      }

      // The cars' demolition, after the game's: a white flash and a shock ring, a fireball in flat bands that burns
      // inwards, sparks thrown out and falling, dark smoke puffing out last.
      const boomMat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: VERT,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        blending: THREE.CustomBlending,
        blendSrc: THREE.OneFactor,
        blendDst: THREE.OneMinusSrcAlphaFactor,
        blendSrcAlpha: THREE.OneFactor,
        blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform vec3 uBoom;
          uniform float uBoomT;
          void over(inout vec4 o, vec3 c, float a) { o = vec4(c * a, a) + o * (1.0 - a); }
          void main() {
            float t = uBoomT;
            vec2 d = (vUv - uBoom.xy) * vec2(uAspect, 1.0) / uBoom.z;
            float r = length(d);
            float ang = atan(d.y, d.x);
            vec4 o = vec4(0.0);
            vec3 glow = vec3(0.0);
            // Smoke, under the fire: puffs pushed out and up, fading.
            float smokeA = smoothstep(0.15, 0.5, t) * (1.0 - smoothstep(1.1, 1.9, t));
            if (smokeA > 0.0) {
              float s = 0.0;

                float fi = float(i);

            float edge = 1.15 * grow * (0.8 + 0.4 * n);

        }
        const bone = {}
        const meshes = []
        root.traverse((o) => {
          // (By its name, and without the number some exports add to it: Neck_12.)
          if (o.isBone) {
            const p = o.getWorldPosition(new THREE.Vector3())
            bone[o.name] = p
            bone[o.name.replace(/_\d+$/, "")] ??= p
          }
          if (o.isSkinnedMesh) meshes.push(o)
        })
        const body = meshes.find((m) => (a.body || /Body/).test(m.material.name))
        const hairMesh = meshes.find((m) => /Hair/.test(m.material.name))
        const extras = a.extra ? meshes.filter((m) => a.extra.test(m.material.name)) : []
        const eyes = bone.L_Eyeball.clone().add(bone.R_Eyeball).multiplyScalar(0.5)
        // The brows: one bone each, or (a finer face rig) the middle of each brow.
        const browY = ((bone.L_Brows || bone.L_Brow_Mid_01).y + (bone.R_Brows || bone.R_Brow_Mid_01).y) / 2
        const front = eyes.z + 0.03
        // The model faces −z with its left at −x; turned half a turn it faces the camera like Luan.
        const turn = (v) => new THREE.Vector3(-v.x, v.y, -v.z)

        // Head piece, in the canonical face's centimetres.
        const s = EYES_CM / bone.L_Eyeball.distanceTo(bone.R_Eyeball)
        const headPiece = new THREE.Group()
        headPiece.rotation.y = Math.PI
        headPiece.scale.setScalar(s * HEAD_K)
        headPiece.position.copy(EYES_AT).sub(turn(eyes).multiplyScalar(s * HEAD_K))
        headPiece.position.y -= HEAD_DOWN
        headPiece.add(piece(hairMesh, (i, p) => a.hairDown === undefined || p.y > eyes.y - a.hairDown))
        // The scalp: above the brows at the forehead; on the sides the fade comes down to the top of the ears
        // (they stick out of the skull only ~1 cm, so they're cut by where they are: 11 cm deep from 2 cm
        // behind the eyes), down to the brows at the temples before them, lower behind them.
        const scalp = (p) => {
          const side = Math.abs(p.x - eyes.x) > 0.068
          const depth = p.z - eyes.z
          if (side && depth > 0.021 && depth < 0.131) return p.y > browY + 0.015
          if (side && depth <= 0.021) return p.y > browY + 0.005
          return p.y > (p.z < front ? browY + (a.forehead ?? 0.035) : browY - 0.03)
        }
        headPiece.add(piece(body, (i, p, g) => g === "head" && scalp(p)))
        a.hair.add(headPiece)
        // The hair's box in the face's centimetres, for the Santa hat on top of it (gorro.js).
        a.hatBox = new THREE.Box3()
        headPiece.updateMatrix()
        const hp = new THREE.Vector3()
        for (const m of headPiece.children) {
          const pos = m.geometry.getAttribute("position")
          for (const i of m.geometry.index.array) a.hatBox.expandByPoint(hp.fromBufferAttribute(pos, i).applyMatrix4(headPiece.matrix))
        }

        // Torso piece, in metres with the shoulders' midpoint at the origin; placed each frame.
        const mid = bone.L_Shoulder.clone().add(bone.R_Shoulder).multiplyScalar(0.5)
        a.width = bone.L_Shoulder.distanceTo(bone.R_Shoulder)
        a.neck = bone.Neck.y - mid.y
        const torsoPiece = new THREE.Group()
        torsoPiece.rotation.y = Math.PI
        torsoPiece.position.copy(turn(mid).multiplyScalar(-1))
        torsoPiece.position.y -= TORSO_DOWN
        const squash = new THREE.Group()
        squash.scale.y = TORSO_Y
        squash.add(torsoPiece)
        a.squash = squash
        torsoPiece.add(piece(body, (i, p, g) => g === "torso" || ARMS.includes(g)))
        for (const m of extras) torsoPiece.add(piece(m, () => true))
        a.torso.add(squash)
        a.ready = true
      }

      // Luan's shoulders in the 3D camera's space (cm): the body tracker gives them on screen and their depth
      // relative to each other; the face's transform gives how far he is.
      const pose = { seen: false, left: new THREE.Vector2(), right: new THREE.Vector2(), dz: 0, elbows: [null, null], target: null, sentAt: -1e9, sentHead: null, offL: new THREE.Vector2(), offR: new THREE.Vector2(), rel: undefined }
      function onRay(u, v, z) {
        const p = new THREE.Vector3(u * 2 - 1, v * 2 - 1, 0.5).unproject(headCam)
        return p.multiplyScalar(z / p.z)
      }
      // The torso's fine-tuning (?tronco's size) is the agents'; a piece placed by numbers has its own size.
      const torsoK = (a) => (a.modo === "fixo" ? 1 : TORSO_K)
      function placeTorso(a) {
        const z = headPos.z
        const L = onRay(pose.left.x, pose.left.y, z - pose.dz / 2)
        const R = onRay(pose.right.x, pose.right.y, z + pose.dz / 2)
        const x = L.clone().sub(R)
        const scale = x.length() / a.width
        x.normalize()
        const zAxis = new THREE.Vector3().crossVectors(x, new THREE.Vector3(0, 1, 0)).normalize()
        const y = new THREE.Vector3().crossVectors(zAxis, x)
        const qt = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, zAxis))
        const at = L.clone().add(R).multiplyScalar(0.5)
        // The neck: how high Luan's chin is over his shoulders sets how tall the torso is, so its collar opens
        // under his chin whether he sits up or looks down at the screen. (A piece placed by numbers whose top is
        // below his shoulders has no neck: it stays as it is.)
        if (faceLm && a.squash && (a.modo !== "fixo" || a.neck > 0.02)) {
          const [cu, cv] = toScreen(faceLm[152].x, faceLm[152].y)
          const chin = onRay(cu, cv, z)
          const neck = chin.sub(at).dot(y)
          const want = THREE.MathUtils.clamp((neck * NECK) / (a.neck * scale * torsoK(a)), 0.3, 1.2)
          a.squash.scale.y += (want - a.squash.scale.y) * 0.4
        } else if (a.modo === "fixo") a.squash.scale.y += (1 - a.squash.scale.y) * 0.4
        if (a.seen) {
          a.pos.lerp(at, 0.8)
          a.quat.slerp(qt, 0.5)
          a.scale += (scale - a.scale) * 0.5
        } else {
          a.pos.copy(at)
          a.quat.copy(qt)
          a.scale = scale
        }
        a.seen = true
      }

      // ---------- the abilities' particles and sounds, and where they happen (every filter's) ----------
      // The particles (vfx.js): the game's own effects, each filter's from its folder's efeitos.js (Phoenix's in
      // filtros/phoenix/), in the 3D camera's space, moved once a frame for every filter (in the loop) and drawn
      // tone mapped over the box.
      const vfx = createVfx(renderer, headCam)
      // Their sounds (sfx.js): each moment of an ability plays the game's own (privado/sons/, made by
      // scripts/filtros_sons.py), panned to where it happens in the box. ?som=<volume> (1), ?mudo to start silent;
      // the dock's "Sons" switch turns them off.
      const sfx = createSfx({ volume: Number(q.get("som") ?? 1) })
      if (q.has("mudo")) sfx.on = false
      const panAt = (u) => (u - 0.5) * 1.2
      const pan3 = (p) => panAt(onBox(p).x)
      // A point on the camera box (0..1, y up) at the depth of his face, dz centimetres closer.
      const at3 = (u, v, dz = 0) => onRay(u, v, (headSeen ? headPos.z : -65) + dz)
      // The hand to cast from: the one seen furthest to that side of the box (1 right, -1 left), else a spot
      // low on that side.
      function handAt(side) {
        const seen = lastHands.map((h) => toScreen((h[0].x + h[9].x) / 2, (h[0].y + h[9].y) / 2))
        if (seen.length) return seen.sort((a, b) => side * (b[0] - a[0]))[0]
        return [0.5 + side * 0.28, 0.3]
      }

      // Every filter's helpers for where things go: the box's aspect, a clamp inside the box, a smooth step, a
      // quadratic curve's point and direction.
      const ASPECT = W / H
      const clamp01 = (v, lo = 0.05, hi = 0.95) => Math.min(hi, Math.max(lo, v))
      const ease = (t) => t * t * (3 - 2 * t)
      const bez = (a, c, b, k) => a.clone().multiplyScalar((1 - k) ** 2).addScaledVector(c, 2 * k * (1 - k)).addScaledVector(b, k * k)
      const bezDir = (a, c, b, k) => c.clone().sub(a).multiplyScalar(1 - k).addScaledVector(b.clone().sub(c), k)
      // The face on screen: its centre (the nose), width, the top of the forehead and its height.
      function faceBox() {
        if (!faceLm) return { c: new THREE.Vector2(0.5, 0.55), w: 0.15, top: new THREE.Vector2(0.5, 0.75), h: 0.3 }
        const S = (i) => new THREE.Vector2(...toScreen(faceLm[i].x, faceLm[i].y))
        const c = S(1), top = S(10), chin = S(152)
        return { c, w: Math.abs(S(454).x - S(234).x), top, h: top.y - chin.y }
      }
      // Where a ray from p along dir leaves the box, a little inside it.
      function toEdge(p, dir, inset = 0.03) {
        let s = Infinity
        if (dir.x > 1e-6) s = Math.min(s, (1 - inset - p.x) / dir.x)
        if (dir.x < -1e-6) s = Math.min(s, (inset - p.x) / dir.x)
        if (dir.y > 1e-6) s = Math.min(s, (1 - inset - p.y) / dir.y)
        if (dir.y < -1e-6) s = Math.min(s, (inset - p.y) / dir.y)
        return p.clone().addScaledVector(dir, Math.max(0, s))
      }
      // A camera-space point on the box (0..1, y up).
      const onBox = (p) => {
        const s = p.clone().project(headCam)
        return new THREE.Vector2(s.x * 0.5 + 0.5, s.y * 0.5 + 0.5)
      }
      // His head in the 3D camera's space (while it isn't seen, a spot in the middle of the box).
      const headAt = () => (headSeen ? headPos.clone() : at3(0.5, 0.55))
      // A hand's shape, for the gestures: its size (the palm's length or its knuckles' width, whichever shows
      // more), the middle of its knuckles, and whether it's a fist or open (the recognizer's own call, or the
      // fingertips' distances from the wrist). Distances in the video's height, so they're round on screen.
      function handShape(h, cat, va) {
        const d = (p, o) => Math.hypot((p.x - o.x) * va, p.y - o.y)
        const s = Math.max(d(h[0], h[9]), d(h[5], h[17]) * 1.25)
        const r = [8, 12, 16, 20].map((t) => d(h[t], h[0]) / s)
        const k = [5, 9, 13, 17].reduce((a, i) => ({ x: a.x + h[i].x / 4, y: a.y + h[i].y / 4 }), { x: 0, y: 0 })
        const fist = (cat === "Closed_Fist" || r.filter((v) => v < 1.3).length >= 3) && cat !== "Open_Palm"
        const open = (cat === "Open_Palm" || r.filter((v) => v > 1.6).length >= 3) && cat !== "Closed_Fist"
        return { h, s, k, d, fist, open }
      }
      // The box's picture shaken (`sacudir`, any filter's: Sova's shocks): ms long, px pixels at first and dying
      // away; one that would end sooner than the shake on doesn't cut it short. A new filter stops it.
      const shaking = { until: 0, len: 1, amp: 0 }
      function shake(ms, px, now) {
        if (now + ms > shaking.until) Object.assign(shaking, { until: now + ms, len: ms, amp: px })
      }
      // The box's picture moved (`deslocar`, any filter's: Celeste's dash whips it to a side, its feather floats it):
      // dx, dy pixels of a 1280-wide box (right, up), for this frame only (asked again every frame it lasts; several
      // add up), zoomed in just enough that no edge of the box shows.
      const moved = { x: 0, y: 0 }
      function deslocar(dx, dy) {
        moved.x += dx
        moved.y += dy
      }

      // Luan's face and hands, drawn back over the jacket: a small mask of the face's outline and each hand's
      // outline, painted with the camera.
      const FACE_OVAL = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109]
      const keepCanvas = document.createElement("canvas")
      keepCanvas.width = 960
      keepCanvas.height = 540
      const keepCtx = keepCanvas.getContext("2d")
      const keepTex = new THREE.CanvasTexture(keepCanvas)
      uniforms.uKeep.value = keepTex
      let lastHands = []
      function hull(points) {
        const p = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1])
        const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0])
        const lower = [], upper = []
        for (const v of p) {
          while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], v) <= 0) lower.pop()
          lower.push(v)
        }
        for (const v of p.reverse()) {
          while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], v) <= 0) upper.pop()
          upper.push(v)
        }
        return lower.slice(0, -1).concat(upper.slice(0, -1))
      }
      // trim: where the face stops above the brows, as a part of the brows-to-chin height (none: the whole oval).
      // face: false for the cars, which cover it (only the hands are kept). rosto, maos: false for a look placed by
      // numbers that covers his face or his hands (visuais.js's rostoPorCima, maosPorCima): they aren't drawn back
      // (still kept from the erasing, and his hands still in the blue).
      function drawKeep(trim, face = true, rosto = true, maos = true) {
        const c = keepCtx
        c.clearRect(0, 0, 960, 540)
        c.fillStyle = c.strokeStyle = "#fff"
        c.lineJoin = "round"
        const px = (lm) => {
          const [u, v] = toScreen(lm.x, lm.y)
          return [u * 960, (1 - v) * 540]
        }
        // Softer the bigger the face is on screen.
        c.filter = faceLm ? `blur(${Math.max(4, Math.hypot(...[0, 1].map((k) => px(faceLm[234])[k] - px(faceLm[454])[k])) * 0.025).toFixed(1)}px)` : "blur(4px)"
        const shape = (pts, pad) => {
          c.beginPath()
          pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)))
          c.closePath()
          c.fill()
          c.lineWidth = pad
          c.stroke()
        }
        if (faceLm && face) {
          let oval = FACE_OVAL.map((i) => px(faceLm[i]))
          // In red only, under the rest: the whole oval and the ears beside it, which the hair around is erased
          // up to (the ears stick out from where the oval meets the head, between the brows and the nose's base).
          c.fillStyle = c.strokeStyle = "#f00"
          shape(oval, 6)
          const [l, r] = [234, 454].map((i) => px(faceLm[i]))
          const fw = Math.hypot(r[0] - l[0], r[1] - l[1])
          const roll = Math.atan2(r[1] - l[1], r[0] - l[0])
          for (const [p, side] of [[l, -1], [r, 1]]) {
            c.beginPath()
            c.ellipse(p[0] + Math.cos(roll) * side * fw * 0.05, p[1] + Math.sin(roll) * side * fw * 0.05, fw * 0.1, fw * 0.2, roll, 0, Math.PI * 2)
            c.fill()
          }
          // The face in red and green (not blue: blue is the hands alone, drawn back over Sova's bow).
          c.fillStyle = c.strokeStyle = "#ff0"
          if (!rosto) oval = null
          else if (trim) {
            // Points above the line `trim` over the brows come down onto it, along the face's up.
            const chinP = px(faceLm[152])
            const topP = px(faceLm[10])
            const brow = [105, 334].map((i) => px(faceLm[i]))
            const len = Math.hypot(topP[0] - chinP[0], topP[1] - chinP[1])
            const up = [(topP[0] - chinP[0]) / len, (topP[1] - chinP[1]) / len]
            const h = (p) => (p[0] - chinP[0]) * up[0] + (p[1] - chinP[1]) * up[1]
            const hb = (h(brow[0]) + h(brow[1])) / 2
            const limit = hb * (1 + trim)
            oval = oval.map((p) => (h(p) > limit ? [p[0] - up[0] * (h(p) - limit), p[1] - up[1] * (h(p) - limit)] : p))
          }
          if (oval) {
            shape(oval, 6)
            const [jl, jr, chin, top] = [172, 397, 152, 10].map((i) => px(faceLm[i]))
            // Tapering to a V like a shirt's neckline, so it doesn't end in a straight cut.
            const down = (chin[1] - top[1]) * 0.3
            const inset = (jr[0] - jl[0]) * 0.14
            const cx = (jl[0] + jr[0]) / 2
            shape([jl, jr, [jr[0] - inset, chin[1] + down * 0.7], [cx, chin[1] + down * 1.25], [jl[0] + inset, chin[1] + down * 0.7]], 6)
          }
        }
        c.fillStyle = c.strokeStyle = maos ? "#fff" : "#f0f"
        for (const h of lastHands) {
          const pts = h.map(px)
          const palm = Math.hypot(pts[0][0] - pts[9][0], pts[0][1] - pts[9][1])
          shape(hull(pts), palm * 0.45)
        }
        keepTex.needsUpdate = true
      }
      const keepMat = new THREE.ShaderMaterial({
        uniforms: { ...uniforms, uKeep: { value: keepTex } },
        vertexShader: VERT,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform sampler2D uKeep;
          void main() {
            float k = smoothstep(0.2, 0.8, texture2D(uKeep, vUv).g);
            if (k <= 0.0) discard;
            gl_FragColor = vec4(texture2D(uCam, camUv(vUv)).rgb, k);
          }`,
      })
      const keepScene = quad(keepMat)
      // His hands alone (the keep's blue), over Sova's bow: they hold it and pull its string.
      const keepHandsMat = keepMat.clone()
      keepHandsMat.uniforms = keepMat.uniforms
      keepHandsMat.fragmentShader = keepMat.fragmentShader.replace("texture2D(uKeep, vUv).g", "texture2D(uKeep, vUv).b")
      const keepHandsScene = quad(keepHandsMat)
      // His face alone (the keep's green without the blue), over a look's head piece that comes down by his face.
      const keepFaceMat = keepMat.clone()
      keepFaceMat.uniforms = keepMat.uniforms
      keepFaceMat.fragmentShader = keepMat.fragmentShader.replace("texture2D(uKeep, vUv).g)", "texture2D(uKeep, vUv).g) * (1.0 - smoothstep(0.2, 0.8, texture2D(uKeep, vUv).b))")
      const keepFaceScene = quad(keepFaceMat)

      // ---------- the cars on the face: Octane, Fennec ----------
      // Rocket League's cars by Jako (CC BY 4.0, public/models/) as Luan's head, Pixar-style: seen a little from
      // above, turning with the head, his own eyes on the windshield and his mouth on the bumper, cut from the
      // camera every frame (so it blinks and talks). The models face +x with +y up.
      const CARS = { octane: { url: "../models/octane.glb" }, fennec: { url: "../models/fennec.glb" } }
      const CAR_W = Number(q.get("carro") || 26)
      const CAR_PITCH = THREE.MathUtils.degToRad(Number(q.get("inclinacao") ?? 10))
      const CAR_LEN = Number(q.get("comprimento") || 0.6)
      // ?perfil=: its length seen from the side (the head is deeper than it's wide).
      const CAR_LEN_SIDE = Number(q.get("perfil") || 0.85)
      const CAR_AT = (q.get("posicao") || "0,0.5,-8").split(",").map(Number)
      // An eye's height for its width (the camera's cut has the same shape).
      const EYE_H = 0.75
      // Reflections for the paint, from a neutral room.
      let carEnv = null
      // A neutral room's reflections (the cars' paint, Sova's bow and drone), made once.
      function roomEnv() {
        if (!carEnv) {
          const pm = new THREE.PMREMGenerator(renderer)
          carEnv = pm.fromScene(new RoomEnvironment(), 0.04).texture
          pm.dispose()
        }
        return carEnv
      }
      // The eyes and the mouth, cut from the camera into one small canvas: the eyes side by side over the mouth.
      const partsCanvas = document.createElement("canvas")
      partsCanvas.width = 512
      partsCanvas.height = 256
      const partsCtx = partsCanvas.getContext("2d")
      const partsTex = new THREE.CanvasTexture(partsCanvas)
      partsTex.colorSpace = THREE.NoColorSpace
      partsTex.minFilter = THREE.LinearFilter
      partsTex.generateMipmaps = false
      // A part: an ellipse of the canvas, with a dark rim like a cartoon's line.
      function partMat(rect) {
        return new THREE.ShaderMaterial({
          uniforms: { uTex: { value: partsTex }, uRect: { value: new THREE.Vector4(...rect) } },
          vertexShader: /* glsl */ `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
          fragmentShader: /* glsl */ `
            uniform sampler2D uTex;
            uniform vec4 uRect;
            varying vec2 vUv;
            void main() {
              float e = length((vUv - 0.5) * 2.0);
              if (e > 1.0) discard;
              vec3 c = texture2D(uTex, uRect.xy + vUv * uRect.zw).rgb;
              c = mix(c, vec3(0.03, 0.03, 0.08), smoothstep(0.85, 0.89, e));
              gl_FragColor = vec4(c, smoothstep(1.0, 0.96, e));
            }`,
          transparent: true,
          depthWrite: false,
          polygonOffset: true,
          polygonOffsetFactor: -4,
          polygonOffsetUnits: -4,
        })
      }
      for (const [id, c] of Object.entries(CARS)) {
        Object.assign(c, { id, amt: 0, ready: false, group: new THREE.Group(), body: new THREE.Group(), boom: -1, flip: -1, shown: 0, s: 1, len: CAR_LEN })
        c.group.visible = false
        c.group.add(c.body)
        head.add(c.group)
        new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load(c.url, (gltf) => buildCar(c, gltf.scene), undefined, (e) => fail(id, e))
      }
      const carList = Object.values(CARS)
      // The paint (2026-11-13, ccamara's idea in the chat): the models come in the blue team's blue, which melts into
      // the blue behind Luan, so they're painted orange by default, the other team's colour. The dock picks another
      // (opcoes.cor, both cars) and an animated decal over it (opcoes.decalque), like the game's: ?cor= and
      // ?decalque= in a browser. Colours are as the page draws them (no colour management here).
      const CAR_PAINTS = {
        laranja: [1, 0.26, 0.02, 0.35, 0.3],
        rosa: [1, 0.2, 0.62, 0.3, 0.32],
        verde: [0.42, 1, 0.12, 0.3, 0.32],
        branco: [0.92, 0.94, 0.97, 0.2, 0.25],
        preto: [0.035, 0.035, 0.045, 0.6, 0.22],
        dourado: [1, 0.72, 0.18, 0.95, 0.22],
        roxo: [0.5, 0.12, 1, 0.35, 0.3],
        azul: [0.048, 0.131, 1, 0.3, 0.29],
      }
      // The decals, drawn by the paint's shader over the car's length (no UVs on the body to put a picture on).
      const CAR_DECALS = { nenhum: 0, chamas: 1, neon: 2, arcoiris: 3, listras: 4 }
      const carLook = { cor: CAR_PAINTS[q.get("cor")] ? q.get("cor") : "laranja", decalque: CAR_DECALS[q.get("decalque")] !== undefined ? q.get("decalque") : "nenhum" }
