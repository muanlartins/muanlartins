          // Tapering to a V like a shirt's neckline, so it doesn't end in a straight cut.
          const down = (chin[1] - top[1]) * 0.3
          const inset = (jr[0] - jl[0]) * 0.14
          const cx = (jl[0] + jr[0]) / 2
          shape([jl, jr, [jr[0] - inset, chin[1] + down * 0.7], [cx, chin[1] + down * 1.25], [jl[0] + inset, chin[1] + down * 0.7]], 6)
        }
        for (const h of lastHands) {
          const pts = h.map(px)
          const palm = Math.hypot(pts[0][0] - pts[9][0], pts[0][1] - pts[9][1])
          shape(hull(pts), palm * 0.45)
        }
        keepTex.needsUpdate = true
      }
      const keepMat = new THREE.ShaderMaterial({
        uniforms: { ...uniforms, uKeep: { value: keepTex } },
        vertexShader: VERT,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform sampler2D uKeep;
          void main() {
            float k = smoothstep(0.2, 0.8, texture2D(uKeep, vUv).r);
            if (k <= 0.0) discard;
            gl_FragColor = vec4(texture2D(uCam, camUv(vUv)).rgb, k);
          }`,
      })
      const keepScene = quad(keepMat)

      // ---------- Sova's abilities ----------
      // All in the camera box's screen space (0..1, y up), drawn by sovaMat; times in ms (performance.now()).
      const sova = {
        bow: { state: "idle", since: 0, lost: 0, amt: 0, charge: 0, auto: 0, a: new THREE.Vector2(0.75, 0.5), b: new THREE.Vector2(0.6, 0.5) },
        arrow: null, // { kind, from, to, t0, dur }
        dart: null, // { at, t0 }: the Recon Bolt's dart; its rings go out PULSES seconds after it lands
        shock: null, // { at, t0 }
        ult: null, // { t0, side, ys, aim, fired }
        drone: null, // { t0, side }
        maskUntil: 0, // the body mask is needed (for the reveal) until then
        shakeUntil: 0,
        shakeLen: 1,
        shakeAmp: 0,
      }
      const PULSES = [0.15, 1.4]
      const RING_SPEED = 1.5 // as in the shader: screen heights a second
      const ULT_BLASTS = [0.75, 1.7, 2.65]
      const ASPECT = W / H
      const clamp01 = (v, lo = 0.05, hi = 0.95) => Math.min(hi, Math.max(lo, v))
      // The face on screen: its centre (the nose), width, the top of the forehead and its height.
      function faceBox() {
        if (!faceLm) return { c: new THREE.Vector2(0.5, 0.55), w: 0.15, top: new THREE.Vector2(0.5, 0.75), h: 0.3 }
        const S = (i) => new THREE.Vector2(...toScreen(faceLm[i].x, faceLm[i].y))
        const c = S(1), top = S(10), chin = S(152)
        return { c, w: Math.abs(S(454).x - S(234).x), top, h: top.y - chin.y }
      }
      // Where a ray from p along dir leaves the box, a little inside it.
      function toEdge(p, dir, inset = 0.03) {
        let s = Infinity
        if (dir.x > 1e-6) s = Math.min(s, (1 - inset - p.x) / dir.x)
        if (dir.x < -1e-6) s = Math.min(s, (inset - p.x) / dir.x)
        if (dir.y > 1e-6) s = Math.min(s, (1 - inset - p.y) / dir.y)
        if (dir.y < -1e-6) s = Math.min(s, (inset - p.y) / dir.y)
        return p.clone().addScaledVector(dir, Math.max(0, s))
      }
      function shake(ms, px, now) {
        if (now + ms > sova.shakeUntil) Object.assign(sova, { shakeUntil: now + ms, shakeLen: ms, shakeAmp: px })
      }
      function sovaReset() {
        Object.assign(sova, { arrow: null, dart: null, shock: null, ult: null, drone: null, shakeUntil: 0 })
        Object.assign(sova.bow, { state: "idle", auto: 0, amt: 0, charge: 0 })
        drone.visible = false
        const u = uniforms
        u.uBowAmt.value = u.uDart.value.z = u.uReveal.value = u.uMark.value.z = u.uDartLineAmt.value = 0
        u.uArrowK.value = u.uShock.value.z = u.uUltT.value = -1
      }

      // The bow by gesture: one hand far out to the side (holding it) and the other closed by the face (pulling
      // the string), about level. Held 0.3 s, the bow shows and the arrow charges; after at least 0.45 s of
      // pulling, opening that hand or moving it away lets the arrow go, the way it points.
      function sovaHands(hands, now) {
        const bow = sova.bow
        if (bow.auto) return
        let pose = null
        if (faceLm && hands.length >= 2 && !sova.arrow) {
          const va = video.videoWidth / video.videoHeight || 16 / 9
          const fw = Math.abs(faceLm[454].x - faceLm[234].x) * va
          const nose = faceLm[1]
          const d = (p) => Math.hypot((p.x - nose.x) * va, p.y - nose.y)
          const [near, far] = hands
            .slice(0, 2)
            .map((h) => ({ h, d: d(h[9]) }))
            .sort((x, y) => x.d - y.d)
          const h = near.h
          const palm = dist(h[0], h[9])
          const open = [8, 12, 16].filter((t) => dist(h[t], h[0]) > 1.45 * palm).length >= 2
          const dx = Math.abs(far.h[9].x - h[9].x) * va
          const dy = Math.abs(far.h[9].y - h[9].y)
          if (!open && near.d < 1.3 * fw && far.d > 1.9 * fw && dy < 0.7 * dx) {
            const g = far.h
            const grip = [5, 9, 13, 17].reduce((s, k) => ({ x: s.x + g[k].x / 4, y: s.y + g[k].y / 4 }), { x: 0, y: 0 })
            pose = { a: toScreen(grip.x, grip.y), b: toScreen((h[4].x + h[8].x) / 2, (h[4].y + h[8].y) / 2) }
          }
        }
        if (pose) {
          const k = bow.state === "idle" ? 1 : 0.5
          bow.a.lerp(new THREE.Vector2(...pose.a), k)
          bow.b.lerp(new THREE.Vector2(...pose.b), k)
          bow.lost = 0
          if (bow.state === "idle") Object.assign(bow, { state: "aim", since: now })
          else if (bow.state === "aim" && now - bow.since > 300) Object.assign(bow, { state: "draw", since: now })
        } else if (bow.state !== "idle") {
          bow.lost ||= now
          // A short loss is the tracker blinking; a longer one is the release.
          if (now - bow.lost > 120) {
            if (bow.state === "draw" && now - bow.since > 450) shoot("recon", now)
            bow.state = "idle"
          }
        }
        if (bow.state !== "idle") handInfo += ` · arco (${bow.state === "aim" ? "mirando" : "puxando"})`
      }
      // The dock's Flecha: the bow drawn beside the face, toward the side with more room, shot by itself.
      function autoBow(now) {
        if (sova.arrow || sova.bow.auto) return
        const f = faceBox()
        const side = f.c.x < 0.5 ? 1 : -1
        sova.bow.a.set(clamp01(f.c.x + side * f.w * 2.3, 0.08, 0.92), f.c.y - f.w * 0.5)
        sova.bow.b.set(f.c.x + side * f.w * 0.5, f.c.y - f.w * 0.45)
        Object.assign(sova.bow, { state: "draw", since: now, auto: now })
      }
      function shoot(kind, now) {
        const bow = sova.bow
        const dir = bow.a.clone().sub(bow.b)
        if (dir.lengthSq() < 1e-8) dir.set(1, 0)
        dir.normalize()
        const from = bow.a.clone().addScaledVector(dir, 0.02)
        const to = toEdge(from, dir)
        sova.arrow = { kind, from, to, t0: now, dur: Math.max(120, (from.distanceTo(to) / 2.4) * 1000) }
        sova.maskUntil = now + 5500
      }
      // The dock's Shock Bolt: it comes in from above on the far side and bursts by his shoulder.
      function shockBolt(now) {
        if (sova.arrow) return
        const f = faceBox()
        const side = f.c.x < 0.5 ? 1 : -1
        const to = new THREE.Vector2(clamp01(f.c.x + side * f.w * 1.3), clamp01(f.c.y - f.w * 1.4))
        const from = new THREE.Vector2(side > 0 ? 1.05 : -0.05, 0.95)
        sova.arrow = { kind: "choque", from, to, t0: now, dur: 300 }
      }
      function startUlt(now) {
        if (sova.ult) return
        const f = faceBox()
        const ys = [f.c.y - f.w * 0.1, f.c.y - f.w * 1.5, f.c.y + f.w * 0.2].map((y) => clamp01(y, 0.1, 0.9))
        sova.ult = { t0: now, side: f.c.x < 0.5 ? 1 : -1, ys, aim: f.c.clone(), fired: 0 }
        sova.maskUntil = now + 4500
      }
      function startDrone(now) {
        if (sova.drone) return
        sova.drone = { t0: now, side: faceBox().c.x > 0.5 ? -1 : 1 }
        sova.maskUntil = now + 7500
      }

      // The Owl Drone, made of shapes (no model of it): a white body, a dark visor with a big cyan eye, owl's ear
      // tufts and two arms with spinning rotors. It lives in the 3D camera's space, in centimetres.
      const droneScene = new THREE.Scene()
      droneScene.add(new THREE.HemisphereLight(0xffffff, 0x334466, 2.4))
      const droneSun = new THREE.DirectionalLight(0xffffff, 2.2)
      droneSun.position.set(0.3, 1, 1)
      droneScene.add(droneSun)
      const drone = new THREE.Group()
      drone.visible = false
      droneScene.add(drone)
      const rotors = []
      const droneEye = new THREE.Object3D()
      {
        const shell = new THREE.MeshStandardMaterial({ color: 0xe9eef7, metalness: 0.15, roughness: 0.45 })
        const dark = new THREE.MeshStandardMaterial({ color: 0x1b2440, metalness: 0.45, roughness: 0.4 })
        const glowMat = new THREE.MeshBasicMaterial({ color: 0x7ee8ff })
        const body = new THREE.Mesh(new THREE.SphereGeometry(3, 24, 16), shell)
        body.scale.set(1, 0.88, 1.05)
        drone.add(body)
        const visor = new THREE.Mesh(new THREE.SphereGeometry(2.3, 24, 12, 0, Math.PI * 2, 0, 1.0), dark)
        visor.rotation.x = Math.PI / 2
        visor.position.z = 1.2
        drone.add(visor)
        const eye = new THREE.Mesh(new THREE.SphereGeometry(1.0, 16, 12), glowMat)
        eye.position.z = 3.25
        drone.add(eye)
        droneEye.position.z = 3.6
        drone.add(droneEye)
        const halo = document.createElement("canvas")
        halo.width = halo.height = 64
        const hc = halo.getContext("2d")
        const grad = hc.createRadialGradient(32, 32, 0, 32, 32, 32)
        grad.addColorStop(0, "rgba(126,232,255,0.9)")
        grad.addColorStop(1, "rgba(126,232,255,0)")
        hc.fillStyle = grad
        hc.fillRect(0, 0, 64, 64)
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(halo), blending: THREE.AdditiveBlending, depthWrite: false }))
        sprite.scale.setScalar(5.5)
        sprite.position.z = 3.4
        drone.add(sprite)
        for (const s of [-1, 1]) {
          const ear = new THREE.Mesh(new THREE.ConeGeometry(0.75, 2.1, 4), dark)
          ear.position.set(s * 1.5, 2.7, 0.2)
          ear.rotation.z = -s * 0.35
          drone.add(ear)
          const arm = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.45, 1.5), dark)
          arm.position.set(s * 4.3, 0.5, -0.3)
          arm.rotation.z = s * 0.22
          drone.add(arm)
          const ring = new THREE.Mesh(new THREE.TorusGeometry(1.9, 0.22, 8, 24), dark)
          ring.position.set(s * 6.7, 1.0, -0.3)
          ring.rotation.x = Math.PI / 2
          drone.add(ring)
          const blur = new THREE.Mesh(
            new THREE.CircleGeometry(1.75, 24),
            new THREE.MeshBasicMaterial({ color: 0x7ee8ff, transparent: true, opacity: 0.25, depthWrite: false, side: THREE.DoubleSide }),
          )
          blur.position.copy(ring.position)
          blur.rotation.x = -Math.PI / 2
          drone.add(blur)
          const rotor = new THREE.Group()
          rotor.position.copy(ring.position)
          for (const r of [0, Math.PI / 2]) {
            const blade = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.08, 0.32), shell)
            blade.rotation.y = r
            rotor.add(blade)
          }
          drone.add(rotor)
          rotors.push(rotor)
        }
      }
      const DRONE = { IN: 1.2, TAG: 3.4, OUT: 5.8, END: 7.0 }
      const ease = (t) => t * t * (3 - 2 * t)
      // Places the drone for this frame; returns how revealed Luan is by its dart.
      function updateDrone(now, dt) {
        const d = sova.drone
        const u = uniforms
        u.uDartLineAmt.value = 0
        if (!d) return 0
        const t = (now - d.t0) / 1000
        if (t > DRONE.END) {
          sova.drone = null
          drone.visible = false
          return 0
        }
        const base = headSeen ? headPos.clone() : new THREE.Vector3(0, 0, -60)
        const hover = base.clone().add(new THREE.Vector3(d.side * 21, 9, 4))
        const away = base.clone().add(new THREE.Vector3(d.side * 75, 30, -10))
        const p = t < DRONE.IN ? away.clone().lerp(hover, ease(t / DRONE.IN)) : t < DRONE.OUT ? hover : hover.clone().lerp(away, ease((t - DRONE.OUT) / (DRONE.END - DRONE.OUT)))
        p.y += Math.sin(t * 3) * 0.9
        drone.position.lerp(p, drone.visible ? 0.35 : 1)
        drone.rotation.set(0.1, -d.side * 0.6, Math.sin(t * 2.1) * 0.12 + (t < DRONE.IN ? d.side * 0.3 : 0))
        drone.scale.setScalar(1.15)
        drone.visible = true
        for (const r of rotors) r.rotation.y += dt * 40
        // The dart: a streak from its eye to his face, then he's revealed.
        const tt = t - DRONE.TAG
        if (tt >= 0 && tt < 0.5) {
          drone.updateMatrixWorld(true)
          const e = droneEye.getWorldPosition(new THREE.Vector3()).project(headCam)
          const f = faceBox()
          u.uDartLine.value.set(e.x * 0.5 + 0.5, e.y * 0.5 + 0.5, f.c.x, f.c.y)
          u.uDartLineAmt.value = tt < 0.3 ? 1 : 1 - (tt - 0.3) / 0.2
        }
        return tt >= 0.15 ? 1 - THREE.MathUtils.smoothstep(tt, 1.9, 2.4) : 0
      }

      function updateSova(now, dt) {
        const u = uniforms
        const bow = sova.bow
        if (bow.auto && now - bow.auto > 750) {
          shoot("recon", now)
          Object.assign(bow, { auto: 0, state: "idle" })
        }
        const drawing = bow.state === "draw"
        const lingering = sova.arrow?.kind === "recon" && now - sova.arrow.t0 < 160
        bow.amt = THREE.MathUtils.clamp(bow.amt + (drawing || bow.state === "aim" || lingering ? dt / 0.15 : -dt / 0.25), 0, 1)
        bow.charge = drawing ? Math.min(1, (now - bow.since) / 1100) : bow.state === "aim" ? 0 : -1
        const f = faceBox()
        u.uBowAmt.value = bow.amt
        u.uBowA.value.copy(bow.a)
        u.uBowB.value.copy(bow.b)
        u.uBowSize.value = THREE.MathUtils.clamp(f.w * ASPECT * 0.8, 0.06, 0.2)
        u.uCharge.value = bow.charge
        // The arrow, until it lands: the recon leaves its dart, the shock bursts.
        u.uArrowK.value = -1
        if (sova.arrow) {
          const a = sova.arrow
          const k = (now - a.t0) / a.dur
          if (k >= 1) {
            if (a.kind === "recon") sova.dart = { at: a.to.clone(), t0: now }
            else {
              sova.shock = { at: a.to.clone(), t0: now }
              shake(380, 10, now)
            }
            sova.arrow = null
          } else {
            u.uArrowK.value = k
            u.uArrowFrom.value.copy(a.from)
            u.uArrowTo.value.copy(a.to)
            u.uArrowKind.value = a.kind === "recon" ? 0 : 1
          }
        }
        // The dart and its rings; how revealed the head is, for the marker.
        let headRv = 0
        const markAt = new THREE.Vector2(f.top.x, Math.min(0.94, f.top.y + f.h * 0.7))
        u.uDart.value.z = 0
        u.uPulse.value.set(-1, -1)
        if (sova.dart) {
          const t = (now - sova.dart.t0) / 1000
          if (t > 3.8) sova.dart = null
          else {
            const tp = PULSES.map((p) => t - p)
            u.uPulse.value.set(tp[0] >= 0 ? tp[0] : -1, tp[1] >= 0 ? tp[1] : -1)
            u.uDart.value.set(sova.dart.at.x, sova.dart.at.y, Math.min(1, t / 0.1) * (1 - THREE.MathUtils.smoothstep(t, 3.1, 3.8)))
            const dd = Math.hypot((markAt.x - sova.dart.at.x) * ASPECT, markAt.y - sova.dart.at.y)
            for (const x of tp) {
              const passed = x * RING_SPEED - dd
              if (x >= 0 && passed > 0) headRv = Math.max(headRv, Math.exp(-passed / (RING_SPEED * 0.9)))
            }
          }
        }
        u.uShock.value.z = -1
        if (sova.shock) {
          const t = (now - sova.shock.t0) / 1000
          if (t > 0.9) sova.shock = null
          else u.uShock.value.set(sova.shock.at.x, sova.shock.at.y, t)
        }
        // Hunter's Fury: each blast shakes the camera and reveals him.
        let reveal = 0
        u.uUltT.value = -1
        if (sova.ult) {
          const ult = sova.ult
          const t = (now - ult.t0) / 1000
          if (t > 3.9) sova.ult = null
          else {
            u.uUltT.value = t
            u.uUltSide.value = ult.side
            u.uUltY.value.set(...ult.ys)
            u.uUltAim.value.copy(ult.aim)
            while (ult.fired < 3 && t >= ULT_BLASTS[ult.fired]) {
              shake(260, 14, now)
              ult.fired++
            }
            for (const b of ULT_BLASTS) if (t >= b) reveal = Math.max(reveal, Math.exp(-(t - b) / 0.6))
          }
        }
        reveal = Math.max(reveal, updateDrone(now, dt))
        u.uReveal.value = reveal
        u.uMark.value.set(markAt.x, markAt.y, Math.max(reveal, headRv) > 0.15 ? Math.min(1, Math.max(reveal, headRv) * 1.5) : 0)
      }

      // ---------- the cars on the face: Octane, Fennec ----------
      // Rocket League's cars by Jako (CC BY 4.0, public/models/) as Luan's head, Pixar-style: seen a little from
      // above, turning with the head, his own eyes on the windshield and his mouth on the bumper, cut from the
      // camera every frame (so it blinks and talks). The models face +x with +y up.
      const CARS = { octane: { url: "../models/octane.glb" }, fennec: { url: "../models/fennec.glb" } }
      const CAR_W = Number(q.get("carro") || 26)
      const CAR_PITCH = THREE.MathUtils.degToRad(Number(q.get("inclinacao") ?? 10))
      const CAR_LEN = Number(q.get("comprimento") || 0.6)
      const CAR_AT = (q.get("posicao") || "0,0.5,-8").split(",").map(Number)
      // An eye's height for its width (the camera's cut has the same shape).
      const EYE_H = 0.75
      // Reflections for the paint, from a neutral room.
      let carEnv = null
      // The eyes and the mouth, cut from the camera into one small canvas: the eyes side by side over the mouth.
      const partsCanvas = document.createElement("canvas")
      partsCanvas.width = 512
      partsCanvas.height = 256
      const partsCtx = partsCanvas.getContext("2d")
      const partsTex = new THREE.CanvasTexture(partsCanvas)
      partsTex.colorSpace = THREE.NoColorSpace
      partsTex.minFilter = THREE.LinearFilter
      partsTex.generateMipmaps = false
      // A part: an ellipse of the canvas, with a dark rim like a cartoon's line.
      function partMat(rect) {
        return new THREE.ShaderMaterial({
          uniforms: { uTex: { value: partsTex }, uRect: { value: new THREE.Vector4(...rect) } },
          vertexShader: /* glsl */ `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
          fragmentShader: /* glsl */ `
            uniform sampler2D uTex;
            uniform vec4 uRect;
            varying vec2 vUv;
            void main() {
              float e = length((vUv - 0.5) * 2.0);
              if (e > 1.0) discard;
              vec3 c = texture2D(uTex, uRect.xy + vUv * uRect.zw).rgb;
              c = mix(c, vec3(0.03, 0.03, 0.08), smoothstep(0.85, 0.89, e));
              gl_FragColor = vec4(c, smoothstep(1.0, 0.96, e));
            }`,
          transparent: true,
          depthWrite: false,
          polygonOffset: true,
          polygonOffsetFactor: -4,
          polygonOffsetUnits: -4,
        })
      }
      for (const [id, c] of Object.entries(CARS)) {
        Object.assign(c, { id, amt: 0, ready: false, group: new THREE.Group(), body: new THREE.Group(), boom: -1, flip: -1 })
        c.group.visible = false
        c.group.add(c.body)
        head.add(c.group)
        new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load(c.url, (gltf) => buildCar(c, gltf.scene), undefined, (e) => fail(id, e))
      }
      const carList = Object.values(CARS)
      function buildCar(c, m) {
        if (!carEnv) {
          const pm = new THREE.PMREMGenerator(renderer)
          carEnv = pm.fromScene(new RoomEnvironment(), 0.04).texture
          pm.dispose()
        }
        m.updateMatrixWorld(true)
        const meshes = []
        m.traverse((o) => {
          if (!o.isMesh) return
          meshes.push(o)
          if (o.material.map) o.material.map.colorSpace = THREE.NoColorSpace
          o.material.envMap = carEnv
          // A dark, quiet windshield, so the eyes on it read.
          if (/Window/.test(o.material.name)) Object.assign(o.material, { envMapIntensity: 0.25, roughness: 0.6, color: new THREE.Color(0x0b1020) })
        })
        const box = new THREE.Box3().setFromObject(m)
        const size = box.getSize(new THREE.Vector3())
        const center = box.getCenter(new THREE.Vector3())
        const inner = new THREE.Group()
        inner.position.copy(center).multiplyScalar(-1)
        inner.add(m)
        // The windshield: the glass facing forward and up (its centre, its normal, how wide it is).
        const ws = { at: new THREE.Vector3(), n: new THREE.Vector3(), area: 0, zMin: Infinity, zMax: -Infinity }
        const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3(), N = new THREE.Vector3(), E = new THREE.Vector3()
        for (const o of meshes.filter((o) => /Window/.test(o.material.name))) {
          const pos = o.geometry.getAttribute("position")
          const idx = o.geometry.index
          const count = idx ? idx.count : pos.count
          for (let t = 0; t < count; t += 3) {
            const [i, j, k] = idx ? [idx.getX(t), idx.getX(t + 1), idx.getX(t + 2)] : [t, t + 1, t + 2]
            A.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld)
            B.fromBufferAttribute(pos, j).applyMatrix4(o.matrixWorld)
            C.fromBufferAttribute(pos, k).applyMatrix4(o.matrixWorld)
            N.subVectors(B, A).cross(E.subVectors(C, A))
            const area = N.length() / 2
            if (!area) continue
            N.normalize()
            if (N.y < 0) N.negate()
            if (N.x < 0.3 || N.y < 0.25) continue
            ws.zMin = Math.min(ws.zMin, A.z, B.z, C.z)
            ws.zMax = Math.max(ws.zMax, A.z, B.z, C.z)
            ws.at.addScaledVector(A.add(B).add(C), area / 3)
            ws.n.addScaledVector(N, area)
            ws.area += area
          }
        }
        const eyeAt = ws.area ? ws.at.divideScalar(ws.area) : new THREE.Vector3(center.x + size.x * 0.1, box.max.y - size.y * 0.2, center.z)
        const eyeN = ws.area ? ws.n.normalize() : new THREE.Vector3(0.6, 0.8, 0).normalize()
        const eyeW = ws.area ? ws.zMax - ws.zMin : size.z * 0.6
        // The mouth: on the front, a little above the bottom, where a ray from ahead meets it.
        const mouthY = box.min.y + size.y * 0.27
        const hit = new THREE.Raycaster(new THREE.Vector3(box.max.x + 100, mouthY, center.z), new THREE.Vector3(-1, 0, 0)).intersectObjects(meshes, false)[0]
        const mouthAt = hit ? hit.point.clone() : new THREE.Vector3(box.max.x, mouthY, center.z)
        // Screen right once the car faces the camera is the model's −z.
        const right = new THREE.Vector3(0, 0, -1)
        const along = (n) => right.clone().addScaledVector(n, -right.dot(n)).normalize()
        const patch = (at, n, w, h, rect, out = 0.6) => {
          const r = along(n)
          const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), partMat(rect))
          p.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(r, new THREE.Vector3().crossVectors(n, r), n))
          p.position.copy(at).addScaledVector(n, out)
          p.renderOrder = 2
          inner.add(p)
        }
        // The eyes face halfway between the glass and straight ahead, so they stay round seen from the front, a
        // little up the glass and out of it so the hood doesn't cut them; at least big enough to read on a small
        // windshield like the Octane's.
        const span = Math.max(eyeW, size.z * 0.62)
        const ew = span * 0.44
        const en = eyeN.clone().add(new THREE.Vector3(1, 0, 0)).normalize()
        const r = along(en)
        const at = eyeAt.clone().addScaledVector(new THREE.Vector3().crossVectors(en, r), ew * EYE_H * 0.22)
        patch(at.clone().addScaledVector(r, -span * 0.245), en, ew, ew * EYE_H, [0, 0.5, 0.5, 0.5], 3)
        patch(at.clone().addScaledVector(r, span * 0.245), en, ew, ew * EYE_H, [0.5, 0.5, 0.5, 0.5], 3)
        const mw = size.z * 0.36
        patch(mouthAt, new THREE.Vector3(1, 0, 0), mw, mw * 0.46, [0, 0, 1, 0.5])
        // CAR_W cm across, facing the camera, its length shortened a little (less perspective, more cartoon).
        const s = CAR_W / size.z
        c.body.rotation.y = -Math.PI / 2
        c.body.scale.set(s * CAR_LEN, s, s)
        c.body.add(inner)
        c.group.position.set(...CAR_AT)
        c.ready = true
      }
      // His eyes (with the brows) and mouth from the camera, levelled (the car leans with the head by itself).
      function drawParts() {
        const vw = video.videoWidth
        const vh = video.videoHeight
        const P = (i) => [faceLm[i].x * vw, faceLm[i].y * vh]
        const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]
        const len = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1])
        const eyes = [
          [33, 133],
          [362, 263],
        ]
          .map(([i, j]) => ({ c: mid(P(i), P(j)), w: len(P(i), P(j)) }))
          .sort((a, b) => a.c[0] - b.c[0])
        const ang = Math.atan2(eyes[1].c[1] - eyes[0].c[1], eyes[1].c[0] - eyes[0].c[0])
        const up = [Math.sin(ang), -Math.cos(ang)]
        const ctx = partsCtx
        const cut = (cx, cy, w, h, dx, dy, dw, dh) => {
          ctx.save()
          ctx.filter = "brightness(1.15) contrast(1.12) saturate(1.1)"
          ctx.beginPath()
          ctx.rect(dx, dy, dw, dh)
          ctx.clip()
          ctx.translate(dx + dw / 2, dy + dh / 2)
          ctx.scale(dw / w, dh / h)
          ctx.rotate(-ang)
          ctx.translate(-cx, -cy)
          ctx.drawImage(video, 0, 0, vw, vh)
          ctx.restore()
        }
        eyes.forEach((e, i) => {
          const w = e.w * 2.2
          cut(e.c[0] + up[0] * e.w * 0.15, e.c[1] + up[1] * e.w * 0.15, w, w * EYE_H, i * 256, 0, 256, 128)
        })
        const mc = mid(mid(P(61), P(291)), mid(P(0), P(17)))
        const mw = len(P(61), P(291)) * 1.7
        cut(mc[0], mc[1], mw, mw * 0.46, 0, 128, 512, 128)
        partsTex.needsUpdate = true
      }
      function updateCars(now) {
        for (const c of carList) {
          c.group.visible = c.amt > 0 && c.ready
          if (!c.group.visible) continue
          let k = easeOutBack(c.amt)
          // Demolished: gone for 2.2 s, then back with a pop.
          if (c.boom >= 0) {
            const t = (now - c.boom) / 1000
            k *= t < 0.06 ? 1 - t / 0.06 : t < 2.2 ? 0 : easeOutBack(Math.min(1, (t - 2.2) / 0.35))
            if (t > 2.6) c.boom = -1
          }
          let flip = 0
          if (c.flip >= 0) {
            const t = (now - c.flip) / 450
            flip = t < 1 ? (1 - (1 - t) ** 3) * Math.PI * 2 : 0
            if (t >= 1) c.flip = -1
          }
          c.group.scale.setScalar(Math.max(k, 1e-4))
          c.group.rotation.x = CAR_PITCH + flip
        }
        // The explosion follows where the car was.
        const c = carList.find((c) => c.boom >= 0)
        uniforms.uBoomT.value = -1
        if (c && headSeen) {
          const t = (now - c.boom) / 1000
          if (t < 2.4) {
            c.group.updateWorldMatrix(true, false)
            const at = c.group.getWorldPosition(new THREE.Vector3())
            const p = at.clone().project(headCam)
            const q2 = at.clone().add(new THREE.Vector3(CAR_W / 2, 0, 0)).project(headCam)
            uniforms.uBoom.value.set(p.x * 0.5 + 0.5, p.y * 0.5 + 0.5, Math.max(0.05, (Math.abs(q2.x - p.x) / 2) * ASPECT))
            uniforms.uBoomT.value = t
          }
        }
      }
      function demo(now) {
        const c = CARS[mode]
        if (c && c.boom < 0) c.boom = now
      }
      function flipCar(now) {
        const c = CARS[mode]
        if (c && c.flip < 0 && c.boom < 0) c.flip = now
      }

      // ---------- models ----------
      let gestures, segmenter, faces, poses, delegate
      async function loadModels() {
        const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.2/wasm")
        const make = async (Task, path, opts, d) =>
          Task.createFromOptions(files, { baseOptions: { modelAssetPath: MODELS + path, delegate: d }, runningMode: "VIDEO", ...opts })
        const all = async (d) => {
          delegate = d
          return Promise.all([
            make(GestureRecognizer, "gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task", { numHands: 2 }, d),
            make(
              ImageSegmenter,
              "image_segmenter/selfie_segmenter_landscape/float16/latest/selfie_segmenter_landscape.tflite",
              { outputConfidenceMasks: true, outputCategoryMask: false },
              d,
            ),
            make(FaceLandmarker, "face_landmarker/face_landmarker/float16/1/face_landmarker.task", { numFaces: 1, outputFacialTransformationMatrixes: true }, d),
            make(PoseLandmarker, "pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", { numPoses: 1 }, d),
          ])
        }
        try {
          ;[gestures, segmenter, faces, poses] = await all(q.has("cpu") ? "CPU" : "GPU")
        } catch (e) {
          console.warn("GPU failed, trying CPU", e)
          ;[gestures, segmenter, faces, poses] = await all("CPU")
        }
      }

      // ---------- state ----------
      const MODES = ["bola", "phoenix", "sova", "octane", "fennec", "pop", "lente"]
      let mode = MODES.includes(q.get("modo")) ? q.get("modo") : "nenhum"
      let pop = 0
      let ballIn = 0
      const ms = { gesto: 0, corpo: 0, rosto: 0, ombros: 0 }
      const fire = { on: false, demo: false, amt: 0, at: new THREE.Vector3(0.5, 0.35, 0.1), lastOn: -1e9 }
      const bang = { t0: -1, key: null, startX: 0, hand: new THREE.Vector2(0.75, 0.45), thrown: false }
      const snaps = new Map()
      let faceLm = null
      let videoFrames = 0
      const lens = { amt: 0, pts: [0, 1, 2, 3].map(() => new THREE.Vector2(0.5, 0.5)), on: false }
      let prevMask = null
      let energy = 0
      const prevHands = new Map()
      let pushes = []
      let handInfo = ""

      function setMode(m) {
        mode = MODES.includes(m) ? m : "nenhum"
        titulo.classList.toggle("on", mode === "pop")
        // Each agent's abilities go with him.
        if (mode !== "phoenix") {
          bang.t0 = -1
          uniforms.uOrbAmt.value = uniforms.uFlashAmt.value = 0
        }
        if (mode !== "sova") sovaReset()
      }
      // A one-off, from the dock or a key: only for the filter that has it.
      function acao(a) {
        const now = performance.now()
        if (mode === "phoenix" && a === "flash") startBang(0.75, 0.45, null)
        if (mode === "sova") ({ recon: autoBow, choque: shockBolt, drone: startDrone, ult: startUlt })[a]?.(now)
        if (CARS[mode]) ({ demo, flip: flipCar })[a]?.(now)
      }
      // The dock's word (obs-browser's emit_event): the filter that should be on, or a one-off.
      addEventListener("muanlartins-filtro", ({ detail }) => {
        if (detail?.filtro && detail.filtro !== mode) setMode(detail.filtro)
        if (detail?.acao) acao(detail.acao)
      })
      addEventListener("keydown", (e) => {
        if (e.key === "1") setMode(mode === "pop" ? "nenhum" : "pop")
        if (e.key === "2") setMode(mode === "bola" ? "nenhum" : "bola")
        if (e.key === "3") setMode(mode === "phoenix" ? "nenhum" : "phoenix")
        if (e.key === "4") startBang(0.75, 0.45, null)
        if (e.key === "5") fire.demo = !fire.demo
        if (e.key === "6") setMode(mode === "lente" ? "nenhum" : "lente")
        if (e.key === "7") setMode(mode === "sova" ? "nenhum" : "sova")
        if (e.key === "8") setMode(mode === "octane" ? "nenhum" : "octane")
        if (e.key === "9") setMode(mode === "fennec" ? "nenhum" : "fennec")
        const k = e.key.toLowerCase()
        const keys = { e: "recon", q: "choque", c: "drone", x: "ult", d: "demo", f: "flip" }
        if (keys[k]) acao(keys[k])
        if (e.key === "0") setMode("nenhum")
      })
      setMode(mode)
      if (q.has("debug")) window.filtros = { sova, AGENTS, CARS, uniforms, acao, get mode() { return mode } }

      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y)
      // Thumb and index out, the other fingers in: half of the lens's frame.
      function isL(h) {
        const palm = dist(h[0], h[9])
        return dist(h[8], h[5]) > 0.55 * palm && dist(h[4], h[8]) > 0.6 * palm && dist(h[12], h[0]) < 1.25 * palm && dist(h[16], h[0]) < 1.2 * palm
      }

      function runGestures(now) {
        const t0 = performance.now()
        const r = gestures.recognizeForVideo(video, now)
        ms.gesto = performance.now() - t0
        const hands = r.landmarks || []
        lastHands = hands
        // The lens: both hands in an L, while it's the filter on.
        const ls = mode === "lente" ? hands.filter(isL) : []
        handInfo = `${hands.length} mão(s), ${ls.length} em L`
        if (mode === "phoenix") phoenixHands(r, now)
        if (mode === "sova") sovaHands(hands, now)
        if (ls.length === 2) {
          ls.sort((a, b) => a[0].x - b[0].x)
          const [L, R] = ls
          const target = [L[8], R[8], R[4], L[4]].map((p) => toScreen(p.x, p.y))
          lens.pts.forEach((v, i) => v.lerp(new THREE.Vector2(...target[i]), lens.on ? 0.6 : 1))
          lens.on = true
        } else lens.on = false
        // Fast hands push Pop's shapes and stir its fire.
        pushes = []
        hands.forEach((h, i) => {
          const [sx, sy] = toScreen(h[9].x, h[9].y)
          const prev = prevHands.get(i)
          if (prev) {
            const v = Math.hypot(sx - prev[0], sy - prev[1]) * 30
            if (v > 0.6) pushes.push({ x: (sx - 0.5) * 2 * halfW, y: (sy - 0.5) * 2 * halfH, v: Math.min(v, 4) * 0.8 })
            energy = Math.max(energy, Math.min(1, v / 3))
          }
          prevHands.set(i, [sx, sy])
        })
        if (!hands.length) prevHands.clear()
      }

      function runBody(now) {
        const t0 = performance.now()
        smallCtx.drawImage(video, 0, 0, MW, MH)
        const r = segmenter.segmentForVideo(small, now)
        const m = r.confidenceMasks?.[0]
        if (m) {
          const f = m.getAsFloat32Array()
          let sum = 0, sx = 0, top = -1, diff = 0
          for (let y = 0; y < MH; y++) {
            let row = 0
            for (let x = 0; x < MW; x++) {
              const i = y * MW + x
              const v = f[i]
              const b = (v * 255) | 0
              if (prevMask) diff += Math.abs(b - prevMask[i])
              maskData[i] = b
              if (v > 0.5) {
                sum++
                sx += x
                row++
              }
            }
            if (top < 0 && row > MW * 0.03) top = y
          }
          prevMask = prevMask || new Uint8Array(MW * MH)
          prevMask.set(maskData)
          maskTex.needsUpdate = true
          energy = Math.max(energy, Math.min(1, diff / (MW * MH * 255) / 0.02))
          if (sum > 50 && top >= 0) {
            const [cx, cy] = toScreen(sx / sum / MW, Math.min(1, top / MH + 0.14))
            uniforms.uCenter.value.lerp(new THREE.Vector2(cx, cy), 0.15)
          }
        }
        r.close()
        ms.corpo = performance.now() - t0
      }

      function runFace(now) {
        const t0 = performance.now()
        const r = faces.detectForVideo(video, now)
        const mat = r.facialTransformationMatrixes?.[0]
        if (mat) {
          const m = new THREE.Matrix4().fromArray(mat.data)
          const p = new THREE.Vector3(), qt = new THREE.Quaternion(), s = new THREE.Vector3()
          m.decompose(p, qt, s)
          if (headSeen) {
            headPos.lerp(p, 0.6)
            headQuat.slerp(qt, 0.6)
            headScale.lerp(s, 0.6)
          } else {
            headPos.copy(p)
            headQuat.copy(qt)
            headScale.copy(s)
          }
          headSeen = true
          head.matrix.compose(headPos, headQuat, headScale)
          faceLm = r.faceLandmarks?.[0] || null
          if (faceLm) faceOval(faceLm)
        } else {
          headSeen = false
          faceLm = null
        }
        ms.rosto = performance.now() - t0
      }

      // The face's oval on screen (forehead top, chin, cheeks), for painting over the hair around it.
      function faceOval(lm) {
        const P = (i) => {
          const [x, y] = toScreen(lm[i].x, lm[i].y)
          return new THREE.Vector2(x * (W / H), y)
        }
        const top = P(10), chin = P(152), l = P(234), r = P(454)
        const c = top.clone().add(chin).multiplyScalar(0.5)
        const up = top.clone().sub(chin)
        const ry = up.length() / 2
        up.normalize()
        uniforms.uFace.value.set(c.x / (W / H), c.y, l.distanceTo(r) / 2, ry)
        uniforms.uFaceUp.value.copy(up)
      }

      function runPose(now) {
        const t0 = performance.now()
        const r = poses.detectForVideo(video, now)
        const lm = r.landmarks?.[0]
        const world = r.worldLandmarks?.[0]
        if (lm && world && lm[11].visibility > 0.4 && lm[12].visibility > 0.4) {
          const l = new THREE.Vector2(...toScreen(lm[11].x, lm[11].y))
          const rr = new THREE.Vector2(...toScreen(lm[12].x, lm[12].y))
          const dz = (world[11].z - world[12].z) * 100
          if (pose.seen) {
            pose.left.lerp(l, 0.5)
            pose.right.lerp(rr, 0.5)
            pose.dz += (dz - pose.dz) * 0.5
          } else {
            pose.left.copy(l)
            pose.right.copy(rr)
            pose.dz = dz
          }
          pose.seen = true
        } else pose.seen = false
        ms.ombros = performance.now() - t0
      }

      // The background's colour, from what the mask says isn't Luan in the frame's top half, for painting
      // over his hair (NVIDIA Broadcast's virtual background is plain blue behind him).
      function sampleBackground() {
        const px = smallCtx.getImageData(0, 0, MW, MH >> 1).data
        let r = 0, g = 0, b = 0, n = 0
        for (let i = 0; i < px.length / 4; i += 3) {
          if (maskData[i] > 40) continue
          r += px[i * 4]
          g += px[i * 4 + 1]
          b += px[i * 4 + 2]
          n++
        }
        if (n > 50) uniforms.uBg.value.lerp(new THREE.Color(r / n / 255, g / n / 255, b / n / 255), 0.2)
      }

      function startBang(x, y, key) {
        if (bang.t0 >= 0) return
        Object.assign(bang, { t0: performance.now(), key, startX: x, thrown: false })
        bang.hand.set(x, y)
      }
      // The orb's path: held in the hand, then thrown to the side the hand moved to (or to the middle).
      function updateBang(now) {
        const t = (now - bang.t0) / 1000
        const u = uniforms
        const R = 0.035
        const { HOLD, FLY, GLARE, FADE } = BANG
        u.uK.value = 0
        u.uRing.value = 0
        u.uFlashAmt.value = 0
        if (t < HOLD) {
          u.uOrb.value.set(bang.hand.x, bang.hand.y, R * easeOutBack(Math.min(1, t / 0.35)))
          u.uOrbAmt.value = 1
        } else if (t < HOLD + FLY) {
          if (!bang.thrown) {
            const dx = bang.hand.x - bang.startX
            const dir = Math.abs(dx) > 0.025 ? Math.sign(dx) : 0
            u.uFrom.value.copy(bang.hand)
            u.uTo.value.set(0.5 + dir * 0.3, 0.6)
            const side = dir || (bang.hand.x > 0.5 ? -1 : 1)
            u.uCtl.value.set((bang.hand.x + u.uTo.value.x) / 2 + side * 0.1, Math.max(bang.hand.y, 0.6) + 0.22)
            bang.thrown = true
          }
          const k = 1 - (1 - (t - HOLD) / FLY) ** 2
          const f = u.uFrom.value, c = u.uCtl.value, e = u.uTo.value
          const x = (1 - k) * (1 - k) * f.x + 2 * (1 - k) * k * c.x + k * k * e.x
          const y = (1 - k) * (1 - k) * f.y + 2 * (1 - k) * k * c.y + k * k * e.y
          u.uOrb.value.set(x, y, R * (1 - 0.3 * k))
          u.uK.value = k
          u.uRing.value = THREE.MathUtils.lerp(0.24, R * 1.05, k)
          u.uOrbAmt.value = 1
        } else if (t < HOLD + FLY + GLARE + FADE) {
          const g = t - HOLD - FLY
          u.uOrbAmt.value = Math.max(0, 1 - g / 0.12)
          u.uFlashAt.value.copy(u.uTo.value)
          u.uFlashAmt.value = Math.min(1, g / 0.06) * (g < GLARE ? 1 : (1 - (g - GLARE) / FADE) ** 1.6)
        } else {
          bang.t0 = -1
          u.uOrbAmt.value = 0
        }
      }

      // Both palms open, fingers up, seen edge on (facing each other), side by side: a fire between them.
      // A thumb pressed to the middle finger and let go with the middle finger landing in the palm: a snap.
      function phoenixHands(r, now) {
        const hands = r.landmarks || []
        const open = []
        hands.forEach((h, i) => {
          const palm = dist(h[0], h[9])
          const fingersOut = [8, 12, 16, 20].every((t) => dist(h[t], h[0]) > 1.3 * palm)
          const upright = h[0].y - h[12].y > 0.9 * palm
          const edgeOn = dist(h[5], h[17]) / palm
          if (fingersOut && upright && edgeOn < 0.8) {
            const c = [0, 5, 9, 13, 17].reduce((a, k) => ({ x: a.x + h[k].x / 5, y: a.y + h[k].y / 5 }), { x: 0, y: 0 })
            open.push({ c, palm })
          }
        })
        // The snap: thumb pressed to the middle finger, then within 0.6 s the hand turns quickly (more than
        // 35° within 0.2 s, flat or twisting) as the fingers part. Not at the face, not with both palms up for
        // the fire or just after it, not while a flash is on.
        const va = video.videoWidth / video.videoHeight || 16 / 9
        hands.forEach((h, i) => {
          const palm = dist(h[0], h[9])
          const key = r.handedness?.[i]?.[0]?.categoryName || String(i)
          const st = snaps.get(key) || { since: now, seen: now, armed: 0, hist: [] }
          if (now - st.seen > 300) Object.assign(st, { since: now, armed: 0, hist: [] })
          st.seen = now
          const atFace = faceLm && dist(h[9], faceLm[1]) < 0.9 * dist(faceLm[234], faceLm[454])
          const allowed = !atFace && now - st.since > 250 && now - fire.lastOn > 1200 && open.length < 2 && bang.t0 < 0
          const angle = Math.atan2(h[17].y - h[5].y, (h[17].x - h[5].x) * va)
          const width = dist(h[5], h[17]) / palm
          st.hist = st.hist.filter((e) => now - e.t < 200)
          let turn = 0, twist = 0
          for (const e of st.hist) {
            let da = Math.abs(angle - e.angle)
            if (da > Math.PI) da = 2 * Math.PI - da
            turn = Math.max(turn, da)
            twist = Math.max(twist, Math.abs(width - e.width))
          }
          st.hist.push({ t: now, angle, width })
          const pinched = dist(h[4], h[12]) < 0.45 * palm
          if (pinched) st.armed = now
          const [ox, oy] = toScreen((h[4].x + h[12].x) / 2, (h[4].y + h[12].y) / 2)
          if (allowed && st.armed && now - st.armed < 600 && !pinched && (turn > 0.6 || twist > 0.35)) {
            startBang(ox, oy, key)
            st.armed = 0
            st.hist = []
          }
          if (bang.t0 >= 0 && bang.key === key) bang.hand.set(ox, oy)
          if (allowed && st.armed && now - st.armed < 600) handInfo += ` · estalo armado (giro ${Math.round((turn * 180) / Math.PI)}°)`
          snaps.set(key, st)
        })
        fire.on = false
        if (open.length === 2) {
          const [a, b] = open
          const gap = Math.abs(a.c.x - b.c.x)
          const palm = (a.palm + b.palm) / 2
          if (gap > 0.6 * palm && gap < 7 * palm && Math.abs(a.c.y - b.c.y) < 1.6 * palm) {
            const [x, y] = toScreen((a.c.x + b.c.x) / 2, (a.c.y + b.c.y) / 2)
            const rad = Math.max(0.04, (gap / cover.sx) * (W / H) * 0.42)
            fire.at.lerp(new THREE.Vector3(x, y, rad), fire.on ? 0.5 : 1)
            fire.on = true
            fire.lastOn = now
          }
        }
        handInfo += fire.on ? " · fogo" : ""
      }

      // ---------- loop ----------
      let lastFrame = -1
      let last = performance.now()
      let frames = 0, fps = 0, fpsAt = last
      let camLabel = ""
      function tick() {
        requestAnimationFrame(tick)
        const now = performance.now()
        const dt = Math.min(0.05, (now - last) / 1000)
        last = now
        const camReady = video.readyState >= 2 && video.videoWidth > 0
        if (!showing || !box || !camReady) {
          renderer.setScissorTest(false)
          renderer.setViewport(0, 0, W, H)
          renderer.clear()
          hud.textContent = `parado: ${!showing ? "fonte fora da tela" : !box ? `sem caixa de câmera na cena "${sceneName}"` : "sem câmera"}` + (errors.length ? "\n" + errors.slice(-3).join("\n") : "")
          return
        }
        const phoenix = AGENTS.phoenix.amt
        const agentOn = agentList.some((a) => a.amt > 0) || !!AGENTS[mode]
        const carOn = carList.some((c) => c.amt > 0) || !!CARS[mode]
        const sovaOn = mode === "sova" || AGENTS.sova.amt > 0
        if (gestures && video.readyState >= 2 && video.currentTime !== lastFrame) {
          lastFrame = video.currentTime
          try {
            videoFrames++
            // The hands are tracked only for the filters that use them (no gesture switches a filter).
            if (mode === "phoenix" || phoenix > 0 || sovaOn || mode === "pop" || pop > 0 || mode === "lente") runGestures(now)
            else {
              lastHands = []
              pushes = []
              lens.on = false
              fire.on = false
              handInfo = "mãos sem uso"
            }
            // The body mask: Pop, and Sova's reveals while one may be on screen.
            const sovaMask = sovaOn && now < sova.maskUntil
            if (mode === "pop" || pop > 0 || sovaMask) runBody(now)
            if (mode === "bola" || ballIn > 0 || agentOn || carOn) runFace(now)
            if (agentOn) {
              if (ERASE && mode !== "pop" && pop <= 0 && !sovaMask) runBody(now)
              if (videoFrames % 2 === 0) runPose(now)
              if (ERASE && videoFrames % 15 === 0) sampleBackground()
            }
            if (carOn && faceLm) drawParts()
          } catch (e) {
            fail("modelos", e)
          }
        }
        pop = THREE.MathUtils.clamp(pop + (mode === "pop" ? dt / 0.55 : -dt / 0.4), 0, 1)
        ballIn = THREE.MathUtils.clamp(ballIn + (mode === "bola" ? dt / 0.35 : -dt / 0.25), 0, 1)
        for (const a of agentList) a.amt = THREE.MathUtils.clamp(a.amt + (mode === a.id ? dt / 0.4 : -dt / 0.3), 0, 1)
        for (const c of carList) c.amt = THREE.MathUtils.clamp(c.amt + (mode === c.id ? dt / 0.35 : -dt / 0.25), 0, 1)
        const agentAmt = Math.max(...agentList.map((a) => a.amt))
        const carAmt = Math.max(...carList.map((c) => c.amt))
        const fireWanted = phoenix > 0 && (fire.on || fire.demo)
        if (fire.demo && !fire.on) fire.at.set(0.5, 0.3, 0.11)
        fire.amt = THREE.MathUtils.clamp(fire.amt + (fireWanted ? dt / 0.25 : -dt / 0.35), 0, 1)
        uniforms.uErase.value = headSeen && ERASE ? agentAmt : 0
        uniforms.uFire.value.copy(fire.at)
        uniforms.uFireAmt.value = fire.amt
        if (bang.t0 >= 0) updateBang(now)
        if (sovaOn) updateSova(now, dt)
        updateCars(now)
        lens.amt = THREE.MathUtils.clamp(lens.amt + (lens.on ? dt / 0.15 : -dt / 0.2), 0, 1)
        energy *= Math.pow(0.25, dt)

        uniforms.uTime.value = now / 1000
        uniforms.uPop.value = pop
        uniforms.uEnergy.value = energy
        uniforms.uLensAmt.value = lens.amt
        lens.pts.forEach((v, i) => uniforms.uLens.value[i].copy(v))
        uniforms.uCover.value.set(cover.sx, cover.sy, cover.ox, cover.oy)

        renderer.setScissorTest(false)
        renderer.setViewport(0, 0, W, H)
        renderer.clear()
        const [bx, by, bw, bh] = box
        // Sova's shocks shake the camera: the whole box's picture moves a few pixels, inside the box.
        let sx = 0, sy = 0
        if (now < sova.shakeUntil) {
          const k = ((sova.shakeUntil - now) / sova.shakeLen) * sova.shakeAmp * (bw / 480) ** 0.5
          sx = Math.round((Math.random() * 2 - 1) * k)
          sy = Math.round((Math.random() * 2 - 1) * k)
        }
        renderer.setViewport(bx + sx, H - by - bh + sy, bw, bh)
        renderer.setScissor(bx, H - by - bh, bw, bh)
        renderer.setScissorTest(true)
        if (!IN_OBS || mode !== "nenhum" || pop > 0 || ballIn > 0 || agentAmt > 0 || carAmt > 0) renderer.render(baseScene, ortho)
        if (pop > 0) {
          updateShapes(dt, pop, pushes)
          renderer.clearDepth()
          renderer.render(back, shapeCam)
          renderer.render(bodyScene, ortho)
          renderer.clearDepth()
          renderer.render(front, shapeCam)
        }
        // The agents' clothes on the shoulders, then Luan's face and hands back over them.
        const ready = agentList.filter((a) => a.amt > 0 && a.ready)
        for (const a of ready) {
          if (pose.seen && headSeen) {
            placeTorso(a)
            const k = a.scale * TORSO_K * easeOutBack(a.amt)
            a.torso.matrix.compose(a.pos, a.quat, new THREE.Vector3(k, k, k))
            a.torso.visible = true
            head.visible = false
            renderer.clearDepth()
            renderer.render(ballScene, headCam)
            a.torso.visible = false
          } else a.seen = false
        }
        if (ready.length) {
          drawKeep()
          renderer.render(keepScene, ortho)
        }
        for (const a of agentList) {
          a.hair.visible = a.amt > 0
          a.hair.scale.set(1, easeOutBack(a.amt), 1)
        }
        ball.visible = ballIn > 0
        // The ball's metal wants strong light; the agents' painted textures wash out under it; the cars have
        // their reflections.
        sky.intensity = agentAmt > 0 ? 1.7 : carAmt > 0 ? 1.4 : 3.2
        key.intensity = agentAmt > 0 ? 1.5 : carAmt > 0 ? 1.8 : 3
        if ((ballIn > 0 || agentAmt > 0 || carAmt > 0) && headSeen) {
          head.visible = true
          ball.scale.setScalar(easeOutBack(ballIn))
          // It turns slowly on the head, on top of the head's own turning (?giro= turns a second, 0 for still).
          ball.rotation.y += dt * BALL_SPIN
          renderer.clearDepth()
          renderer.render(ballScene, headCam)
          if (ready.some((a) => a.behind)) renderer.render(keepScene, ortho)
        }
        if (sovaOn) {
          renderer.render(sovaScene, ortho)
          if (drone.visible) {
            renderer.clearDepth()
            renderer.render(droneScene, headCam)
          }
        }
        if (uniforms.uBoomT.value >= 0) renderer.render(boomScene, ortho)
        if (fire.amt > 0) renderer.render(fireScene, ortho)
        if (lens.amt > 0) renderer.render(lensScene, ortho)
        if (uniforms.uOrbAmt.value > 0) renderer.render(bangScene, ortho)
        // The glare stays in the camera's box (Luan's call), from where the orb popped.
        if (uniforms.uFlashAmt.value > 0) renderer.render(flashScene, ortho)

        frames++
        if (now - fpsAt > 500) {
          fps = (frames * 1000) / (now - fpsAt)
          frames = 0
          fpsAt = now
          const ag = AGENTS[mode] || CARS[mode]
          hud.textContent =
            `${fps.toFixed(0)} fps · ${delegate || "…"} · ${camLabel}\n` +
            `gesto ${ms.gesto.toFixed(1)} ms · corpo ${ms.corpo.toFixed(1)} ms · rosto ${ms.rosto.toFixed(1)} ms · ombros ${ms.ombros.toFixed(1)} ms\n` +
            `${handInfo} · filtro: ${mode}${lens.on ? " · lente" : ""}` +
            (ag ? `\n${mode}: modelo ${ag.ready ? "ok" : "carregando"} · rosto ${headSeen ? "sim" : "não"}${AGENTS[mode] ? ` · ombros ${pose.seen ? "sim" : "não"}` : ""}` : "") +
            (mode === "sova" ? `\nsova: arco ${sova.bow.state} ${sova.bow.amt.toFixed(2)}${sova.arrow ? " · flecha" : ""}${sova.dart ? " · dardo" : ""}${sova.shock ? " · choque" : ""}${sova.drone ? " · coruja" : ""}${sova.ult ? " · ultimate" : ""}` : "") +
            (errors.length ? "\n" + errors.slice(-3).join("\n") : "")
        }
      }

      // Opens the camera, and again every 5 s while it fails (busy, Broadcast restarting).
      async function startCamera() {
        try {
          camLabel = await openCamera()
          setupCamera()
        } catch (e) {
          fail("câmera", e)
          setTimeout(startCamera, 5000)
        }
      }
      function setupCamera() {
        fitCover()
        MH = Math.round((MW * video.videoHeight) / video.videoWidth)
        maskData = new Uint8Array(MW * MH)
        maskTex.dispose()
        maskTex = makeMaskTex()
        uniforms.uMask.value = maskTex
        small.width = MW
        small.height = MH
      }
      startCamera()
      tick()
      loadModels().catch((e) => fail("modelos", e))
    </script>
  </body>
</html>
