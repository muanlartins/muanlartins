          hatOther.collider = {
            c: roofG.clone().multiplyScalar(-1 / hs),
            r: new THREE.Vector3(CAR_W / 2, (c.size.y * c.s) / 2, (c.size.x * c.s * c.len) / 2).multiplyScalar(0.92 / hs),
          }
          toward(hatOther, Math.min(1, c.shown))
        }
        return hatNow
      }

      // ---------- trackers ----------
      // MediaPipe's trackers run in workers (rastreio.js), three of them so that their calls overlap: the face alone
      // (the hair and the cars sit on it), the hands alone, and the shoulders with the body mask. Each call ends by
      // reading its answer back from the GPU, which on the page's own thread held the whole frame: four calls a
      // frame took Phoenix to ~15 fps on the 4070 (2026-11-12). Now the camera is drawn on every frame whatever the
      // trackers do, each tracker takes the newest frame whenever it's free, and what sits on Luan is carried along
      // his motion between their answers (`follow`).
      const GROUPS = { rosto: ["rosto"], maos: ["maos"], corpo: ["ombros", "corpo"] }
      const trackers = {}
      let delegate = ""
      function loadModels() {
        for (const [name, which] of Object.entries(GROUPS)) {
          const tr = (trackers[name] = { which, ok: false, busy: true, n: 0, rate: 0, w: new Worker("rastreio.js", { type: "module" }) })
          tr.w.onmessage = ({ data }) => {
            if (data.type === "pronto") {
              Object.assign(tr, { ok: true, busy: false })
              delegate = data.delegate
            } else if (data.type === "falha") fail("modelos", data.erro)
            else if (data.type === "resultado") {
              tr.busy = false
              tr.n++
              if (MEDIR) medir(tr, data)
              try {
                received(data)
              } catch (e) {
                fail("modelos", e)
              }
            }
          }
          tr.w.onerror = (e) => fail("modelos", e.message || e)
          // The hands without MediaPipe's gesture classifier (?gestos=1 brings it back): its two extra models cost the
          // hand tracker about half its answers in OBS, and the gestures read the hand's shape anyway (handShape).
          tr.w.postMessage({ type: "carregar", cpu: q.has("cpu"), which, gestos: q.get("gestos") === "1" })
        }
      }
      const trackersReady = () => Object.values(trackers).some((t) => t.ok)
      // ?medir: each second, to the server's /bench, how often and how late each tracker answers (for tuning in OBS).
      const MEDIR = q.has("medir")
      function medir(tr, d) {
        const m = (tr.m ||= { n: 0, lat: 0, ida: 0, calc: 0, volta: 0 })
        const agora = performance.timeOrigin + performance.now()
        const t = performance.timeOrigin + d.t
        m.n++
        m.lat += agora - t
        if (d.t0) {
          m.ida += d.t0 - t
          m.calc += d.t1 - d.t0
          m.volta += agora - d.t1
        }
      }
      if (MEDIR) {
        let at = performance.now(), f0 = 0, v0 = 0
        setInterval(() => {
          const now = performance.now(), s = (now - at) / 1000
          const out = { fps: +((frames - f0) / s).toFixed(1), camera: +((videoFrames - v0) / s).toFixed(1), modo: mode, rastreio: {} }
          for (const [k, tr] of Object.entries(trackers)) {
            const m = tr.m
            if (!m?.n) continue
            const r = (x) => +(x / m.n).toFixed(1)
            out.rastreio[k] = { porSeg: +(m.n / s).toFixed(1), atraso: r(m.lat), ida: r(m.ida), calculo: r(m.calc), volta: r(m.volta) }
            tr.m = null
          }
          out.ms = Object.fromEntries(Object.entries(ms).map(([k, x]) => [k, +x.toFixed(1)]))
          at = now
          f0 = frames
          v0 = videoFrames
          fetch("/bench", { method: "POST", body: JSON.stringify(out) }).catch(() => {})
        }, 1000)
      }
      // The newest frame, to each free tracker that has something wanted of it.
      function sendFrame(want, now) {
        for (const tr of Object.values(trackers)) {
          if (!tr.ok || tr.busy) continue
          const quer = {}
          for (const k of tr.which) if (want[k]) quer[k] = true
          if (quer.corpo && want.fundo) quer.fundo = true
          if (quer.corpo && want.tronco) quer.tronco = true
          if (quer.corpo && want.quadro) quer.quadro = true
          if (!Object.keys(quer).length) continue
          tr.busy = true
          if (quer.ombros) {
            pose.sentAt = now
            pose.sentHead = headOnScreen()
          }
          if (quer.corpo) bodySentAt = now
          if (quer.fundo) plate.at = now
          createImageBitmap(video).then(
            (bitmap) => tr.w.postMessage({ type: "quadro", bitmap, t: now, quer }, [bitmap]),
            (e) => {
              tr.busy = false
              fail("quadro", e)
            },
          )
        }
      }
      const MS_NAMES = { maos: "gesto", corpo: "corpo", rosto: "rosto", ombros: "ombros" }
      function received(d) {
        for (const k in d.ms) ms[MS_NAMES[k]] = d.ms[k]
        if (d.erro) fail("modelos", d.erro)
        if (d.maos && handsOn) applyHands(d.maos, d.t)
        if ("rosto" in d) applyFace(d.rosto, d.t)
        if (d.ombros) applyPose(d.ombros, d.t)
        let fica = false
        try {
          if (!d.corpo) return
          const r = applyBody(d.corpo, d.t)
          if (!r?.usar) return
          if (d.corpo.topo) sampleBackground(d.corpo.topo, d.t)
          // Learnt from only while the background is the one it was: a frame of the room, or of no picture, isn't.
          if (d.quadro && r.fora && d.t > memZeradaEm && !(plate.bateu && plate.off >= PLATE_MAX)) {
            esquecerQuadro()
            aprender = { bitmap: d.quadro, fora: r.fora }
            fica = true
          }
        } finally {
          if (!fica) d.quadro?.close()
        }
      }

      // ---------- state ----------
      // The filters (filtros/index.js): each one's entry by its id, and the modules that do something of their own
      // (`plugins`, by folder), made once the engine they're handed exists (`motor`, at the end).
      const LISTA = await listaDeFiltros()
      const INFO = Object.fromEntries(LISTA.map((f) => [f.id, f]))
      const MODES = LISTA.map((f) => f.id)
      const plugins = {}
      const pluginOf = (id) => plugins[INFO[id]?.modulo]
      let mode = MODES.includes(q.get("modo")) ? q.get("modo") : "nenhum"
      let pop = 0
      let ballIn = 0
      const ms = { gesto: 0, corpo: 0, rosto: 0, ombros: 0 }
      let faceLm = null
      let videoFrames = 0
      let handsOn = false
      let bodySentAt = -1e9
      // When the newest body mask came in (`mascaraEm`: a filter waiting for one made after it asked).
      let maskTime = -Infinity
      // The frame the mask on screen was made from, and what's believed of the trackers' answers (quadro.js).
      let maskDe = -Infinity
      const quadro = criarQuadro()
      // When the newest camera frame came in: what's on screen, which the trackers' answers are carried up to.
      let shownAt = 0
      const lens = { amt: 0, pts: [0, 1, 2, 3].map(() => new THREE.Vector2(0.5, 0.5)), on: false }
      let prevMask = null
      let energy = 0
      const prevHands = new Map()
      let pushes = []
      let handInfo = ""

      function setMode(m) {
        const before = mode
        mode = MODES.includes(m) ? m : "nenhum"
        titulo.classList.toggle("on", mode === "pop")
        // A new filter silences the last one's and decodes its own (its entry's `sons`, its cues' prefix).
        if (mode !== before) sfx.stopAll(0.25)
        const sons = INFO[mode]?.sons
        if (sons) {
          sfx.preload(sons)
          sfx.keep(sons)
        }
        // A filter with a module lets go of what it was doing when another comes on, and what it put on his body
        // goes; the one coming on loads what it needs (its effects' textures).
        if (mode !== before) {
          // Off and on again in the dock forgets what was learnt behind him.
          if (before === "nenhum") zerarFundo()
          if (pluginOf(before) !== pluginOf(mode)) pluginOf(before)?.desligar?.()
          corpo.limpar()
          shaking.until = 0
        }
        pluginOf(mode)?.ligar?.(mode)
        // Whatever comes on (the same one again too), the particles still flying go.
        vfx.clear()
      }
      // A one-off, from the dock or a key: only for the filter that has it.
      function acao(a) {
        const now = performance.now()
        pluginOf(mode)?.acao?.(a, now)
        if (CARS[mode]) ({ demo, flip: flipCar })[a]?.(now)
      }
      // A viewer's channel points (the Efeitos dock's { visita: { filtro, acao } }): that filter comes on for the
      // ability even over another one or none, and once the ability is over the dock's own choice comes back. Meanwhile
      // the Filtros dock's repeats only change what to come back to. One visit at a time (the Efeitos dock refunds the
      // rest).
      let dockFiltro = mode
      // The visit on the page's clock, moved on by tick(): waiting for him, the ability playing, leaving.
      const visita = { filtro: null, acao: null, fase: null, desde: 0 }
      /** The visiting filter can take the ability: the camera open, his face found, the model loaded. */
      const prontoPara = (f) => camState === "aberta" && headSeen && !!(AGENTS[f] ?? CARS[f] ?? { ready: true }).ready && (pluginOf(f)?.pronto?.() ?? true)
      /** An ability of the filter on is still playing. */
      function ocupado() {
        if (pluginOf(mode)?.ocupado) return pluginOf(mode).ocupado()
        if (CARS[mode]) return CARS[mode].boom >= 0 || CARS[mode].flip >= 0
        return false
      }
      function visitar({ filtro, acao: a }) {
        if (!MODES.includes(filtro) || visita.filtro) return
        Object.assign(visita, { filtro, acao: a, fase: "esperando", desde: performance.now() })
        if (mode !== filtro) setMode(filtro)
      }
      function visitaTick(now) {
        if (!visita.filtro) return
        const t = now - visita.desde
        if (visita.fase === "esperando" && (prontoPara(visita.filtro) || t > 8000)) {
          acao(visita.acao)
          Object.assign(visita, { fase: "soltou", desde: now })
        } else if (visita.fase === "soltou" && t > 4000 && (!ocupado() || t > 30000)) {
          Object.assign(visita, { fase: "saindo", desde: now })
        } else if (visita.fase === "saindo" && t > 1500) {
          visita.filtro = null
          if (mode !== dockFiltro) setMode(dockFiltro)
        }
      }
      // The dock's word (obs-browser's emit_event): the filter that should be on with its options (Sova's drone
      // flying behind him), or a one-off.
      addEventListener("muanlartins-filtro", ({ detail }) => {
        if (detail?.filtro) dockFiltro = detail.filtro
        if (detail?.filtro && detail.filtro !== mode && !visita.filtro) setMode(detail.filtro)
        if (detail?.visita) visitar(detail.visita)
        if (detail?.opcoes) {
          // The dock's "Sons" switch (on unless it says mudo).
          sfx.on = !detail.opcoes.mudo
          // The cars' paint and decal.
          if (CAR_PAINTS[detail.opcoes.cor]) carLook.cor = detail.opcoes.cor
          if (CAR_DECALS[detail.opcoes.decalque] !== undefined) carLook.decalque = detail.opcoes.decalque
          // The Santa hat, over any filter or none.
          if (detail.opcoes.gorro !== undefined) gorro.want = !!detail.opcoes.gorro
          // And each module's own switches, on or not (Sova's drone flying behind him).
          for (const p of Object.values(plugins)) p.opcoes?.(detail.opcoes)
        }
        if (detail?.acao) acao(detail.acao)
      })
      addEventListener("keydown", (e) => {
        // (Not while typing in ?ajuste's panel.)
        if (e.target.matches?.("input:not([type=range]):not([type=checkbox]):not([type=radio]), select, textarea")) return
        // A filter's own key (its entry's `atalho`) turns it on and off.
        const f = LISTA.find((x) => x.atalho === e.key)
        if (f) setMode(mode === f.id ? "nenhum" : f.id)
        const k = e.key.toLowerCase()
        // The filter on's one-offs by their keys in the game (C, Q, E, X, as the dock shows them), or its own (`teclas`).
        const keys = INFO[mode]?.teclas || Object.fromEntries((INFO[mode]?.acoes || []).filter(([, t]) => t).map(([id, t]) => [t.toLowerCase(), id]))
        if (keys[k]) acao(keys[k])
        pluginOf(mode)?.tecla?.(k)
        if (k === "m") sfx.on = !sfx.on
        if (k === "g") gorro.want = !gorro.want
        if (e.key === "0") setMode("nenhum")
      })
      const DEBUG = q.has("debug")

      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y)
      // Thumb and index out, the other fingers in: half of the lens's frame.
      function isL(h) {
        const palm = dist(h[0], h[9])
        return dist(h[8], h[5]) > 0.55 * palm && dist(h[4], h[8]) > 0.6 * palm && dist(h[12], h[0]) < 1.25 * palm && dist(h[16], h[0]) < 1.2 * palm
      }

      // The hands' answer (or ?debug's made-up hands): the gestures, the lens, Pop's pushes.
      function applyHands(r, now) {
        const hands = r.landmarks || []
        // A frame without them: drawn where they were for a moment (SEGURA). The gestures still get what was seen.
        if (!hands.length && handsTrack.cur?.length && now - handsTrack.t <= SEGURA.maos) handsTrack.prev = null
        else {
          handsTrack.prev = alignHands(handsTrack.cur, hands)
          // The hands on screen in the answer's order too, each easing on from where it was.
          const shown = alignHands(lastHands, hands)
          lastHands = hands.map((h, i) => shown[i] || h.map((p) => ({ ...p })))
          handsTrack.prevT = handsTrack.t
          handsTrack.cur = hands
          handsTrack.t = now
        }
        // The lens: both hands in an L, while it's the filter on.
        const ls = mode === "lente" ? hands.filter(isL) : []
        handInfo = `${hands.length} mão(s), ${ls.length} em L`
        // The filter on's gestures (what it says about them goes on ?debug's line).
        handInfo += pluginOf(mode)?.maos?.(r, now) || ""
        if (ls.length === 2) {
          ls.sort((a, b) => a[0].x - b[0].x)
          const [L, R] = ls
          const target = [L[8], R[8], R[4], L[4]].map((p) => toScreen(p.x, p.y))
          lens.pts.forEach((v, i) => v.lerp(new THREE.Vector2(...target[i]), lens.on ? 0.6 : 1))
          lens.on = true
        } else lens.on = false
        // Fast hands push Pop's shapes and stir its fire.
        pushes = []
        const step = Math.max(0.016, (now - handsTrack.prevT) / 1000)
        hands.forEach((h, i) => {
          const [sx, sy] = toScreen(h[9].x, h[9].y)
          const prev = prevHands.get(i)
          if (prev) {
            const v = Math.hypot(sx - prev[0], sy - prev[1]) / step
            if (v > 0.6) pushes.push({ x: (sx - 0.5) * 2 * halfW, y: (sy - 0.5) * 2 * halfH, v: Math.min(v, 4) * 0.8 })
            energy = Math.max(energy, Math.min(1, v / 3))
          }
          prevHands.set(i, [sx, sy])
        })
        if (!hands.length) prevHands.clear()
      }

      // The body mask's answer (256 wide, 0–255).
      function applyBody({ mask, w, h, tronco }, t) {
        if (w !== MW || h !== MH || !mask) return null
        const q = quadro.mascara(mask, w, h, t)
        // A failed one: the last one stays on screen.
        if (!q.usar) return q
        maskDe = t
        let sum = 0, sx = 0, top = -1, diff = 0
        for (let y = 0; y < MH; y++) {
          let row = 0
          for (let x = 0; x < MW; x++) {
            const i = y * MW + x
            const b = mask[i]
            if (prevMask) diff += Math.abs(b - prevMask[i])
            if (b > 127) {
              sum++
              sx += x
              row++
            }
          }
          if (top < 0 && row > MW * 0.03) top = y
        }
        maskData.set(mask)
        prevMask = prevMask || new Uint8Array(MW * MH)
        prevMask.set(maskData)
        maskTex.needsUpdate = true
        troncoData.set(tronco || mask)
        troncoTex.needsUpdate = true
        maskTime = performance.now()
        energy = Math.max(energy, Math.min(1, diff / (MW * MH * 255) / 0.02))
        if (sum > 50 && top >= 0) {
          const [cx, cy] = toScreen(sx / sum / MW, Math.min(1, top / MH + 0.14))
          uniforms.uCenter.value.lerp(new THREE.Vector2(cx, cy), 0.15)
        }
        return q
      }

      // The face's answer: the head's pose (the transformation matrix) and the face's points, kept with the one
      // before them for `follow`.
      const headTrack = { p: new THREE.Vector3(), q: new THREE.Quaternion(), s: new THREE.Vector3(), pp: new THREE.Vector3(), pq: new THREE.Quaternion(), t: 0, prevT: -1e9, prev: false }
      const faceTrack = { cur: null, prev: null, t: 0, prevT: -1e9 }
      const handsTrack = { cur: null, prev: null, t: 0, prevT: -1e9 }
      function applyFace(r, t) {
        if (!r) {
          // A frame without it: where it was, not carried on, for a moment (SEGURA).
          if (headSeen && t - headTrack.t <= SEGURA.rosto) {
            headTrack.prev = false
            faceTrack.prev = null
            return
          }
          headSeen = false
          faceLm = null
          faceTrack.cur = null
          return
        }
        quadro.rosto(r.landmarks, t)
        const fresh = !headSeen
        headTrack.pp.copy(headTrack.p)
        headTrack.pq.copy(headTrack.q)
        headTrack.prevT = headTrack.t
        headTrack.prev = !fresh
        new THREE.Matrix4().fromArray(r.matrix).decompose(headTrack.p, headTrack.q, headTrack.s)
        headTrack.t = t
        if (fresh) {
          headPos.copy(headTrack.p)
          headQuat.copy(headTrack.q)
          headScale.copy(headTrack.s)
          head.matrix.compose(headPos, headQuat, headScale)
        }
        headSeen = true
        faceTrack.prev = fresh ? null : faceTrack.cur
        faceTrack.prevT = faceTrack.t
        faceTrack.cur = r.landmarks
        faceTrack.t = t
        if (!r.landmarks) faceLm = null
        else if (fresh || !faceLm) {
          faceLm = r.landmarks.map((p) => ({ ...p }))
          faceOval(faceLm)
        }
      }

      // Where Luan is now, between the trackers' answers: the last answer carried along the motion between the two
      // last ones, for as long as it's older than the frame on screen (up to 1.5 of their gaps, ×?adiante, 0.8),
      // then eased into over ?suave ms (25), so nothing steps at the trackers' rate on a 60 fps picture.
      const LEAD = Number(q.get("adiante") ?? 0.8)
      const EASE = Number(q.get("suave") ?? 25) / 1000
      function aheadOf(tr) {
        const gap = tr.t - tr.prevT
        if (!tr.prev || gap <= 0 || gap > 200) return 0
        return Math.min(1.5, Math.max(0, shownAt - tr.t) / gap) * LEAD
      }
      function carry(cur, prev, a, out, k) {
        if (!out || out.length !== cur.length) out = cur.map((p) => ({ ...p }))
        for (let i = 0; i < cur.length; i++) {
          const c = cur[i], o = out[i], b = prev ? prev[i] : null
          const x = b ? c.x + (c.x - b.x) * a : c.x
          const y = b ? c.y + (c.y - b.y) * a : c.y
          const z = b ? c.z + (c.z - b.z) * a : c.z
          o.x += (x - o.x) * k
          o.y += (y - o.y) * k
          o.z += (z - o.z) * k
          o.visibility = c.visibility
        }
        return out
      }
      // Each hand's previous self (the tracker's order can change): with two and two, the pairing that moves them
      // least, so fists side by side don't swap; otherwise the nearest, if near.
      function alignHands(prev, cur) {
        prev = prev || []
        const d = (a, b) => dist(a[0], b[0]) + dist(a[9], b[9])
        if (prev.length === 2 && cur.length === 2)
          return d(cur[0], prev[0]) + d(cur[1], prev[1]) <= d(cur[0], prev[1]) + d(cur[1], prev[0]) ? [prev[0], prev[1]] : [prev[1], prev[0]]
        return cur.map((h) => {
          let best = null, bd = 0.16
          for (const p of prev) {
            const e = d(p, h)
            if (e < bd) (bd = e), (best = p)
          }
          return best
        })
      }
      function follow(dt) {
        const k = 1 - Math.exp(-dt / Math.max(0.001, EASE))
        if (headSeen && headTrack.t) {
          const a = aheadOf(headTrack)
          const p = headTrack.p.clone()
          const qt = headTrack.q.clone()
          if (a > 0) {
            p.lerpVectors(headTrack.pp, headTrack.p, 1 + a)
            qt.copy(headTrack.pq).slerp(headTrack.q, 1 + a)
          }
          headPos.lerp(p, k)
          headQuat.slerp(qt, k)
          headScale.lerp(headTrack.s, k)
          head.matrix.compose(headPos, headQuat, headScale)
        }
        if (headSeen && faceTrack.cur && faceLm) {
          const prev = faceTrack.prev && faceTrack.prev.length === faceTrack.cur.length ? faceTrack.prev : null
          faceLm = carry(faceTrack.cur, prev, aheadOf(faceTrack), faceLm, k)
          faceOval(faceLm)
        }
        if (handsOn && handsTrack.cur) {
          const a = aheadOf(handsTrack)
          const cur = handsTrack.cur
          lastHands = cur.map((h, i) => carry(h, handsTrack.prev?.[i] || null, a, lastHands[i], k))
        }
        // The shoulders: where they are against the head (eased, the body tracker answers least often and jitters),
        // carried with the head as it moves on this frame, so the clothes keep to him at the face's pace.
        if (pose.seen && pose.target) {
          const T = pose.target
          const h = headOnScreen()
          const rel = !!(T.head && h)
          if (rel !== pose.rel) {
            pose.offL.copy(pose.left)
            pose.offR.copy(pose.right)
            if (rel) pose.offL.sub(h), pose.offR.sub(h)
            pose.rel = rel
          }
          const ks = 1 - Math.exp(-dt / 0.05)
          pose.offL.lerp(rel ? T.left.clone().sub(T.head) : T.left, ks)
          pose.offR.lerp(rel ? T.right.clone().sub(T.head) : T.right, ks)
          pose.left.copy(pose.offL)
          pose.right.copy(pose.offR)
          if (rel) pose.left.add(h), pose.right.add(h)
          pose.dz += (T.dz - pose.dz) * ks
        }
      }
      // The head on screen, for carrying the shoulders: its centre (the face's transform), across fully and up and down
      // a little less (nodding moves the head more than the shoulders).
      const GLUE = new THREE.Vector2(1, 0.8)
      function headOnScreen() {
        if (!headSeen) return null
        const v = headPos.clone().project(headCam)
        return new THREE.Vector2((v.x + 1) / 2, (v.y + 1) / 2).multiply(GLUE)
      }

      // The face's oval on screen (forehead top, chin, cheeks), for painting over the hair around it.
      function faceOval(lm) {
        const P = (i) => {
          const [x, y] = toScreen(lm[i].x, lm[i].y)
          return new THREE.Vector2(x * (W / H), y)
        }
        const top = P(10), chin = P(152), l = P(234), r = P(454)
        const c = top.clone().add(chin).multiplyScalar(0.5)
        const up = top.clone().sub(chin)
        const ry = up.length() / 2
        up.normalize()
        uniforms.uFace.value.set(c.x / (W / H), c.y, l.distanceTo(r) / 2, ry)
        uniforms.uFaceUp.value.copy(up)
      }

      // The shoulders' answer.
      function applyPose(r, t) {
        const lm = r.landmarks
        const world = r.world
        if (lm && world && lm[11].visibility > 0.4 && lm[12].visibility > 0.4) {
          const l = new THREE.Vector2(...toScreen(lm[11].x, lm[11].y))
          const rr = new THREE.Vector2(...toScreen(lm[12].x, lm[12].y))
          const dz = (world[11].z - world[12].z) * 100
          if (!pose.seen) {
            pose.left.copy(l)
            pose.right.copy(rr)
            pose.dz = dz
            pose.rel = undefined
          }
          // With where the head was on the frame it's about, for carrying them with the head (`follow`).
          pose.target = { left: l, right: rr, dz, head: pose.sentHead }
          pose.seen = true
          pose.em = t
          // The elbows, when they're in the picture (Phoenix's ultimate burns on them too).
          pose.elbows = [13, 14].map((i) => (lm[i].visibility > 0.5 ? new THREE.Vector2(...toScreen(lm[i].x, lm[i].y)) : null))
        } else if (!(pose.seen && t - pose.em <= SEGURA.ombros)) pose.seen = false
        // The filter on's own use of them (Sage's barrier gesture), unless ?debug's made-up arms stand in.
        if (!(DEBUG && window.__bracos)) pluginOf(mode)?.pose?.(lm, performance.now())
      }

      // Does the background plate match the frame? Compared where the mask says Luan isn't, in the frame's top
      // half (`px`, from the body mask's tracker, same frame): the mean difference evens out the camera's colours
      // (uPlateFix), and what's left after it must be small (the lattice's lines are a few levels off the blue;
      // another picture is tens).
      function sampleBackground(px, t) {
        if (!plate.img) return
        const c = plate.canvas
        if (c.width !== MW || c.height !== MH || !plate.px) {
          Object.assign(c, { width: MW, height: MH })
          const pctx = c.getContext("2d", { willReadFrequently: true })
          pctx.drawImage(plate.img, 0, 0, MW, MH)
          plate.px = pctx.getImageData(0, 0, MW, MH >> 1).data
        }
        const pl = plate.px
        if (px.length !== pl.length) return
        const sum = [0, 0, 0]
        let n = 0
        for (let i = 0; i < px.length / 4; i += 2) {
          if (maskData[i] > 40) continue
          for (let k = 0; k < 3; k++) sum[k] += px[i * 4 + k] - pl[i * 4 + k]
          n++
        }
        if (n < 200) return
        const fix = sum.map((v) => v / n)
        let off = 0
        for (let i = 0; i < px.length / 4; i += 2) {
          if (maskData[i] > 40) continue
          for (let k = 0; k < 3; k++) off += Math.abs(px[i * 4 + k] - pl[i * 4 + k] - fix[k])
        }
        plate.off = off / n / 3
        if (plate.off < PLATE_MAX) Object.assign(plate, { ok: true, bateu: true, erros: 0, foraDesde: 0 })
        else {
          // One sample that doesn't match doesn't bring his hair back; five seconds of them are another background.
          if (++plate.erros >= 3) plate.ok = false
          plate.foraDesde ||= t
          if (plate.bateu && t - plate.foraDesde > 5000) zerarFundo()
          return
        }
        uniforms.uPlateFix.value.lerp(new THREE.Vector3(fix[0] / 255, fix[1] / 255, fix[2] / 255), 0.3)
      }

      // ---------- loop ----------
      let lastFrame = -1
      let partsFrame = -1
      let last = performance.now()
      let frames = 0, fps = 0, fpsAt = last
      let camLabel = ""
      // ?fps=60 draws at most that many frames a second (a browser at 144 Hz drawing like OBS's 60 fps source).
      const FPS_CAP = Number(q.get("fps")) || 0
      let lastDraw = 0
      let limpo = false
      function tick() {
        requestAnimationFrame(tick)
        const now = performance.now()
        if (FPS_CAP && now - lastDraw < 1000 / FPS_CAP - 2) return
        lastDraw = now
        const dt = Math.min(0.05, (now - last) / 1000)
        last = now
        visitaTick(now)
        camera(now)
        const camReady = camState === "aberta" && video.readyState >= 2 && video.videoWidth > 0
        if (!showing || !camReady) {
          // Cleared once: a frame with nothing drawn gives OBS nothing new to take.
          if (!limpo) {
            renderer.setScissorTest(false)
            renderer.setViewport(0, 0, W, H)
            renderer.clear()
            limpo = true
          }
          const porque = !showing ? "fonte fora da tela" : camState === "fechada" && mode === "nenhum" && !gorro.want ? "nenhum filtro, câmera fechada" : "abrindo a câmera"
          hud.textContent = `parado: ${porque}` + (errors.length ? "\n" + errors.slice(-3).join("\n") : "")
          return
        }
        limpo = false
        const agentOn = agentList.some((a) => a.amt > 0) || !!AGENTS[mode]
        // (A look placed by numbers can leave his hair as it is: `apagar: false`.)
        const lookErases = agentList.some((a) => a.apagar !== false && (a.amt > 0 || mode === a.id))
        const carOn = carList.some((c) => c.amt > 0) || !!CARS[mode]
        if (trackersReady() && video.currentTime !== lastFrame) {
          lastFrame = video.currentTime
          shownAt = now
          videoFrames++
          try {
            const want = {}
            // What the filter on's module needs tracked: hands, face, shoulders ("sempre": every frame), body mask.
            const pq = pluginOf(mode)?.quer?.(now) || {}
            // The hands are tracked only for the filters that use them (no gesture switches a filter), and while a
            // look is on or fading out (its keep draws them back over its clothes); ?debug's window.__hands(now) can
            // stand in for the tracker (made-up hands, for checking the gestures).
            handsOn = agentOn || !!pq.maos || mode === "pop" || pop > 0 || mode === "lente"
            const fake = handsOn && DEBUG && window.__hands?.(now)
            if (fake) applyHands(fake, now)
            else if (handsOn) want.maos = true
            else {
              lastHands = []
              handsTrack.cur = null
              pushes = []
              lens.on = false
              handInfo = "mãos sem uso"
            }
            // The body mask: Pop, the filter on's effects on him (Sova's reveals while one may be on screen, Sage's heal
            // and frost), and erasing his hair (agents) or his head (cars), with the background's check now and then.
            // While the hands are tracked, the mask asks at most ~12 times a second, leaving the GPU to the hands.
            const bodyEvery = handsOn && mode !== "pop" ? 80 : 0
            if ((mode === "pop" || pop > 0 || pq.corpo || ((lookErases || carOn) && ERASE)) && now - bodySentAt >= bodyEvery) want.corpo = true
            if (pq.tronco) want.tronco = true
            if ((lookErases || carOn) && ERASE) want.quadro = true
            if ((lookErases || carOn) && ERASE && (plate.off === undefined || now - plate.at > 250)) want.fundo = true
            if (mode === "bola" || ballIn > 0 || agentOn || carOn || pq.rosto || gorro.want || gorro.visible) want.rosto = true
            // The shoulders ride the head between answers, so ~15 a second is plenty; Sage's barrier gesture reads the
            // arms, so as often as it can there.
            if ((agentOn || pq.ombros) && now - pose.sentAt > (pq.ombros === "sempre" ? 0 : 60)) want.ombros = true
            sendFrame(want, now)
            // ?debug's window.__bracos(now) can stand in for the arms (body tracker landmarks), for Sage's gesture.
            if (DEBUG && window.__bracos) pluginOf(mode)?.pose?.(window.__bracos(now), now)
          } catch (e) {
            fail("modelos", e)
          }
        }
        follow(dt)
        pluginOf(mode)?.seguir?.(dt)
        if (carOn && faceLm && video.currentTime !== partsFrame) {
          partsFrame = video.currentTime
          drawParts()
        }
        pop = THREE.MathUtils.clamp(pop + (mode === "pop" ? dt / 0.55 : -dt / 0.4), 0, 1)
        ballIn = THREE.MathUtils.clamp(ballIn + (mode === "bola" ? dt / 0.35 : -dt / 0.25), 0, 1)
        for (const a of agentList) a.amt = THREE.MathUtils.clamp(a.amt + (mode === a.id ? dt / 0.4 : -dt / 0.3), 0, 1)
        for (const c of carList) c.amt = THREE.MathUtils.clamp(c.amt + (mode === c.id ? dt / 0.35 : -dt / 0.25), 0, 1)
        const agentAmt = Math.max(...agentList.map((a) => a.amt))
        const eraseAmt = Math.max(0, ...agentList.filter((a) => a.apagar !== false).map((a) => a.amt))
        const carAmt = Math.max(...carList.map((c) => c.amt))
        uniforms.uPlateOk.value = plate.ok ? 1 : 0
        // The filter on's module moves what its particles follow (an orb in flight, a fireball in a hand) before
        // every filter's particles move, here, so they don't trail it by a frame; the rest of its frame comes after.
        pluginOf(mode)?.mover?.(now, dt)
        if (vfx.active()) vfx.update(dt)
        pluginOf(mode)?.atualizar?.(now, dt)
        updateCars(now, dt)
        gorro.update(now, dt, hatAnchor())
        // Erasing his hair: around an agent's, or his whole head under a car (back while it's demolished).
        const carShown = Math.max(0, ...carList.map((c) => (c.group.visible ? c.shown : 0)))
        uniforms.uErase.value = headSeen && ERASE ? Math.max(eraseAmt, carShown) : 0
        uniforms.uEraseLow.value.set(...(carShown > eraseAmt ? [-1.05, -0.85] : [-0.55, -0.3]))
        uniforms.uMaskShift.value.set(0, 0)
        if (uniforms.uErase.value > 0 && faceLm) {
          const de = quadro.centroEm(maskDe)
          if (de) {
            const [ax, ay] = toScreen(de[0], de[1])
            const [bx, by] = toScreen((faceLm[10].x + faceLm[152].x) / 2, (faceLm[10].y + faceLm[152].y) / 2)
            uniforms.uMaskShift.value.set(bx - ax, by - ay).clampLength(0, 0.15)
          }
        }
        // Under a car, centred on the middle of his head rather than his face, which turns off to a side.
        if (carShown > eraseAmt && headSeen) {
          const mid = new THREE.Vector3(...CAR_AT).applyMatrix4(head.matrix).project(headCam)
          uniforms.uFace.value.x += (mid.x * 0.5 + 0.5 - uniforms.uFace.value.x) * 0.7
        }
        lens.amt = THREE.MathUtils.clamp(lens.amt + (lens.on ? dt / 0.15 : -dt / 0.2), 0, 1)
        energy *= Math.pow(0.25, dt)

        uniforms.uTime.value = now / 1000
        uniforms.uPop.value = pop
        uniforms.uEnergy.value = energy
        uniforms.uLensAmt.value = lens.amt
        lens.pts.forEach((v, i) => uniforms.uLens.value[i].copy(v))
        uniforms.uCover.value.set(cover.sx, cover.sy, cover.ox, cover.oy)

        // The abilities' particles into their own target first (that switches render targets).
        const vfxOn = vfx.active()
        vfx.tint.set(...(TINTS[INFO[mode]?.tint] || TINTS.phoenix))
        if (vfxOn) vfx.render(box[2], box[3])
        // The face's mask and what's behind Luan, before the camera's layer, which erases his hair with them.
        const ready = agentList.filter((a) => a.amt > 0 && a.ready)
        if (ready.length) drawKeep(ready.find((a) => a.trim)?.trim, true, ready.some((a) => a.rostoPorCima !== false), ready.some((a) => a.maosPorCima !== false))
        else if (carAmt > 0) drawKeep(undefined, false)
        if (aprender) {
          if ((agentAmt > 0 || carAmt > 0) && ERASE) remember()
          else esquecerQuadro()
        }

        renderer.setScissorTest(false)
        renderer.setViewport(0, 0, W, H)
        renderer.clear()
        const [bx, by, bw, bh] = box
        // A filter's shake (`sacudir`: Sova's shocks): the whole box's picture moves a few pixels, inside the box.
        let sx = 0, sy = 0
        if (now < shaking.until) {
          const k = ((shaking.until - now) / shaking.len) * shaking.amp * (bw / 480) ** 0.5
          sx = Math.round((Math.random() * 2 - 1) * k)
          sy = Math.round((Math.random() * 2 - 1) * k)
        }
        // A filter's move of the picture (`deslocar`), with the zoom that keeps the box covered.
        const ox = Math.round((moved.x * bw) / W)
        const oy = Math.round((moved.y * bw) / W)
        const mx = Math.max(Math.abs(ox), Math.ceil((Math.abs(oy) * bw) / bh))
        const my = Math.ceil((mx * bh) / bw)
        moved.x = moved.y = 0
        renderer.setViewport(bx + sx + ox - mx, H - by - bh + sy + oy - my, bw + 2 * mx, bh + 2 * my)
        renderer.setScissor(bx, H - by - bh, bw, bh)
        renderer.setScissorTest(true)
        if (!IN_OBS || mode !== "nenhum" || pop > 0 || ballIn > 0 || agentAmt > 0 || carAmt > 0 || gorro.visible) renderer.render(baseScene, ortho)
        if (pop > 0) {
          updateShapes(dt, pop, pushes)
          renderer.clearDepth()
          renderer.render(back, shapeCam)
          renderer.render(bodyScene, ortho)
          renderer.clearDepth()
          renderer.render(front, shapeCam)
        }
        // What a filter puts behind him, under everything else (Sova's drone, his body in front of it).
        desenhar("atras")
        // The agents' clothes on the shoulders, then Luan's face and hands back over them.
        for (const a of ready) {
          if (a.modo === "fixo" && !a.pecas.ombros) continue
          if (pose.seen && headSeen) {
            placeTorso(a)
            const k = a.scale * torsoK(a) * easeOutBack(a.amt)
            a.torso.matrix.compose(a.pos, a.quat, new THREE.Vector3(k, k, k))
            a.torso.visible = true
            head.visible = false
            renderer.clearDepth()
            renderer.render(ballScene, headCam)
            a.torso.visible = false
          } else a.seen = false
        }
        if (ready.length) renderer.render(keepScene, ortho)
        for (const a of agentList) {
          a.hair.visible = a.amt > 0
          a.hair.scale.set(1, easeOutBack(a.amt), 1)
        }
        ball.visible = ballIn > 0
        // The ball's metal wants strong light; the agents' painted textures wash out under it; the cars have
        // their reflections.
        sky.intensity = agentAmt > 0 ? 1.7 : carAmt > 0 ? 1.4 : 3.2
        key.intensity = agentAmt > 0 ? 1.5 : carAmt > 0 ? 1.8 : 3
        if ((ballIn > 0 || agentAmt > 0 || carAmt > 0) && headSeen) {
          head.visible = true
          ball.scale.setScalar(easeOutBack(ballIn))
          // It turns slowly on the head, on top of the head's own turning (?giro= turns a second, 0 for still).
          ball.rotation.y += dt * BALL_SPIN
          renderer.clearDepth()
          renderer.render(ballScene, headCam)
          // His face and hands back over the hair whose locks fall beside his face (Sova's, Sage's), or over a head
          // piece placed by numbers that asks for one or both (`rostoPorCima`, `maosPorCima`: "tudo").
          const tudo = (k) => ready.some((a) => a[k] === "tudo")
          if (ready.some((a) => a.behind) || (tudo("rostoPorCima") && tudo("maosPorCima"))) renderer.render(keepScene, ortho)
          else if (tudo("maosPorCima")) renderer.render(keepHandsScene, ortho)
          else if (tudo("rostoPorCima")) renderer.render(keepFaceScene, ortho)
        }
        // What a filter puts in his hands, over his clothes and hair (it can draw his hands back over it: Sova's bow,
        // which they hold and pull the string of).
        desenhar("segurado")
        // The Santa hat, over whatever is on his head (the abilities' effects still pass in front of it).
        if (gorro.visible) {
          renderer.clearDepth()
          renderer.render(gorro.scene, headCam)
        }
        // What's on his body, then what a filter puts in front of him.
        if (corpo.ativo()) renderer.render(corpoScene, ortho)
        desenhar("frente")
        if (uniforms.uBoomT.value >= 0) renderer.render(boomScene, ortho)
        if (lens.amt > 0) renderer.render(lensScene, ortho)
        desenhar("antesFx")
        // The abilities' particles, drawn by vfx into its own target, tone mapped over the box.
        if (vfxOn) renderer.render(vfx.compositeScene, ortho)
        desenhar("depoisFx")

        // ?debug: a test bench can take this frame (the drawing buffer is only readable right after drawing).
        if (DEBUG && window.__foto) window.__foto(renderer.domElement)
        frames++
        if (now - fpsAt > 500) {
          fps = (frames * 1000) / (now - fpsAt)
          for (const tr of Object.values(trackers)) {
            tr.rate = (tr.n * 1000) / (now - fpsAt)
            tr.n = 0
          }
          frames = 0
          fpsAt = now
          const ag = AGENTS[mode] || CARS[mode]
          hud.textContent =
            `${fps.toFixed(0)} fps · ${delegate || "…"} · ${camLabel}\n` +
            `gesto ${ms.gesto.toFixed(1)} ms · corpo ${ms.corpo.toFixed(1)} ms · rosto ${ms.rosto.toFixed(1)} ms · ombros ${ms.ombros.toFixed(1)} ms\n` +
            `respostas/s: ${Object.entries(trackers).map(([k, t]) => `${k} ${t.rate.toFixed(0)}`).join(" · ")}\n` +
            `${handInfo} · filtro: ${mode}${lens.on ? " · lente" : ""}${gorro.want ? ` · gorro ${gorro.visible ? "na cabeça" : "sem rosto"}` : ""}` +
            (ag ? `\n${mode}: modelo ${ag.ready ? "ok" : "carregando"} · rosto ${headSeen ? "sim" : "não"}${AGENTS[mode] ? ` · ombros ${pose.seen ? "sim" : "não"} · fundo ${!ERASE ? "desligado" : plate.off === undefined ? "…" : `${plate.ok ? "ok" : "não bate"} (${plate.off.toFixed(1)})`}` : ""}` : "") +
            (pluginOf(mode)?.hud ? "\n" + pluginOf(mode).hud() : "") +
            (errors.length ? "\n" + errors.slice(-3).join("\n") : "")
        }
      }

      // The camera only while something on the page needs it (a filter, the hat), and let go SOLTA_MS after
      // (fade-outs, the hat's fall) or off screen. Held with nothing on, NVIDIA Broadcast served two apps at once:
      // measured 2026-11-18, ~1 CPU core and +9 points of GPU with no filter on. Opening takes a fraction of a
      // second, under the filter's fade-in; OBS's own Câmera shows meanwhile. A camera that stops sending frames
      // (Broadcast restarting it; on 11-18 the page stayed dark the rest of the live) is let go and opened again.
      const SOLTA_MS = 3000
      const MUDA_MS = 3000 // no new frame for this long: the camera is gone
      let camState = "fechada" // "abrindo", "aberta"
      let camStream = null
      let camRetryAt = 0
      let neededAt = -Infinity
      let frameSeen = -1
      let frameAt = 0
      async function startCamera() {
        camState = "abrindo"
        try {
          camLabel = await openCamera()
          camStream = video.srcObject
          const s = camStream
          s.getVideoTracks()[0].addEventListener("ended", () => camStream === s && stopCamera())
          setupCamera()
          camState = "aberta"
          frameAt = performance.now()
        } catch (e) {
          fail("câmera", e)
          stopCamera()
          camRetryAt = performance.now() + 5000
        }
      }
      function stopCamera() {
        ;(camStream ?? video.srcObject)?.getTracks().forEach((t) => t.stop())
        camStream = null
        video.srcObject = null
        camState = "fechada"
      }
      /** Opens or lets go of the camera for this frame. */
      function camera(now) {
        if (showing && (mode !== "nenhum" || gorro.want)) neededAt = now
        const want = now - neededAt < SOLTA_MS
        if (video.currentTime !== frameSeen) {
          frameSeen = video.currentTime
          frameAt = now
        }
        if (camState === "aberta" && (!want || now - frameAt > MUDA_MS)) {
          if (want) fail("câmera", "parou de mandar imagem; abrindo de novo")
          stopCamera()
        }
        if (want && camState === "fechada" && now >= camRetryAt) startCamera()
      }
      function setupCamera() {
        fitCover()
        MH = Math.round((MW * video.videoHeight) / video.videoWidth)
        maskData = new Uint8Array(MW * MH)
        maskTex.dispose()
        maskTex = makeMaskTex(maskData)
        uniforms.uMask.value = maskTex
        troncoData = new Uint8Array(MW * MH)
        troncoTex.dispose()
        troncoTex = makeMaskTex(troncoData)
        uniforms.uTronco.value = troncoTex
        foraData = new Uint8Array(MW * MH)
        foraTex.dispose()
        foraTex = makeMaskTex(foraData)
        memMat.uniforms.uFora.value = foraTex
        zerarFundo()
      }
      // ---------- the filters' modules ----------
      // What every filter's module is handed (filtros/README.md says what each piece is): three.js and its loader,
      // the particles and the sounds, where he is (face, hands, shoulders, on screen and in the 3D camera's
      // centimetres), the box, the effects on his body, the drawing's pieces, and the page's error list.
      const motor = {
        THREE, GLTFLoader, MeshoptDecoder, vfx, sfx, q, W, H, video, cover, uniforms, GLSL_COMMON, GLSL_APAGAR, VERT, quad, ortho, headCam, renderer,
        at3, onRay, onBox, toScreen, handAt, handShape, panAt, pan3, faceBox, headAt, headOnScreen, pose, headPos, easeOutBack, roomEnv, corpo, fail,
        toEdge, clamp01, ease, bez, bezDir, FACE_OVAL,
        sacudir: shake,
        deslocar,
        get mascaraEm() { return maskTime },
        get faceLm() { return faceLm },
        get lastHands() { return lastHands },
        get headSeen() { return headSeen },
        get modo() { return mode },
        // The look on him now (visuais.js), and a colour for its material of that name (a filter's hair following
        // its game); false while there's no look or none of its materials has that name.
        get visual() { return AGENTS[mode]?.ready ? AGENTS[mode] : null },
        corDoVisual(material, cor) {
          const a = AGENTS[mode]
          if (!a?.ready) return false
          let achou = false
          for (const g of [a.hair, a.torso])
            g.traverse((o) => {
              if (o.isMesh) for (const mt of [o.material].flat()) if (mt.name === material) ((achou = true), mt.color.copy(cor))
            })
          return achou
        },
      }
      // Drawing a filter's own things at its moment of the frame (`desenhar` in the loop): "atras" behind him,
      // "segurado" in his hands, "frente" in front of him, "antesFx"/"depoisFx" around the particles.
      const R = { renderer, ortho, headCam, maosPorCima: () => renderer.render(keepHandsScene, ortho), rostoPorCima: () => renderer.render(keepScene, ortho) }
      function desenhar(fase) {
        pluginOf(mode)?.desenhar?.(fase, R)
      }
      for (const nome of new Set(LISTA.map((f) => f.modulo).filter(Boolean))) {
        try {
          const mod = await import(`./filtros/${nome}/index.js`)
          if (mod.criar) plugins[nome] = await mod.criar(motor)
        } catch (e) {
          fail(nome, e)
        }
      }
      setMode(mode)
      // ?ajuste: the panel for fitting a look placed by numbers on him (filtros/ajuste.js), loaded only then.
      if (q.has("ajuste"))
        import("./filtros/ajuste.js").then(
          (m) =>
            m.criarAjuste({
              AGENTS, VISUAIS, gorro, HAT_Y, hatOnLook, nomesDe, bate, setMode,
              canvas: renderer.domElement,
              ajustar: fitFixed,
              refazer: buildFixed,
              get modo() { return mode },
            }),
          (e) => fail("ajuste", e),
        )
      if (DEBUG) {
        window.filtros = { visita, get faceLm() { return faceLm }, toScreen, AGENTS, CARS, uniforms, acao, vfx, sfx, gorro, setMode, handShape, at3, corpo, plugins, INFO, get mode() { return mode }, get trackers() { return trackersReady() } }
        for (const p of Object.values(plugins)) Object.assign(window.filtros, p.estado)
      }
      tick()
      loadModels()
