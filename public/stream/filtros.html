      }
      // Places the bow: its grip at G, the string pulled towards N (both in camera space), `draw` (0..1) of the way
      // from rest to a full draw, scaled by `amt` as it shows. Its size: with `fit` (by gesture), so the string is
      // at N however far it's drawn (it opens as the hands part); otherwise so a full draw reaches N.
      const bowAxis = new THREE.Vector3(1, 0, 0)
      function placeBow(G, N, draw, amt, kind, fit) {
        const u = G.clone().sub(N)
        if (u.lengthSq() < 1e-6) u.set(1, 0, 0)
        u.normalize()
        bowAxis.copy(u)
        // Upright in the picture whichever way it aims, its face to the camera.
        const v = new THREE.Vector3(0, 1, 0).addScaledVector(u, -u.y)
        if (v.lengthSq() < 1e-4) v.set(-u.y, u.x, 0)
        v.normalize()
        const w = u.clone().cross(v)
        const k = Math.max(1e-3, easeOutBack(amt))
        bow3.root.matrix.makeBasis(u, v, w).scale(new THREE.Vector3(k, k, k)).setPosition(G)
        bow3.root.matrixWorldNeedsUpdate = true
        bow3.root.visible = amt > 0
        if (!bow3.model) return
        const reach = THREE.MathUtils.clamp(G.distanceTo(N) / (-BOW.REST + BOW.PULL * (fit ? draw : 1)), BOW_K * 0.7, BOW_K * (fit ? BOW_FIT : 1.5))
        bow3.k += (reach - bow3.k) * (amt < 1 ? 1 : fit ? 0.6 : 0.3)
        bow3.model.scale.setScalar(bow3.k)
        bow3.root.updateMatrixWorld(true)
        const sx = BOW.REST - BOW.PULL * draw
        if (bow3.string) {
          const t = bow3.model.localToWorld(new THREE.Vector3(sx, BOW.LINE, 0))
          bow3.string.parent.updateMatrixWorld(true)
          bow3.string.position.copy(bow3.string.parent.worldToLocal(t))
        }
        for (const [k2, a] of Object.entries(bow3.arrows)) a.visible = k2 === kind
        bow3.arrow = bow3.arrows[kind] || null
        if (bow3.arrow) bow3.arrow.position.set(sx, BOW.LINE, 0)
      }
      // The bow where the hands are now: the grip and the pulling hand at the depth of his face, a little nearer
      // the camera.
      function placeBowNow(kind) {
        const bow = sova.bow
        const fit = bow.state === "draw" && !bow.auto && !sova.ult
        placeBow(at3(bow.a.x, bow.a.y, 10), at3(bow.b.x, bow.b.y, 10), bow.draw, bow.amt, kind, fit)
      }

      // A hand's shape, for the gestures: its size (the palm's length or its knuckles' width, whichever shows
      // more), the middle of its knuckles, and whether it's a fist or open (the recognizer's own call, or the
      // fingertips' distances from the wrist). Distances in the video's height, so they're round on screen.
      function handShape(h, cat, va) {
        const d = (p, o) => Math.hypot((p.x - o.x) * va, p.y - o.y)
        const s = Math.max(d(h[0], h[9]), d(h[5], h[17]) * 1.25)
        const r = [8, 12, 16, 20].map((t) => d(h[t], h[0]) / s)
        const k = [5, 9, 13, 17].reduce((a, i) => ({ x: a.x + h[i].x / 4, y: a.y + h[i].y / 4 }), { x: 0, y: 0 })
        const fist = (cat === "Closed_Fist" || r.filter((v) => v < 1.3).length >= 3) && cat !== "Open_Palm"
        const open = (cat === "Open_Palm" || r.filter((v) => v > 1.6).length >= 3) && cat !== "Closed_Fist"
        return { h, s, k, d, fist, open }
      }
      // Where each hand holds the bow on screen: the bow hand by its knuckles, the string hand between its thumb
      // and index fingertips.
      function bowHands(B, S, k) {
        const sb = sova.bow
        sb.a.lerp(new THREE.Vector2(...toScreen(B.k.x, B.k.y)), k)
        sb.b.lerp(new THREE.Vector2(...toScreen((S.h[4].x + S.h[8].x) / 2, (S.h[4].y + S.h[8].y) / 2)), k)
      }
      // The bow by gesture: both hands closed, one fist against the other, for 0.2 s opens it between them; pulling
      // them apart draws it (the hand nearer the face pulls the string, the other holds the bow), and opening a hand
      // lets the Recon Bolt go, from that hand towards the other. Losing a hand once it's a third drawn lets it go
      // too (a quick release blurs); opening or losing one before that folds it.
      function sovaHands(r, now) {
        const va = video.videoWidth / video.videoHeight || 16 / 9
        const hs = (r.landmarks || []).slice(0, 2).map((h, i) => handShape(h, r.gestures?.[i]?.[0]?.categoryName, va))
        owlHands(hs, now)
        const bow = sova.bow
        if (bow.auto || sova.ult) return
        const nose = faceLm ? faceLm[1] : { x: 0.5, y: 0.4 }
        const fw = faceLm ? Math.abs(faceLm[454].x - faceLm[234].x) * va : 0.2
        const toNose = (p) => Math.hypot((p.x - nose.x) * va, p.y - nose.y)
        const [A, B] = hs
        if (bow.state === "idle") {
          const together = hs.length === 2 && A.fist && B.fist && A.d(A.k, B.k) < 0.95 * (A.s + B.s)
          if (!together) {
            sova.fists = 0
            return
          }
          sova.fists ||= now
          handInfo += " · punhos"
          if (now - sova.fists < 200) return
          sova.fists = 0
          const [S, G] = toNose(A.k) <= toNose(B.k) ? [A, B] : [B, A]
          bow.g = { pa: G.k, pb: S.k, opened: 0, lost: 0 }
          Object.assign(bow, { state: "draw", since: now, kind: "recon", d0: null, draw: 0 })
          bowHands(G, S, 1)
          bowSound("recon")
          return
        }
        const g = bow.g
        if (bow.state !== "draw" || !g) return
        if (hs.length < 2) {
          g.lost ||= now
          if (now - g.lost > 150) bow.draw >= 0.35 ? shoot("recon", now) : foldBow()
          return
        }
        g.lost = 0
        // The same hands as before (the tracker's order can swap), then which pulls the string: the one nearer the
        // face, by a margin (he can change sides while drawing).
        const sq = (p, o) => (p.x - o.x) ** 2 + (p.y - o.y) ** 2
        let [G, S] = sq(A.k, g.pa) + sq(B.k, g.pb) <= sq(B.k, g.pa) + sq(A.k, g.pb) ? [A, B] : [B, A]
        if (toNose(G.k) < toNose(S.k) - 0.35 * fw) [G, S] = [S, G]
        g.pa = G.k
        g.pb = S.k
        bowHands(G, S, 0.6)
        handInfo += ` · arco ${Math.round(bow.draw * 100)}%`
        // A hand open for two frames lets go: the one that opened was pulling the string.
        if (!G.open && !S.open) {
          g.opened = 0
          return
        }
        if (++g.opened < 2) return
        if (bow.draw < 0.25) return foldBow()
        if (G.open && !S.open) {
          bowHands(S, G, 1)
          placeBowNow(bow.kind)
        }
        shoot("recon", now)
      }
      const foldBow = () => {
        bowQuiet("sova-bow-fold")
        Object.assign(sova.bow, { state: "idle", g: null })
      }
      // The bow's sounds: out, with its charge and a hum while it's drawn and a tick at half and at full draw
      // (updateSova), then let go (shoot) or folded unshot.
      let bowSnd = null
      function bowSound(kind) {
        bowSnd?.hum.stop(0.1)
        const shock = kind === "choque"
        const pan = panAt(sova.bow.a.x)
        sfx.play(shock ? "sova-shock-equip" : "sova-recon-equip", { pan })
        sfx.play(shock ? "sova-shock-charge" : "sova-recon-charge", { pan, gain: 0.8, delay: 0.12 })
        bowSnd = { lvl: 0, hum: sfx.play(shock ? "sova-shock-hum" : "sova-charge-hum", { loop: true, pan, gain: 0.7 }) }
      }
      function bowQuiet(cue) {
        if (!bowSnd) return
        bowSnd.hum.stop(0.1)
        bowSnd = null
        if (cue) sfx.play(cue, { pan: panAt(sova.bow.a.x) })
      }
      // The Owl Drone's gesture: both palms open to the camera, fingers up, side by side (thumbs towards each
      // other, so not the backs of the hands, and apart, so not a clap). Held 0.3 s, the drone opens between them
      // (or, flying behind him, comes).
      function isOwl(hs) {
        if (hs.length < 2) return false
        const [A, B] = hs
        const up = (x) => x.h[0].y - x.h[12].y > 1.1 * x.s
        const flat = (x) => x.d(x.h[5], x.h[17]) > 0.45 * x.d(x.h[0], x.h[9])
        const inward = (x, o) => x.d(x.h[4], o.h[0]) < x.d(x.h[20], o.h[0])
        const s = (A.s + B.s) / 2
        return A.open && B.open && up(A) && up(B) && flat(A) && flat(B) && inward(A, B) && inward(B, A) && A.d(A.k, B.k) > 1.0 * s && Math.abs(A.k.y - B.k.y) < 1.5 * s
      }
      function owlHands(hs, now) {
        const o = sova.owl
        if (!isOwl(hs)) {
          o.since = 0
          return
        }
        o.since ||= now
        handInfo += " · coruja"
        if (now - o.since > 300 && !sova.drone) {
          const [A, B] = hs
          const m = toScreen((A.k.x + B.k.x) / 2, (A.k.y + B.k.y) / 2)
          startDrone(now, at3(m[0], m[1], 12))
          o.since = Infinity
        }
      }

      // The dock's Flecha de Reconhecimento and Flecha de Choque: the bow drawn beside the face, toward the side with
      // more room, shot by itself.
      function autoBow(kind, now) {
        if (sova.bow.state !== "idle" || sova.ult) return
        const f = faceBox()
        const side = f.c.x < 0.5 ? 1 : -1
        sova.bow.a.set(clamp01(f.c.x + side * f.w * 2.3, 0.08, 0.92), f.c.y - f.w * 0.5)
        sova.bow.b.set(f.c.x + side * f.w * 0.5, f.c.y - f.w * 0.45)
        Object.assign(sova.bow, { state: "draw", since: now, auto: now, kind })
        bowSound(kind)
      }
      // The arrow leaves the bow: the Recon Bolt flies to the edge of the box where it points and sticks there; the
      // Shock Bolt flies up, bounces off the top of the box and bursts by his shoulder on that side.
      function shoot(kind, now) {
        // One arrow in the air at a time: the one before gets where it was going now.
        if (sova.arrow) finishArrow(sova.arrow, now)
        const tip = arrowTip()
        const from = onBox(tip)
        const dir2 = onBox(tip.clone().add(bowAxis)).sub(from).normalize()
        const depth = (p) => at3(p.x, p.y, tip.z - (headSeen ? headPos.z : -65))
        let pts
        if (kind === "recon") pts = [tip, depth(toEdge(from, dir2, 0.02))]
        else {
          const f = faceBox()
          const side = Math.sign(sova.bow.a.x - f.c.x) || 1
          const up = toEdge(from, new THREE.Vector2(dir2.x * 0.5, 1).normalize(), 0.03)
          const land = new THREE.Vector2(clamp01(f.c.x + side * f.w * 1.5), clamp01(f.c.y - f.w * 1.5))
          pts = [tip, depth(up), depth(land)]
        }
        const legs = pts.slice(1).map((p, i) => Math.max(110, (onBox(p).distanceTo(onBox(pts[i])) / 2.6) * 1000))
        const a = { kind, pts, legs, t0: now, leg: 0, at: tip.clone(), dir: pts[1].clone().sub(tip).normalize(), k: bow3.k }
        a.sys = vfx.spawn(kind === "recon" ? SOVA.E.trail : SOVA.Q.trail, (v) => v.copy(a.at), { scale: 0.3, dir: () => a.dir })
        sova.arrow = a
        sova.maskUntil = now + 6500
        bowQuiet("sova-bow-release")
        Object.assign(sova.bow, { state: "idle", auto: 0, g: null })
      }
      // An arrow at the end of its flight: the Recon Bolt sticks, the Shock Bolt bursts.
      function finishArrow(a, now) {
        a.sys.stop()
        const end = a.pts[a.pts.length - 1]
        if (a.kind === "recon") land(end, a.dir.clone(), a.k, now)
        else {
          // The game's blast is 4 m across; here about two faces.
          vfx.spawn(SOVA.Q.boom, (v) => v.copy(end), { scale: 0.07, dur: 0.05 })
          sfx.play("sova-shock-explode", { pan: pan3(end) })
          shake(380, 10, now)
        }
        sova.arrow = null
      }
      function startUlt(now) {
        if (sova.ult) return
        sova.arrow?.sys.stop()
        sova.arrow = null
        const f = faceBox()
        const side = f.c.x < 0.5 ? 1 : -1
        sova.bow.a.set(clamp01(f.c.x + side * f.w * 2.4, 0.08, 0.92), f.c.y - f.w * 0.35)
        sova.bow.b.set(f.c.x + side * f.w * 0.5, f.c.y - f.w * 0.35)
        Object.assign(sova.bow, { state: "idle", auto: 0 })
        bowQuiet()
        const pan = panAt(sova.bow.a.x)
        sfx.play("sova-ult-equip", { pan })
        sova.ult = { t0: now, fired: 0, charging: -1, pan, hum: sfx.play("sova-ult-hum", { loop: true, pan, gain: 0.8 }), sys: vfx.spawn(SOVA.X.bow, (v) => v.copy(limbPoint()), { scale: bow3.k / 100 }) }
      }
      // A point along the bow's limbs, at random (where Amb_EnergyBow1P_VFX's loops crawl: 17 to 53 cm from the grip).
      const LIMB = [0.17, 0.28, 0.36, -0.34, -0.45, -0.53]
      const limbPoint = () => bowPt(-0.06, LIMB[Math.floor(Math.random() * LIMB.length)] * (0.9 + Math.random() * 0.25), 0.01)

      // The Owl Drone: in its metres it faces +x, up +y, its two eyes 2.5 cm either side of the middle, its ducted
      // turbines at ±0.18 on z (their rings face forward). The ability: it opens where it's thrown (between the
      // palms, by the gesture), flies up beside his head, looks at him, tags him with its dart (which reveals him
      // twice) and flies off. With the dock's "Coruja sobrevoando" it flies behind him all the while (below), and
      // the ability is that drone coming round to beside his head and going back.
      // In its own scene: behind him it's drawn first, under him (his body's mask in front of it), else on top.
      const DRONE_K = Number(q.get("coruja") || 30)
      const drone3 = { root: new THREE.Group(), model: null, discs: [], behind: false, eyes: null }
      drone3.root.visible = false
      sv3.drone = new THREE.Scene()
      sv3.drone.add(new THREE.HemisphereLight(0xe4ecff, 0x2a3042, 1.7))
      const droneSun = new THREE.DirectionalLight(0xffffff, 2.2)
      droneSun.position.set(0.4, 1, 1)
      sv3.drone.add(droneSun, drone3.root)
      // His body as the nearest depth, where the mask has him: what's drawn behind it after is hidden.
      const occludeScene = quad(
        new THREE.ShaderMaterial({
          uniforms,
          vertexShader: /* glsl */ `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, -1.0, 1.0); }`,
          fragmentShader: /* glsl */ `
            ${GLSL_COMMON}
            void main() {
              if (maskAt(vUv, 0.0) < 0.5) discard;
              gl_FragColor = vec4(0.0);
            }`,
          colorWrite: false,
          depthWrite: true,
          depthTest: true,
          depthFunc: THREE.AlwaysDepth,
        }),
      )
      const DRONE_EYE = new THREE.Vector3(0.085, 0.04, 0)
      loadPiece("Ability_E/1P/Models/AB_Hunter_S0_E_Skelmesh.glb", (m) => {
        m.scale.setScalar(DRONE_K)
        // Its +x to the group's +z, so the group's lookAt points it.
        m.rotation.y = -Math.PI / 2
        drone3.root.add(m)
        drone3.model = m
        // The turbines' blades, blurred spinning (Hunter_C_Propellers: the blur in (0, 3, 10)).
        const blur = new THREE.TextureLoader().load(HUNTER + "VFX/Textures/Hunter_C_Propellers_Blur.png")
        blur.colorSpace = THREE.NoColorSpace
        for (const z of [-0.18, 0.18]) {
          const disc = new THREE.Mesh(new THREE.CircleGeometry(0.085, 40), new THREE.MeshBasicMaterial({ map: blur, color: new THREE.Color(0.35, 0.75, 1), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }))
          disc.position.set(0.072, -0.018, z)
          disc.rotation.y = Math.PI / 2
          m.add(disc)
          drone3.discs.push(disc)
        }
      })
      // Flying behind him: round an ellipse behind his head (centimetres from it: 38 to either side, 26 to 46
      // behind), a little above his shoulders, bobbing; a loop takes about 8 s, a little faster and slower in turn.
      const PATROL = { A: 38, Y: 4, Z: -36, B: 10, SPEED: 0.75 }
      const patrolPoint = (ph) => sova.patrol.anchor.clone().add(new THREE.Vector3(Math.sin(ph) * PATROL.A, PATROL.Y + Math.sin(ph * 2 + 0.7) * 4, PATROL.Z - Math.cos(ph) * PATROL.B))
      // Where it comes in from and leaves to: up and out of the box on a side.
      const patrolOff = (side) => headAt().add(new THREE.Vector3(side * 110, 55, -40))
      // A quadratic curve's point and direction.
      const bez = (a, c, b, k) => a.clone().multiplyScalar((1 - k) ** 2).addScaledVector(c, 2 * k * (1 - k)).addScaledVector(b, k * k)
      const bezDir = (a, c, b, k) => c.clone().sub(a).multiplyScalar(1 - k).addScaledVector(b.clone().sub(c), k)
      // A curve's middle point round his side, from a point behind him to one beside his head (either way): wide
      // enough that it never crosses him.
      const roundSide = (a, b, side, head) => new THREE.Vector3(head.x + side * Math.max(Math.abs(a.x - head.x), Math.abs(b.x - head.x), 42), Math.max(a.y, b.y) + 12, (a.z + b.z) / 2)

      function startDrone(now, from) {
        if (sova.drone) return
        const f = faceBox()
        // Flying behind him: that drone comes, round the side it's on.
        if (sova.patrol.amt >= 1 && drone3.root.visible) {
          const at = drone3.root.position.clone()
          sova.drone = { t0: now - DRONE.OPEN * 1000, from: at, side: Math.sign(at.x - headAt().x) || 1, patrol: true, darted: false }
        } else {
          const side = f.c.x > 0.5 ? -1 : 1
          const start = from || at3(clamp01(f.c.x + side * f.w * 1.6), clamp01(f.c.y - f.w * 2.2), 12)
          sova.drone = { t0: now, from: start, side, patrol: false, darted: false }
          vfx.spawn(SOVA.C.equip, (v) => v.copy(start), { scale: DRONE_K / 100, dur: 0.05 })
          sfx.play("sova-drone-open", { pan: pan3(start) })
        }
        sova.maskUntil = now + (DRONE.END + 0.5) * 1000
      }
      const droneEye = () => (drone3.model ? drone3.model.localToWorld(DRONE_EYE.clone()) : new THREE.Vector3())
      function updateDrone(now, dt) {
        const P = sova.patrol
        const head = headAt()
        const T = now / 1000
        P.amt = THREE.MathUtils.clamp(P.amt + (P.want && mode === "sova" ? dt / 1.6 : -dt / 1.2), 0, 1)
        if (P.amt > 0) {
          // His head, followed slowly, so it doesn't jerk along with every nod.
          if (!P.anchor) {
            P.anchor = head.clone()
            P.side = Math.sign(Math.sin(P.ph)) || 1
          }
          P.anchor.lerp(head, 1 - Math.exp(-dt * 2))
          if (!sova.drone) P.ph += dt * PATROL.SPEED * (0.75 + 0.25 * Math.sin(T * 0.43))
        } else P.anchor = null
        const d = sova.drone
        let p, ahead, s = 1
        if (d) {
          const t = (now - d.t0) / 1000
          if (t > DRONE.END) {
            sova.drone = null
            return updateDrone(now, 0)
          }
          const hover = head.clone().add(new THREE.Vector3(d.side * 23, 9, 8))
          // Back to its loop behind him, or off and away.
          const back = P.amt > 0
          const away = back ? patrolPoint(P.ph) : head.clone().add(new THREE.Vector3(d.side * 95, 50, -25))
          // Up from the hands in an arc (from behind him, round his side), then hovering (bobbing), then off;
          // facing the camera as it opens, then where it flies, him while it hovers, and where it goes.
          if (t < DRONE.OPEN) {
            p = d.from.clone()
            ahead = new THREE.Vector3(0, 0, 1)
            s = easeOutBack(t / DRONE.OPEN)
          } else if (t < DRONE.FLY) {
            const k = ease((t - DRONE.OPEN) / (DRONE.FLY - DRONE.OPEN))
            const ctl = d.patrol ? roundSide(d.from, hover, d.side, head) : d.from.clone().lerp(hover, 0.5).add(new THREE.Vector3(-d.side * 6, 22, 6))
            p = bez(d.from, ctl, hover, k)
            // The curve's direction, turning towards him as it arrives.
            ahead = bezDir(d.from, ctl, hover, k).setY(0).normalize().lerp(head.clone().sub(p).setY(0).normalize(), k * k)
          } else if (t < DRONE.LEAVE) {
            p = hover.clone()
            ahead = head.clone().sub(p)
          } else {
            const k = ease((t - DRONE.LEAVE) / (DRONE.END - DRONE.LEAVE))
            const ctl = back ? roundSide(away, hover, d.side, head) : hover.clone().lerp(away, 0.5)
            p = bez(hover, ctl, away, k)
            ahead = bezDir(hover, ctl, away, k).setY(0)
          }
        } else if (P.amt > 0) {
          const k = ease(P.amt)
          const on = patrolPoint(P.ph)
          const off = patrolOff(P.side)
          p = off.clone().lerp(on, k)
          // Along its loop, turned a little towards the camera (its eyes show more), or where it's going as it
          // comes in or leaves.
          const along = new THREE.Vector3(Math.cos(P.ph) * PATROL.A, 0, Math.sin(P.ph) * PATROL.B).normalize().add(new THREE.Vector3(0, 0, 0.5))
          const going = (P.want ? on.clone().sub(off) : off.clone().sub(on)).setY(0).normalize()
          ahead = along.normalize().multiplyScalar(k).addScaledVector(going, 1 - k)
        } else {
          drone3.root.visible = false
          drone3.eyes?.stop()
          drone3.eyes = null
          drone3.hum?.stop(0.3)
          drone3.hum = null
          return
        }
        if (!drone3.model) return
        p.y += Math.sin(T * 3.1) * 0.8
        drone3.root.position.copy(p)
        drone3.root.scale.setScalar(Math.max(1e-3, s))
        if (ahead.lengthSq() < 1e-6) ahead.set(0, 0, 1)
        drone3.root.lookAt(p.clone().add(ahead.normalize()))
        drone3.root.rotateZ(Math.sin(T * 2.3) * 0.08)
        drone3.root.visible = true
        for (const c of drone3.discs) c.rotateZ(dt * 38)
        drone3.root.updateMatrixWorld(true)
        // Behind him once it's a hand's breadth behind his face: he covers it, and its eyes' glow (drawn over
        // everything) waits until it comes out.
        drone3.behind = p.z < head.z - 10
        // Its propellers, quieter behind him and while it flies round on its own.
        drone3.hum ||= sfx.play("sova-drone-idle", { loop: true, gain: 0 })
        drone3.hum.set({ gain: (drone3.behind ? 0.45 : 1) * Math.min(1, s) * (d ? 1 : 0.6 * ease(P.amt)), pan: pan3(p) })
        if (!drone3.behind && !drone3.eyes) {
          const sys = [0.025, -0.025].map((z) => vfx.spawn(SOVA.C.eye, (v) => v.copy(drone3.model.localToWorld(new THREE.Vector3(DRONE_EYE.x, DRONE_EYE.y, z))), { scale: DRONE_K / 100 }))
          drone3.eyes = { stop: () => sys.forEach((x) => x.stop()) }
        } else if (drone3.behind && drone3.eyes) {
          drone3.eyes.stop()
          drone3.eyes = null
        }
        if (!d) return
        const t = (now - d.t0) / 1000
        // The dart: from the eye to his face; it reveals him as it hits, and again a second later.
        if (t >= DRONE.DART && !d.darted) {
          d.darted = true
          const at = droneEye(), to = head.clone().add(new THREE.Vector3(0, 0, 6))
          const dart = { p: at.clone(), t0: now }
          const dir = to.clone().sub(at).normalize()
          const sys = vfx.spawn(SOVA.C.dart, (v) => v.copy(dart.p), { scale: 1, dir: () => dir })
          d.dartFly = { dart, at, to, sys }
          sfx.play("sova-drone-dart", { pan: pan3(at) })
        }
        if (d.dartFly) {
          const f = d.dartFly
          const k = Math.min(1, (now - f.dart.t0) / 150)
          f.dart.p.copy(f.at).lerp(f.to, k)
          if (k >= 1) {
            f.sys.stop()
            vfx.spawn(SOVA.C.hit, (v) => v.copy(f.to), { scale: 0.3, dur: 0.05 })
            sfx.play("sova-drone-tag", { pan: pan3(f.to) })
            shake(160, 4, now)
            reveal(now)
            d.revealAgain = now + 1100
            d.dartFly = null
          }
        }
        if (d.revealAgain && now >= d.revealAgain) {
          reveal(now)
          sfx.play("sova-drone-pulse", { pan: pan3(head), gain: 0.8 })
          d.revealAgain = 0
        }
      }

      function sovaReset() {
        vfx.clear()
        sova.bow.fx = drone3.eyes = drone3.hum = bowSnd = null
        Object.assign(sova, { arrow: null, dart: null, ult: null, drone: null, reveals: [], shakeUntil: 0, fists: 0 })
        Object.assign(sova.bow, { state: "idle", auto: 0, amt: 0, draw: 0, g: null })
        Object.assign(sova.patrol, { amt: 0, anchor: null })
        bow3.root.visible = drone3.root.visible = flying.visible = stuck.visible = false
        uniforms.uReveal.value = uniforms.uMark.value.z = 0
        uniforms.uUltT.value = -1
      }

      function updateSova(now, dt) {
        const u = uniforms
        const bow = sova.bow
        const f = faceBox()
        // The dock's bow: drawn over 0.6 s, then shot.
        if (bow.auto && now - bow.auto > 750) shoot(bow.kind, now)
        // The ultimate: the bow out for its three shots, each charged 0.9 s.
        const ult = sova.ult
        let ultDraw = 0
        if (ult) {
          const t = (now - ult.t0) / 1000
          if (t > ULT.END) {
            ult.sys.stop()
            vfx.spawn(SOVA.X.outro, (v) => v.copy(bowPt(-0.05, 0)), { scale: bow3.k / 100, dur: 0.05 })
            ult.hum.stop(0.3)
            sfx.play("sova-ult-end", { pan: ult.pan })
            sova.ult = null
          } else {
            const next = ULT.SHOTS[ult.fired]
            if (next !== undefined) {
              const c = (t - (next - ULT.CHARGE)) / ULT.CHARGE
              if (c >= 0 && ult.charging !== ult.fired) {
                ult.charging = ult.fired
                // Its third-person effect, made to read from across a map: smaller here.
                ult.charge = vfx.spawn(SOVA.X.charge, (v) => v.copy(arrowTip()), { scale: 0.12 })
                ult.aim = vfx.spawn(SOVA.X.aim, (v) => v.copy(arrowTip()), { scale: 1, beam: () => [arrowTip(), ultEnd()] })
                sfx.play("sova-ult-charge", { pan: ult.pan })
              }
              ultDraw = THREE.MathUtils.clamp(c, 0, 1)
              if (t >= next) {
                ult.charge?.stop()
                ult.aim?.stop()
                const a = arrowTip(), b = ultEnd()
                vfx.spawn(SOVA.X.blast, (v) => v.copy(a), { scale: 0.32, dur: 0.05, beam: () => [a, b] })
                sfx.play("sova-ult-fire", { pan: ult.pan })
                shake(320, 13, now)
                ult.fired++
              }
            }
          }
        }
        // How much of the bow shows and how far it's drawn.
        const held = bow.state === "draw" || !!sova.ult
        bow.amt = THREE.MathUtils.clamp(bow.amt + (held ? dt / 0.18 : -dt / 0.25), 0, 1)
        if (sova.ult) bow.draw = ultDraw
        else if (bow.state === "draw" && bow.auto) bow.draw = Math.min(1, bow.draw + dt / 0.5)
        else if (bow.state === "draw") {
          // By gesture: as far as the hands have parted, from where the fists met to a full draw at the bow's
          // biggest.
          const d = at3(bow.a.x, bow.a.y, 10).distanceTo(at3(bow.b.x, bow.b.y, 10))
          bow.d0 ??= Math.max(d, -BOW.REST * BOW_K * 0.7)
          const full = (-BOW.REST + BOW.PULL) * BOW_K * BOW_FIT
          bow.draw = THREE.MathUtils.clamp((d - bow.d0) / Math.max(5, full - bow.d0), 0, 1)
        } else bow.draw = Math.max(0, bow.draw - dt / 0.06)
        // The charge's tick at half and at full draw, the hum following the bow.
        if (bowSnd && !sova.ult) {
          const lvl = bow.draw >= 0.98 ? 2 : bow.draw >= 0.5 ? 1 : 0
          const pan = panAt(bow.a.x)
          if (lvl > bowSnd.lvl) sfx.play("sova-charge-level", { pan, gain: 0.8 })
          bowSnd.lvl = Math.max(bowSnd.lvl, lvl)
          bowSnd.hum.set({ pan })
        }
        const kind = sova.ult ? (ultDraw > 0 ? "ult" : null) : bow.state === "idle" ? null : bow.kind
        placeBowNow(kind)
        if (bow3.glow) bow3.glow.color.setRGB(0.35, 0.85, 1).multiplyScalar(sova.ult ? 1.6 : 1)
        // While it's drawn: zaps on the string, the glow on the head (the shock's lightning instead).
        const showFx = bow.amt > 0.5 && kind && kind !== "ult"
        if (showFx && !bow.fx) {
          const k = bow3.k / 100
          bow.fx = [
            vfx.spawn(SOVA.E.string, (v) => v.copy(bowPt(BOW.REST - BOW.PULL * bow.draw, BOW.LINE)), { scale: k, beam: () => [bowPt(BOW.REST - BOW.PULL * bow.draw, BOW.LINE), bowPt(-0.375, 0.816)] }),
            vfx.spawn(SOVA.E.string, (v) => v.copy(bowPt(BOW.REST - BOW.PULL * bow.draw, BOW.LINE)), { scale: k, beam: () => [bowPt(BOW.REST - BOW.PULL * bow.draw, BOW.LINE), bowPt(-0.375, -0.706)] }),
            vfx.spawn(kind === "choque" ? SOVA.Q.held : SOVA.E.tip, (v) => v.copy(arrowTip()), { scale: k }),
          ]
        } else if (!showFx && bow.fx) {
          bow.fx.forEach((s) => s.stop())
          bow.fx = null
        }

        // The arrow in flight, leg by leg.
        flying.visible = false
        const a = sova.arrow
        if (a) {
          let t = now - a.t0
          let leg = 0
          while (leg < a.legs.length && t > a.legs[leg]) t -= a.legs[leg++]
          if (leg > a.leg) {
            // A bounce (the shock's ricochet off the top of the box).
            if (leg < a.legs.length) {
              vfx.spawn(SOVA.Q.ricochet, ((p) => (v) => v.copy(p))(a.pts[leg].clone()), { scale: 0.12, dur: 0.05 })
              sfx.play("sova-shock-ricochet", { pan: pan3(a.pts[leg]) })
            }
            a.leg = leg
          }
          if (leg >= a.legs.length) finishArrow(a, now)
          else {
            const p0 = a.pts[leg], p1 = a.pts[leg + 1]
            a.dir.copy(p1).sub(p0).normalize()
            a.at.copy(p0).lerp(p1, t / a.legs[leg])
            const m = flying.getObjectByName(a.kind)
            if (m) {
              flying.children.forEach((c) => (c.visible = c === m))
              // The arrow's head at `at`, pointing along the leg.
              m.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), a.dir)
              m.scale.setScalar(a.k)
              m.position.copy(a.at).addScaledVector(a.dir, -ARROW_LEN * a.k)
              flying.visible = true
            }
          }
        }

        // The Recon Bolt where it landed: its head spinning, two sonar pulses that reveal him as they pass.
        stuck.visible = false
        const dt0 = sova.dart
        if (dt0) {
          const t = (now - dt0.t0) / 1000
          if (t > DART_LIFE) endDart(dt0)
          else {
            stuck.visible = true
            if (stuckArrow) {
              stuckArrow.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), dt0.dir)
              stuckArrow.scale.setScalar(dt0.k)
              stuckArrow.position.copy(dt0.tip).addScaledVector(dt0.dir, -ARROW_LEN * dt0.k * 0.85)
            }
            reconHead.scale.setScalar(dt0.k)
            reconHead.position.copy(dt0.tip).addScaledVector(dt0.dir, -2)
            reconHead.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), dt0.dir)
            reconHead.rotateX(t * 6.3)
            const d = headAt().distanceTo(dt0.tip)
            PULSES.forEach((p, i) => {
              if (t >= p && !dt0.pulsed[i]) {
                dt0.pulsed[i] = true
                // Its ring grows to 30 × 8 game centimetres across in a second: scaled to reach 1.3 times as far as
                // his head, which it crosses 0.63 s in (where its size curve passes 6.15).
                vfx.spawn(SOVA.E.pulse, (v) => v.copy(dt0.tip), { scale: (2.6 * d) / 240, dur: 0.05 })
                sfx.play("sova-recon-ping", { pan: pan3(dt0.tip) })
                dt0.ringAt[i] = now + 634
              }
              if (dt0.ringAt[i] && now >= dt0.ringAt[i]) {
                reveal(now)
                dt0.ringAt[i] = 0
              }
            })
          }
        }
        updateDrone(now, dt)

        // The red reveal: each flash fades over 0.9 s; the marker over the head while it shows.
        sova.reveals = sova.reveals.filter((r) => now - r < 1600)
        let rv = 0
        for (const r of sova.reveals) rv = Math.max(rv, Math.exp(-(now - r) / 600))
        u.uReveal.value = rv
        const markAt = new THREE.Vector2(f.top.x, Math.min(0.94, f.top.y + f.h * 0.7))
        u.uMark.value.set(markAt.x, markAt.y, rv > 0.15 ? Math.min(1, rv * 1.5) : 0)
        u.uUltT.value = sova.ult ? (now - sova.ult.t0) / 1000 : -1
      }
      // Where the ultimate's shot goes: out of the box along the bow, a little past the edge.
      function ultEnd() {
        const tip = arrowTip()
        const from = onBox(tip)
        const dir2 = onBox(tip.clone().add(bowAxis)).sub(from).normalize()
        const e = toEdge(from, dir2, -0.1)
        return at3(e.x, e.y, tip.z - (headSeen ? headPos.z : -65))
      }
      // The Recon Bolt lands: the flash, its glows and arcs while it sits there.
      function land(tip, dir, k, now) {
        // One stuck at a time: a new one breaks the one before (its glow and arcs would stay on forever).
        if (sova.dart) endDart(sova.dart)
        vfx.spawn(SOVA.E.impact, (v) => v.copy(tip), { scale: 0.3, dur: 0.05 })
        const dart = { tip: tip.clone(), dir, k, t0: now, pulsed: [], ringAt: [] }
        dart.sys = vfx.spawn(SOVA.E.stuck, (v) => v.copy(dart.tip), { scale: 0.3 })
        sfx.play("sova-recon-hit", { pan: pan3(tip) })
        dart.snd = sfx.play("sova-recon-deployed", { pan: pan3(tip), gain: 0.8 })
        sova.dart = dart
      }
      function endDart(dart) {
        dart.sys.stop()
        vfx.spawn(SOVA.E.destroyed, (v) => v.copy(dart.tip), { scale: 0.3, dur: 0.05 })
        dart.snd.stop(0.2)
        sfx.play("sova-recon-end", { pan: pan3(dart.tip) })
        sova.dart = null
      }

      // ---------- the cars on the face: Octane, Fennec ----------
      // Rocket League's cars by Jako (CC BY 4.0, public/models/) as Luan's head, Pixar-style: seen a little from
      // above, turning with the head, his own eyes on the windshield and his mouth on the bumper, cut from the
      // camera every frame (so it blinks and talks). The models face +x with +y up.
      const CARS = { octane: { url: "../models/octane.glb" }, fennec: { url: "../models/fennec.glb" } }
      const CAR_W = Number(q.get("carro") || 26)
      const CAR_PITCH = THREE.MathUtils.degToRad(Number(q.get("inclinacao") ?? 10))
      const CAR_LEN = Number(q.get("comprimento") || 0.6)
      // ?perfil=: its length seen from the side (the head is deeper than it's wide).
      const CAR_LEN_SIDE = Number(q.get("perfil") || 0.85)
      const CAR_AT = (q.get("posicao") || "0,0.5,-8").split(",").map(Number)
      // An eye's height for its width (the camera's cut has the same shape).
      const EYE_H = 0.75
      // Reflections for the paint, from a neutral room.
      let carEnv = null
      // A neutral room's reflections (the cars' paint, Sova's bow and drone), made once.
      function roomEnv() {
        if (!carEnv) {
          const pm = new THREE.PMREMGenerator(renderer)
          carEnv = pm.fromScene(new RoomEnvironment(), 0.04).texture
          pm.dispose()
        }
        return carEnv
      }
      // The eyes and the mouth, cut from the camera into one small canvas: the eyes side by side over the mouth.
      const partsCanvas = document.createElement("canvas")
      partsCanvas.width = 512
      partsCanvas.height = 256
      const partsCtx = partsCanvas.getContext("2d")
      const partsTex = new THREE.CanvasTexture(partsCanvas)
      partsTex.colorSpace = THREE.NoColorSpace
      partsTex.minFilter = THREE.LinearFilter
      partsTex.generateMipmaps = false
      // A part: an ellipse of the canvas, with a dark rim like a cartoon's line.
      function partMat(rect) {
        return new THREE.ShaderMaterial({
          uniforms: { uTex: { value: partsTex }, uRect: { value: new THREE.Vector4(...rect) } },
          vertexShader: /* glsl */ `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
          fragmentShader: /* glsl */ `
            uniform sampler2D uTex;
            uniform vec4 uRect;
            varying vec2 vUv;
            void main() {
              float e = length((vUv - 0.5) * 2.0);
              if (e > 1.0) discard;
              vec3 c = texture2D(uTex, uRect.xy + vUv * uRect.zw).rgb;
              c = mix(c, vec3(0.03, 0.03, 0.08), smoothstep(0.85, 0.89, e));
              gl_FragColor = vec4(c, smoothstep(1.0, 0.96, e));
            }`,
          transparent: true,
          depthWrite: false,
          polygonOffset: true,
          polygonOffsetFactor: -4,
          polygonOffsetUnits: -4,
        })
      }
      for (const [id, c] of Object.entries(CARS)) {
        Object.assign(c, { id, amt: 0, ready: false, group: new THREE.Group(), body: new THREE.Group(), boom: -1, flip: -1, shown: 0, s: 1, len: CAR_LEN })
        c.group.visible = false
        c.group.add(c.body)
        head.add(c.group)
        new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load(c.url, (gltf) => buildCar(c, gltf.scene), undefined, (e) => fail(id, e))
      }
      const carList = Object.values(CARS)
      function buildCar(c, m) {
        roomEnv()
        m.updateMatrixWorld(true)
        const meshes = []
        m.traverse((o) => {
          if (!o.isMesh) return
          meshes.push(o)
          if (o.material.map) o.material.map.colorSpace = THREE.NoColorSpace
          o.material.envMap = carEnv
          // A dark, quiet windshield, so the eyes on it read.
          if (/Window/.test(o.material.name)) Object.assign(o.material, { envMapIntensity: 0.25, roughness: 0.6, color: new THREE.Color(0x0b1020) })
        })
        const box = new THREE.Box3().setFromObject(m)
        const size = box.getSize(new THREE.Vector3())
        const center = box.getCenter(new THREE.Vector3())
        const inner = new THREE.Group()
        inner.position.copy(center).multiplyScalar(-1)
        inner.add(m)
        // The windshield: the glass facing forward and up (its centre, its normal, how wide it is).
        const ws = { at: new THREE.Vector3(), n: new THREE.Vector3(), area: 0, zMin: Infinity, zMax: -Infinity }
        const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3(), N = new THREE.Vector3(), E = new THREE.Vector3()
        for (const o of meshes.filter((o) => /Window/.test(o.material.name))) {
          const pos = o.geometry.getAttribute("position")
          const idx = o.geometry.index
          const count = idx ? idx.count : pos.count
          for (let t = 0; t < count; t += 3) {
            const [i, j, k] = idx ? [idx.getX(t), idx.getX(t + 1), idx.getX(t + 2)] : [t, t + 1, t + 2]
            A.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld)
            B.fromBufferAttribute(pos, j).applyMatrix4(o.matrixWorld)
            C.fromBufferAttribute(pos, k).applyMatrix4(o.matrixWorld)
            N.subVectors(B, A).cross(E.subVectors(C, A))
            const area = N.length() / 2
            if (!area) continue
            N.normalize()
            if (N.y < 0) N.negate()
            if (N.x < 0.3 || N.y < 0.25) continue
            ws.zMin = Math.min(ws.zMin, A.z, B.z, C.z)
            ws.zMax = Math.max(ws.zMax, A.z, B.z, C.z)
            ws.at.addScaledVector(A.add(B).add(C), area / 3)
            ws.n.addScaledVector(N, area)
            ws.area += area
          }
        }
        const eyeAt = ws.area ? ws.at.divideScalar(ws.area) : new THREE.Vector3(center.x + size.x * 0.1, box.max.y - size.y * 0.2, center.z)
        const eyeN = ws.area ? ws.n.normalize() : new THREE.Vector3(0.6, 0.8, 0).normalize()
        const eyeW = ws.area ? ws.zMax - ws.zMin : size.z * 0.6
        // The mouth: on the front, a little above the bottom, where a ray from ahead meets it.
        const mouthY = box.min.y + size.y * 0.27
        const hit = new THREE.Raycaster(new THREE.Vector3(box.max.x + 100, mouthY, center.z), new THREE.Vector3(-1, 0, 0)).intersectObjects(meshes, false)[0]
        const mouthAt = hit ? hit.point.clone() : new THREE.Vector3(box.max.x, mouthY, center.z)
        // Screen right once the car faces the camera is the model's −z.
        const right = new THREE.Vector3(0, 0, -1)
        const along = (n) => right.clone().addScaledVector(n, -right.dot(n)).normalize()
        const patch = (at, n, w, h, rect, out = 0.6) => {
          const r = along(n)
          const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), partMat(rect))
          p.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(r, new THREE.Vector3().crossVectors(n, r), n))
          p.position.copy(at).addScaledVector(n, out)
          p.renderOrder = 2
          inner.add(p)
        }
        // The eyes face halfway between the glass and straight ahead, so they stay round seen from the front, a
        // little up the glass and out of it so the hood doesn't cut them; at least big enough to read on a small
        // windshield like the Octane's.
        const span = Math.max(eyeW, size.z * 0.62)
        const ew = span * 0.44
        const en = eyeN.clone().add(new THREE.Vector3(1, 0, 0)).normalize()
        const r = along(en)
        const at = eyeAt.clone().addScaledVector(new THREE.Vector3().crossVectors(en, r), ew * EYE_H * 0.22)
        patch(at.clone().addScaledVector(r, -span * 0.245), en, ew, ew * EYE_H, [0, 0.5, 0.5, 0.5], 3)
        patch(at.clone().addScaledVector(r, span * 0.245), en, ew, ew * EYE_H, [0.5, 0.5, 0.5, 0.5], 3)
        const mw = size.z * 0.36
        patch(mouthAt, new THREE.Vector3(1, 0, 0), mw, mw * 0.46, [0, 0, 1, 0.5])
        // CAR_W cm across, facing the camera, its length shortened a little (less perspective, more cartoon).
        const s = CAR_W / size.z
        c.body.rotation.y = -Math.PI / 2
        c.s = s
        c.body.scale.set(s * CAR_LEN, s, s)
        c.body.add(inner)
        c.group.position.set(...CAR_AT)
        c.ready = true
      }
      // His eyes (with the brows) and mouth from the camera, levelled (the car leans with the head by itself).
      function drawParts() {
        const vw = video.videoWidth
        const vh = video.videoHeight
        const P = (i) => [faceLm[i].x * vw, faceLm[i].y * vh]
        const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]
        const len = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1])
        const eyes = [
          [33, 133],
          [362, 263],
        ]
          .map(([i, j]) => ({ c: mid(P(i), P(j)), w: len(P(i), P(j)) }))
          .sort((a, b) => a.c[0] - b.c[0])
        const ang = Math.atan2(eyes[1].c[1] - eyes[0].c[1], eyes[1].c[0] - eyes[0].c[0])
        const up = [Math.sin(ang), -Math.cos(ang)]
        const ctx = partsCtx
        const cut = (cx, cy, w, h, dx, dy, dw, dh) => {
          ctx.save()
          ctx.filter = "brightness(1.15) contrast(1.12) saturate(1.1)"
          ctx.beginPath()
          ctx.rect(dx, dy, dw, dh)
          ctx.clip()
          ctx.translate(dx + dw / 2, dy + dh / 2)
          ctx.scale(dw / w, dh / h)
          ctx.rotate(-ang)
          ctx.translate(-cx, -cy)
          ctx.drawImage(video, 0, 0, vw, vh)
          ctx.restore()
        }
        eyes.forEach((e, i) => {
          const w = e.w * 2.2
          cut(e.c[0] + up[0] * e.w * 0.15, e.c[1] + up[1] * e.w * 0.15, w, w * EYE_H, i * 256, 0, 256, 128)
        })
        const mc = mid(mid(P(61), P(291)), mid(P(0), P(17)))
        const mw = len(P(61), P(291)) * 1.7
        cut(mc[0], mc[1], mw, mw * 0.46, 0, 128, 512, 128)
        partsTex.needsUpdate = true
      }
      function updateCars(now) {
        for (const c of carList) {
          c.group.visible = c.amt > 0 && c.ready
          if (!c.group.visible) continue
          let k = easeOutBack(c.amt)
          // Demolished: gone for 2.2 s, then back with a pop.
          if (c.boom >= 0) {
            const t = (now - c.boom) / 1000
            k *= t < 0.06 ? 1 - t / 0.06 : t < 2.2 ? 0 : easeOutBack(Math.min(1, (t - 2.2) / 0.35))
            if (t > 2.6) c.boom = -1
          }
          // Flip: like a dodge in the game, a hop up, a front flip at the top and a little squash landing.
          let flip = 0, hop = 0, squash = 1
          if (c.flip >= 0) {
            const t = (now - c.flip) / 700
            if (t < 1) {
              hop = Math.sin(Math.min(1, t / 0.85) * Math.PI) * CAR_W * 0.35
              const f = THREE.MathUtils.clamp((t - 0.12) / 0.6, 0, 1)
              flip = (f < 0.5 ? 4 * f ** 3 : 1 - (-2 * f + 2) ** 3 / 2) * Math.PI * 2
              squash = t > 0.85 ? 1 - Math.sin(((t - 0.85) / 0.15) * Math.PI) * 0.12 : 1
            } else c.flip = -1
          }
          c.group.scale.set(Math.max(k, 1e-4), Math.max(k * squash, 1e-4), Math.max(k, 1e-4))
          c.group.position.set(CAR_AT[0], CAR_AT[1] + hop, CAR_AT[2])
          // It flips about the car's own crosswise axis (screen x once it faces the camera).
          c.group.rotation.x = CAR_PITCH + flip
          c.shown = Math.min(1, k)
          // Longer as he turns: short from the front (more cartoon), but from the side long enough to cover his
          // head from the nose to the back of his hair.
          const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(headQuat)
          const side = Math.min(1, Math.abs(fwd.x))
          c.len += ((CAR_LEN + (CAR_LEN_SIDE - CAR_LEN) * side) - c.len) * 0.3
          c.body.scale.x = c.s * c.len
        }
        // The explosion follows where the car was.
        const c = carList.find((c) => c.boom >= 0)
        uniforms.uBoomT.value = -1
        if (c && headSeen) {
          const t = (now - c.boom) / 1000
          if (t < 2.4) {
            c.group.updateWorldMatrix(true, false)
            const at = c.group.getWorldPosition(new THREE.Vector3())
            const p = at.clone().project(headCam)
            const q2 = at.clone().add(new THREE.Vector3(CAR_W / 2, 0, 0)).project(headCam)
            uniforms.uBoom.value.set(p.x * 0.5 + 0.5, p.y * 0.5 + 0.5, Math.max(0.05, (Math.abs(q2.x - p.x) / 2) * ASPECT))
            uniforms.uBoomT.value = t
          }
        }
      }
      // With the game's sounds: the demolition's blast; the flip's jump, then its dodge.
      function demo(now) {
        const c = CARS[mode]
        if (!c || c.boom >= 0) return
        c.boom = now
        sfx.play("carro-demo", { pan: panAt(faceBox().c.x) })
      }
      function flipCar(now) {
        const c = CARS[mode]
        if (!c || c.flip >= 0 || c.boom >= 0) return
        c.flip = now
        const pan = panAt(faceBox().c.x)
        sfx.play("carro-pulo", { pan, gain: 0.7 })
        sfx.play("carro-flip", { pan, delay: 0.08 })
      }

      // ---------- models ----------
      let gestures, segmenter, faces, poses, delegate
      async function loadModels() {
        const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.2/wasm")
        const make = async (Task, path, opts, d) =>
          Task.createFromOptions(files, { baseOptions: { modelAssetPath: MODELS + path, delegate: d }, runningMode: "VIDEO", ...opts })
        const all = async (d) => {
          delegate = d
          return Promise.all([
            make(GestureRecognizer, "gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task", { numHands: 2 }, d),
            make(
              ImageSegmenter,
              "image_segmenter/selfie_segmenter_landscape/float16/latest/selfie_segmenter_landscape.tflite",
              { outputConfidenceMasks: true, outputCategoryMask: false },
              d,
            ),
            make(FaceLandmarker, "face_landmarker/face_landmarker/float16/1/face_landmarker.task", { numFaces: 1, outputFacialTransformationMatrixes: true }, d),
            make(PoseLandmarker, "pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", { numPoses: 1 }, d),
          ])
        }
        try {
          ;[gestures, segmenter, faces, poses] = await all(q.has("cpu") ? "CPU" : "GPU")
        } catch (e) {
          console.warn("GPU failed, trying CPU", e)
          ;[gestures, segmenter, faces, poses] = await all("CPU")
        }
      }

      // ---------- state ----------
      const MODES = ["bola", "phoenix", "sova", "octane", "fennec", "pop", "lente"]
      let mode = MODES.includes(q.get("modo")) ? q.get("modo") : "nenhum"
      let pop = 0
      let ballIn = 0
      const ms = { gesto: 0, corpo: 0, rosto: 0, ombros: 0 }
      const fire = { on: false, demo: false, amt: 0, at: new THREE.Vector3(0.5, 0.35, 0.1), lastOn: -1e9 }
      const bang = { t0: -1, key: null, startX: 0, hand: new THREE.Vector2(0.75, 0.45), thrown: false }
      const snaps = new Map()
      let faceLm = null
      let videoFrames = 0
      const lens = { amt: 0, pts: [0, 1, 2, 3].map(() => new THREE.Vector2(0.5, 0.5)), on: false }
      let prevMask = null
      let energy = 0
      const prevHands = new Map()
      let pushes = []
      let handInfo = ""

      // Each filter's sounds, by their cues' prefix.
      const SONS = { phoenix: "phoenix-", sova: "sova-", octane: "carro-", fennec: "carro-" }
      function setMode(m) {
        const before = mode
        mode = MODES.includes(m) ? m : "nenhum"
        titulo.classList.toggle("on", mode === "pop")
        // A new filter silences the last one's and decodes its own.
        if (mode !== before) sfx.stopAll(0.25)
        if (SONS[mode]) {
          sfx.preload(SONS[mode])
          sfx.keep(SONS[mode])
        }
        // Each agent's abilities go with him.
        if (mode !== "phoenix") {
          bang.t0 = -1
          uniforms.uOrbAmt.value = uniforms.uFlashAmt.value = 0
          phxReset()
        }
        if (mode !== "sova") sovaReset()
        // Each agent's effects' textures, loaded as he comes on.
        if (mode === "phoenix") vfx.preload(PHX)
        if (mode === "sova") vfx.preload(SOVA)
      }
      // A one-off, from the dock or a key: only for the filter that has it.
      function acao(a) {
        const now = performance.now()
        if (mode === "phoenix") {
          if (a === "flash") startBang(...handAt(1), null)
          else ({ molotov: startHotHands, blaze: startBlaze, ult: startRunItBack })[a]?.(now)
        }
        if (mode === "sova") ({ recon: () => autoBow("recon", now), choque: () => autoBow("choque", now), drone: () => startDrone(now), ult: () => startUlt(now) })[a]?.()
        if (CARS[mode]) ({ demo, flip: flipCar })[a]?.(now)
      }
      // The dock's word (obs-browser's emit_event): the filter that should be on with its options (Sova's drone
      // flying behind him), or a one-off.
      addEventListener("muanlartins-filtro", ({ detail }) => {
        if (detail?.filtro && detail.filtro !== mode) setMode(detail.filtro)
        if (detail?.opcoes) {
          sova.patrol.want = !!detail.opcoes.patrulha
          // The dock's "Sons" switch (on unless it says mudo).
          sfx.on = !detail.opcoes.mudo
        }
        if (detail?.acao) acao(detail.acao)
      })
      addEventListener("keydown", (e) => {
        if (e.key === "1") setMode(mode === "pop" ? "nenhum" : "pop")
        if (e.key === "2") setMode(mode === "bola" ? "nenhum" : "bola")
        if (e.key === "3") setMode(mode === "phoenix" ? "nenhum" : "phoenix")
        if (e.key === "4") startBang(0.75, 0.45, null)
        if (e.key === "5") fire.demo = !fire.demo
        if (e.key === "6") setMode(mode === "lente" ? "nenhum" : "lente")
        if (e.key === "7") setMode(mode === "sova" ? "nenhum" : "sova")
        if (e.key === "8") setMode(mode === "octane" ? "nenhum" : "octane")
        if (e.key === "9") setMode(mode === "fennec" ? "nenhum" : "fennec")
        const k = e.key.toLowerCase()
        const keys = mode === "phoenix" ? { c: "blaze", q: "flash", e: "molotov", x: "ult" } : { e: "recon", q: "choque", c: "drone", x: "ult", d: "demo", f: "flip" }
        if (keys[k]) acao(keys[k])
        if (k === "p") sova.patrol.want = !sova.patrol.want
        if (k === "m") sfx.on = !sfx.on
        if (e.key === "0") setMode("nenhum")
      })
      setMode(mode)
      const DEBUG = q.has("debug")
      if (DEBUG) window.filtros = { get faceLm() { return faceLm }, toScreen, sova, AGENTS, CARS, uniforms, acao, vfx, sfx, phx, isOwl, handShape, bow3, drone3, SOVA, at3, get mode() { return mode } }

      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y)
      // Thumb and index out, the other fingers in: half of the lens's frame.
      function isL(h) {
        const palm = dist(h[0], h[9])
        return dist(h[8], h[5]) > 0.55 * palm && dist(h[4], h[8]) > 0.6 * palm && dist(h[12], h[0]) < 1.25 * palm && dist(h[16], h[0]) < 1.2 * palm
      }

      function runGestures(now) {
        const t0 = performance.now()
        // ?debug: window.__hands(now) can stand in for the tracker (made-up hands, for checking the gestures).
        const r = (DEBUG && window.__hands?.(now)) || gestures.recognizeForVideo(video, now)
        ms.gesto = performance.now() - t0
        const hands = r.landmarks || []
        lastHands = hands
        // The lens: both hands in an L, while it's the filter on.
        const ls = mode === "lente" ? hands.filter(isL) : []
        handInfo = `${hands.length} mão(s), ${ls.length} em L`
        if (mode === "phoenix") phoenixHands(r, now)
        if (mode === "sova") sovaHands(r, now)
        if (ls.length === 2) {
          ls.sort((a, b) => a[0].x - b[0].x)
          const [L, R] = ls
          const target = [L[8], R[8], R[4], L[4]].map((p) => toScreen(p.x, p.y))
          lens.pts.forEach((v, i) => v.lerp(new THREE.Vector2(...target[i]), lens.on ? 0.6 : 1))
          lens.on = true
        } else lens.on = false
        // Fast hands push Pop's shapes and stir its fire.
        pushes = []
        hands.forEach((h, i) => {
          const [sx, sy] = toScreen(h[9].x, h[9].y)
          const prev = prevHands.get(i)
          if (prev) {
            const v = Math.hypot(sx - prev[0], sy - prev[1]) * 30
            if (v > 0.6) pushes.push({ x: (sx - 0.5) * 2 * halfW, y: (sy - 0.5) * 2 * halfH, v: Math.min(v, 4) * 0.8 })
            energy = Math.max(energy, Math.min(1, v / 3))
          }
          prevHands.set(i, [sx, sy])
        })
        if (!hands.length) prevHands.clear()
      }

      function runBody(now) {
        const t0 = performance.now()
        smallCtx.drawImage(video, 0, 0, MW, MH)
        const r = segmenter.segmentForVideo(small, now)
        const m = r.confidenceMasks?.[0]
        if (m) {
          const f = m.getAsFloat32Array()
          let sum = 0, sx = 0, top = -1, diff = 0
          for (let y = 0; y < MH; y++) {
            let row = 0
            for (let x = 0; x < MW; x++) {
              const i = y * MW + x
              const v = f[i]
              const b = (v * 255) | 0
              if (prevMask) diff += Math.abs(b - prevMask[i])
              maskData[i] = b
              if (v > 0.5) {
                sum++
                sx += x
                row++
              }
            }
            if (top < 0 && row > MW * 0.03) top = y
          }
          prevMask = prevMask || new Uint8Array(MW * MH)
          prevMask.set(maskData)
          maskTex.needsUpdate = true
          maskFresh = true
          energy = Math.max(energy, Math.min(1, diff / (MW * MH * 255) / 0.02))
          if (sum > 50 && top >= 0) {
            const [cx, cy] = toScreen(sx / sum / MW, Math.min(1, top / MH + 0.14))
            uniforms.uCenter.value.lerp(new THREE.Vector2(cx, cy), 0.15)
          }
        }
        r.close()
        ms.corpo = performance.now() - t0
      }

      function runFace(now) {
        const t0 = performance.now()
        const r = faces.detectForVideo(video, now)
        const mat = r.facialTransformationMatrixes?.[0]
        if (mat) {
          const m = new THREE.Matrix4().fromArray(mat.data)
          const p = new THREE.Vector3(), qt = new THREE.Quaternion(), s = new THREE.Vector3()
          m.decompose(p, qt, s)
          if (headSeen) {
            headPos.lerp(p, 0.6)
            headQuat.slerp(qt, 0.6)
            headScale.lerp(s, 0.6)
          } else {
            headPos.copy(p)
            headQuat.copy(qt)
            headScale.copy(s)
          }
          headSeen = true
          head.matrix.compose(headPos, headQuat, headScale)
          faceLm = r.faceLandmarks?.[0] || null
          if (faceLm) faceOval(faceLm)
        } else {
          headSeen = false
          faceLm = null
        }
        ms.rosto = performance.now() - t0
      }

      // The face's oval on screen (forehead top, chin, cheeks), for painting over the hair around it.
      function faceOval(lm) {
        const P = (i) => {
          const [x, y] = toScreen(lm[i].x, lm[i].y)
          return new THREE.Vector2(x * (W / H), y)
        }
        const top = P(10), chin = P(152), l = P(234), r = P(454)
        const c = top.clone().add(chin).multiplyScalar(0.5)
        const up = top.clone().sub(chin)
        const ry = up.length() / 2
        up.normalize()
        uniforms.uFace.value.set(c.x / (W / H), c.y, l.distanceTo(r) / 2, ry)
        uniforms.uFaceUp.value.copy(up)
      }

      function runPose(now) {
        const t0 = performance.now()
        const r = poses.detectForVideo(video, now)
        const lm = r.landmarks?.[0]
        const world = r.worldLandmarks?.[0]
        if (lm && world && lm[11].visibility > 0.4 && lm[12].visibility > 0.4) {
          const l = new THREE.Vector2(...toScreen(lm[11].x, lm[11].y))
          const rr = new THREE.Vector2(...toScreen(lm[12].x, lm[12].y))
          const dz = (world[11].z - world[12].z) * 100
          if (pose.seen) {
            pose.left.lerp(l, 0.5)
            pose.right.lerp(rr, 0.5)
            pose.dz += (dz - pose.dz) * 0.5
          } else {
            pose.left.copy(l)
            pose.right.copy(rr)
            pose.dz = dz
          }
          pose.seen = true
          // The elbows, when they're in the picture (Phoenix's ultimate burns on them too).
          pose.elbows = [13, 14].map((i) => (lm[i].visibility > 0.5 ? new THREE.Vector2(...toScreen(lm[i].x, lm[i].y)) : null))
        } else pose.seen = false
        ms.ombros = performance.now() - t0
      }

      // Does the background plate match the frame? Compared where the mask says Luan isn't, in the frame's top
      // half: the mean difference evens out the camera's colours (uPlateFix), and what's left after it must be
      // small (the lattice's lines are a few levels off the blue; another picture is tens).
      function sampleBackground() {
        if (!plate.img) return
        const c = plate.canvas
        if (c.width !== MW || c.height !== MH) Object.assign(c, { width: MW, height: MH })
        const pctx = c.getContext("2d", { willReadFrequently: true })
        pctx.drawImage(plate.img, 0, 0, MW, MH)
        const px = smallCtx.getImageData(0, 0, MW, MH >> 1).data
        const pl = pctx.getImageData(0, 0, MW, MH >> 1).data
        const sum = [0, 0, 0]
        let n = 0
        for (let i = 0; i < px.length / 4; i += 2) {
          if (maskData[i] > 40) continue
          for (let k = 0; k < 3; k++) sum[k] += px[i * 4 + k] - pl[i * 4 + k]
          n++
        }
        if (n < 200) return
        const fix = sum.map((v) => v / n)
        let off = 0
        for (let i = 0; i < px.length / 4; i += 2) {
          if (maskData[i] > 40) continue
          for (let k = 0; k < 3; k++) off += Math.abs(px[i * 4 + k] - pl[i * 4 + k] - fix[k])
        }
        plate.off = off / n / 3
        plate.ok = plate.off < 12
        uniforms.uPlateFix.value.lerp(new THREE.Vector3(fix[0] / 255, fix[1] / 255, fix[2] / 255), 0.3)
      }

      function startBang(x, y, key) {
        if (bang.t0 >= 0) return
        Object.assign(bang, { t0: performance.now(), key, startX: x, thrown: false, heard: 0 })
        bang.hand.set(x, y)
        sfx.play("phoenix-flash-equip", { pan: panAt(x) })
      }
      // The orb's path: held in the hand, then thrown to the side the hand moved to (or to the middle).
      function updateBang(now) {
        const t = (now - bang.t0) / 1000
        const u = uniforms
        const R = 0.035
        const { HOLD, FLY, GLARE, FADE } = BANG
        u.uK.value = 0
        u.uRing.value = 0
        u.uFlashAmt.value = 0
        if (t < HOLD) {
          u.uOrb.value.set(bang.hand.x, bang.hand.y, R * easeOutBack(Math.min(1, t / 0.35)))
          u.uOrbAmt.value = 1
        } else if (t < HOLD + FLY) {
          if (!bang.thrown) {
            const dx = bang.hand.x - bang.startX
            const dir = Math.abs(dx) > 0.025 ? Math.sign(dx) : 0
            u.uFrom.value.copy(bang.hand)
            u.uTo.value.set(0.5 + dir * 0.3, 0.6)
            const side = dir || (bang.hand.x > 0.5 ? -1 : 1)
            u.uCtl.value.set((bang.hand.x + u.uTo.value.x) / 2 + side * 0.1, Math.max(bang.hand.y, 0.6) + 0.22)
            bang.thrown = true
          }
          const k = 1 - (1 - (t - HOLD) / FLY) ** 2
          const f = u.uFrom.value, c = u.uCtl.value, e = u.uTo.value
          const x = (1 - k) * (1 - k) * f.x + 2 * (1 - k) * k * c.x + k * k * e.x
          const y = (1 - k) * (1 - k) * f.y + 2 * (1 - k) * k * c.y + k * k * e.y
          u.uOrb.value.set(x, y, R * (1 - 0.3 * k))
          u.uK.value = k
          u.uRing.value = THREE.MathUtils.lerp(0.24, R * 1.05, k)
          u.uOrbAmt.value = 1
        } else if (t < HOLD + FLY + GLARE + FADE) {
          const g = t - HOLD - FLY
          u.uOrbAmt.value = Math.max(0, 1 - g / 0.12)
          u.uFlashAt.value.copy(u.uTo.value)
          // With the game's pop (vfx), the glare comes a moment after it, as the game's flash whites out.
          const pop = vfx.ok ? 0.15 : 0
          u.uFlashAmt.value = THREE.MathUtils.clamp((g - pop) / 0.06, 0, 1) * (g < GLARE ? 1 : (1 - (g - GLARE) / FADE) ** 1.6)
        } else {
          bang.t0 = -1
          u.uOrbAmt.value = 0
        }
        // Thrown, then its pop, and what a flashed player hears as the glare blinds whoever's watching.
        if (bang.heard < 1 && t >= HOLD) {
          bang.heard = 1
          sfx.play("phoenix-flash-throw", { pan: panAt(bang.hand.x) })
        }
        if (bang.heard < 2 && t >= HOLD + FLY) {
          bang.heard = 2
          const pan = panAt(u.uTo.value.x)
          sfx.play("phoenix-flash-pop", { pan })
          sfx.play("phoenix-flash-blind", { pan: pan * 0.5, gain: 0.55, delay: 0.15 })
        }
        phxCurveball(t)
      }

      // Both palms open, fingers up, seen edge on (facing each other), side by side: a fire between them.
      // A thumb pressed to the middle finger and let go with the middle finger landing in the palm: a snap.
      function phoenixHands(r, now) {
        const hands = r.landmarks || []
        const open = []
        hands.forEach((h, i) => {
          const palm = dist(h[0], h[9])
          const fingersOut = [8, 12, 16, 20].every((t) => dist(h[t], h[0]) > 1.3 * palm)
          const upright = h[0].y - h[12].y > 0.9 * palm
          const edgeOn = dist(h[5], h[17]) / palm
          if (fingersOut && upright && edgeOn < 0.8) {
            const c = [0, 5, 9, 13, 17].reduce((a, k) => ({ x: a.x + h[k].x / 5, y: a.y + h[k].y / 5 }), { x: 0, y: 0 })
            open.push({ c, palm })
          }
        })
        // The snap: thumb pressed to the middle finger, then within 0.6 s the hand turns quickly (more than
        // 35° within 0.2 s, flat or twisting) as the fingers part. Not at the face, not with both palms up for
        // the fire or just after it, not while a flash is on.
        const va = video.videoWidth / video.videoHeight || 16 / 9
        hands.forEach((h, i) => {
          const palm = dist(h[0], h[9])
          const key = r.handedness?.[i]?.[0]?.categoryName || String(i)
          const st = snaps.get(key) || { since: now, seen: now, armed: 0, hist: [] }
          if (now - st.seen > 300) Object.assign(st, { since: now, armed: 0, hist: [] })
          st.seen = now
          const atFace = faceLm && dist(h[9], faceLm[1]) < 0.9 * dist(faceLm[234], faceLm[454])
          const allowed = !atFace && now - st.since > 250 && now - fire.lastOn > 1200 && open.length < 2 && bang.t0 < 0
          const angle = Math.atan2(h[17].y - h[5].y, (h[17].x - h[5].x) * va)
          const width = dist(h[5], h[17]) / palm
          st.hist = st.hist.filter((e) => now - e.t < 200)
          let turn = 0, twist = 0
          for (const e of st.hist) {
            let da = Math.abs(angle - e.angle)
            if (da > Math.PI) da = 2 * Math.PI - da
            turn = Math.max(turn, da)
            twist = Math.max(twist, Math.abs(width - e.width))
          }
          st.hist.push({ t: now, angle, width })
          const pinched = dist(h[4], h[12]) < 0.45 * palm
          if (pinched) st.armed = now
          const [ox, oy] = toScreen((h[4].x + h[12].x) / 2, (h[4].y + h[12].y) / 2)
          if (allowed && st.armed && now - st.armed < 600 && !pinched && (turn > 0.6 || twist > 0.35)) {
            startBang(ox, oy, key)
            st.armed = 0
            st.hist = []
          }
          if (bang.t0 >= 0 && bang.key === key) bang.hand.set(ox, oy)
          if (allowed && st.armed && now - st.armed < 600) handInfo += ` · estalo armado (giro ${Math.round((turn * 180) / Math.PI)}°)`
          snaps.set(key, st)
        })
        fire.on = false
        if (open.length === 2) {
          const [a, b] = open
          const gap = Math.abs(a.c.x - b.c.x)
          const palm = (a.palm + b.palm) / 2
          if (gap > 0.6 * palm && gap < 7 * palm && Math.abs(a.c.y - b.c.y) < 1.6 * palm) {
            const [x, y] = toScreen((a.c.x + b.c.x) / 2, (a.c.y + b.c.y) / 2)
            const rad = Math.max(0.04, (gap / cover.sx) * (W / H) * 0.42)
            fire.at.lerp(new THREE.Vector3(x, y, rad), fire.on ? 0.5 : 1)
            fire.on = true
            fire.lastOn = now
          }
        }
        handInfo += fire.on ? " · fogo" : ""
      }

      // ---------- loop ----------
      let lastFrame = -1
      let last = performance.now()
      let frames = 0, fps = 0, fpsAt = last
      let camLabel = ""
      function tick() {
        requestAnimationFrame(tick)
        const now = performance.now()
        const dt = Math.min(0.05, (now - last) / 1000)
        last = now
        const camReady = video.readyState >= 2 && video.videoWidth > 0
        if (!showing || !box || !camReady) {
          renderer.setScissorTest(false)
          renderer.setViewport(0, 0, W, H)
          renderer.clear()
          hud.textContent = `parado: ${!showing ? "fonte fora da tela" : !box ? `sem caixa de câmera na cena "${sceneName}"` : "sem câmera"}` + (errors.length ? "\n" + errors.slice(-3).join("\n") : "")
          return
        }
        const phoenix = AGENTS.phoenix.amt
        const agentOn = agentList.some((a) => a.amt > 0) || !!AGENTS[mode]
        const carOn = carList.some((c) => c.amt > 0) || !!CARS[mode]
        const sovaOn = mode === "sova" || AGENTS.sova.amt > 0
        if (gestures && video.readyState >= 2 && video.currentTime !== lastFrame) {
          lastFrame = video.currentTime
          try {
            videoFrames++
            // The hands are tracked only for the filters that use them (no gesture switches a filter).
            if (mode === "phoenix" || phoenix > 0 || sovaOn || mode === "pop" || pop > 0 || mode === "lente") runGestures(now)
            else {
              lastHands = []
              pushes = []
              lens.on = false
              fire.on = false
              handInfo = "mãos sem uso"
            }
            // The body mask: Pop, and Sova's reveals while one may be on screen.
            const sovaMask = sovaOn && (now < sova.maskUntil || sova.patrol.amt > 0)
            if (mode === "pop" || pop > 0 || sovaMask) runBody(now)
            if (mode === "bola" || ballIn > 0 || agentOn || carOn) runFace(now)
            if (agentOn && videoFrames % 2 === 0) runPose(now)
            // The body mask and the background's check, for erasing his hair (agents) or his head (cars).
            if ((agentOn || carOn) && ERASE) {
              if (mode !== "pop" && pop <= 0 && !sovaMask) runBody(now)
              if (plate.off === undefined || videoFrames % 15 === 0) sampleBackground()
            }
            if (carOn && faceLm) drawParts()
          } catch (e) {
            fail("modelos", e)
          }
        }
        pop = THREE.MathUtils.clamp(pop + (mode === "pop" ? dt / 0.55 : -dt / 0.4), 0, 1)
        ballIn = THREE.MathUtils.clamp(ballIn + (mode === "bola" ? dt / 0.35 : -dt / 0.25), 0, 1)
        for (const a of agentList) a.amt = THREE.MathUtils.clamp(a.amt + (mode === a.id ? dt / 0.4 : -dt / 0.3), 0, 1)
        for (const c of carList) c.amt = THREE.MathUtils.clamp(c.amt + (mode === c.id ? dt / 0.35 : -dt / 0.25), 0, 1)
        const agentAmt = Math.max(...agentList.map((a) => a.amt))
        const carAmt = Math.max(...carList.map((c) => c.amt))
        const fireWanted = phoenix > 0 && (fire.on || fire.demo)
        if (fire.demo && !fire.on) fire.at.set(0.5, 0.3, 0.11)
        fire.amt = THREE.MathUtils.clamp(fire.amt + (fireWanted ? dt / 0.25 : -dt / 0.35), 0, 1)
        // The fire between his palms crackles as loud as it's big.
        if (fire.amt > 0.01) {
          fire.snd ||= sfx.play("phoenix-fire", { loop: true, gain: 0 })
          fire.snd.set({ gain: fire.amt * 0.9, pan: panAt(fire.at.x) })
        } else if (fire.snd) {
          fire.snd.stop(0.2)
          fire.snd = null
        }
        uniforms.uPlateOk.value = plate.ok ? 1 : 0
        uniforms.uFire.value.copy(fire.at)
        uniforms.uFireAmt.value = fire.amt
        if (bang.t0 >= 0) updateBang(now)
        if (mode === "phoenix" || vfx.active()) updatePhoenix(now, dt)
        if (sovaOn) updateSova(now, dt)
        updateCars(now)
        // Erasing his hair: around an agent's, or his whole head under a car (back while it's demolished).
        const carShown = Math.max(0, ...carList.map((c) => (c.group.visible ? c.shown : 0)))
        uniforms.uErase.value = headSeen && ERASE ? Math.max(agentAmt, carShown) : 0
        uniforms.uEraseLow.value.set(...(carShown > agentAmt ? [-1.05, -0.85] : [-0.55, -0.3]))
        // Under a car, centred on the middle of his head rather than his face, which turns off to a side.
        if (carShown > agentAmt && headSeen) {
          const mid = new THREE.Vector3(...CAR_AT).applyMatrix4(head.matrix).project(headCam)
          uniforms.uFace.value.x += (mid.x * 0.5 + 0.5 - uniforms.uFace.value.x) * 0.7
        }
        lens.amt = THREE.MathUtils.clamp(lens.amt + (lens.on ? dt / 0.15 : -dt / 0.2), 0, 1)
        energy *= Math.pow(0.25, dt)

        uniforms.uTime.value = now / 1000
        uniforms.uPop.value = pop
        uniforms.uEnergy.value = energy
        uniforms.uLensAmt.value = lens.amt
        lens.pts.forEach((v, i) => uniforms.uLens.value[i].copy(v))
        uniforms.uCover.value.set(cover.sx, cover.sy, cover.ox, cover.oy)

        // Phoenix's effects into their own target first (that switches render targets).
        const vfxOn = vfx.active()
        vfx.tint.set(...(sovaOn ? TINTS.sova : TINTS.phoenix))
        if (vfxOn) vfx.render(box[2], box[3])
        // The face's mask and what's behind Luan, before the camera's layer, which erases his hair with them.
        const ready = agentList.filter((a) => a.amt > 0 && a.ready)
        if (ready.length) drawKeep(ready.find((a) => a.trim)?.trim)
        else if (carAmt > 0) drawKeep(undefined, false)
        if ((agentAmt > 0 || carAmt > 0) && ERASE && maskFresh) {
          remember()
          maskFresh = false
        }

        renderer.setScissorTest(false)
        renderer.setViewport(0, 0, W, H)
        renderer.clear()
        const [bx, by, bw, bh] = box
        // Sova's shocks shake the camera: the whole box's picture moves a few pixels, inside the box.
        let sx = 0, sy = 0
        if (now < sova.shakeUntil) {
          const k = ((sova.shakeUntil - now) / sova.shakeLen) * sova.shakeAmp * (bw / 480) ** 0.5
          sx = Math.round((Math.random() * 2 - 1) * k)
          sy = Math.round((Math.random() * 2 - 1) * k)
        }
        renderer.setViewport(bx + sx, H - by - bh + sy, bw, bh)
        renderer.setScissor(bx, H - by - bh, bw, bh)
        renderer.setScissorTest(true)
        if (!IN_OBS || mode !== "nenhum" || pop > 0 || ballIn > 0 || agentAmt > 0 || carAmt > 0) renderer.render(baseScene, ortho)
        if (pop > 0) {
          updateShapes(dt, pop, pushes)
          renderer.clearDepth()
          renderer.render(back, shapeCam)
          renderer.render(bodyScene, ortho)
          renderer.clearDepth()
          renderer.render(front, shapeCam)
        }
        // Sova's drone behind him: under everything else, his body in front of it.
        if (sovaOn && drone3.root.visible && drone3.behind) {
          renderer.clearDepth()
          renderer.render(occludeScene, ortho)
          renderer.render(sv3.drone, headCam)
        }
        // The agents' clothes on the shoulders, then Luan's face and hands back over them.
        for (const a of ready) {
          if (pose.seen && headSeen) {
            placeTorso(a)
            const k = a.scale * TORSO_K * easeOutBack(a.amt)
            a.torso.matrix.compose(a.pos, a.quat, new THREE.Vector3(k, k, k))
            a.torso.visible = true
            head.visible = false
            renderer.clearDepth()
            renderer.render(ballScene, headCam)
            a.torso.visible = false
          } else a.seen = false
        }
        if (ready.length) renderer.render(keepScene, ortho)
        for (const a of agentList) {
          a.hair.visible = a.amt > 0
          a.hair.scale.set(1, easeOutBack(a.amt), 1)
        }
        ball.visible = ballIn > 0
        // The ball's metal wants strong light; the agents' painted textures wash out under it; the cars have
        // their reflections.
        sky.intensity = agentAmt > 0 ? 1.7 : carAmt > 0 ? 1.4 : 3.2
        key.intensity = agentAmt > 0 ? 1.5 : carAmt > 0 ? 1.8 : 3
        if ((ballIn > 0 || agentAmt > 0 || carAmt > 0) && headSeen) {
          head.visible = true
          ball.scale.setScalar(easeOutBack(ballIn))
          // It turns slowly on the head, on top of the head's own turning (?giro= turns a second, 0 for still).
          ball.rotation.y += dt * BALL_SPIN
          renderer.clearDepth()
          renderer.render(ballScene, headCam)
          if (ready.some((a) => a.behind)) renderer.render(keepScene, ortho)
        }
        // Sova's bow in his hand, over his clothes and hair, under his hands (drawn back over it, they hold it and
        // pull the string).
        if (sovaOn && bow3.root.visible) {
          renderer.clearDepth()
          renderer.render(sv3.held, headCam)
          renderer.render(keepHandsScene, ortho)
        }
        if (sovaOn) {
          renderer.render(sovaScene, ortho)
          const droneFront = drone3.root.visible && !drone3.behind
          if (droneFront || flying.visible || stuck.visible) {
            renderer.clearDepth()
            if (flying.visible || stuck.visible) renderer.render(sv3.free, headCam)
            if (droneFront) renderer.render(sv3.drone, headCam)
          }
        }
        if (uniforms.uBoomT.value >= 0) renderer.render(boomScene, ortho)
        if (fire.amt > 0) renderer.render(fireScene, ortho)
        if (lens.amt > 0) renderer.render(lensScene, ortho)
        if (uniforms.uOrbAmt.value > 0 && !vfx.ok) renderer.render(bangScene, ortho)
        // Phoenix's abilities, drawn by vfx into its own target, tone mapped over the box.
        if (vfxOn) renderer.render(vfx.compositeScene, ortho)
        if (uniforms.uUltVig.value > 0) renderer.render(vigScene, ortho)
        // The glare stays in the camera's box (Luan's call), from where the orb popped.
        if (uniforms.uFlashAmt.value > 0) renderer.render(flashScene, ortho)

        frames++
        if (now - fpsAt > 500) {
          fps = (frames * 1000) / (now - fpsAt)
          frames = 0
          fpsAt = now
          const ag = AGENTS[mode] || CARS[mode]
          hud.textContent =
            `${fps.toFixed(0)} fps · ${delegate || "…"} · ${camLabel}\n` +
            `gesto ${ms.gesto.toFixed(1)} ms · corpo ${ms.corpo.toFixed(1)} ms · rosto ${ms.rosto.toFixed(1)} ms · ombros ${ms.ombros.toFixed(1)} ms\n` +
            `${handInfo} · filtro: ${mode}${lens.on ? " · lente" : ""}` +
            (ag ? `\n${mode}: modelo ${ag.ready ? "ok" : "carregando"} · rosto ${headSeen ? "sim" : "não"}${AGENTS[mode] ? ` · ombros ${pose.seen ? "sim" : "não"} · fundo ${!ERASE ? "desligado" : plate.off === undefined ? "…" : `${plate.ok ? "ok" : "não bate"} (${plate.off.toFixed(1)})`}` : ""}` : "") +
            (mode === "sova" ? `\nsova: peças ${bow3.model ? "ok" : "…"} · arco ${sova.bow.state} ${sova.bow.amt.toFixed(2)}${sova.arrow ? ` · flecha (${sova.arrow.kind})` : ""}${sova.dart ? " · reconhecimento" : ""}${sova.drone ? " · coruja" : ""}${sova.patrol.amt > 0 ? " · coruja sobrevoando" : ""}${sova.ult ? " · ultimate" : ""}` : "") +
            (errors.length ? "\n" + errors.slice(-3).join("\n") : "")
        }
      }

      // Opens the camera, and again every 5 s while it fails (busy, Broadcast restarting).
      async function startCamera() {
        try {
          camLabel = await openCamera()
          setupCamera()
        } catch (e) {
          fail("câmera", e)
          setTimeout(startCamera, 5000)
        }
      }
      function setupCamera() {
        fitCover()
        MH = Math.round((MW * video.videoHeight) / video.videoWidth)
        maskData = new Uint8Array(MW * MH)
        maskTex.dispose()
        maskTex = makeMaskTex()
        uniforms.uMask.value = maskTex
        small.width = MW
        small.height = MH
      }
      startCamera()
      tick()
      loadModels().catch((e) => fail("modelos", e))
    </script>
  </body>
</html>
