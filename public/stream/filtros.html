<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Filtros · muanlartins</title>
    <!--
      The stream's camera filters, switched from the "Filtros" dock in OBS (filtros-painel.html), not by gestures.
      It opens the camera itself (NVIDIA Broadcast by default, ?cam=<part of the name> for another), tracks hands,
      body and face with MediaPipe in the browser and draws the camera with the filter on top at 1920×1080
      (browser sources need OBS started with --enable-media-stream to open a camera).

      The dock sends "muanlartins-filtro" through obs-browser's emit_event: { filtro: "<id>" } is the filter that
      should be on ("nenhum" for none; the dock repeats it every few seconds, so a reloaded page catches up) and
      { acao: "flash" } fires a one-off. One filter at a time. A new filter: its id in MODES here, what it draws,
      and a line in the dock's FILTROS.

      On the dock:
        Bola  (key 2 in a browser): the ball on the head, turning with it and slowly on itself (a turn in
              about 12 s; ?giro=<turns a second>).
        Phoenix (key 3): Valorant's Phoenix from his model (privado/phoenix.glb, out of git), from the
              front: his hair and faded scalp on the head, his jacket and shirt on the shoulders (?bracos=0
              without the upper arms, ?bracos=2 with the forearms too), Luan's face and hands drawn back over
              them. Its own gestures stay, only while it's on: both palms open and facing each other, as if
              starting a clap, hold a fire between them that grows with the gap (key 5 shows it in the middle);
              a snap with a turn of the hand (thumb on the middle finger, then a quick twist) puts his flash's
              orb in the hand; moving the hand left or right throws it that way, curving, while a ring closes on
              it, and it pops into a warm glare of about 2.5 s (key 4, or the dock's Flash).
      Kept here but off the dock (Luan, 2026-11-10: only Phoenix and the ball for now):
        Pop   (key 1): the body cut out, in blues, with fire coming off its outline, a pop-art burst behind
              that follows the head, flying shapes the hands push away; it comes in with shards.
        Lente (key 6): two hands in an "L" (thumb and index out): the space between the fingers turns
              psychedelic. It used to work at any time; now only as its own filter.
      Key 0 turns the filter off.

      ?debug shows fps, how long each model takes and the hands seen; ?cpu runs the models on the CPU;
      ?modo=pop|bola|phoenix|lente starts with a filter on; ?texto=A|B the title's two lines in Pop; it frames the camera as OBS's
      "Enquadramento" crop does (NVIDIA Broadcast's auto frame is off), or ?zoom=1.3 and ?foco=x,y (0..1 of the
      camera's frame, from its top left) for another framing, ?zoom=1 for none; ?phoenix=<url> another
      copy of his model.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
          "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.2/vision_bundle.mjs"
        }
      }
    </script>
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("space-grotesk.ttf");
        font-weight: 300 700;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body.solo {
        background: #000;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      video {
        display: none;
      }
      #caixa {
        position: absolute;
        container-type: size;
        pointer-events: none;
      }
      #titulo {
        position: absolute;
        left: 4cqw;
        top: 34cqh;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        line-height: 0.86;
        color: #241a6b;
        transform: rotate(-7deg) scale(0.2);
        transform-origin: 0 50%;
        opacity: 0;
        transition:
          transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1),
          opacity 0.2s;
        pointer-events: none;
      }
      #titulo.on {
        transform: rotate(-7deg) scale(1);
        opacity: 1;
      }
      #titulo small {
        display: block;
        margin-left: 12cqw;
        font-size: 2.2cqw;
        color: #fff;
        -webkit-text-stroke: 0.25cqw #241a6b;
        paint-order: stroke;
      }
      #titulo b {
        display: block;
        font-size: 7cqw;
        letter-spacing: -0.03em;
        -webkit-text-stroke: 0.5cqw #fff;
        paint-order: stroke;
        text-transform: uppercase;
      }
      #titulo b + b {
        margin-left: 3cqw;
      }
      #hud {
        position: absolute;
        left: 8px;
        top: 8px;
        display: none;
        padding: 6px 10px;
        font: 15px/1.35 ui-monospace, monospace;
        color: #7fff7f;
        white-space: pre;
        background: #000b;
      }
    </style>
  </head>
  <body>
    <video id="cam" playsinline muted></video>
    <div id="caixa"><div id="titulo"><small>ao vivo</small><b>muan</b><b>lartins</b></div></div>
    <div id="hud">carregando…</div>
    <script type="module">
      import * as THREE from "three"
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js"
      import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js"
      import { FilesetResolver, GestureRecognizer, ImageSegmenter, FaceLandmarker, PoseLandmarker } from "@mediapipe/tasks-vision"

      const q = new URLSearchParams(location.search)
      const W = 1920
      const H = 1080
      const MODELS = "https://storage.googleapis.com/mediapipe-models/"
      const hud = document.getElementById("hud")
      const titulo = document.getElementById("titulo")
      if (q.has("debug")) hud.style.display = "block"
      if (q.get("texto")) {
        const [a, b] = q.get("texto").split("|")
        titulo.querySelectorAll("b")[0].textContent = a || ""
        titulo.querySelectorAll("b")[1].textContent = b || ""
      }
      // In OBS the page is one full-screen source in every scene with the camera, just above it: it draws the camera
      // with the filter exactly in that scene's camera box (positions from brand/twitch/obs.py) and stays clear
      // while no filter is on; everything, the flash's glare too, stays in that box. Opened in a browser it fills the window
      // with the camera. ?caixa=x,y,w,h forces a box (1920×1080 pixels).
      const IN_OBS = !!window.obsstudio
      const BOXES = {
        "RL + chat": [44, 740, 480, 270],
        "Valorant + chat": [44, 44, 480, 270],
        Conversa: [64, 64, 1280, 720],
        Terapia: [64, 64, 560, 315],
      }
      let box = q.get("caixa") ? q.get("caixa").split(",").map(Number) : IN_OBS ? null : [0, 0, 1920, 1080]
      let showing = true
      let sceneName = ""
      if (!IN_OBS) document.body.classList.add("solo")
      function setBox(b) {
        box = b
        const c = document.getElementById("caixa")
        c.style.display = b ? "block" : "none"
        if (b) Object.assign(c.style, { left: `${(b[0] / 1920) * 100}%`, top: `${(b[1] / 1080) * 100}%`, width: `${(b[2] / 1920) * 100}%`, height: `${(b[3] / 1080) * 100}%` })
      }
      setBox(box)
      if (IN_OBS && !q.get("caixa")) {
        window.obsstudio.getCurrentScene?.((scene) => {
          sceneName = scene?.name
          setBox(BOXES[scene?.name] || null)
        })
        addEventListener("obsSceneChanged", (e) => {
          sceneName = e.detail?.name
          setBox(BOXES[e.detail?.name] || null)
        })
      }
      // Off screen (a scene without it), it stops tracking and drawing.
      addEventListener("obsSourceActiveChanged", (e) => (showing = !!e.detail?.active))
      const errors = []
      const fail = (where, e) => {
        console.error(where, e?.name || "", e?.message || e)
        errors.push(`${where}: ${e?.name ? e.name + " " : ""}${e?.message || e}`)
        // On screen only with ?debug: in OBS it would go out on the live (2026-11-09, the camera refused because OBS
        // was opened without its flags). The error is in OBS's log either way, as [obs-browser: 'Filtros'].
      }

      // ---------- camera ----------
      const video = document.getElementById("cam")
      async function openCamera() {
        const want = (q.get("cam") || "NVIDIA Broadcast").toLowerCase()
        // The format OBS's own Câmera uses, since NVIDIA Broadcast's camera serves several apps at once only in one format.
        const size = { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } }
        const open = (deviceId) => navigator.mediaDevices.getUserMedia({ video: { ...size, deviceId: { exact: deviceId } }, audio: false })
        // The wanted camera by its name, never the system's default first: that's often the physical webcam, which
        // NVIDIA Broadcast holds for itself ("device in use"). Names show only once some camera was opened, so
        // until then each camera is tried in turn.
        let cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput")
        let stream = null
        let pick = cams.find((d) => d.label.toLowerCase().includes(want))
        if (!pick) {
          for (const c of cams) {
            try {
              stream = await open(c.deviceId)
              break
            } catch {}
          }
          cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput")
          pick = cams.find((d) => d.label.toLowerCase().includes(want))
        }
        if (pick && stream?.getVideoTracks()[0].getSettings().deviceId !== pick.deviceId) {
          stream?.getTracks().forEach((t) => t.stop())
          stream = await open(pick.deviceId)
        }
        if (!stream) throw new Error(`nenhuma câmera abriu (${cams.map((c) => c.label || "?").join(", ")})`)
        video.srcObject = stream
        await video.play()
        await new Promise((r) => (video.videoWidth ? r() : video.addEventListener("loadedmetadata", r, { once: true })))
        return stream.getVideoTracks()[0].label
      }

      // ---------- rendering ----------
      THREE.ColorManagement.enabled = false
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" })
      renderer.setClearColor(0x000000, 0)
      renderer.outputColorSpace = THREE.LinearSRGBColorSpace
      renderer.setPixelRatio(1)
      renderer.setSize(W, H, false)
      renderer.autoClear = false
      document.body.prepend(renderer.domElement)

      const camTex = new THREE.VideoTexture(video)
      camTex.colorSpace = THREE.NoColorSpace
      camTex.minFilter = camTex.magFilter = THREE.LinearFilter

      // The body mask, from a small copy of the frame; mipmaps blur it for free, which is what the outline and
      // the fire are made of.
      const MW = 256
      let MH = 144
      let maskData = new Uint8Array(MW * MH)
      let maskTex = makeMaskTex()
      function makeMaskTex() {
        const t = new THREE.DataTexture(maskData, MW, MH, THREE.RedFormat, THREE.UnsignedByteType)
        t.minFilter = THREE.LinearMipmapLinearFilter
        t.magFilter = THREE.LinearFilter
        t.generateMipmaps = true
        t.needsUpdate = true
        return t
      }
      const small = document.createElement("canvas")
      const smallCtx = small.getContext("2d", { willReadFrequently: true })

      // Screen uv (0..1, y up) ↔ video uv: the video covers the canvas, zoomed in on ?foco by ?zoom.
      const cover = { sx: 1, sy: 1, ox: 0, oy: 0 }
      function fitCover() {
        const va = video.videoWidth / video.videoHeight
        const ca = W / H
        if (va > ca) Object.assign(cover, { sx: ca / va, sy: 1, ox: (1 - ca / va) / 2, oy: 0 })
        else Object.assign(cover, { sx: 1, sy: va / ca, ox: 0, oy: (1 - va / ca) / 2 })
        // By default the same framing as OBS's "Enquadramento" crop (CAMERA_CROP in brand/twitch/obs_shorts.py:
        // 310, 360, 330, 0 of 1920×1080, 1280×720 kept), since the page opens the camera itself, without OBS's filters.
        const zoom = Math.max(1, Number(q.get("zoom") || 1920 / 1280))
        if (zoom > 1) {
          const [fx, fy] = (q.get("foco") || `${(310 + 640) / 1920},${(360 + 360) / 1080}`).split(",").map(Number)
          const sx = cover.sx / zoom
          const sy = cover.sy / zoom
          const clamp = (v, max) => Math.min(Math.max(v, 0), max)
          Object.assign(cover, { sx, sy, ox: clamp(fx - sx / 2, 1 - sx), oy: clamp(1 - fy - sy / 2, 1 - sy) })
        }
        // The 3D camera sees the whole frame at MediaPipe's 63°, and renders only the part on screen.
        const fullW = W / cover.sx
        const fullH = H / cover.sy
        headCam.aspect = fullW / fullH
        headCam.setViewOffset(fullW, fullH, cover.ox * fullW, (1 - cover.oy - cover.sy) * fullH, W, H)
      }
      // A point in the video image (x right, y down, 0..1) to screen uv.
      const toScreen = (x, y) => [(x - cover.ox) / cover.sx, (1 - y - cover.oy) / cover.sy]

      const GLSL_COMMON = /* glsl */ `
        uniform sampler2D uCam;
        uniform sampler2D uMask;
        uniform vec4 uCover;
        uniform float uTime;
        uniform float uAspect;
        varying vec2 vUv;
        vec2 camUv(vec2 uv) { return uv * uCover.xy + uCover.zw; }
        float maskAt(vec2 uv, float lod) { vec2 v = camUv(uv); return textureLod(uMask, vec2(v.x, 1.0 - v.y), lod).r; }
        float hash(float n) { return fract(sin(n * 127.1) * 43758.5453); }
        float hash2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash2(i), hash2(i + vec2(1, 0)), f.x), mix(hash2(i + vec2(0, 1)), hash2(i + vec2(1, 1)), f.x), f.y);
        }
        float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * noise(p); p *= 2.03; a *= 0.5; } return s; }
        float lum(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
        const vec3 YELLOW = vec3(1.0, 0.91, 0.05);
        const vec3 CYAN = vec3(0.1, 0.74, 0.97);
        const vec3 MAGENTA = vec3(1.0, 0.17, 0.58);
        const vec3 NAVY = vec3(0.13, 0.09, 0.42);
        const vec3 ORANGE = vec3(1.0, 0.5, 0.08);
        const vec3 BLUE = vec3(0.17, 0.36, 0.96);
        const vec3 LIME = vec3(0.45, 0.95, 0.4);
        // Halftone dots in pixels: 1 inside a dot of radius r (0..0.5 of a cell).
        float dots(vec2 uv, float cell, float r) {
          vec2 px = uv * vec2(${W}.0, ${H}.0);
          vec2 g = mat2(0.7071, -0.7071, 0.7071, 0.7071) * px / cell;
          return step(length(fract(g) - 0.5), r);
        }
        // The shards Pop comes in with: diagonal bands, each a little ahead or behind.
        float reveal(vec2 uv, float p) {
          vec2 d = normalize(vec2(1.0, 0.55));
          float along = dot(uv, d);
          float band = floor(dot(uv, vec2(-d.y, d.x)) * 9.0);
          return step(along, p * 1.75 - 0.15 - hash(band + 3.0) * 0.3);
        }
      `
      const VERT = /* glsl */ `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`

      const uniforms = {
        uCam: { value: camTex },
        uMask: { value: maskTex },
        uCover: { value: new THREE.Vector4(1, 1, 0, 0) },
        uTime: { value: 0 },
        uAspect: { value: W / H },
        uPop: { value: 0 },
        uCenter: { value: new THREE.Vector2(0.55, 0.6) },
        uEnergy: { value: 0 },
        uLens: { value: [0, 1, 2, 3].map(() => new THREE.Vector2()) },
        uLensAmt: { value: 0 },
        // Phoenix: the face's oval (centre, half width and height, its up direction), where Luan's own hair
        // around it is painted over in the background's colour.
        uErase: { value: 0 },
        uFace: { value: new THREE.Vector4(0.5, 0.6, 0.1, 0.15) },
        uFaceUp: { value: new THREE.Vector2(0, 1) },
        uBg: { value: new THREE.Color(0x002fa7) },
        uFire: { value: new THREE.Vector3(0.5, 0.4, 0.1) },
        uFireAmt: { value: 0 },
        // Phoenix's flash: the orb (x, y, radius) and how much of it shows, the curve it flies along (from,
        // control, to) and how far along it is, the ring closing on it, and the glare where it popped.
        uOrb: { value: new THREE.Vector3(0.7, 0.45, 0.035) },
        uOrbAmt: { value: 0 },
        uFrom: { value: new THREE.Vector2() },
        uCtl: { value: new THREE.Vector2() },
        uTo: { value: new THREE.Vector2() },
        uK: { value: 0 },
        uRing: { value: 0 },
        uFlashAt: { value: new THREE.Vector2(0.5, 0.6) },
        uFlashAmt: { value: 0 },
      }

      // Layer 0: the camera, or Pop's burst and fire where its shards have come in.
      const baseMat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: VERT,
        depthTest: false,
        depthWrite: false,
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform float uPop;
          uniform vec2 uCenter;
          uniform float uEnergy;
          uniform float uErase;
          uniform vec4 uFace;
          uniform vec2 uFaceUp;
          uniform vec3 uBg;
          vec3 burst(vec2 uv, float t) {
            vec2 p = (uv - uCenter) * vec2(uAspect, 1.0);
            float r = length(p);
            float n = 22.0;
            float k = (atan(p.y, p.x) / 6.2831853 + 0.5) * n + t * (0.04 + uEnergy * 0.5);
            k += 0.12 * sin(r * 38.0 + floor(k) * 2.0);
            float id = mod(floor(k), n);
            float h = hash(id + 11.0);
            vec3 c = h < 0.4 ? YELLOW : h < 0.58 ? BLUE : h < 0.7 ? MAGENTA : h < 0.82 ? CYAN : NAVY;
            if (h >= 0.4 && h < 0.58) c = mix(c, NAVY, dots(uv, 13.0, 0.16 + 0.22 * smoothstep(0.1, 0.9, r)));
            if (h >= 0.82) c = mix(c, BLUE, dots(uv, 11.0, 0.3));
            // Flat splashes drifting up, cut with hard edges.
            float b = fbm(p * 2.4 + vec2(0.0, -t * 0.18) + 3.0);
            float b2 = fbm(p * 3.1 + vec2(4.0, -t * 0.25));
            if (b > 0.7) c = MAGENTA; else if (b > 0.68) c = NAVY;
            if (b2 > 0.73) c = CYAN; else if (b2 > 0.715) c = LIME;
            return c;
          }
          // Fire off the body's outline: the mask looked up a little below, blurred, through jumpy noise.
          vec4 fire(vec2 uv, float t) {
            float ts = floor(t * 12.0) / 12.0;
            float n1 = noise(vec2(uv.x * 22.0, uv.y * 7.0 - ts * 5.0));
            float n2 = noise(vec2(uv.x * 12.0 + 9.0, uv.y * 4.0 - ts * 3.5));
            float grow = 1.0 + uEnergy * 1.5;
            float near = maskAt(uv + vec2((n1 - 0.5) * 0.04, -0.045 * (0.3 + n1) * grow), 2.2);
            float far = maskAt(uv + vec2((n2 - 0.5) * 0.08, -0.12 * (0.25 + n2) * grow), 3.4);
            float ring = maskAt(uv, 2.6);
            if (near > 0.5) return vec4(mix(ORANGE, YELLOW, step(0.62, n1)), 1.0);
            if (ring > 0.16) return vec4(ORANGE, 1.0);
            if (far > 0.42) return vec4(mix(MAGENTA, ORANGE, step(0.55, n2)), 1.0);
            if (far > 0.34) return vec4(CYAN, 1.0);
            return vec4(0.0);
          }
          void main() {
            vec3 col = texture2D(uCam, camUv(vUv)).rgb;
            if (uPop > 0.0 && reveal(vUv, uPop) > 0.0) {
              vec3 bg = burst(vUv, uTime);
              vec4 f = fire(vUv, uTime);
              col = mix(bg, f.rgb, f.a);
            }
            if (uErase > 0.0) {
              vec2 d = (vUv - uFace.xy) * vec2(uAspect, 1.0);
              d = vec2(dot(d, vec2(uFaceUp.y, -uFaceUp.x)), dot(d, uFaceUp));
              float keep = length(d / (uFace.zw * vec2(1.03, 1.0)));
              float zone = length(d / (uFace.zw * vec2(2.4, 2.0)));
              if (keep > 1.0 && zone < 1.0 && d.y > -uFace.w * 0.3) {
                float m = smoothstep(0.06, 0.3, maskAt(vUv, 1.6));
                col = mix(col, uBg, m * uErase * smoothstep(1.0, 1.04, keep));
              }
            }
            gl_FragColor = vec4(col, 1.0);
          }`,
      })

      // Layer 1: the body in Pop's blues, over the shapes behind it.
      const bodyMat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: VERT,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform float uPop;
          void main() {
            float m = smoothstep(0.4, 0.6, maskAt(vUv, 0.0));
            if (m <= 0.0 || reveal(vUv, uPop) <= 0.0) discard;
            float l = clamp((lum(texture2D(uCam, camUv(vUv)).rgb) - 0.08) * 1.35, 0.0, 1.0);
            vec3 c = l < 0.22 ? vec3(0.07, 0.05, 0.3) : l < 0.42 ? NAVY * 1.25 : l < 0.62 ? BLUE : vec3(0.55, 0.78, 1.0);
            if (l >= 0.42 && l < 0.62) c = mix(c, NAVY * 1.25, dots(vUv, 9.0, 0.28));
            // A light rim just inside the outline.
            if (maskAt(vUv, 1.6) < 0.8) c = vec3(0.75, 0.95, 1.0);
            gl_FragColor = vec4(c, m);
          }`,
      })

      // Layer 2: the lens between the hands.
      const lensMat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: VERT,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        extensions: { derivatives: true },
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform vec2 uLens[4];
          uniform float uLensAmt;
          float side(vec2 p, vec2 a, vec2 b) { return (b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x); }
          bool inTri(vec2 p, vec2 a, vec2 b, vec2 c) {
            float d1 = side(p, a, b), d2 = side(p, b, c), d3 = side(p, c, a);
            return !((d1 < 0.0 || d2 < 0.0 || d3 < 0.0) && (d1 > 0.0 || d2 > 0.0 || d3 > 0.0));
          }
          float segDist(vec2 p, vec2 a, vec2 b) {
            vec2 pa = p - a, ba = b - a;
            return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0));
          }
          vec3 hsv(float h, float s, float v) {
            vec3 k = clamp(abs(mod(h * 6.0 + vec3(0, 4, 2), 6.0) - 3.0) - 1.0, 0.0, 1.0);
            return v * mix(vec3(1.0), k, s);
          }
          void main() {
            vec2 s = vec2(uAspect, 1.0);

          ${GLSL_COMMON}

      // flares, held in the hand, then thrown along a curve with a trail while a ring closes on it; when the
      // ring meets it, it pops into a warm glare with rays of light from where it popped, that holds and fades.
      const BANG = { HOLD: 1.0, FLY: 0.65, GLARE: 1.6, FADE: 1.0 }
      const bangMat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: VERT,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform vec3 uOrb;
          uniform float uOrbAmt;
          uniform vec2 uFrom;
          uniform vec2 uCtl;
          uniform vec2 uTo;
          uniform float uK;
          uniform float uRing;
          vec2 bez(float s) { return mix(mix(uFrom, uCtl, s), mix(uCtl, uTo, s), s); }
          float seg(vec2 p, vec2 a, vec2 b) {
            vec2 pa = p - a, ba = b - a;
            return length(pa - ba * clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0));
          }
          void main() {
            vec2 a = vec2(uAspect, 1.0);
            vec2 d = (vUv - uOrb.xy) * a;
            float r = length(d);
            float R = uOrb.z;
            float ang = atan(d.y, d.x);
            float body = smoothstep(R, R * 0.9, r);
            vec3 orb = mix(vec3(0.5, 0.02, 0.02), vec3(1.0, 0.24, 0.08),
              smoothstep(0.0, 0.7 * R, r + 0.14 * R * sin(uTime * 9.0 + ang * 3.0)));

            float out_ = max(r - R, 0.0);

            // The trail: a continuous streak along the curve behind it, thinning out.
            if (uK > 0.0) {

              vec2 prev = bez(uK) * a;

      const bangScene = quad(bangMat)
      const flashMat = new THREE.ShaderMaterial({

      const flashScene = quad(flashMat)

      // ---------- Pop's flying shapes ----------
      const shapeCam = new THREE.PerspectiveCamera(50, W / H, 0.1, 100)
      shapeCam.position.z = 10
      const halfH = Math.tan(THREE.MathUtils.degToRad(25)) * 10
      const halfW = halfH * (W / H)
      const back = new THREE.Scene()
      const front = new THREE.Scene()

        const sun = new THREE.DirectionalLight(0xffffff, 2.4)

      const COLORS = [0xff2b94, 0x1abdf8, 0xffe80d, 0x2b5cf5, 0xff8014, 0x73f266, 0x8a2be2]
      const shapes = []
      const rand = (a, b) => a + Math.random() * (b - a)
      function spawn(s, anywhere) {
        const c = uniforms.uCenter.value
        const cx = (c.x - 0.5) * 2 * halfW
        const cy = (c.y - 0.5) * 2 * halfH

        const dir = new THREE.Vector2(s.mesh.position.x - cx, s.mesh.position.y - cy).normalize()
        const sp = rand(0.4, 1.4)
        s.vel.set(dir.x * sp, dir.y * sp + 0.15, 0)
        s.spin.set(rand(-2, 2), rand(-2, 2), rand(-2, 2))
        s.size = rand(0.35, 1.3) * (s.front ? 0.7 : 1)
        s.age = anywhere ? 1 : 0
      }
      for (let i = 0; i < 30; i++) {
        const isFront = i % 5 === 0
        const mesh = new THREE.Mesh(
          GEOS[i % GEOS.length],
          new THREE.MeshLambertMaterial({ color: COLORS[i % COLORS.length], flatShading: true }),
        )
        const s = { mesh, vel: new THREE.Vector3(), spin: new THREE.Vector3(), size: 1, age: 0, front: isFront }
        ;(isFront ? front : back).add(mesh)
        spawn(s, true)
        shapes.push(s)
      }

        for (const s of shapes) {
          s.age += dt
          const k = 1 + uniforms.uEnergy.value * 3
          s.mesh.position.addScaledVector(s.vel, dt * k)
          s.vel.multiplyScalar(Math.pow(0.6, dt)).addScaledVector(s.vel.clone().normalize(), dt * 0.5)
          for (const h of pushes) {

            const dy = s.mesh.position.y - h.y

      const ballScene = new THREE.Scene()
      const sky = new THREE.HemisphereLight(0xffffff, 0x445566, 3.2)
      ballScene.add(sky)
      const key = new THREE.DirectionalLight(0xffffff, 3)

      head.matrixAutoUpdate = false
      head.visible = false
      ballScene.add(head)
      const ball = new THREE.Group()

      const headScale = new THREE.Vector3()

      const PHOENIX_URL = q.get("phoenix") || "privado/phoenix.glb"
      // Painting Luan's hair around Phoenix's over in the background's colour: off unless ?apagar (it showed as

      const groupOf = (name) =>
        /Head|Jaw|Mouth|Brow|Eye|Lid|Neck/.test(name) ? "head"
        : /Hand|Thumb|Index|Middle|Pinky|Ring|WeaponPoint/.test(name) ? "hand"
        : /Elbow/.test(name) ? "forearm"
        : /Shoulder/.test(name) ? "arm"

      // all pass keep(i, p, group).
      function piece(sm, keep) {
        const g = sm.geometry.clone()
        const raw = g.getAttribute("position")
        const baked = new Float32Array(raw.count * 3)
        const SI = g.getAttribute("skinIndex")
        const SW = g.getAttribute("skinWeight")
        const boneMats = sm.skeleton.bones.map((bone, j) => new THREE.Matrix4().multiplyMatrices(bone.matrixWorld, sm.skeleton.boneInverses[j]))
        const v = new THREE.Vector3()
        const base = new THREE.Vector3()

          }

        }
        g.setAttribute("position", new THREE.BufferAttribute(baked, 3))
        g.deleteAttribute("normal")
        g.deleteAttribute("tangent")

        g.computeBoundingSphere()

        const J = g.getAttribute("skinIndex")
        const Wt = g.getAttribute("skinWeight")
        const ok = new Uint8Array(pos.count)
        const p = new THREE.Vector3()
        for (let i = 0; i < pos.count; i++) {
          const acc = {}
          for (let k = 0; k < 4; k++) {
            const name = groupOf(sm.skeleton.bones[J.getComponent(i, k)].name)
            acc[name] = (acc[name] || 0) + Wt.getComponent(i, k)
          }
          const group = Object.keys(acc).reduce((a, b) => (acc[a] >= acc[b] ? a : b))
          ok[i] = keep(i, p.fromBufferAttribute(pos, i), group) ? 1 : 0
        }
        const index = g.index ? g.index.array : Array.from({ length: pos.count }, (_, i) => i)
        const out = []
        for (let t = 0; t < index.length; t += 3) {
          if (ok[index[t]] && ok[index[t + 1]] && ok[index[t + 2]]) out.push(index[t], index[t + 1], index[t + 2])
        }
        g.setIndex(out)
        g.deleteAttribute("skinIndex")
        g.deleteAttribute("skinWeight")
        if (sm.material.map) sm.material.map.colorSpace = THREE.NoColorSpace
        return new THREE.Mesh(g, sm.material)
      }
      new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load(
        PHOENIX_URL,
        (gltf) => {
          const root = gltf.scene
          root.updateMatrixWorld(true)
          const bone = {}
          const meshes = []

          headPiece.position.y -= HEAD_DOWN

          // (they stick out of the skull only ~1 cm, so they're cut by where they are: 11 cm deep from 2 cm
          // behind the eyes), down to the brows at the temples before them, lower behind them.
          const scalp = (p) => {
            const side = Math.abs(p.x - eyes.x) > 0.068
            const depth = p.z - eyes.z
            if (side && depth > 0.021 && depth < 0.131) return p.y > browY + 0.015
            if (side && depth <= 0.021) return p.y > browY + 0.005

      // relative to each other; the face's transform gives how far he is.
      const pose = { seen: false, left: new THREE.Vector2(), right: new THREE.Vector2(), dz: 0 }
      const torsoPos = new THREE.Vector3()
      const torsoQuat = new THREE.Quaternion()
      let torsoScale = 1
      let torsoSeen = false
      function onRay(u, v, z) {

        return p.multiplyScalar(z / p.z)
      }

        const R = onRay(pose.right.x, pose.right.y, z + pose.dz / 2)

        x.normalize()
        const zAxis = new THREE.Vector3().crossVectors(x, new THREE.Vector3(0, 1, 0)).normalize()
        const y = new THREE.Vector3().crossVectors(zAxis, x)
        const qt = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, zAxis))
        const at = L.clone().add(R).multiplyScalar(0.5)
        // The neck: how high Luan's chin is over his shoulders sets how tall the torso is, so its collar opens
        // under his chin whether he sits up or looks down at the screen.
        if (faceLm && phoenixModel.squash) {
          const [cu, cv] = toScreen(faceLm[152].x, faceLm[152].y)
          const chin = onRay(cu, cv, z)
          const neck = chin.sub(at).dot(y)
          const want = THREE.MathUtils.clamp((neck * NECK) / (phoenixModel.neck * scale * TORSO_K), 0.3, 1.2)
          phoenixModel.squash.scale.y += (want - phoenixModel.squash.scale.y) * 0.4
        }
        if (torsoSeen) {
          torsoPos.lerp(at, 0.45)
          torsoQuat.slerp(qt, 0.45)
          torsoScale += (scale - torsoScale) * 0.45
        } else {
          torsoPos.copy(at)
          torsoQuat.copy(qt)
          torsoScale = scale
        }
        torsoSeen = true
        torso.matrix.compose(torsoPos, torsoQuat, new THREE.Vector3(torsoScale, torsoScale, torsoScale))
      }

      // Luan's face and hands, drawn back over the jacket: a small mask of the face's outline and each hand's
      // outline, painted with the camera.
      const FACE_OVAL = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109]
      const keepCanvas = document.createElement("canvas")
      keepCanvas.width = 960
      keepCanvas.height = 540
      const keepCtx = keepCanvas.getContext("2d")
      const keepTex = new THREE.CanvasTexture(keepCanvas)
      let lastHands = []
      function hull(points) {
        const p = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1])
        const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0])
        const lower = [], upper = []
        for (const v of p) {
          while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], v) <= 0) lower.pop()
          lower.push(v)
        }
        for (const v of p.reverse()) {
          while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], v) <= 0) upper.pop()
          upper.push(v)
        }
        return lower.slice(0, -1).concat(upper.slice(0, -1))
      }
      function drawKeep() {
        const c = keepCtx
        c.clearRect(0, 0, 960, 540)
        c.fillStyle = c.strokeStyle = "#fff"
        c.filter = "blur(4px)"
        c.lineJoin = "round"
        const px = (lm) => {
          const [u, v] = toScreen(lm.x, lm.y)
          return [u * 960, (1 - v) * 540]
        }
        const shape = (pts, pad) => {
          c.beginPath()
          pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)))
          c.closePath()
          c.fill()
          c.lineWidth = pad
          c.stroke()
        }
        if (faceLm) {
          shape(FACE_OVAL.map((i) => px(faceLm[i])), 6)
          const [jl, jr, chin, top] = [172, 397, 152, 10].map((i) => px(faceLm[i]))
          // Tapering to a V like a shirt's neckline, so it doesn't end in a straight cut.
          const down = (chin[1] - top[1]) * 0.3
          const inset = (jr[0] - jl[0]) * 0.14
          const cx = (jl[0] + jr[0]) / 2
          shape([jl, jr, [jr[0] - inset, chin[1] + down * 0.7], [cx, chin[1] + down * 1.25], [jl[0] + inset, chin[1] + down * 0.7]], 6)
        }
        for (const h of lastHands) {
          const pts = h.map(px)
          const palm = Math.hypot(pts[0][0] - pts[9][0], pts[0][1] - pts[9][1])
          shape(hull(pts), palm * 0.45)
        }
        keepTex.needsUpdate = true
      }
      const keepMat = new THREE.ShaderMaterial({
        uniforms: { ...uniforms, uKeep: { value: keepTex } },
        vertexShader: VERT,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform sampler2D uKeep;
          void main() {
            float k = smoothstep(0.2, 0.8, texture2D(uKeep, vUv).r);
            if (k <= 0.0) discard;
            gl_FragColor = vec4(texture2D(uCam, camUv(vUv)).rgb, k);
          }`,
      })
      const keepScene = quad(keepMat)

      // ---------- models ----------
      let gestures, segmenter, faces, poses, delegate
      async function loadModels() {
        const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.2/wasm")
        const make = async (Task, path, opts, d) =>
          Task.createFromOptions(files, { baseOptions: { modelAssetPath: MODELS + path, delegate: d }, runningMode: "VIDEO", ...opts })
        const all = async (d) => {
          delegate = d
          return Promise.all([
            make(GestureRecognizer, "gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task", { numHands: 2 }, d),
            make(
              ImageSegmenter,
              "image_segmenter/selfie_segmenter_landscape/float16/latest/selfie_segmenter_landscape.tflite",
              { outputConfidenceMasks: true, outputCategoryMask: false },
              d,
            ),
            make(FaceLandmarker, "face_landmarker/face_landmarker/float16/1/face_landmarker.task", { numFaces: 1, outputFacialTransformationMatrixes: true }, d),
            make(PoseLandmarker, "pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", { numPoses: 1 }, d),
          ])
        }
        try {
          ;[gestures, segmenter, faces, poses] = await all(q.has("cpu") ? "CPU" : "GPU")
        } catch (e) {
          console.warn("GPU failed, trying CPU", e)
          ;[gestures, segmenter, faces, poses] = await all("CPU")
        }
      }

      // ---------- state ----------
      const MODES = ["bola", "phoenix", "pop", "lente"]
      let mode = MODES.includes(q.get("modo")) ? q.get("modo") : "nenhum"
      let pop = 0
      let ballIn = 0
      const ms = { gesto: 0, corpo: 0, rosto: 0, ombros: 0 }
      let phoenix = 0
      const fire = { on: false, demo: false, amt: 0, at: new THREE.Vector3(0.5, 0.35, 0.1), lastOn: -1e9 }
      const bang = { t0: -1, key: null, startX: 0, hand: new THREE.Vector2(0.75, 0.45), thrown: false }
      const snaps = new Map()
      let faceLm = null
      let videoFrames = 0
      const lens = { amt: 0, pts: [0, 1, 2, 3].map(() => new THREE.Vector2(0.5, 0.5)), on: false }
      let prevMask = null
      let energy = 0
      const prevHands = new Map()
      let pushes = []
      let handInfo = ""

      function setMode(m) {
        mode = MODES.includes(m) ? m : "nenhum"
        titulo.classList.toggle("on", mode === "pop")
        // Phoenix's flash goes with him.
        if (mode !== "phoenix") {
          bang.t0 = -1
          uniforms.uOrbAmt.value = uniforms.uFlashAmt.value = 0
        }
      }
      // The dock's word (obs-browser's emit_event): the filter that should be on, or a one-off.
      addEventListener("muanlartins-filtro", ({ detail }) => {
        if (detail?.filtro && detail.filtro !== mode) setMode(detail.filtro)
        if (detail?.acao === "flash" && mode === "phoenix") startBang(0.75, 0.45, null)
      })
      addEventListener("keydown", (e) => {
        if (e.key === "1") setMode(mode === "pop" ? "nenhum" : "pop")
        if (e.key === "2") setMode(mode === "bola" ? "nenhum" : "bola")
        if (e.key === "3") setMode(mode === "phoenix" ? "nenhum" : "phoenix")
        if (e.key === "4") startBang(0.75, 0.45, null)
        if (e.key === "5") fire.demo = !fire.demo
        if (e.key === "6") setMode(mode === "lente" ? "nenhum" : "lente")
        if (e.key === "0") setMode("nenhum")
      })
      setMode(mode)

      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y)
      // Thumb and index out, the other fingers in: half of the lens's frame.
      function isL(h) {
        const palm = dist(h[0], h[9])
        return dist(h[8], h[5]) > 0.55 * palm && dist(h[4], h[8]) > 0.6 * palm && dist(h[12], h[0]) < 1.25 * palm && dist(h[16], h[0]) < 1.2 * palm
      }

      function runGestures(now) {
        const t0 = performance.now()
        const r = gestures.recognizeForVideo(video, now)
        ms.gesto = performance.now() - t0
        const hands = r.landmarks || []
        lastHands = hands
        // The lens: both hands in an L, while it's the filter on.
        const ls = mode === "lente" ? hands.filter(isL) : []
        handInfo = `${hands.length} mão(s), ${ls.length} em L`
        if (mode === "phoenix") phoenixHands(r, now)
        if (ls.length === 2) {
          ls.sort((a, b) => a[0].x - b[0].x)
          const [L, R] = ls
          const target = [L[8], R[8], R[4], L[4]].map((p) => toScreen(p.x, p.y))
          lens.pts.forEach((v, i) => v.lerp(new THREE.Vector2(...target[i]), lens.on ? 0.6 : 1))
          lens.on = true
        } else lens.on = false
        // Fast hands push Pop's shapes and stir its fire.
        pushes = []
        hands.forEach((h, i) => {
          const [sx, sy] = toScreen(h[9].x, h[9].y)
          const prev = prevHands.get(i)
          if (prev) {
            const v = Math.hypot(sx - prev[0], sy - prev[1]) * 30
            if (v > 0.6) pushes.push({ x: (sx - 0.5) * 2 * halfW, y: (sy - 0.5) * 2 * halfH, v: Math.min(v, 4) * 0.8 })
            energy = Math.max(energy, Math.min(1, v / 3))
          }
          prevHands.set(i, [sx, sy])
        })
        if (!hands.length) prevHands.clear()
      }

      function runBody(now) {
        const t0 = performance.now()
        smallCtx.drawImage(video, 0, 0, MW, MH)
        const r = segmenter.segmentForVideo(small, now)
        const m = r.confidenceMasks?.[0]
        if (m) {
          const f = m.getAsFloat32Array()
          let sum = 0, sx = 0, top = -1, diff = 0
          for (let y = 0; y < MH; y++) {
            let row = 0
            for (let x = 0; x < MW; x++) {
              const i = y * MW + x
              const v = f[i]
              const b = (v * 255) | 0
              if (prevMask) diff += Math.abs(b - prevMask[i])
              maskData[i] = b
              if (v > 0.5) {
                sum++
                sx += x
                row++
              }
            }
            if (top < 0 && row > MW * 0.03) top = y
          }
          prevMask = prevMask || new Uint8Array(MW * MH)
          prevMask.set(maskData)
          maskTex.needsUpdate = true
          energy = Math.max(energy, Math.min(1, diff / (MW * MH * 255) / 0.02))
          if (sum > 50 && top >= 0) {
            const [cx, cy] = toScreen(sx / sum / MW, Math.min(1, top / MH + 0.14))
            uniforms.uCenter.value.lerp(new THREE.Vector2(cx, cy), 0.15)
          }
        }
        r.close()
        ms.corpo = performance.now() - t0
      }

      function runFace(now) {
        const t0 = performance.now()
        const r = faces.detectForVideo(video, now)
        const mat = r.facialTransformationMatrixes?.[0]
        if (mat) {
          const m = new THREE.Matrix4().fromArray(mat.data)
          const p = new THREE.Vector3(), qt = new THREE.Quaternion(), s = new THREE.Vector3()
          m.decompose(p, qt, s)
          if (headSeen) {
            headPos.lerp(p, 0.6)
            headQuat.slerp(qt, 0.6)
            headScale.lerp(s, 0.6)
          } else {
            headPos.copy(p)
            headQuat.copy(qt)
            headScale.copy(s)
          }
          headSeen = true
          head.matrix.compose(headPos, headQuat, headScale)
          faceLm = r.faceLandmarks?.[0] || null
          if (faceLm) faceOval(faceLm)
        } else {
          headSeen = false
          faceLm = null
        }
        ms.rosto = performance.now() - t0
      }

      // The face's oval on screen (forehead top, chin, cheeks), for painting over the hair around it.
      function faceOval(lm) {
        const P = (i) => {
          const [x, y] = toScreen(lm[i].x, lm[i].y)
          return new THREE.Vector2(x * (W / H), y)
        }
        const top = P(10), chin = P(152), l = P(234), r = P(454)
        const c = top.clone().add(chin).multiplyScalar(0.5)
        const up = top.clone().sub(chin)
        const ry = up.length() / 2
        up.normalize()
        uniforms.uFace.value.set(c.x / (W / H), c.y, l.distanceTo(r) / 2, ry)
        uniforms.uFaceUp.value.copy(up)
      }

      function runPose(now) {
        const t0 = performance.now()
        const r = poses.detectForVideo(video, now)
        const lm = r.landmarks?.[0]
        const world = r.worldLandmarks?.[0]
        if (lm && world && lm[11].visibility > 0.4 && lm[12].visibility > 0.4) {
          const l = new THREE.Vector2(...toScreen(lm[11].x, lm[11].y))
          const rr = new THREE.Vector2(...toScreen(lm[12].x, lm[12].y))
          const dz = (world[11].z - world[12].z) * 100
          if (pose.seen) {
            pose.left.lerp(l, 0.5)
            pose.right.lerp(rr, 0.5)
            pose.dz += (dz - pose.dz) * 0.5
          } else {
            pose.left.copy(l)
            pose.right.copy(rr)
            pose.dz = dz
          }
          pose.seen = true
        } else pose.seen = false
        ms.ombros = performance.now() - t0
      }

      // The background's colour, from what the mask says isn't Luan in the frame's top half, for painting
      // over his hair (NVIDIA Broadcast's virtual background is plain blue behind him).
      function sampleBackground() {
        const px = smallCtx.getImageData(0, 0, MW, MH >> 1).data
        let r = 0, g = 0, b = 0, n = 0
        for (let i = 0; i < px.length / 4; i += 3) {
          if (maskData[i] > 40) continue
          r += px[i * 4]
          g += px[i * 4 + 1]
          b += px[i * 4 + 2]
          n++
        }
        if (n > 50) uniforms.uBg.value.lerp(new THREE.Color(r / n / 255, g / n / 255, b / n / 255), 0.2)
      }

      function startBang(x, y, key) {
        if (bang.t0 >= 0) return
        Object.assign(bang, { t0: performance.now(), key, startX: x, thrown: false })
        bang.hand.set(x, y)
      }
      // The orb's path: held in the hand, then thrown to the side the hand moved to (or to the middle).
      function updateBang(now) {
        const t = (now - bang.t0) / 1000
        const u = uniforms
        const R = 0.035
        const { HOLD, FLY, GLARE, FADE } = BANG
        u.uK.value = 0
        u.uRing.value = 0
        u.uFlashAmt.value = 0
        if (t < HOLD) {
          u.uOrb.value.set(bang.hand.x, bang.hand.y, R * easeOutBack(Math.min(1, t / 0.35)))
          u.uOrbAmt.value = 1
        } else if (t < HOLD + FLY) {
          if (!bang.thrown) {
            const dx = bang.hand.x - bang.startX
            const dir = Math.abs(dx) > 0.025 ? Math.sign(dx) : 0
            u.uFrom.value.copy(bang.hand)
            u.uTo.value.set(0.5 + dir * 0.3, 0.6)
            const side = dir || (bang.hand.x > 0.5 ? -1 : 1)
            u.uCtl.value.set((bang.hand.x + u.uTo.value.x) / 2 + side * 0.1, Math.max(bang.hand.y, 0.6) + 0.22)
            bang.thrown = true
          }
          const k = 1 - (1 - (t - HOLD) / FLY) ** 2
          const f = u.uFrom.value, c = u.uCtl.value, e = u.uTo.value
          const x = (1 - k) * (1 - k) * f.x + 2 * (1 - k) * k * c.x + k * k * e.x
          const y = (1 - k) * (1 - k) * f.y + 2 * (1 - k) * k * c.y + k * k * e.y
          u.uOrb.value.set(x, y, R * (1 - 0.3 * k))
          u.uK.value = k
          u.uRing.value = THREE.MathUtils.lerp(0.24, R * 1.05, k)
          u.uOrbAmt.value = 1
        } else if (t < HOLD + FLY + GLARE + FADE) {
          const g = t - HOLD - FLY
          u.uOrbAmt.value = Math.max(0, 1 - g / 0.12)
          u.uFlashAt.value.copy(u.uTo.value)
          u.uFlashAmt.value = Math.min(1, g / 0.06) * (g < GLARE ? 1 : (1 - (g - GLARE) / FADE) ** 1.6)
        } else {
          bang.t0 = -1
          u.uOrbAmt.value = 0
        }
      }

      // Both palms open, fingers up, seen edge on (facing each other), side by side: a fire between them.
      // A thumb pressed to the middle finger and let go with the middle finger landing in the palm: a snap.
      function phoenixHands(r, now) {
        const hands = r.landmarks || []
        const open = []
        hands.forEach((h, i) => {
          const palm = dist(h[0], h[9])
          const fingersOut = [8, 12, 16, 20].every((t) => dist(h[t], h[0]) > 1.3 * palm)
          const upright = h[0].y - h[12].y > 0.9 * palm
          const edgeOn = dist(h[5], h[17]) / palm
          if (fingersOut && upright && edgeOn < 0.8) {
            const c = [0, 5, 9, 13, 17].reduce((a, k) => ({ x: a.x + h[k].x / 5, y: a.y + h[k].y / 5 }), { x: 0, y: 0 })
            open.push({ c, palm })
          }
        })
        // The snap: thumb pressed to the middle finger, then within 0.6 s the hand turns quickly (more than
        // 35° within 0.2 s, flat or twisting) as the fingers part. Not at the face, not with both palms up for
        // the fire or just after it, not while a flash is on.
        const va = video.videoWidth / video.videoHeight || 16 / 9
        hands.forEach((h, i) => {
          const palm = dist(h[0], h[9])
          const key = r.handedness?.[i]?.[0]?.categoryName || String(i)
          const st = snaps.get(key) || { since: now, seen: now, armed: 0, hist: [] }
          if (now - st.seen > 300) Object.assign(st, { since: now, armed: 0, hist: [] })
          st.seen = now
          const atFace = faceLm && dist(h[9], faceLm[1]) < 0.9 * dist(faceLm[234], faceLm[454])
          const allowed = !atFace && now - st.since > 250 && now - fire.lastOn > 1200 && open.length < 2 && bang.t0 < 0
          const angle = Math.atan2(h[17].y - h[5].y, (h[17].x - h[5].x) * va)
          const width = dist(h[5], h[17]) / palm
          st.hist = st.hist.filter((e) => now - e.t < 200)
          let turn = 0, twist = 0
          for (const e of st.hist) {
            let da = Math.abs(angle - e.angle)
            if (da > Math.PI) da = 2 * Math.PI - da
            turn = Math.max(turn, da)
            twist = Math.max(twist, Math.abs(width - e.width))
          }
          st.hist.push({ t: now, angle, width })
          const pinched = dist(h[4], h[12]) < 0.45 * palm
          if (pinched) st.armed = now
          const [ox, oy] = toScreen((h[4].x + h[12].x) / 2, (h[4].y + h[12].y) / 2)
          if (allowed && st.armed && now - st.armed < 600 && !pinched && (turn > 0.6 || twist > 0.35)) {
            startBang(ox, oy, key)
            st.armed = 0
            st.hist = []
          }
          if (bang.t0 >= 0 && bang.key === key) bang.hand.set(ox, oy)
          if (allowed && st.armed && now - st.armed < 600) handInfo += ` · estalo armado (giro ${Math.round((turn * 180) / Math.PI)}°)`
          snaps.set(key, st)
        })
        fire.on = false
        if (open.length === 2) {
          const [a, b] = open
          const gap = Math.abs(a.c.x - b.c.x)
          const palm = (a.palm + b.palm) / 2
          if (gap > 0.6 * palm && gap < 7 * palm && Math.abs(a.c.y - b.c.y) < 1.6 * palm) {
            const [x, y] = toScreen((a.c.x + b.c.x) / 2, (a.c.y + b.c.y) / 2)
            const rad = Math.max(0.04, (gap / cover.sx) * (W / H) * 0.42)
            fire.at.lerp(new THREE.Vector3(x, y, rad), fire.on ? 0.5 : 1)
            fire.on = true
            fire.lastOn = now
          }
        }
        handInfo += fire.on ? " · fogo" : ""
      }

      // ---------- loop ----------
      let lastFrame = -1
      let last = performance.now()
      let frames = 0, fps = 0, fpsAt = last
      let camLabel = ""
      function tick() {
        requestAnimationFrame(tick)
        const now = performance.now()
        const dt = Math.min(0.05, (now - last) / 1000)
        last = now
        const camReady = video.readyState >= 2 && video.videoWidth > 0
        if (!showing || !box || !camReady) {
          renderer.setScissorTest(false)
          renderer.setViewport(0, 0, W, H)
          renderer.clear()
          hud.textContent = `parado: ${!showing ? "fonte fora da tela" : !box ? `sem caixa de câmera na cena "${sceneName}"` : "sem câmera"}` + (errors.length ? "\n" + errors.slice(-3).join("\n") : "")
          return
        }
        if (gestures && video.readyState >= 2 && video.currentTime !== lastFrame) {
          lastFrame = video.currentTime
          try {
            videoFrames++
            // The hands are tracked only for the filters that use them (no gesture switches a filter).
            if (mode === "phoenix" || phoenix > 0 || mode === "pop" || pop > 0 || mode === "lente") runGestures(now)
            else {
              lastHands = []
              pushes = []
              lens.on = false
              fire.on = false
              handInfo = "mãos sem uso"
            }
            if (mode === "pop" || pop > 0) runBody(now)
            const ph = mode === "phoenix" || phoenix > 0
            if (mode === "bola" || ballIn > 0 || ph) runFace(now)
            if (ph) {
              if (ERASE && mode !== "pop" && pop <= 0) runBody(now)
              if (videoFrames % 2 === 0) runPose(now)
              if (ERASE && videoFrames % 15 === 0) sampleBackground()
            }
          } catch (e) {
            fail("modelos", e)
          }
        }
        pop = THREE.MathUtils.clamp(pop + (mode === "pop" ? dt / 0.55 : -dt / 0.4), 0, 1)
        ballIn = THREE.MathUtils.clamp(ballIn + (mode === "bola" ? dt / 0.35 : -dt / 0.25), 0, 1)
        phoenix = THREE.MathUtils.clamp(phoenix + (mode === "phoenix" ? dt / 0.4 : -dt / 0.3), 0, 1)
        const fireWanted = phoenix > 0 && (fire.on || fire.demo)
        if (fire.demo && !fire.on) fire.at.set(0.5, 0.3, 0.11)
        fire.amt = THREE.MathUtils.clamp(fire.amt + (fireWanted ? dt / 0.25 : -dt / 0.35), 0, 1)
        uniforms.uErase.value = headSeen && ERASE ? phoenix : 0
        uniforms.uFire.value.copy(fire.at)
        uniforms.uFireAmt.value = fire.amt
        if (bang.t0 >= 0) updateBang(now)
        lens.amt = THREE.MathUtils.clamp(lens.amt + (lens.on ? dt / 0.15 : -dt / 0.2), 0, 1)
        energy *= Math.pow(0.25, dt)

        uniforms.uTime.value = now / 1000
        uniforms.uPop.value = pop
        uniforms.uEnergy.value = energy
        uniforms.uLensAmt.value = lens.amt
        lens.pts.forEach((v, i) => uniforms.uLens.value[i].copy(v))
        uniforms.uCover.value.set(cover.sx, cover.sy, cover.ox, cover.oy)

        renderer.setScissorTest(false)
        renderer.setViewport(0, 0, W, H)
        renderer.clear()
        const [bx, by, bw, bh] = box
        renderer.setViewport(bx, H - by - bh, bw, bh)
        renderer.setScissor(bx, H - by - bh, bw, bh)
        renderer.setScissorTest(true)
        if (!IN_OBS || mode !== "nenhum" || pop > 0 || ballIn > 0 || phoenix > 0) renderer.render(baseScene, ortho)
        if (pop > 0) {
          updateShapes(dt, pop, pushes)
          renderer.clearDepth()
          renderer.render(back, shapeCam)
          renderer.render(bodyScene, ortho)
          renderer.clearDepth()
          renderer.render(front, shapeCam)
        }
        if (phoenix > 0 && phoenixModel.ready) {
          if (pose.seen && headSeen) {
            placeTorso()
            const k = torsoScale * TORSO_K * easeOutBack(phoenix)
            torso.matrix.compose(torsoPos, torsoQuat, new THREE.Vector3(k, k, k))
            torso.visible = true
            head.visible = false
            renderer.clearDepth()
            renderer.render(ballScene, headCam)
            torso.visible = false
          } else torsoSeen = false
          drawKeep()
          renderer.render(keepScene, ortho)
        }
        hair.visible = phoenix > 0
        hair.scale.set(1, easeOutBack(phoenix), 1)
        ball.visible = ballIn > 0
        // The ball's metal wants strong light; Phoenix's painted textures wash out under it.
        sky.intensity = phoenix > 0 ? 1.7 : 3.2
        key.intensity = phoenix > 0 ? 1.5 : 3
        if ((ballIn > 0 || phoenix > 0) && headSeen) {
          head.visible = true
          ball.scale.setScalar(easeOutBack(ballIn))
          // It turns slowly on the head, on top of the head's own turning (?giro= turns a second, 0 for still).
          ball.rotation.y += dt * BALL_SPIN
          renderer.clearDepth()
          renderer.render(ballScene, headCam)
        }
        if (fire.amt > 0) renderer.render(fireScene, ortho)
        if (lens.amt > 0) renderer.render(lensScene, ortho)
        if (uniforms.uOrbAmt.value > 0) renderer.render(bangScene, ortho)
        // The glare stays in the camera's box (Luan's call), from where the orb popped.
        if (uniforms.uFlashAmt.value > 0) renderer.render(flashScene, ortho)

        frames++
        if (now - fpsAt > 500) {
          fps = (frames * 1000) / (now - fpsAt)
          frames = 0
          fpsAt = now
          hud.textContent =
            `${fps.toFixed(0)} fps · ${delegate || "…"} · ${camLabel}\n` +
            `gesto ${ms.gesto.toFixed(1)} ms · corpo ${ms.corpo.toFixed(1)} ms · rosto ${ms.rosto.toFixed(1)} ms · ombros ${ms.ombros.toFixed(1)} ms\n` +
            `${handInfo} · filtro: ${mode}${lens.on ? " · lente" : ""}` +
            (mode === "phoenix" ? `\nphoenix: modelo ${phoenixModel.ready ? "ok" : "carregando"} · rosto ${headSeen ? "sim" : "não"} · ombros ${pose.seen ? "sim" : "não"}` : "") +
            (errors.length ? "\n" + errors.slice(-3).join("\n") : "")
        }
      }

      // Opens the camera, and again every 5 s while it fails (busy, Broadcast restarting).
      async function startCamera() {
        try {
          camLabel = await openCamera()
          setupCamera()
        } catch (e) {
          fail("câmera", e)
          setTimeout(startCamera, 5000)
        }
      }
      function setupCamera() {
        fitCover()
        MH = Math.round((MW * video.videoHeight) / video.videoWidth)
        maskData = new Uint8Array(MW * MH)
        maskTex.dispose()
        maskTex = makeMaskTex()
        uniforms.uMask.value = maskTex
        small.width = MW
        small.height = MH
      }
      startCamera()
      tick()
      loadModels().catch((e) => fail("modelos", e))
    </script>
  </body>
</html>
