<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Filtros · muanlartins</title>
    <!--
      The stream's camera filters, switched from the "Filtros" dock in OBS (filtros-painel.html), not by gestures.
      It opens the camera itself (NVIDIA Broadcast by default, ?cam=<part of the name> for another), tracks hands,
      body and face with MediaPipe in the browser and draws the camera with the filter on top at 1920×1080
      (browser sources need OBS started with --enable-media-stream to open a camera).

      The dock sends "muanlartins-filtro" through obs-browser's emit_event: { filtro: "<id>" } is the filter that
      should be on ("nenhum" for none; the dock repeats it every few seconds, so a reloaded page catches up) and
      { acao: "flash" } fires a one-off. One filter at a time. A new filter: its id in MODES here, what it draws,
      and a line in the dock's FILTROS.

      On the dock:
        Bola  (key 2 in a browser): the ball on the head, turning with it and slowly on itself (a turn in
              about 12 s; ?giro=<turns a second>).
        Phoenix (key 3): Valorant's Phoenix from his model (privado/phoenix.glb, out of git), from the
              front: his hair and faded scalp on the head, his jacket and shirt on the shoulders (?bracos=0
              without the upper arms, ?bracos=2 with the forearms too), Luan's face and hands drawn back over
              them. Its own gestures stay, only while it's on: both palms open and facing each other, as if
              starting a clap, hold a fire between them that grows with the gap (key 5 shows it in the middle);
              a snap with a turn of the hand (thumb on the middle finger, then a quick twist) puts his flash's
              orb in the hand; moving the hand left or right throws it that way, curving, while a ring closes on
              it, and it pops into a warm glare of about 2.5 s (key 4, or the dock's Flash).
        Sova  (key 7): Valorant's Sova the same way (privado/sova.glb, out of git): his slicked-back hair on the
              head, the fur collar, the cape and the folded bow on the back on the shoulders. His abilities,
              drawn (none of them is a model): the bow, by its gesture, only while he's on: one arm stretched out
              to the side and the other hand near the face, as if pulling the string; the bow shows in the far
              hand with an arrow that glows as it's held; letting go shoots a Recon Bolt to the edge of the
              camera, where it sends two sonar rings out and whoever they cross is revealed, in Valorant's red
              outline with the marker over the head (key E, or the dock's Flecha, draws and shoots it by
              itself). From the dock only: the Shock Bolt (Q: an arrow that bursts in an electric blast by him,
              the camera shakes), the Owl Drone (C: an owl-like drone flies in, hovers by his head, tags him with
              a dart, which reveals him, and leaves) and Hunter's Fury (X: the camera darkens and three blasts
              cross it, through him, one after another).
        Octane (key 8) and Fennec (key 9): his face as Rocket League's car, Pixar-style: the car sits on the head
              seen a little from above, turning with it, his own eyes on its windshield and his mouth on its
              bumper (cut from the camera, so it blinks and talks). The dock's Demolição blows it up as in a
              demo and it respawns 2 s later (key D); Flip front-flips it (key F). Models by Jako (CC BY 4.0),
              public/models/. ?carro=<cm across> (30), ?inclinacao=<degrees from above> (24),
              ?comprimento=<length kept, 0..1> (0.8), ?posicao=x,y,z (cm on the face) to tune.
      Kept here but off the dock (Luan, 2026-11-10: only Phoenix and the ball for now):
        Pop   (key 1): the body cut out, in blues, with fire coming off its outline, a pop-art burst behind
              that follows the head, flying shapes the hands push away; it comes in with shards.
        Lente (key 6): two hands in an "L" (thumb and index out): the space between the fingers turns
              psychedelic. It used to work at any time; now only as its own filter.
      Key 0 turns the filter off.

      ?debug shows fps, how long each model takes and the hands seen; ?cpu runs the models on the CPU;
      ?modo=pop|bola|phoenix|sova|octane|fennec|lente starts with a filter on; ?texto=A|B the title's two lines in Pop; it frames the camera as OBS's
      "Enquadramento" crop does (NVIDIA Broadcast's auto frame is off), or ?zoom=1.3 and ?foco=x,y (0..1 of the
      camera's frame, from its top left) for another framing, ?zoom=1 for none; ?phoenix=<url> and ?sova=<url>
      other copies of their models.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
          "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.2/vision_bundle.mjs"
        }
      }
    </script>
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("space-grotesk.ttf");
        font-weight: 300 700;
      }
      html,
      body {

      }
      #titulo b {

      }
    </style>
  </head>
  <body>
    <video id="cam" playsinline muted></video>
    <div id="caixa"><div id="titulo"><small>ao vivo</small><b>muan</b><b>lartins</b></div></div>
    <div id="hud">carregando…</div>
    <script type="module">
      import * as THREE from "three"
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js"
      import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js"
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"
      import { FilesetResolver, GestureRecognizer, ImageSegmenter, FaceLandmarker, PoseLandmarker } from "@mediapipe/tasks-vision"

      const q = new URLSearchParams(location.search)
      const W = 1920
      const H = 1080
      const MODELS = "https://storage.googleapis.com/mediapipe-models/"
      const hud = document.getElementById("hud")
      const titulo = document.getElementById("titulo")
      if (q.has("debug")) hud.style.display = "block"
      if (q.get("texto")) {
        const [a, b] = q.get("texto").split("|")
        titulo.querySelectorAll("b")[0].textContent = a || ""
        titulo.querySelectorAll("b")[1].textContent = b || ""
      }
      // In OBS the page is one full-screen source in every scene with the camera, just above it: it draws the camera
      // with the filter exactly in that scene's camera box (positions from brand/twitch/obs.py) and stays clear
      // while no filter is on; everything, the flash's glare too, stays in that box. Opened in a browser it fills the window
      // with the camera. ?caixa=x,y,w,h forces a box (1920×1080 pixels).
      const IN_OBS = !!window.obsstudio
      const BOXES = {
        "RL + chat": [44, 740, 480, 270],
        "Valorant + chat": [44, 44, 480, 270],
        Conversa: [64, 64, 1280, 720],
        Fim: [64, 64, 1280, 720],
        Terapia: [64, 64, 560, 315],
      }
      let box = q.get("caixa") ? q.get("caixa").split(",").map(Number) : IN_OBS ? null : [0, 0, 1920, 1080]
      let showing = true
      let sceneName = ""
      if (!IN_OBS) document.body.classList.add("solo")
      function setBox(b) {
        box = b
        const c = document.getElementById("caixa")
        c.style.display = b ? "block" : "none"
        if (b) Object.assign(c.style, { left: `${(b[0] / 1920) * 100}%`, top: `${(b[1] / 1080) * 100}%`, width: `${(b[2] / 1920) * 100}%`, height: `${(b[3] / 1080) * 100}%` })
      }
      setBox(box)
      if (IN_OBS && !q.get("caixa")) {
        window.obsstudio.getCurrentScene?.((scene) => {
          sceneName = scene?.name
          setBox(BOXES[scene?.name] || null)
        })
        addEventListener("obsSceneChanged", (e) => {
          sceneName = e.detail?.name
          setBox(BOXES[e.detail?.name] || null)
        })
      }
      // Off screen (a scene without it), it stops tracking and drawing.
      addEventListener("obsSourceActiveChanged", (e) => (showing = !!e.detail?.active))
      const errors = []
      const fail = (where, e) => {
        console.error(where, e?.name || "", e?.message || e)
        errors.push(`${where}: ${e?.name ? e.name + " " : ""}${e?.message || e}`)
        // On screen only with ?debug: in OBS it would go out on the live (2026-11-09, the camera refused because OBS
        // was opened without its flags). The error is in OBS's log either way, as [obs-browser: 'Filtros'].
      }

      // ---------- camera ----------
      const video = document.getElementById("cam")
      async function openCamera() {
        const want = (q.get("cam") || "NVIDIA Broadcast").toLowerCase()
        // The format OBS's own Câmera uses, since NVIDIA Broadcast's camera serves several apps at once only in one format.
        const size = { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } }
        const open = (deviceId) => navigator.mediaDevices.getUserMedia({ video: { ...size, deviceId: { exact: deviceId } }, audio: false })
        // The wanted camera by its name, never the system's default first: that's often the physical webcam, which
        // NVIDIA Broadcast holds for itself ("device in use"). Names show only once some camera was opened, so
        // until then each camera is tried in turn.
        let cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput")
        let stream = null
        let pick = cams.find((d) => d.label.toLowerCase().includes(want))
        if (!pick) {
          for (const c of cams) {
            try {
              stream = await open(c.deviceId)
              break
            } catch {}
          }
          cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput")
          pick = cams.find((d) => d.label.toLowerCase().includes(want))
        }
        if (pick && stream?.getVideoTracks()[0].getSettings().deviceId !== pick.deviceId) {
          stream?.getTracks().forEach((t) => t.stop())
          stream = await open(pick.deviceId)
        }
        if (!stream) throw new Error(`nenhuma câmera abriu (${cams.map((c) => c.label || "?").join(", ")})`)
        video.srcObject = stream
        await video.play()
        await new Promise((r) => (video.videoWidth ? r() : video.addEventListener("loadedmetadata", r, { once: true })))
        return stream.getVideoTracks()[0].label
      }

      // ---------- rendering ----------
      THREE.ColorManagement.enabled = false
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" })
      renderer.setClearColor(0x000000, 0)
      renderer.outputColorSpace = THREE.LinearSRGBColorSpace
      renderer.setPixelRatio(1)
      renderer.setSize(W, H, false)
      renderer.autoClear = false
      document.body.prepend(renderer.domElement)

      const camTex = new THREE.VideoTexture(video)
      camTex.colorSpace = THREE.NoColorSpace
      camTex.minFilter = camTex.magFilter = THREE.LinearFilter

      // The body mask, from a small copy of the frame; mipmaps blur it for free, which is what the outline and
      // the fire are made of.
      const MW = 256
      let MH = 144
      let maskData = new Uint8Array(MW * MH)
      let maskTex = makeMaskTex()
      function makeMaskTex() {
        const t = new THREE.DataTexture(maskData, MW, MH, THREE.RedFormat, THREE.UnsignedByteType)
        t.minFilter = THREE.LinearMipmapLinearFilter
        t.magFilter = THREE.LinearFilter
        t.generateMipmaps = true
        t.needsUpdate = true
        return t
      }
      const small = document.createElement("canvas")
      const smallCtx = small.getContext("2d", { willReadFrequently: true })

      // Screen uv (0..1, y up) ↔ video uv: the video covers the canvas, zoomed in on ?foco by ?zoom.
      const cover = { sx: 1, sy: 1, ox: 0, oy: 0 }
      function fitCover() {
        const va = video.videoWidth / video.videoHeight
        const ca = W / H
        if (va > ca) Object.assign(cover, { sx: ca / va, sy: 1, ox: (1 - ca / va) / 2, oy: 0 })
        else Object.assign(cover, { sx: 1, sy: va / ca, ox: 0, oy: (1 - va / ca) / 2 })
        // By default the same framing as OBS's "Enquadramento" crop (CAMERA_CROP in brand/twitch/obs_shorts.py:
        // 310, 360, 330, 0 of 1920×1080, 1280×720 kept), since the page opens the camera itself, without OBS's filters.
        const zoom = Math.max(1, Number(q.get("zoom") || 1920 / 1280))
        if (zoom > 1) {
          const [fx, fy] = (q.get("foco") || `${(310 + 640) / 1920},${(360 + 360) / 1080}`).split(",").map(Number)
          const sx = cover.sx / zoom
          const sy = cover.sy / zoom
          const clamp = (v, max) => Math.min(Math.max(v, 0), max)
          Object.assign(cover, { sx, sy, ox: clamp(fx - sx / 2, 1 - sx), oy: clamp(1 - fy - sy / 2, 1 - sy) })
        }
        // The 3D camera sees the whole frame at MediaPipe's 63°, and renders only the part on screen.
        const fullW = W / cover.sx
        const fullH = H / cover.sy
        headCam.aspect = fullW / fullH
        headCam.setViewOffset(fullW, fullH, cover.ox * fullW, (1 - cover.oy - cover.sy) * fullH, W, H)
      }
      // A point in the video image (x right, y down, 0..1) to screen uv.
      const toScreen = (x, y) => [(x - cover.ox) / cover.sx, (1 - y - cover.oy) / cover.sy]

      const GLSL_COMMON = /* glsl */ `
        uniform sampler2D uCam;
        uniform sampler2D uMask;
        uniform vec4 uCover;
        uniform float uTime;
        uniform float uAspect;
        varying vec2 vUv;
        vec2 camUv(vec2 uv) { return uv * uCover.xy + uCover.zw; }
        float maskAt(vec2 uv, float lod) { vec2 v = camUv(uv); return textureLod(uMask, vec2(v.x, 1.0 - v.y), lod).r; }
        float hash(float n) { return fract(sin(n * 127.1) * 43758.5453); }
        float hash2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash2(i), hash2(i + vec2(1, 0)), f.x), mix(hash2(i + vec2(0, 1)), hash2(i + vec2(1, 1)), f.x), f.y);
        }
        float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * noise(p); p *= 2.03; a *= 0.5; } return s; }
        float lum(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
        const vec3 YELLOW = vec3(1.0, 0.91, 0.05);
        const vec3 CYAN = vec3(0.1, 0.74, 0.97);
        const vec3 MAGENTA = vec3(1.0, 0.17, 0.58);
        const vec3 NAVY = vec3(0.13, 0.09, 0.42);
        const vec3 ORANGE = vec3(1.0, 0.5, 0.08);
        const vec3 BLUE = vec3(0.17, 0.36, 0.96);
        const vec3 LIME = vec3(0.45, 0.95, 0.4);
        // Halftone dots in pixels: 1 inside a dot of radius r (0..0.5 of a cell).
        float dots(vec2 uv, float cell, float r) {
          vec2 px = uv * vec2(${W}.0, ${H}.0);
          vec2 g = mat2(0.7071, -0.7071, 0.7071, 0.7071) * px / cell;
          return step(length(fract(g) - 0.5), r);
        }
        // The shards Pop comes in with: diagonal bands, each a little ahead or behind.
        float reveal(vec2 uv, float p) {
          vec2 d = normalize(vec2(1.0, 0.55));
          float along = dot(uv, d);
          float band = floor(dot(uv, vec2(-d.y, d.x)) * 9.0);
          return step(along, p * 1.75 - 0.15 - hash(band + 3.0) * 0.3);
        }
      `
      const VERT = /* glsl */ `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`

      const uniforms = {
        uCam: { value: camTex },
        uMask: { value: maskTex },
        uCover: { value: new THREE.Vector4(1, 1, 0, 0) },
        uTime: { value: 0 },
        uAspect: { value: W / H },
        uPop: { value: 0 },
        uCenter: { value: new THREE.Vector2(0.55, 0.6) },
        uEnergy: { value: 0 },
        uLens: { value: [0, 1, 2, 3].map(() => new THREE.Vector2()) },
        uLensAmt: { value: 0 },
        // Phoenix: the face's oval (centre, half width and height, its up direction), where Luan's own hair
        // around it is painted over in the background's colour.
        uErase: { value: 0 },
        uFace: { value: new THREE.Vector4(0.5, 0.6, 0.1, 0.15) },
        uFaceUp: { value: new THREE.Vector2(0, 1) },
        uBg: { value: new THREE.Color(0x002fa7) },
        uFire: { value: new THREE.Vector3(0.5, 0.4, 0.1) },
        uFireAmt: { value: 0 },
        // Phoenix's flash: the orb (x, y, radius) and how much of it shows, the curve it flies along (from,
        // control, to) and how far along it is, the ring closing on it, and the glare where it popped.
        uOrb: { value: new THREE.Vector3(0.7, 0.45, 0.035) },
        uOrbAmt: { value: 0 },
        uFrom: { value: new THREE.Vector2() },
        uCtl: { value: new THREE.Vector2() },
        uTo: { value: new THREE.Vector2() },
        uK: { value: 0 },
        uRing: { value: 0 },
        uFlashAt: { value: new THREE.Vector2(0.5, 0.6) },
        uFlashAmt: { value: 0 },
        // Sova: the bow (how much of it shows, the hand holding it, the hand pulling the string, the charge),
        // the arrow in flight (from, to, how far along, recon or shock), the dart stuck where it landed (x, y,
        // how much), its two sonar rings (seconds since each went out, −1 before), the red reveal everywhere
        // (drone, ultimate), the marker over the head, the shock's blast (x, y, seconds since) and the ultimate
        // (seconds since it started, the side the blasts come from, each blast's height, where it aims).
        uBowAmt: { value: 0 },
        uBowA: { value: new THREE.Vector2(0.75, 0.5) },
        uBowB: { value: new THREE.Vector2(0.6, 0.5) },
        uBowSize: { value: 0.12 },
        uCharge: { value: 0 },
        uArrowK: { value: -1 },
        uArrowFrom: { value: new THREE.Vector2() },
        uArrowTo: { value: new THREE.Vector2() },
        uArrowKind: { value: 0 },
        uDart: { value: new THREE.Vector3(0, 0, 0) },
        uPulse: { value: new THREE.Vector2(-1, -1) },
        uReveal: { value: 0 },
        uMark: { value: new THREE.Vector3(0.5, 0.9, 0) },
        uShock: { value: new THREE.Vector3(0.5, 0.5, -1) },
        uUltT: { value: -1 },
        uUltSide: { value: 1 },
        uUltY: { value: new THREE.Vector3(0.6, 0.45, 0.7) },
        uUltAim: { value: new THREE.Vector2(0.5, 0.5) },
        uDartLine: { value: new THREE.Vector4() },
        uDartLineAmt: { value: 0 },
        // The cars' demolition: where (x, y, radius) and seconds since.
        uBoom: { value: new THREE.Vector3(0.5, 0.5, 0.2) },
        uBoomT: { value: -1 },
      }

      // Layer 0: the camera, or Pop's burst and fire where its shards have come in.
      const baseMat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: VERT,
        depthTest: false,
        depthWrite: false,
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform float uPop;
          uniform vec2 uCenter;
          uniform float uEnergy;
          uniform float uErase;
          uniform vec4 uFace;
          uniform vec2 uFaceUp;
          uniform vec3 uBg;
          vec3 burst(vec2 uv, float t) {
            vec2 p = (uv - uCenter) * vec2(uAspect, 1.0);
            float r = length(p);
            float n = 22.0;
            float k = (atan(p.y, p.x) / 6.2831853 + 0.5) * n + t * (0.04 + uEnergy * 0.5);
            k += 0.12 * sin(r * 38.0 + floor(k) * 2.0);
            float id = mod(floor(k), n);
            float h = hash(id + 11.0);
            vec3 c = h < 0.4 ? YELLOW : h < 0.58 ? BLUE : h < 0.7 ? MAGENTA : h < 0.82 ? CYAN : NAVY;
            if (h >= 0.4 && h < 0.58) c = mix(c, NAVY, dots(uv, 13.0, 0.16 + 0.22 * smoothstep(0.1, 0.9, r)));
            if (h >= 0.82) c = mix(c, BLUE, dots(uv, 11.0, 0.3));
            // Flat splashes drifting up, cut with hard edges.
            float b = fbm(p * 2.4 + vec2(0.0, -t * 0.18) + 3.0);
            float b2 = fbm(p * 3.1 + vec2(4.0, -t * 0.25));
            if (b > 0.7) c = MAGENTA; else if (b > 0.68) c = NAVY;
            if (b2 > 0.73) c = CYAN; else if (b2 > 0.715) c = LIME;
            return c;
          }
          // Fire off the body's outline: the mask looked up a little below, blurred, through jumpy noise.
          vec4 fire(vec2 uv, float t) {
            float ts = floor(t * 12.0) / 12.0;
            float n1 = noise(vec2(uv.x * 22.0, uv.y * 7.0 - ts * 5.0));
            float n2 = noise(vec2(uv.x * 12.0 + 9.0, uv.y * 4.0 - ts * 3.5));
            float grow = 1.0 + uEnergy * 1.5;
            float near = maskAt(uv + vec2((n1 - 0.5) * 0.04, -0.045 * (0.3 + n1) * grow), 2.2);
            float far = maskAt(uv + vec2((n2 - 0.5) * 0.08, -0.12 * (0.25 + n2) * grow), 3.4);
            float ring = maskAt(uv, 2.6);
            if (near > 0.5) return vec4(mix(ORANGE, YELLOW, step(0.62, n1)), 1.0);
            if (ring > 0.16) return vec4(ORANGE, 1.0);
            if (far > 0.42) return vec4(mix(MAGENTA, ORANGE, step(0.55, n2)), 1.0);
            if (far > 0.34) return vec4(CYAN, 1.0);
            return vec4(0.0);
          }
          void main() {
            vec3 col = texture2D(uCam, camUv(vUv)).rgb;
            if (uPop > 0.0 && reveal(vUv, uPop) > 0.0) {
              vec3 bg = burst(vUv, uTime);
              vec4 f = fire(vUv, uTime);
              col = mix(bg, f.rgb, f.a);
            }
            if (uErase > 0.0) {
              vec2 d = (vUv - uFace.xy) * vec2(uAspect, 1.0);
              d = vec2(dot(d, vec2(uFaceUp.y, -uFaceUp.x)), dot(d, uFaceUp));
              float keep = length(d / (uFace.zw * vec2(1.03, 1.0)));
              float zone = length(d / (uFace.zw * vec2(2.4, 2.0)));
              if (keep > 1.0 && zone < 1.0 && d.y > -uFace.w * 0.3) {
                float m = smoothstep(0.06, 0.3, maskAt(vUv, 1.6));
                col = mix(col, uBg, m * uErase * smoothstep(1.0, 1.04, keep));
              }
            }
            gl_FragColor = vec4(col, 1.0);
          }`,
      })

      // Layer 1: the body in Pop's blues, over the shapes behind it.
      const bodyMat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: VERT,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform float uPop;
          void main() {
            float m = smoothstep(0.4, 0.6, maskAt(vUv, 0.0));
            if (m <= 0.0 || reveal(vUv, uPop) <= 0.0) discard;
            float l = clamp((lum(texture2D(uCam, camUv(vUv)).rgb) - 0.08) * 1.35, 0.0, 1.0);
            vec3 c = l < 0.22 ? vec3(0.07, 0.05, 0.3) : l < 0.42 ? NAVY * 1.25 : l < 0.62 ? BLUE : vec3(0.55, 0.78, 1.0);
            if (l >= 0.42 && l < 0.62) c = mix(c, NAVY * 1.25, dots(vUv, 9.0, 0.28));
            // A light rim just inside the outline.
            if (maskAt(vUv, 1.6) < 0.8) c = vec3(0.75, 0.95, 1.0);

          }`,
      })

      // Layer 2: the lens between the hands.
      const lensMat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: VERT,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        extensions: { derivatives: true },
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform vec2 uLens[4];
          uniform float uLensAmt;
          float side(vec2 p, vec2 a, vec2 b) { return (b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x); }
          bool inTri(vec2 p, vec2 a, vec2 b, vec2 c) {
            float d1 = side(p, a, b), d2 = side(p, b, c), d3 = side(p, c, a);
            return !((d1 < 0.0 || d2 < 0.0 || d3 < 0.0) && (d1 > 0.0 || d2 > 0.0 || d3 > 0.0));
          }
          float segDist(vec2 p, vec2 a, vec2 b) {
            vec2 pa = p - a, ba = b - a;
            return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0));
          }
          vec3 hsv(float h, float s, float v) {
            vec3 k = clamp(abs(mod(h * 6.0 + vec3(0, 4, 2), 6.0) - 3.0) - 1.0, 0.0, 1.0);
            return v * mix(vec3(1.0), k, s);
          }
          void main() {
            vec2 s = vec2(uAspect, 1.0);
            vec2 p = vUv * s;
            vec2 a = uLens[0] * s, b = uLens[1] * s, c = uLens[2] * s, d = uLens[3] * s;
            float edge = min(min(segDist(p, a, b), segDist(p, b, c)), min(segDist(p, c, d), segDist(p, d, a)));
            bool inside = inTri(p, a, b, c) || inTri(p, a, c, d);
            if (!inside && edge > 0.004) discard;
            vec3 cam = texture2D(uCam, camUv(vUv)).rgb;
            float l = lum(cam);
            float h = fract(l * 2.6 + uTime * 0.35 + (vUv.x - vUv.y) * 0.6);
            vec3 col = hsv(h, 0.95, 1.0);
            col = mix(col, 1.0 - col, step(0.55, fract(l * 5.0 - uTime * 0.5)) * 0.5);
            col *= 1.0 - smoothstep(0.02, 0.09, fwidth(l) * 6.0) * 0.85;
            col = mix(col, vec3(0.0), step(hash2(floor(vUv * vec2(640.0, 360.0)) + floor(uTime * 24.0)), 0.12) * 0.5);
            if (edge < 0.004) col = vec3(1.0);
            gl_FragColor = vec4(col, uLensAmt);
          }`,
      })

      const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1)
      const quad = (mat) => {
        const s = new THREE.Scene()
        s.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat))
        return s
      }
      const baseScene = quad(baseMat)
      const bodyScene = quad(bodyMat)
      const lensScene = quad(lensMat)

      // Phoenix's fire between the palms: a flame shaped like a drop pointing up, licking upwards, with
      // embers and a glow, added on top (it lights what's behind it).
      const fireMat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: VERT,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform vec3 uFire;
          uniform float uFireAmt;
          void main() {
            vec2 p = (vUv - uFire.xy) * vec2(uAspect, 1.0) / max(uFire.z, 0.01);
            float r = length(p);
            if (r > 2.8) discard;
            float t = uTime;
            vec2 q = vec2(p.x * 1.05, p.y + 0.2);
            q.y *= q.y > 0.0 ? 0.5 : 1.15;
            float n = fbm(vec2(p.x * 2.4, p.y * 1.7 - t * 2.8));
            float n2 = fbm(vec2(p.x * 4.6 + 3.0, p.y * 3.2 - t * 4.4));
            float f = clamp((1.0 - length(q) + (n - 0.5) * 1.0 + (n2 - 0.5) * 0.45) * 1.7, 0.0, 1.0);
            // Flat bands with hard edges, like Valorant's painted fire: red rim, orange, gold, a white-hot core.
            vec3 col = f < 0.12 ? vec3(0.0) : f < 0.3 ? vec3(0.85, 0.16, 0.02) : f < 0.55 ? vec3(1.0, 0.45, 0.04)
              : f < 0.8 ? vec3(1.0, 0.78, 0.2) : vec3(1.0, 0.97, 0.82);
            vec3 c = col + vec3(1.0, 0.42, 0.08) * exp(-r * 1.6) * 0.35;
            for (int i = 0; i < 18; i++) {
              float fi = float(i);
              float life = fract(t * (0.45 + hash(fi + 7.0) * 0.4) + hash(fi));
              vec2 e = vec2((hash(fi + 1.3) - 0.5) * 1.5 + sin(t * 3.0 + fi) * 0.12, -0.1 + life * 2.3);
              c += vec3(1.0, 0.62, 0.18) * smoothstep(0.055, 0.0, length(p - e)) * (1.0 - life);
            }
            gl_FragColor = vec4(c * uFireAmt, 1.0);
          }`,
      })
      const fireScene = quad(fireMat)

      // Phoenix's flash (Curveball), after the game's: an orange orb with a dark red heart, a white-hot rim and
      // flares, held in the hand, then thrown along a curve with a trail while a ring closes on it; when the
      // ring meets it, it pops into a warm glare with rays of light from where it popped, that holds and fades.
      const BANG = { HOLD: 1.0, FLY: 0.65, GLARE: 1.6, FADE: 1.0 }
      const bangMat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: VERT,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform vec3 uOrb;
          uniform float uOrbAmt;
          uniform vec2 uFrom;
          uniform vec2 uCtl;
          uniform vec2 uTo;
          uniform float uK;
          uniform float uRing;
          vec2 bez(float s) { return mix(mix(uFrom, uCtl, s), mix(uCtl, uTo, s), s); }
          float seg(vec2 p, vec2 a, vec2 b) {
            vec2 pa = p - a, ba = b - a;
            return length(pa - ba * clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0));
          }
          void main() {
            vec2 a = vec2(uAspect, 1.0);
            vec2 d = (vUv - uOrb.xy) * a;
            float r = length(d);
            float R = uOrb.z;
            float ang = atan(d.y, d.x);
            float body = smoothstep(R, R * 0.9, r);
            vec3 orb = mix(vec3(0.5, 0.02, 0.02), vec3(1.0, 0.24, 0.08),
              smoothstep(0.0, 0.7 * R, r + 0.14 * R * sin(uTime * 9.0 + ang * 3.0)));
            orb = mix(orb, vec3(1.0, 0.95, 0.86), smoothstep(0.6 * R, 0.88 * R, r) * body);
            vec3 c = orb * body;
            float out_ = max(r - R, 0.0);
            float flares = pow(max(0.0, cos(ang * 3.0 + uTime * 2.0)), 14.0) + pow(max(0.0, cos(ang * 2.0 - uTime * 1.3 + 1.0)), 20.0);
            c += vec3(1.0, 0.42, 0.12) * (exp(-out_ / (R * 0.8)) * 0.9 + flares * exp(-out_ / (R * 2.4)) * 0.9) * (1.0 - body);
            // The trail: a continuous streak along the curve behind it, thinning out.
            if (uK > 0.0) {
              float best = 1e9;
              vec2 prev = bez(uK) * a;
              for (int i = 1; i < 16; i++) {
                float f = float(i) / 15.0;
                float s = max(uK - 0.4 * f, 0.0);
                vec2 cur = bez(s) * a;
                best = min(best, seg(vUv * a, prev, cur) / max(1.0 - f, 0.05));
                prev = cur;
                if (s <= 0.0) break;
              }
              c += vec3(1.0, 0.36, 0.1) * smoothstep(R * 0.7, 0.0, best) * 0.9;
            }
            if (uRing > 0.0) {
              float e = abs(r - uRing);
              c += vec3(1.0, 0.72, 0.42) * (smoothstep(0.005, 0.0, e) + 0.3 * exp(-e / 0.01));
            }
            float alpha = clamp(max(c.r, max(c.g, c.b)), 0.0, 1.0);
            if (alpha <= 0.002) discard;
            gl_FragColor = vec4(c / alpha, alpha * uOrbAmt);
          }`,
      })
      const bangScene = quad(bangMat)
      const flashMat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: VERT,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform vec2 uFlashAt;
          uniform float uFlashAmt;
          void main() {
            vec2 d = (vUv - uFlashAt) * vec2(uAspect, 1.0);
            float r = length(d);
            float ang = atan(d.y, d.x);
            float rays = pow(abs(sin(ang * 7.0 + 0.3)), 18.0) + 0.8 * pow(abs(sin(ang * 11.0 + 1.7)), 30.0)
              + pow(abs(sin(ang * 4.0 + uTime * 0.15)), 40.0);
            rays *= exp(-r * 0.8);
            vec3 col = vec3(0.86, 0.6, 0.5) + vec3(1.0, 0.8, 0.66) * rays * 0.6 + vec3(1.0, 0.96, 0.9) * exp(-r * 4.0);
            gl_FragColor = vec4(min(col, vec3(1.0)), uFlashAmt * clamp(0.84 + 0.4 * exp(-r * 3.0) + rays * 0.3, 0.0, 1.0));
          }`,
      })
      const flashScene = quad(flashMat)

      // Sova's abilities, drawn over everything in the camera's box: the bow with its arrow, the arrow in flight,
      // the Recon Bolt's dart with its two sonar rings, Valorant's red reveal on Luan (the body mask's outline)
      // with the marker over the head, the Shock Bolt's blast, the drone's dart and Hunter's Fury's three blasts.
      // Premultiplied: solid things go over, light adds.
      const sovaMat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: VERT,
        transparent: true,
        depthTest: false,
        depthWrite: false,
        blending: THREE.CustomBlending,
        blendSrc: THREE.OneFactor,
        blendDst: THREE.OneMinusSrcAlphaFactor,
        blendSrcAlpha: THREE.OneFactor,
        blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
        fragmentShader: /* glsl */ `
          ${GLSL_COMMON}
          uniform float uBowAmt;
          uniform vec2 uBowA;
          uniform vec2 uBowB;
          uniform float uBowSize;
          uniform float uCharge;
          uniform float uArrowK;
          uniform vec2 uArrowFrom;
          uniform vec2 uArrowTo;
          uniform float uArrowKind;
          uniform vec3 uDart;
          uniform vec2 uPulse;
          uniform float uReveal;
          uniform vec3 uMark;
          uniform vec3 uShock;
          uniform float uUltT;
          uniform float uUltSide;
          uniform vec3 uUltY;
          uniform vec2 uUltAim;
          uniform vec4 uDartLine;
          uniform float uDartLineAmt;
          const vec3 SKY = vec3(0.3, 0.82, 1.0);
          const vec3 ICE = vec3(0.86, 0.97, 1.0);
          const vec3 RED = vec3(1.0, 0.27, 0.33);
          const float RING_SPEED = 1.5;
          float seg(vec2 p, vec2 a, vec2 b) {
            vec2 pa = p - a, ba = b - a;
            return length(pa - ba * clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0));
          }
          void over(inout vec4 o, vec3 c, float a) { o = vec4(c * a, a) + o * (1.0 - a); }
          // An arrow lying from tail to tip: shaft, glowing head, light along it.
          void arrow(inout vec4 o, inout vec3 glow, vec2 p, vec2 tail, vec2 tip, float L, float charge, float kind) {
            vec2 u = normalize(tip - tail);
            vec2 n = vec2(-u.y, u.x);
            float shaft = seg(p, tail, tip - u * L * 0.12);
            over(o, mix(vec3(0.75, 0.8, 0.9), ICE, kind), smoothstep(L * 0.022, L * 0.012, shaft));
            vec2 h = p - tip;
            float along = dot(h, u), across = dot(h, n);
            // The head: a long diamond, cyan for the recon, white-hot for the shock.
            float head = abs(across) / (L * 0.07) + abs(along + L * 0.09) / (L * 0.12);
            vec3 hc = mix(SKY, ICE, kind);
            over(o, mix(hc, vec3(1.0), 0.35), smoothstep(1.05, 0.9, head));
            float r = length(h + u * L * 0.08);
            glow += hc * (exp(-r / (L * (0.08 + 0.12 * charge))) * (0.35 + 0.9 * charge) + exp(-shaft / (L * 0.03)) * 0.25 * charge);
          }
          void main() {
            vec2 A = vec2(uAspect, 1.0);
            vec2 p = vUv * A;
            vec4 o = vec4(0.0);
            vec3 glow = vec3(0.0);

            // Hunter's Fury: the camera darkens while it lasts.
            if (uUltT >= 0.0) {
              float dim = smoothstep(0.0, 0.5, uUltT) * (1.0 - smoothstep(3.3, 3.9, uUltT));
              float vig = length((vUv - 0.5) * vec2(1.0, 0.8));
              over(o, vec3(0.01, 0.03, 0.12), dim * (0.3 + 0.5 * vig));
            }

            // The sonar rings, and how revealed this pixel is.
            float rv = uReveal;
            if (uDart.z > 0.0) {
              float d = length(p - uDart.xy * A);
              for (int i = 0; i < 2; i++) {
                float t = i == 0 ? uPulse.x : uPulse.y;
                if (t < 0.0) continue;
                float R = t * RING_SPEED;
                float passed = R - d;
                if (passed > 0.0) rv = max(rv, exp(-passed / (RING_SPEED * 0.9)));
                float e = abs(d - R);
                float fade = 1.0 - smoothstep(1.6, 2.4, R);
                glow += SKY * (smoothstep(0.005, 0.0, e) + exp(-e / 0.016) * 0.3 * step(d, R)) * fade;
                if (passed > 0.0 && passed < 0.07) glow += SKY * 0.2 * step(0.5, fract(d * 180.0 - uTime * 4.0)) * (1.0 - passed / 0.07) * fade;
              }
            }
            // Revealed: Valorant's red outline round the body and a light red over it.
            if (rv > 0.003) {
              float body = maskAt(vUv, 0.0);
              float halo = (1.0 - smoothstep(0.35, 0.6, body)) * smoothstep(0.06, 0.32, maskAt(vUv, 2.4));
              float rim = smoothstep(0.45, 0.6, body) * (1.0 - smoothstep(0.75, 0.95, maskAt(vUv, 1.4)));
              over(o, RED, 0.2 * smoothstep(0.45, 0.6, body) * rv);
              glow += RED * (halo * 0.9 + rim * 0.8) * rv;
            }

            // The drone's dart: a streak from the drone to Luan.
            if (uDartLineAmt > 0.0) {
              vec2 a = uDartLine.xy * A, b = uDartLine.zw * A;
              float d = seg(p, a, b);
              glow += SKY * (smoothstep(0.004, 0.0, d) + exp(-d / 0.012) * 0.4) * uDartLineAmt;
            }

            // The Shock Bolt's blast: a white flash, a ring, jagged bolts that flicker.
            if (uShock.z >= 0.0) {
              float t = uShock.z;
              vec2 d = p - uShock.xy * A;
              float r = length(d);
              float R = 0.2 * (1.0 - exp(-t * 9.0));
              float fade = 1.0 - smoothstep(0.35, 0.9, t);
              glow += ICE * exp(-r / 0.035) * exp(-t * 4.0) * 2.0;
              glow += SKY * smoothstep(0.006, 0.0, abs(r - R)) * fade;
              float flick = floor(t * 24.0);
              for (int k = 0; k < 7; k++) {
                float fk = float(k);
                float th = hash(fk * 3.1 + flick) * 6.2831853;
                vec2 u = vec2(cos(th), sin(th));
                float along = dot(d, u);
                float perp = dot(d, vec2(-u.y, u.x)) - (noise(vec2(along * 45.0 + fk * 7.0, flick)) - 0.5) * 0.035;
                if (along > 0.0 && along < R * 1.35) {
                  float w = 1.0 - along / (R * 1.35);
                  glow += (ICE * smoothstep(0.0035, 0.0, abs(perp)) + SKY * exp(-abs(perp) / 0.009) * 0.5) * fade * w;
                }
              }
            }

            // Hunter's Fury: three blasts crossing the camera from one side, each after a thin aiming line.
            if (uUltT >= 0.0) {
              for (int i = 0; i < 3; i++) {
                float fi = float(i);
                float tau = uUltT - (0.75 + 0.95 * fi);
                if (tau < -0.4 || tau > 0.6) continue;
                float y = i == 0 ? uUltY.x : i == 1 ? uUltY.y : uUltY.z;
                vec2 P = vec2(uUltAim.x, y) * A;
                float ang = (fi - 1.0) * 0.07 * uUltSide;
                vec2 dir = vec2(cos(ang), sin(ang)) * -uUltSide;
                vec2 n = vec2(-dir.y, dir.x);
                float dp = abs(dot(p - P, n));
                float s = uUltSide > 0.0 ? uAspect - p.x : p.x;
                if (tau < 0.0) {
                  glow += SKY * smoothstep(0.0025, 0.0, dp) * 0.7 * smoothstep(-0.4, -0.25, tau);
                  continue;
                }
                float w = 0.06 * min(1.0, tau / 0.05) * (1.0 - smoothstep(0.12, 0.6, tau));
                float reach = step(s, tau * 8.0);
                float nz = noise(vec2(s * 26.0 - tau * 90.0, dp * 50.0));
                float dq = dp + (nz - 0.5) * w * 0.5;
                float core = smoothstep(w * 0.42, w * 0.1, dq);
                float mid = smoothstep(w, w * 0.35, dq);
                glow += (ICE * core * 1.3 + SKY * mid * 0.9 + vec3(0.15, 0.4, 1.0) * exp(-dq / (w * 0.9 + 0.001)) * 0.55) * reach;
              }
            }

            // The dart stuck where the Recon Bolt landed: a spiky cyan light, pulsing.
            if (uDart.z > 0.0) {
              vec2 d = p - uDart.xy * A;
              float r = length(d);
              float spikes = pow(max(0.0, cos(atan(d.y, d.x) * 4.0 + uTime * 2.0)), 6.0);
              float beat = 0.8 + 0.2 * sin(uTime * 14.0);
              over(o, ICE, smoothstep(0.011, 0.007, r) * uDart.z);
              glow += SKY * (exp(-r / 0.022) * 0.8 + spikes * exp(-r / 0.03) * 0.5) * uDart.z * beat;
            }

            // The bow: an arc through the hand holding it, its tips curving back, the string to the hand pulling it
            // and the arrow on it.
            if (uBowAmt > 0.0) {
              vec2 a = uBowA * A, b = uBowB * A;
              vec2 u = normalize(a - b + vec2(1e-5, 0.0));
              vec2 n = vec2(-u.y, u.x);
              float L = uBowSize * uBowAmt;
              float Rc = 1.336 * L;
              vec2 C = a - u * Rc;
              vec2 cp = p - C;
              float ang = acos(clamp(dot(normalize(cp + 1e-6), u), -1.0, 1.0));
              float th = L * (0.075 - 0.04 * ang / 0.846);
              float dArc = abs(length(cp) - Rc);
              if (ang < 0.846) {
                over(o, vec3(0.07, 0.09, 0.17), smoothstep(th, th * 0.7, dArc) * uBowAmt);
                float edge = abs(length(cp) - (Rc + th * 0.45));
                glow += SKY * (smoothstep(th * 0.25, 0.0, edge) * 0.9 + exp(-dArc / (L * 0.05)) * 0.2) * uBowAmt;
              }
              vec2 t1 = C + Rc * (u * cos(0.846) + n * sin(0.846));
              vec2 t2 = C + Rc * (u * cos(0.846) - n * sin(0.846));
              glow += SKY * (exp(-length(p - t1) / (L * 0.04)) + exp(-length(p - t2) / (L * 0.04))) * 0.7 * uBowAmt;
              float nockAmt = uCharge >= 0.0 ? 1.0 : 0.0;
              vec2 nock = mix(a - u * L * 0.45, b, nockAmt);
              float str = min(seg(p, t1, nock), seg(p, t2, nock));
              over(o, ICE, smoothstep(L * 0.014, L * 0.006, str) * uBowAmt);
              if (uCharge >= 0.0) arrow(o, glow, p, b, a + u * L * 0.55, L * 2.2, uCharge, 0.0);
            }

            // The arrow in flight, with its trail.
            if (uArrowK >= 0.0) {
              vec2 f = uArrowFrom * A, to = uArrowTo * A;
              vec2 u = normalize(to - f + vec2(1e-5, 0.0));
              vec2 P = mix(f, to, uArrowK);
              vec2 tail = P - u * min(0.45, length(P - f) + 0.02);
              float d = seg(p, tail, P);
              float k = clamp(dot(p - tail, u) / max(length(P - tail), 1e-4), 0.0, 1.0);
              vec3 tc = mix(SKY, ICE, uArrowKind);
              glow += tc * (smoothstep(0.004, 0.0, d) * 0.8 + exp(-d / 0.01) * 0.4) * k * k;
              arrow(o, glow, p, P - u * 0.09, P, 0.26, 1.0, uArrowKind);
            }

            // The marker over a revealed head.
            if (uMark.z > 0.0) {
              vec2 m = (p - uMark.xy * A) / 0.021;

        g.deleteAttribute("skinWeight")

      }
      for (const [id, a] of Object.entries(AGENTS)) {
