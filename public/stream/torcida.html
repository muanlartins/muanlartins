    <title>Torcida · muanlartins</title>
    <link rel="stylesheet" href="stream.css" />
    <link rel="stylesheet" href="torcedor.css" />
    <!--
      OBS: Browser source, 1920×1080, in the game scenes over palco.html, moved
      348 px right: there its stand (596 to 1556 on the page, at the bottom, 178 px tall) is 944 to 1904, in the
      band under the game (y 902 to 1080, under palco's line on the game's edge), beside the game's plate and numbers,
      where it covers nothing (since 2026-11-23; until then it stood over the game, at the bottom centre). The VAR's
      scenes have it where the page puts it, under the booth's monitor and vote. ?altura= (178; 120 to 380), ?x= and
      ?largura= (640 to 1280) move and size it. Only its moments pass over the game: the balloons by the talker's face,
      the banners, the captions, confetti, a jump. The crowd: one fan
      for each viewer logged in to the chat (Twitch's membership events, as in
      presenca.html: only who has the chat open, about 10 s late), their name
      on their row's riser and their rank's emblem pinned on their shirt (their Σ in Rocket League's ranks, or
      Valorant's with ?jogo=valorant). Twenty seats at most, in two rows of ten, spread over the stand's width (Luan, 2026-11-23: room for
      the names; "realisticamente só precisamos de um espaço pra 20 pessoas"). Σ is a perk there, never a lock (Luan,
      2026-11-23): the channel and then the most Σ (sigma.js) stand at the front row's centre and outwards, then the row
      behind; with more in the chat the top 20 by Σ sit, and whoever talks or acts without a seat borrows the
      lowest-Σ quiet fan's while they keep at it (arrumar(), below). Every name
      is always up under its fan, cut to its first 8 characters (6 when 8 don't fit the seat at 18 px); the talker's
      balloon has it whole.

      Each fan is their 3D fan (since 2026-11-23: torcedor3d/, their look from /perfil, or their 2D one turned 3D),
      drawn by arquibancada3d.js from pictures baked a few at a time (fas3d.js), never as 3D on every frame.

      It reacts to the game as the "Partidas" dock sends it (partidas.html,
      through obs-browser's emit_event), whatever the game. Rocket League: our
      goal is everyone's own celebration rippling along the stand, confetti, the speed, and a goal dedicated to someone
      drawn from the stand, who comes forward to the rail; theirs, a slump; our saves, a cheer. Valorant
      (scripts/valorant.py reads the Riot Client): each round won is a smaller
      party with the score, a round lost a slump, and a match won the full
      party with the win dedicated. The dedication is drawn by Σ, flattened.
      ?jogo=valorant (the Valorant scene's source) hears the rounds and the
      Σ in Valorant's ranks; until 2026-11-23, when the stand stood over the
      game, it tucked the stand away during a match. ?jogo=diversos
      (the scene for any other game, Diversos + chat) reacts to no game at all:
      no goals, saves, rounds or matches, the Σ in the channel's own ranks
      (Rocket League's, as the site shows them); the chat, the arrivals, the
      captions and the VAR stay. What
      a viewer says in the chat: their fan comes forward to the rail with the line in a balloon by their face for a few
      seconds (three wait at most); they move their own fan with !pula,
      !danca, !comemora, !grito, !ola (comandos.js), and every ?dicas= minutes (6; 0 for none) the channel's own fan
      says one of the chat's commands and does it (comandos.json's tips). Each fan's look is their profile on the site
      (/perfil), or what their login gives them.

      On air, each dedication goes to the Σ API (POST /dedicatoria, with the key), which keeps it for the viewer's
      page on the site (/torcedor/<login>). (The end credits listed the day's until 2026-11-21, when the live's numbers
      took their place.)

      Goals are narrated in the narrator's voice by scripts/narrador.py, running
      on this PC (?narrador= its address, ?narrador=0 for none); OBS sends this
      source's sound to the stream only, never to the recording.

      While the stream is on, it credits Σ to whoever is in the chat, once a
      minute: ?sigma= the Σ API, and #chave= its key, set only in OBS.

      The VAR (the Efeitos dock's "muanlartins-var" events; var.html draws the rest): while it's open everyone wears
      the referee's kit (torcedor3d/vestir.js, baked again fan by fan, their own look kept for when it closes) and the
      rail goes referee yellow; who votes in the
      chat (!1, !2, !3, counted by the dock) holds up a card with their number. On the verdict, who voted for it
      celebrates and the rest slump, and, on air and with the key, the Σ API credits each one who got it right
      (POST /var, a little Σ, once per VAR however many sources send it).

      ?canal= as in the overlays. The channel stands with its viewers. ?demo fills the stand with sample people and
      plays moments on its own (?demo=parado: only the keys; ?pessoas= how many, 13 by default); keys: g gol, c gol
      deles, d defesa, e defesaça, r round nosso, t round deles,
      w vitória, x derrota, a VAR (abre, votos, veredito; de novo fecha),
      p pula, n dança, k comemora, b bananeira, h grito, o ola, i uma dica, m mensagem, u mensagem de quem está fora
      (com mais de 20), j chega alguém, s sai alguém, q 8/18/36/56 pessoas, l uma legenda de exemplo, v liga/desliga as
      legendas de verdade (scripts/legenda.py).
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js"
        }
      }
    </script>
    <style>
      :root {
        --altura: 178px;
        --meio: 1076px;
      }
      /* The stand's canvas: the stand at its bottom, room above it for the confetti. */
      .torcida {
        transition: transform 0.6s ease;
        position: absolute;
        left: 596px;
        width: 960px;
        bottom: 0;
        height: calc(var(--altura) + 200px);
        pointer-events: none;
      }
      .torcida canvas {
        position: absolute;
        left: 0;
        bottom: 0;
      }

      /* The banner over the stand: the stream's plate, Klein, cut at 45°. */
      .faixa {
        position: absolute;
        left: 50%;
        bottom: calc(var(--altura) + 10px);
        z-index: 60;
        translate: -50% 0;
        display: flex;
        align-items: baseline;
        gap: 18px;
        padding: 14px 44px 16px;
        background: var(--klein);
        white-space: nowrap;
        clip-path: polygon(22px 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%, 0 22px);
        animation: faixa 4.8s var(--ease) both;
      }
      .faixa strong {
        font-size: 54px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .faixa span {
        font-size: 26px;
        font-weight: 500;
        color: var(--klein-claro);
      }
      .faixa.dedicatoria {
        bottom: calc(var(--altura) + 96px);
        background: var(--paper);
        color: var(--klein);
        padding: 10px 30px 12px;
        animation-delay: 0.4s;
      }
      .faixa.dedicatoria strong {
        font-size: 32px;
      }
      @keyframes faixa {
        0% {
          clip-path: polygon(0 0, 0 0, -60px 100%, -60px 100%);
        }
        12%,
        88% {
          clip-path: polygon(0 0, calc(100% + 60px) 0, 100% 100%, -60px 100%);
        }
        100% {
          clip-path: polygon(calc(100% + 60px) 0, calc(100% + 60px) 0, 100% 100%, 100% 100%);
        }
      }

      /* Live captions (legenda.js): over the stand, clear of its banners, which hide them while they show. */
      .legenda {
        position: absolute;
        left: var(--meio);
        bottom: calc(var(--altura) + 16px);
        z-index: 55;
        translate: -50% 0;
        width: fit-content;
        max-width: 960px;
        max-height: calc(2 * 1.25em + 20px);
        overflow: hidden;
        margin: 0;
        padding: 8px 20px 12px;
        background: rgb(0 20 71 / 0.78);
        color: var(--klein-claro);
        font-size: 34px;
        font-weight: 600;
        line-height: 1.25;
        text-align: center;
        opacity: 0;
        transition: opacity 0.4s var(--ease), color 0.3s;
      }
      .legenda.final {
        color: var(--paper);
      }
      .legenda.visivel {
        opacity: 1;
      }
      .legenda.escondida {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="torcida" id="torcida" aria-label="Torcida">
        <canvas id="arquibancada"></canvas>
      </section>
    </main>
    <script src="stream.js"></script>
    <script src="sigma.js"></script>
    <script src="comandos.js"></script>
    <script src="legenda.js"></script>
    <script type="module">
      import { criarArquibancada } from "./arquibancada3d.js"
      import { natal as dezembro, medidas as fornada, onde as ondeAssa } from "./fas3d.js"
      import { torcedorDe } from "./torcedor3d/antigo.js"
      import { MODELOS, sortear as dado } from "./torcedor3d/esquema.js"

      const torcida = document.getElementById("torcida")
      // 178 px: the band under the game in the game scenes (y 902 to 1080, under palco.html's line on the game's edge).
      const ALTURA = Math.round(Math.min(380, Math.max(120, Number(params.get("altura")) || 178)))
      // Where it stands: from x 596, 960 wide (?x=, ?largura= from 640 to 1280, to clear what a scene has beside it).
      const X = Math.round(Number(params.get("x")) || 596)
      const LARGURA = Math.round(Math.min(1280, Math.max(640, Number(params.get("largura")) || 960)))
      document.documentElement.style.setProperty("--altura", `${ALTURA}px`)
      document.documentElement.style.setProperty("--meio", `${X + LARGURA / 2}px`)
      Object.assign(torcida.style, { left: `${X}px`, width: `${LARGURA}px` })
      const stand = criarArquibancada(document.getElementById("arquibancada"), { largura: LARGURA, altura: ALTURA, lugares: 20, porFila: [10, 10], espalhar: true, doCentro: true, nomesCurtos: true, trilho: "#001447" })
      // Twitch sends who was already there as JOINs over the first seconds; they all arrive at once, unanimated.
      const ASSENTANDO_MS = 15000

      const pessoas = new Map() // login → { login, nome, desde, sigmaOrdem, sigmaVisto, agiu, chegou, gritou }
      // Who has a place on the stand (the channel and the most Σ, up to its 20 seats, and whoever borrowed one by talking).
      let naArquibancada = new Set()
      let conectouEm = 0
      let vistos = new Set()

      // --- How each fan looks: what they chose on their profile on the site (their 3D fan, or their 2D one) ---------
      // The profile API (infra/site.yml) answers for the whole stand at once; it's asked again when people
      // arrive and every two minutes, so a change made on the site shows up during the live.
      const API = params.get("api") ?? "https://wtpv8afsak.execute-api.us-east-1.amazonaws.com"
      const escolhas = new Map() // login → what the profile API has for them
      // Their fan, undressed: what it does (fes), shouts (frase) and throws (stickers) on the stand.
      const fa = (login) => torcedorDe(escolhas.get(login) ?? null, login)
      let varAberto = false
      // December puts Santa's hat on everyone (?natal to see it any day), checked now and then since the source stays
      // open for days.
      stand.natal(dezembro())
      setInterval(() => stand.natal(dezembro()), 600000)

      // --- Σ: each viewer's points (sigma.js), from the Σ API (infra/site.yml) ---------------------------
      // Asked with the looks. More Σ stands further in front, shows its rank's emblem by the name and weighs
      // more in the goal's dedication. While the stream is on (the Partidas dock says so), this page tells
      // the API who's in the chat once a minute, which is how Σ is earned; that takes the key, which only
      // OBS's source URL holds (#chave=…). The channel earns none and always stands in front.
      const SIGMA_API = params.get("sigma") ?? "https://p1rblei1o9.execute-api.us-east-1.amazonaws.com"
      const CHAVE = new URLSearchParams(location.hash.slice(1)).get("chave")
      // The game on screen: Valorant's scene says so (?jogo=valorant), and the one for any other game (?jogo=diversos);
      // otherwise Rocket League.
      const JOGO = ["valorant", "diversos"].includes(params.get("jogo")) ? params.get("jogo") : "rocket-league"
      const sigmas = new Map() // login → { sigma, minutos, lives, sequencia }
      const sigma = (login) => sigmas.get(login)?.sigma ?? 0
      let noArAte = 0
      async function presenca() {
        const logins = [...pessoas.keys()].filter((login) => login !== CHANNEL)
        if (!SIGMA_API || !CHAVE || Date.now() > noArAte || !logins.length) return
        try {
          await fetch(`${SIGMA_API}/presenca`, {
            method: "POST",
            headers: { "content-type": "application/json", "x-chave": CHAVE },
            body: JSON.stringify({ logins: logins.slice(0, 100) }),
          })
        } catch {
          // The API down: this minute isn't counted.
        }
      }
      setInterval(presenca, 60000)
      // Someone who just arrived shouts their phrase, once their choices come in.
      const GRITO_MS = 30000

      let pedido
      function pedirEscolhas() {
        clearTimeout(pedido)
        pedido = setTimeout(async () => {
          const logins = [...pessoas.keys()]
          // The demo's people are made up: nobody is asked about them.
          if (!API || !logins.length || params.has("demo")) return
          try {
            for (let i = 0; i < logins.length; i += 100) {
              const lote = logins.slice(i, i + 100)
              const [resposta, pontos] = await Promise.all([
                fetch(`${API}/torcedores?logins=${lote.join(",")}`),
                SIGMA_API ? fetch(`${SIGMA_API}/sigmas?logins=${lote.join(",")}`).then((r) => (r.ok ? r.json() : null)).catch(() => null) : null,
              ])
              if (pontos)
                for (const login of lote) {
                  pontos[login] ? sigmas.set(login, pontos[login]) : sigmas.delete(login)
                  // Their first Σ places them; after that, only the checkpoints.
                  const p = pessoas.get(login)
                  if (p && !p.sigmaVisto && pontos[login]) Object.assign(p, { sigmaOrdem: sigma(login), sigmaVisto: true })
                }
              if (resposta.ok) {
                const achadas = await resposta.json()
                for (const login of lote) achadas[login] ? escolhas.set(login, achadas[login]) : escolhas.delete(login)
              }
              arrumar()
              if (resposta.ok) for (const login of lote) gritar(pessoas.get(login))
            }
          } catch {
            // Offline or the API down: everyone keeps the look they have.
          }
        }, 1500)
      }
      setInterval(pedirEscolhas, 120000)

      function gritar(p) {
        if (!p || !naArquibancada.has(p.login) || !p.chegou || p.gritou || Date.now() - p.chegou > GRITO_MS) return
        const { frase } = fa(p.login)
        if (!frase) return
        p.gritou = true
        falar(p, frase)
      }

      // On a goal, each fan throws their stickers: a few from each, at most STICKERS on screen.
      const STICKERS = 36
      function soltarStickers(quando) {
        const todos = []
        for (const p of pessoas.values()) {
          if (!naArquibancada.has(p.login)) continue
          for (const emoji of fa(p.login).stickers[quando]) todos.push([p, emoji])
        }
        todos.sort(() => Math.random() - 0.5)
        const alto = torcida.clientHeight
        for (const [p, emoji] of todos.slice(0, STICKERS)) {
          const onde = stand.onde(p.login)
          if (!onde) continue
          const el = document.createElement("span")
          el.className = "sticker"
          el.textContent = emoji
          el.style.left = `${onde.x}px`
          el.style.bottom = `${alto - onde.y}px`
          el.style.setProperty("--dx", `${(Math.random() - 0.5) * 120}px`)
          el.style.setProperty("--sobe", `${-120 - Math.random() * 160}px`)
          el.style.setProperty("--espera", `${Math.random() * 1.4}s`)
          el.style.setProperty("--t", `${2 + Math.random()}s`)
          torcida.append(el)
          setTimeout(() => el.remove(), 4500)
        }
      }

      // --- The stand -------------------------------------------------------------------------------------------
      // The rank's emblem by the name; the channel's name alone, so it fits.
      const emblemaDe = (login) => (login !== CHANNEL && (SIGMA_API || params.has("demo")) ? Sigma.ranque(sigma(login), "pt", JOGO).emblema : null)
      // Σ decides who sits and where (Luan, 2026-11-23: a perk, never a lock). The channel, then the most Σ, at the front
      // row's centre and outwards, then the row behind; ties by who came first. With more than the 20 seats' worth in
      // the chat, the top 20 by Σ sit; whoever talks or acts without a seat borrows the one of the lowest-Σ fan who has
      // been quiet, for as long as they keep at it (ATIVO_MS since the last thing they did), then gives it back. The
      // order goes by each one's Σ as of a checkpoint (when they come in, when the Σ API first answers for them, and every
      // REORDENA_MS), so Σ ticking up minute by minute never reshuffles the stand; whoever loses their seat sinks away.
      const ATIVO_MS = 90000
      const REORDENA_MS = 10 * 60000
      const ordem = (a, b) => (b.login === CHANNEL) - (a.login === CHANNEL) || b.sigmaOrdem - a.sigmaOrdem || a.desde - b.desde
      const agindo = (p, agora) => agora - (p.agiu ?? 0) < ATIVO_MS
      function arrumar() {
        const agora = Date.now()
        const todos = [...pessoas.values()].sort(ordem)
        const sentados = todos.slice(0, stand.capacidade)
        // Who talked or acted without a seat, the most recent first, each in the seat of the lowest-Σ quiet one.
        for (const c of todos.slice(stand.capacidade).filter((p) => agindo(p, agora)).sort((a, b) => b.agiu - a.agiu)) {
          const quieto = sentados.findLast((p) => p.login !== CHANNEL && !agindo(p, agora))
          if (!quieto) break
          sentados[sentados.indexOf(quieto)] = c
        }
        sentados.sort(ordem)
        const ficam = new Set(sentados.map((p) => p.login))
        for (const login of naArquibancada) if (!ficam.has(login) && pessoas.has(login)) stand.sair(login)
        naArquibancada = ficam
        stand.dispor(
          sentados.map((p) => ({ login: p.login, nome: p.nome, aparencia: escolhas.get(p.login) ?? null, emblema: emblemaDe(p.login), canal: p.login === CHANNEL })),
          { animar: Date.now() - conectouEm > ASSENTANDO_MS },
        )
      }
      // A borrowed seat goes back once its guest has been quiet ATIVO_MS.
      setInterval(() => pessoas.size > stand.capacidade && arrumar(), 5000)
      // The checkpoint: everyone's Σ as it is now.
      setInterval(() => {
        for (const p of pessoas.values()) p.sigmaOrdem = sigma(p.login)
        arrumar()
      }, REORDENA_MS)
      document.fonts.ready.then(arrumar)

      function chegar(login, nome = login) {
        if (BOTS.has(login) || login.startsWith("justinfan")) return
        vistos.add(login)
        const p = pessoas.get(login)
        if (p) {
          if (nome !== login && p.nome !== nome) {
            p.nome = nome
            arrumar()
          }
          return
        }
        pessoas.set(login, { login, nome, desde: Date.now(), sigmaOrdem: sigma(login), sigmaVisto: sigmas.has(login), chegou: Date.now() - conectouEm > ASSENTANDO_MS ? Date.now() : 0 })
        arrumar()
        pedirEscolhas()
      }
      // Someone talked or acted: without a seat, they borrow one while they keep at it.
      function ativar(login) {
        const p = pessoas.get(login)
        if (!p) return
        p.agiu = Date.now()
        if (!naArquibancada.has(login)) arrumar()
      }

      function sair(login) {
        if (!pessoas.delete(login)) return
        stand.sair(login)
        naArquibancada.delete(login)
        setTimeout(arrumar, 600)
      }

      // --- Moments ---------------------------------------------------------------------------------------------
      function faixa(texto, detalhe, extra = "") {
        const f = document.createElement("div")
        f.className = "faixa " + extra
        const strong = document.createElement("strong")
        strong.textContent = texto
        f.append(strong)
        if (detalhe) {
          const span = document.createElement("span")
          span.textContent = detalhe
          f.append(span)
        }
        torcida.append(f)
        Legenda.esconder(5400)
        setTimeout(() => f.remove(), 5400)
      }

      // A goal (Valorant: a win) is dedicated to someone in the stand, everyone with the same odds (by Σ, once it exists).
      function sortear() {
        const lista = [...pessoas.values()].filter((p) => naArquibancada.has(p.login) && p.login !== CHANNEL)
        let sorte = Math.random() * lista.reduce((soma, p) => soma + Sigma.peso(sigma(p.login)), 0)
        return lista.find((p) => (sorte -= Sigma.peso(sigma(p.login))) < 0) ?? lista.at(-1) ?? null
      }
      // The dedications, on air only, kept for good on their page on the site. Both stands hear every moment: each
      // sends its own game's.
      function anotarDedicatoria(p, tipo, detalhe) {
        if (!p || p.login === CHANNEL || params.has("demo") || Date.now() > noArAte) return
        const em = Date.now()
        if (SIGMA_API && CHAVE) {
          fetch(`${SIGMA_API}/dedicatoria`, {
            method: "POST",
            headers: { "content-type": "application/json", "x-chave": CHAVE },
            body: JSON.stringify({ id: em, login: p.login, tipo, detalhe: detalhe == null ? null : String(detalhe), jogo: JOGO }),
          }).catch(() => {})
        }
      }

      // The fan it's dedicated to comes forward to the rail, arms up.
      function dedicar(p, frase = (quem) => `Esse gol é do ${quem}!`) {
        setTimeout(() => {
          stand.dedicar(p.login, 5600)
          faixa(frase(p.nome), "", "dedicatoria")
        }, 2400)
      }

      // The rounds and the match's end come from scripts/valorant.py on this PC (?valorant= its address).
      if (JOGO === "valorant" && !params.has("demo")) {
        const fonte = new EventSource(`${params.get("valorant") ?? "http://127.0.0.1:8792"}/eventos`)
        fonte.onmessage = ({ data }) => {
          const evento = JSON.parse(data)
          jogo[evento.tipo]?.(evento)
        }
      }

      // --- The narrator (scripts/narrador.py, on this PC): goals in the narrator's voice ---------------
      // OBS routes this source's sound to the stream's track only, never to the recording. The openers
      // are rendered when the page loads, so they play at once; the rest (the speed, the dedication)
      // renders while the opener plays. Without the narrator running, goals are just silent.
      // The dock switches it on and off.
      const NARRADOR = params.get("narrador") ?? "http://127.0.0.1:8788"
      // On only while the dock's "Galvão narrando os gols" is on (it says so every few seconds); always in the demo.
      let narradorLigado = params.has("demo")
      const ABERTURAS = [
        "Olha o que ele fez! É gol! É gol do Luan!",
        "Haja coração, amigo! É gol do Luan!",
        "Vai que é sua, Luan! E é gol!",
        "Que pancada! É gol, é gol, é gol do Luan!",
      ]
      const CONTRA = ["Ih, amigo... tomou. Bola pra frente, Luan.", "Não dá pra acreditar. Gol deles.", "Acontece. Respira e vamos pra cima!"]
      // Valorant: only the match's end is narrated; rounds come too often.
      const VITORIA = ["Acabou! É vitória do Luan!", "Fim de jogo, e é vitória, amigo!"]
      const DERROTA = ["Fim de jogo. Não foi dessa vez, Luan.", "Perdemos essa. Respira, que tem a próxima."]
      const som = new AudioContext()
      const prontas = new Map() // line → AudioBuffer
      function voz(texto) {
        if (NARRADOR === "0") return Promise.resolve(null)
        if (prontas.has(texto)) return Promise.resolve(prontas.get(texto))
        return fetch(`${NARRADOR}/falar`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ texto }) })
          .then((r) => (r.ok ? r.arrayBuffer() : null))
          .then((dados) => dados && som.decodeAudioData(dados))
          .then((buffer) => (buffer && prontas.set(texto, buffer), buffer))
          .catch(() => null)
      }
      // The openers, now and whenever the narrator comes up later.
      const preparar = () => [...ABERTURAS, ...CONTRA, ...VITORIA, ...DERROTA].filter((t) => !prontas.has(t)).forEach(voz)
      preparar()
      setInterval(preparar, 30000)

      let narrando = Promise.resolve()
      function narrar(...partes) {
        if (!narradorLigado) return
        narrando = narrando.then(async () => {
          for (const parte of partes) {
            const buffer = await parte
            if (!buffer) continue
            await new Promise((fim) => {
              const fonte = som.createBufferSource()
              fonte.buffer = buffer
              fonte.connect(som.destination)
              fonte.onended = fim
              fonte.start()
            })
          }
        })
      }
      const pick = (lista) => lista[Math.floor(Math.random() * lista.length)]
      // Logins read better without their dots and underscores: "bia.lima" → "bia lima".
      const falado = (nome) => nome.replace(/[._-]+/g, " ").trim()
      function narrarGol(kmh, dedicado) {
        const velocidade = kmh ? (kmh >= 100 ? `${kmh} quilômetros por hora, que bomba!` : `A bola entrou a ${kmh} quilômetros por hora!`) : ""
        const resto = [velocidade, dedicado && `Esse gol é do ${falado(dedicado.nome)}!`].filter(Boolean).join(" ")
        narrar(voz(pick(ABERTURAS)), resto && voz(resto))
      }

      const jogo = {
        gol({ nosso, kmh }) {
          if (!nosso) {
            narrar(voz(pick(CONTRA)))
            soltarStickers("contra")
            return stand.evento("deles", { ms: 3300 })
          }
          stand.evento("gol", { placa: "GOOOL!" })
          soltarStickers("gol")
          faixa("GOOOL!", kmh ? `${kmh} km/h` : "")
          const dedicado = sortear()
          if (dedicado) dedicar(dedicado)
          if (JOGO === "rocket-league") anotarDedicatoria(dedicado, "gol", kmh)
          narrarGol(kmh, dedicado)
        },
        noar({ ligado }) {
          noArAte = ligado ? Date.now() + 15000 : 0
        },
        narrador({ ligado }) {
          narradorLigado = !!ligado
        },
        legenda({ ligado, fala, em }) {
          Legenda.ligar(!!ligado, fala, em)
        },
        defesa({ epica }) {
          stand.evento("defesa", { ms: 800 })
          if (epica) faixa("DEFESAÇA!")
        },
        // Valorant, from scripts/valorant.py through the dock. `placar` is ours–theirs, "7–5".
        rodada({ nosso, placar }) {
          if (!nosso) {
            soltarStickers("contra")
            return stand.evento("deles", { ms: 2400 })
          }
          stand.evento("gol", { placa: "ROUND!", ms: 2600, confete: false })
          soltarStickers("gol")
          faixa("ROUND!", placar ?? "")
        },
        partida({ vitoria, placar }) {
          if (!vitoria) {
            narrar(voz(pick(DERROTA)))
            soltarStickers("contra")
            faixa("FIM DE JOGO", placar ?? "")
            return stand.evento("deles", { ms: 3300 })
          }
          stand.evento("gol", { placa: "VITÓRIA!", ms: 3500 })
          soltarStickers("gol")
          faixa("VITÓRIA!", placar ?? "")
          const dedicado = sortear()
          if (dedicado) dedicar(dedicado, (quem) => `Essa vitória é do ${quem}!`)
          if (JOGO === "valorant") anotarDedicatoria(dedicado, "vitoria", placar)
          narrar(voz(pick(VITORIA)), dedicado && voz(`Essa vitória é do ${falado(dedicado.nome)}!`))
        },
      }
      // Any other game (?jogo=diversos) has none of these moments: the docks still send Rocket League's and Valorant's
      // to every stand, so this one lets them pass.
      if (JOGO === "diversos") for (const tipo of ["gol", "defesa", "rodada", "partida"]) jogo[tipo] = () => {}
      addEventListener("muanlartins-torcida", ({ detail }) => jogo[detail?.tipo]?.(detail))
      // A Christmas gift sub drawn on the Pix overlay (pix.html writes it to this site's storage, which OBS's sources
      // share): its winner steps forward like a goal's dedication, if they're in this stand.
      addEventListener("storage", ({ key, newValue }) => {
        if (key !== "natal:sorteio" || !newValue) return
        try {
          const { login, em } = JSON.parse(newValue)
          const p = pessoas.get(login)
          if (p && naArquibancada.has(login) && Date.now() - em < 30000) {
            stand.confete()
            dedicar(p, (quem) => `Sub de presente pro ${quem}!`)
          }
        } catch {}
      })

      // --- The VAR (efeitos.html sends its whole state with every change; var.html draws the booth) ----------
      let varId = null
      let varVeredito = null
      function cartao(login, numero) {
        stand.cartao(login, numero)
      }
      async function creditarVar(id, logins) {
        if (!SIGMA_API || !CHAVE || Date.now() > noArAte) return
        const certos = logins.filter((login) => login !== CHANNEL)
        for (let i = 0; i < certos.length; i += 100) {
          try {
            await fetch(`${SIGMA_API}/var`, {
              method: "POST",
              headers: { "content-type": "application/json", "x-chave": CHAVE },
              body: JSON.stringify({ id, logins: certos.slice(i, i + 100) }),
            })
          } catch {
            // The API down: this VAR's Σ is lost, like a minute's.
          }
        }
      }
      addEventListener("muanlartins-var", ({ detail }) => {
        const v = varDe(detail)
        if (!v) return
        const aberto = v.fase !== "fechado"
        if (aberto !== varAberto) {
          varAberto = aberto
          stand.arbitro(aberto)
        }
        if (!aberto) {
          varId = varVeredito = null
          for (const login of pessoas.keys()) cartao(login, 0)
          return
        }
        if (v.id !== varId) {
          varId = v.id
          varVeredito = null
          for (const login of pessoas.keys()) cartao(login, 0)
        }
        const votos = v.votantes ?? {}
        for (const [login, opcao] of Object.entries(votos)) {
          if (!pessoas.has(login)) chegar(login)
          // A first vote is acting: it brings them to the stand.
          if (!stand.cartao(login)) ativar(login)
          cartao(login, opcao + 1)
        }
        if (v.fase === "veredito" && varVeredito === null) {
          varVeredito = v.vencedora
          for (const [login, opcao] of Object.entries(votos)) stand.mover(login, opcao === v.vencedora ? "comemora" : "lamenta", { acende: false })
          creditarVar(v.id, Object.keys(votos).filter((login) => votos[login] === v.vencedora))
        }
      })

      // --- From the chat ---------------------------------------------------------------------------------------
      // !pula, !danca, !comemora, !grito and !ola (comandos.js), waiting while a goal's party or mourning is on.
      const comando = Comandos.criar({
        pessoa: (login) => (naArquibancada.has(login) ? pessoas.get(login) : null),
        pausado: () => stand.ocupada(),
        falar: (p, texto) => falar(p, texto),
        frase: (p) => fa(p.login).frase,
        mover: (p, move) => stand.mover(p.login, move),
        ola: (p) => stand.evento("ola", { de: p.login }),
      })

      // Tips: every ?dicas= minutes (6; 0 for none) the channel's own fan says one of the chat's commands at the rail,
      // in turn, from comandos.json's `dica`, and does it when it's one of the stand's. Not while the stand is busy (a
      // goal, the VAR).
      const DICA_MS = Number(params.get("dicas") ?? 6) * 60000
      let dicas = []
      let dicaVez = 0
      function dica() {
        const p = pessoas.get(CHANNEL)
        if (!dicas.length || !p || !naArquibancada.has(CHANNEL) || stand.ocupada() || varAberto) return
        const c = dicas[dicaVez++ % dicas.length]
        falar(p, c.dica)
        setTimeout(() => comando(CHANNEL, c.comando), 700)
      }
      if (DICA_MS > 0) {
        fetch("comandos.json")
          .then((r) => r.json())
          .then((lista) => (dicas = lista.grupos.flatMap((g) => g.comandos.filter((c) => c.dica))))
          .catch(() => {})
        if (!params.has("demo")) setInterval(dica, DICA_MS)
      }
      // What someone says: they come forward to the rail with it (the stand keeps three waiting at most).
      function falar(p, texto) {
        if (!p || !naArquibancada.has(p.login)) return
        stand.falar(p.login, texto)
      }

      function apply(line) {
        const { tags, prefix, command, trailing } = parseIrc(line)
        const login = prefix.split("!")[0]
        if (command === "JOIN") chegar(login)
        else if (command === "PART") sair(login)
        // Someone who talks is there, even before their JOIN arrives; and now we know their display name.
        else if (command === "PRIVMSG") {
          chegar(login, tags["display-name"] || login)
          ativar(login)
          if (trailing.startsWith("!")) comando(login, trailing)
          else falar(pessoas.get(login), trailing.replace(/^\u0001ACTION (.*)\u0001$/, "$1"))
        } else if (command === "353") trailing.split(" ").forEach((name) => name && chegar(name))
      }

      // For headless checks: the stand's numbers (pictures held, drawing and baking times).
      window.estadoTorcida = () => ({ ...stand.medidas, esperando: stand.esperando(), fornada, forno: ondeAssa(), pessoas: pessoas.size, naArquibancada: naArquibancada.size })

      if (params.has("demo")) demo()
      else
        irc(apply, {
          membership: true,
          // On reconnecting, Twitch lists who is there again; whoever it doesn't list left meanwhile.
          onStatus(connected) {
            if (!connected) return
            conectouEm = Date.now()
            vistos = new Set()
            setTimeout(() => [...pessoas.keys()].filter((login) => !vistos.has(login)).forEach(sair), ASSENTANDO_MS)
          },
        })

      function demo() {
        // Invented people (Twitch logins go up to 25 characters: a few long ones keep it honest).
        const nomes = ["Bia", "torcedor_da_madrugada_10", "Duda", "Tobias", "Nina", "Raul", "Lívia", "a_lenda_do_rank_ferro_br1", "Malu", "Igor",
          "Sol", "capivara_cansada", "Teca", "Breno", "Iara", "Otto", "Lola", "Enzo", "Cida", "Nando", "Pipa", "mira_de_pao_de_queijo",
          "Aline", "Gui", "Rafa", "Mari", "Juca", "Kika", "Leo", "Val", "Tuca", "Fe", "Bento", "Olga", "Dico", "Manu", "Yuri", "Tina", "Gael",
          "Ivo", "Lara", "Noe", "Jade", "Beto", "Susi", "Ciro", "Pati", "Ravi", "Lucio", "Mel", "Hugo", "Dani", "Tom", "Ester", "Quim", "Rita", "Zeca", "Vivi"]
        const loginDe = (n) => n.toLowerCase().normalize("NFD").replace(/\p{M}/gu, "")
        const FRASES_GRITO = ["bora Luan!", "chegueeei", "hoje sobe!"]
        const FES = ["pula", "danca", "gira", "acena", "palmas", "bananeira"]
        const STK = ["🎉", "⚽", "🔥", "🚀", "💙", "👏", "😭", "😱", "💀", "🤡"]
        // A third made their 3D fan on the site (a preset or the dice); a third kept their 2D one (turned 3D here);
        // the rest never made one (their login gives it).
        const ANTIGOS = { cabeca: ["losango", "redonda", "quadrada", "hexagono", "triangulo"], roupa: ["lisa", "listra", "faixa", "meio", "numero", "gola", "listras", "listrado", "tricolor", "faixa-dupla"],
          acessorio: ["nenhum", "bone", "cachecol", "bandeira", "coroa", "oculos", "fone", "cartola"] }
        nomes.forEach((n, i) => {
          const login = loginDe(n)
          const extra = { frase: FRASES_GRITO[i % 3], stickers: { gol: [STK[i % 6], STK[(i + 2) % 6]], contra: [STK[6 + (i % 4)]] } }
          if (i % 3 === 0) {
            const t3 = i % 6 === 0 ? { ...MODELOS[(i / 6) % MODELOS.length][1] } : dado(7919 * i + 13)
            escolhas.set(login, { t3: { ...t3, ...extra, fes: FES[(i / 3) % FES.length] } })
          } else if (i % 3 === 1)
            escolhas.set(login, { cabeca: ANTIGOS.cabeca[i % 5], roupa: ANTIGOS.roupa[i % 10], acessorio: ANTIGOS.acessorio[i % 8], comemoracao: ["pula", "danca", "gira", "acena", "bananeira"][i % 5], ...extra })
        })
        // And each has some Σ, from a newcomer to a regular of a year.
        nomes.forEach((n, i) => sigmas.set(loginDe(n), { sigma: Math.round(20000 * acaso(i) ** 3) }))
        function acaso(n) {
          const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453
          return x - Math.floor(x)
        }
        // The channel too, as on the live, where its own account is in the chat (and says the tips).
        let quantos = Math.max(0, Math.min(nomes.length, params.has("pessoas") ? Number(params.get("pessoas")) : 12))
        function povoar(n) {
          const logins = nomes.slice(0, n).map(loginDe)
          for (const login of [...pessoas.keys()]) if (login !== CHANNEL && !logins.includes(login)) sair(login)
          ;[CHANNEL, ...nomes.slice(0, n)].forEach((x) => chegar(loginDe(x), x))
        }
        // The first ones are already there (seated at once); whoever comes later runs in.
        conectouEm = Date.now()
        povoar(quantos)
        conectouEm = Date.now() - 2 * ASSENTANDO_MS
        const FRASES = ["boa noite!!", "que jogada", "GG", "essa foi limpa demais",
          "qual a tua sensibilidade?", "bora subir hoje", "kkkkkkk", "salvou demais", "essa defesa foi de outro planeta, não acredito que entrou"]
        const placar = [0, 0]
        const say = (login, text) => apply(`@display-name=${login} :${login}!${login}@x PRIVMSG #${CHANNEL} :${text}`)
        const random = () => [...naArquibancada].filter((l) => l !== CHANNEL)[Math.floor(Math.random() * Math.max(1, naArquibancada.size - 1))] ?? CHANNEL
        // Someone in the chat without a seat (with more than 20 there).
        const deFora = () => [...pessoas.keys()].find((l) => !naArquibancada.has(l))
        const keys = {
          g: () => jogo.gol({ nosso: true, kmh: 80 + Math.round(Math.random() * 60) }),
          c: () => jogo.gol({ nosso: false }),
          d: () => jogo.defesa({}),
          e: () => jogo.defesa({ epica: true }),
          r: () => jogo.rodada({ nosso: true, placar: `${++placar[0]}–${placar[1]}` }),
          t: () => jogo.rodada({ nosso: false, placar: `${placar[0]}–${++placar[1]}` }),
          w: () => jogo.partida({ vitoria: true, placar: "13–9" }),
          x: () => jogo.partida({ vitoria: false, placar: "9–13" }),
          // The VAR as the dock sends it: opens with votes coming in, then the verdict; again, it closes.
          a: () => {
            const enviar = (v) => dispatchEvent(new CustomEvent("muanlartins-var", { detail: v }))
            if (varAberto) return enviar({ fase: "fechado" })
            const id = String(Date.now())
            const votantes = {}
            enviar({ fase: "votacao", id, votantes })
            const logins = [...naArquibancada].filter((l) => l !== CHANNEL)
            logins.forEach((login, i) => setTimeout(() => {
              votantes[login] = Math.random() < 0.65 ? 0 : 1
              enviar({ fase: "votacao", id, votantes: { ...votantes } })
            }, 600 + i * 350))
            setTimeout(() => enviar({ fase: "veredito", id, votantes, vencedora: 0 }), 1200 + logins.length * 350)
          },
          p: () => say(random(), "!pula"),
          n: () => say(random(), "!dança"),
          o: () => say(random(), "!ola"),
          k: () => say(random(), "!comemora"),
          // Someone whose celebration is the handstand.
          b: () => {
            const login = [...naArquibancada].find((l) => fa(l).fes === "bananeira")
            if (login) stand.mover(login, "comemora")
          },
          i: dica,
          h: () => say(random(), "!grito"),
          j: () => {
            const novo = nomes.find((n) => !pessoas.has(loginDe(n))) || `pessoa${pessoas.size}`
            chegar(loginDe(novo), novo)
            setTimeout(() => gritar(pessoas.get(loginDe(novo))), 1200)
          },
          s: () => sair(random()),
          m: () => say(random(), FRASES[Math.floor(Math.random() * FRASES.length)]),
          // Someone off the stand talks: they take the seat of whoever has been quiet longest.
          u: () => deFora() && say(deFora(), FRASES[Math.floor(Math.random() * FRASES.length)]),
          q: () => {
            quantos = { 8: 18, 18: 36, 36: 56 }[quantos] ?? 8
            povoar(quantos)
          },
          // The real captions, without OBS or the dock: to try legenda.py from a browser.
          v: () => Legenda.ligar(!Legenda.ligada),
          l: () => Legenda.mostrar(pick(["Olha essa jogada, eu achei que não ia dar", "Que lance, meu Deus do céu, que lance!",
            "Aqui eu devia ter esperado o meu time, entrei sozinho e fiquei no meio do caminho"]), Math.random() < 0.5),
        }
        // For headless checks: who sits and who's outside, with their Σ.
        const comSigma = (logins) => logins.map((l) => [l, sigma(l)])
        window.demoTorcida = {
          keys, povoar: (n) => povoar((quantos = n)), say, stand,
          sentados: () => comSigma([...naArquibancada]),
          fora: () => comSigma([...pessoas.keys()].filter((l) => !naArquibancada.has(l))),
        }
        addEventListener("keydown", (e) => keys[e.key]?.())
        if (params.get("demo") === "parado") return
        const roteiro = "gmpjmnomdcmsgejmpn"
        let i = 0
        setInterval(() => keys[roteiro[i++ % roteiro.length]](), 6000)
      }
    </script>
  </body>
