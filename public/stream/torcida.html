<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Torcida · muanlartins</title>
    <link rel="stylesheet" href="stream.css" />
    <link rel="stylesheet" href="torcedor.css" />
    <!--
      OBS: Browser source, 1920×1080, over the game in Jogo and Jogo + chat. The
      crowd: a stand at the bottom centre, clear of the camera frame (bottom
      left) and Rocket League's boost meter (bottom right), with one fan for
      each viewer logged in to the chat (Twitch's membership events, as in
      presenca.html: only who has the chat open, about 10 s late), their name
      over them, after their rank's emblem. Ten to a row; the channel and then
      who has the most Σ stand in front (sigma.js), each row behind smaller.

      It reacts to the game as the "Partidas" dock sends it (partidas.html,
      through obs-browser's emit_event): our goal is a wave, confetti, the
      speed, and a goal dedicated to someone drawn from the stand; theirs, a
      slump; our saves, a cheer. The dedication is drawn by Σ, flattened. What
      a viewer says in the chat shows in a balloon over their fan for a few
      seconds (three at most at once); they move their own fan with !pula,
      !danca, !ola. Each fan's look is their profile on the site (/perfil), or
      what their login gives them.

      Goals are narrated in the narrator's voice by scripts/narrador.py, running
      on this PC (?narrador= its address, ?narrador=0 for none); OBS sends this
      source's sound to the stream only, never to the recording.

      While the stream is on, it credits Σ to whoever is in the chat, once a
      minute: ?sigma= the Σ API, and #chave= its key, set only in OBS.

      ?canal= as in the overlays. The channel stands with its viewers. ?demo fills the stand with sample people and
      plays moments on its own; keys: g gol, c gol deles, d defesa, e defesaça,
      p pula, n dança, o ola, m mensagem, j chega alguém, s sai alguém.
    -->
    <style>
      .torcida {
        position: absolute;
        left: 596px;
        width: 960px;
        bottom: 0;
        height: 220px;
      }

      /* The stand: a Klein band cut at 45° on its ends, lined with the lattice, a Klein claro hairline on top. */
      .arquibancada {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 34px;
        background: var(--klein);
        clip-path: polygon(34px 0, calc(100% - 34px) 0, 100% 100%, 0 100%);
        overflow: hidden;
      }
      .arquibancada::before {
        content: "";
        position: absolute;
        inset: -48px;
        background:
          repeating-linear-gradient(45deg, transparent 0 calc(var(--unit) * 0.7071 - 1px), var(--lattice-line) 0 calc(var(--unit) * 0.7071)),
          repeating-linear-gradient(-45deg, transparent 0 calc(var(--unit) * 0.7071 - 1px), var(--lattice-line) 0 calc(var(--unit) * 0.7071));
        animation: drift 12s linear infinite;
      }
      .arquibancada::after {
        content: "";
        position: absolute;
        left: 34px;
        right: 34px;
        top: 0;
        height: 2px;
        background: var(--klein-claro);
      }
      /* While the stand is empty, a line on it says how to get in. */
      .convite {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 8px;
        z-index: 50;
        margin: 0;
        text-align: center;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.04em;
      }

      /*
       * A fan, drawn on the mark's lattice: a head, a body with 45° shoulders, arms that show to cheer.
       * Placed by the script (left, bottom, --s for its row's size); three layers so moves don't fight:
       * .fa arrives and leaves, .pose does the moves, .vivo breathes.
       */
      .fa {
        --s: 1;
        position: absolute;
        width: calc(40px * var(--s));
        height: calc(60px * var(--s));
        margin-left: calc(-20px * var(--s));
        transition:
          left 0.8s var(--ease),
          bottom 0.8s var(--ease),
          width 0.8s var(--ease),
          height 0.8s var(--ease),
          margin 0.8s var(--ease);
      }
      .pose {
        position: absolute;
        inset: 0;
        transform-origin: 50% 100%;
      }
      .vivo {
        position: absolute;
        inset: 0;
        animation: respira 3.2s ease-in-out infinite;
        animation-delay: var(--atraso, 0s);
      }
      @keyframes respira {
        50% {
          transform: translateY(-1.5px);
        }
      }
      /* The name over each fan, still while they move; a long one shrinks to fit its place, then is cut
         short, and is whole while its fan is the one moving. */
      .nome {
        position: absolute;
        z-index: 1;
        left: 50%;
        /* Clear of the tallest accessories (a top hat, a crown). */
        bottom: calc(100% + 9px * var(--s));
        translate: -50% 0;
        max-width: 84px;
        padding: 1px 5px 2px;
        background: rgb(0 20 71 / 0.78);
        font-size: max(11px, 13px * var(--s));
        font-weight: 600;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nome img {
        height: 1.2em;
        margin-right: 0.25em;
        vertical-align: -0.25em;
      }
      .fa.atras .nome {
        color: var(--klein-claro);
        font-weight: 500;
      }
      .fa.foco {
        z-index: 40 !important;
      }
      .fa.foco .nome {
        max-width: none;
        font-size: max(11px, 13px * var(--s)) !important;
        background: var(--paper);
        color: var(--klein);
      }

      /* What a fan says in the chat, for a few seconds, in a balloon over the whole stand (so it never
         hides behind a row), its tail pointing down at them, whose name lights up. Branco, Klein ink. */
      .fala {
        position: absolute;
        z-index: 55;
        width: max-content;
        max-width: 260px;
        padding: 6px 12px 8px;
        background: var(--paper);
        color: var(--klein);
        font-size: 17px;
        font-weight: 500;
        line-height: 1.25;
        overflow-wrap: anywhere;
        animation: fala-entra 0.35s var(--ease) both;
      }
      .fala::after {
        content: "";
        position: absolute;
        left: var(--ponta, 50%);
        top: 100%;
        width: 12px;
        height: 8px;
        translate: -50% 0;
        background: var(--paper);
        clip-path: polygon(0 0, 100% 0, 50% 100%);
      }
      .fala.some {
        animation: fala-sai 0.4s var(--ease) both;
      }
      @keyframes fala-entra {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.9);
        }
      }
      @keyframes fala-sai {
        to {
          opacity: 0;
          transform: translateY(-6px);
        }
      }

      /* Arriving: runs in from the right and hops into place. Leaving: sinks away. */
      .fa.chegando {
        animation: chega 1.1s var(--ease) both;
      }
      @keyframes chega {
        0% {
          transform: translateX(var(--de, 400px));
          opacity: 0;
        }
        60% {
          transform: translateX(0);
          opacity: 1;
        }
        75% {
          transform: translateY(-10px);
        }
      }
      .fa.saindo {
        animation: sai 0.6s var(--ease) forwards;
      }
      @keyframes sai {
        to {
          transform: translateY(20px);
          opacity: 0;
        }
      }

      /* Our goal: each fan's own celebration (torcedor.css), rippling along the stand. A save, a chat
         command: arms up. */
      .defesa .bracos,
      .pula .bracos,
      .ola .bracos {
        opacity: 1;
        transform: none;
      }
      @keyframes pula {
        to {
          transform: translateY(-18px);
        }
      }
      /* Their goal: everyone slumps and dims for a moment. */
      .luto .pose {
        animation: murcha 3s var(--ease) calc(var(--x) * 0.3ms) both;
      }
      @keyframes murcha {
        15%,
        75% {
          transform: translateY(6px) scaleY(0.88);
          filter: brightness(0.55);
        }
      }
      /* A save: a quick cheer. */
      .defesa .pose {
        animation: pula 0.28s var(--ease) calc(var(--x) * 0.25ms) 2 alternate;
      }

      /* From the chat. !pula: three jumps. !danca: a sway, arms taking turns. !ola: a wave out from them. */
      .fa.pula .pose {
        animation: pula 0.35s var(--ease) 6 alternate;
      }
      .fa.danca .pose {
        animation: danca 0.9s ease-in-out 4;
      }
      @keyframes danca {
        25% {
          transform: rotate(-9deg) translateY(-4px);
        }
        75% {
          transform: rotate(9deg) translateY(-4px);
        }
      }
      .fa.danca .bracos {
        opacity: 1;
        animation: bracos 0.9s steps(1) 4;
      }
      @keyframes bracos {
        0% {
          transform: scaleY(1) scaleX(1);
        }
        50% {
          transform: scaleY(1) scaleX(-1);
        }
      }
      .fa.ola .pose {
        animation: pula 0.32s var(--ease) var(--atraso-ola, 0ms) 2 alternate both;
      }

      /* The fan a goal is dedicated to steps forward, bigger. */
      .torcida .fa.dedicado .pose {
        animation: destaque 5.5s var(--ease) both;
      }
      @keyframes destaque {
        10%,
        85% {
          transform: translateY(-34px) scale(1.7);
        }
      }

      /* Confetti: little lattice diamonds in the mark's two colours. */
      .confete {
        position: absolute;
        width: 9px;
        height: 9px;
        rotate: 45deg;
        z-index: 45;
        animation: confete var(--t) cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      }
      @keyframes confete {
        0% {
          transform: translate(0, 0);
          opacity: 1;
        }
        45% {
          transform: translate(calc(var(--dx) * 0.6), var(--sobe));
          opacity: 1;
        }
        100% {
          transform: translate(var(--dx), 40px);
          opacity: 0;
        }
      }

      /* The banner over the stand: the stream's plate, Klein, cut at 45°. */
      .faixa {
        position: absolute;
        left: 50%;
        bottom: 230px;
        z-index: 60;
        translate: -50% 0;
        display: flex;
        align-items: baseline;
        gap: 18px;
        padding: 14px 44px 16px;
        background: var(--klein);
        white-space: nowrap;
        clip-path: polygon(22px 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%, 0 22px);
        animation: faixa 4.8s var(--ease) both;
      }
      .faixa strong {
        font-size: 54px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .faixa span {
        font-size: 26px;
        font-weight: 500;
        color: var(--klein-claro);
      }
      .faixa.dedicatoria {
        bottom: 316px;
        background: var(--paper);
        color: var(--klein);
        padding: 10px 30px 12px;
        animation-delay: 0.4s;
      }
      .faixa.dedicatoria strong {
        font-size: 32px;
      }
      @keyframes faixa {
        0% {
          clip-path: polygon(0 0, 0 0, -60px 100%, -60px 100%);
        }
        12%,
        88% {
          clip-path: polygon(0 0, calc(100% + 60px) 0, 100% 100%, -60px 100%);
        }
        100% {
          clip-path: polygon(calc(100% + 60px) 0, calc(100% + 60px) 0, 100% 100%, 100% 100%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .vivo,
        .arquibancada::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="torcida" id="torcida" aria-label="Torcida">
        <div class="arquibancada"></div>
        <p class="convite" id="convite">Entre no chat e apareça aqui</p>
      </section>
    </main>
    <script src="stream.js"></script>
    <script src="torcedor.js"></script>
    <script src="sigma.js"></script>
    <script>
      const torcida = document.getElementById("torcida")
      const $ = (id) => document.getElementById(id)

      // The rows: ten fans each, like bleachers: each row behind smaller and higher, its heads above the
      // names in front, half a place to the side so it shows between the heads in front. Past the last
      // row, the rest wait off the stand for a place.
      const POR_FILEIRA = 10
      const FILEIRAS = [
        { s: 1, base: 22 },
        { s: 0.8, base: 76 },
        { s: 0.66, base: 120 },
        { s: 0.55, base: 158 },
      ]
      const MARGEM = 40
      const LARGURA = 960 - 2 * MARGEM
      // Twitch sends who was already there as JOINs over the first seconds; they all arrive at once, unanimated.
      const ASSENTANDO_MS = 15000
      // !pula and !danca once every 8 s per person; one !ola at a time for the whole stand.
      const ESPERA_MS = 8000
      const OLA_MS = 15000
      // Chat balloons: 5 s each, at most three at once (a new one pushes out the oldest), cut at 80 characters.
      const FALA_MS = 5000
      const FALAS = 3
      const FALA_MAX = 80

      const pessoas = new Map() // login → { login, nome, desde, el }
      let conectouEm = 0
      let vistos = new Set()

      // --- How each fan looks: what they chose on their profile on the site, or the default (torcedor.js) ---
      // The profile API (infra/site.yml) answers for the whole stand at once; it's asked again when people
      // arrive and every two minutes, so a change made on the site shows up during the live.
      const API = params.get("api") ?? "https://wtpv8afsak.execute-api.us-east-1.amazonaws.com"
      const escolhas = new Map() // login → what they chose
      // Free colours are a Σ unlock (sigma.js); the channel has them anyway.
      const aparencia = (login) => {
        const a = Torcedor.normalizar(escolhas.get(login), login)
        return login === CHANNEL || sigma(login) >= Sigma.COR_LIVRE ? a : Torcedor.soPaleta(a, login)
      }

      // --- Σ: each viewer's points (sigma.js), from the Σ API (infra/site.yml) ---------------------------
      // Asked with the looks. More Σ stands further in front, shows its rank's emblem by the name and weighs
      // more in the goal's dedication. While the stream is on (the Partidas dock says so), this page tells
      // the API who's in the chat once a minute, which is how Σ is earned; that takes the key, which only
      // OBS's source URL holds (#chave=…). The channel earns none and always stands in front.
      const SIGMA_API = params.get("sigma") ?? "https://p1rblei1o9.execute-api.us-east-1.amazonaws.com"
      const CHAVE = new URLSearchParams(location.hash.slice(1)).get("chave")
      const sigmas = new Map() // login → { sigma, minutos, lives, sequencia }
      const sigma = (login) => sigmas.get(login)?.sigma ?? 0
      let noArAte = 0
      async function presenca() {
        const logins = [...pessoas.keys()].filter((login) => login !== CHANNEL)
        if (!SIGMA_API || !CHAVE || Date.now() > noArAte || !logins.length) return
        try {
          await fetch(`${SIGMA_API}/presenca`, {
            method: "POST",
            headers: { "content-type": "application/json", "x-chave": CHAVE },
            body: JSON.stringify({ logins: logins.slice(0, 100) }),
          })
        } catch {
          // The API down: this minute isn't counted.
        }
      }
      setInterval(presenca, 60000)
      // Someone who just arrived shouts their phrase, once their choices come in.
      const GRITO_MS = 30000

      let pedido
      function pedirEscolhas() {
        clearTimeout(pedido)
        pedido = setTimeout(async () => {
          const logins = [...pessoas.keys()]
          if (!API || !logins.length) return
          try {
            for (let i = 0; i < logins.length; i += 100) {
              const lote = logins.slice(i, i + 100)
              const [resposta, pontos] = await Promise.all([
                fetch(`${API}/torcedores?logins=${lote.join(",")}`),
                // The demo's people have made-up Σ: they aren't asked about.
                SIGMA_API && !params.has("demo") ? fetch(`${SIGMA_API}/sigmas?logins=${lote.join(",")}`).then((r) => (r.ok ? r.json() : null)).catch(() => null) : null,
              ])
              if (pontos) {
                for (const login of lote) pontos[login] ? sigmas.set(login, pontos[login]) : sigmas.delete(login)
                for (const login of lote) rotular(pessoas.get(login))
                arrumar()
              }
              if (!resposta.ok) return
              const achadas = await resposta.json()
              for (const login of lote) {
                const agora = achadas[login] ?? null
                if (JSON.stringify(agora) !== JSON.stringify(escolhas.get(login) ?? null)) {
                  agora ? escolhas.set(login, agora) : escolhas.delete(login)
                  vestir(pessoas.get(login))
                }
                gritar(pessoas.get(login))
              }
            }
          } catch {
            // Offline or the API down: everyone keeps the look they have.
          }
        }, 1500)
      }
      setInterval(pedirEscolhas, 120000)

      function vestir(p) {
        if (!p?.el) return
        const a = aparencia(p.login)
        p.el.dataset.comemoracao = a.comemoracao
        p.el.querySelector(".vivo").innerHTML = Torcedor.figura(a)
      }
      function gritar(p) {
        if (!p?.el || !p.chegou || p.gritou || Date.now() - p.chegou > GRITO_MS) return
        const { frase } = aparencia(p.login)
        if (!frase) return
        p.gritou = true
        falar(p, frase)
      }

      // On a goal, each fan throws their stickers: a few from each, at most STICKERS on screen.
      const STICKERS = 36
      function soltarStickers(quando) {
        const todos = []
        for (const p of pessoas.values()) {
          if (!p.el) continue
          for (const emoji of aparencia(p.login).stickers[quando]) todos.push([p, emoji])
        }
        todos.sort(() => Math.random() - 0.5)
        for (const [p, emoji] of todos.slice(0, STICKERS)) {
          const el = document.createElement("span")
          el.className = "sticker"
          el.textContent = emoji
          el.style.left = `${p.el.style.getPropertyValue("--x")}px`
          el.style.bottom = `${parseFloat(p.el.style.bottom) + p.el.offsetHeight}px`
          el.style.setProperty("--dx", `${(Math.random() - 0.5) * 120}px`)
          el.style.setProperty("--sobe", `${-120 - Math.random() * 160}px`)
          el.style.setProperty("--espera", `${Math.random() * 1.4}s`)
          el.style.setProperty("--t", `${2 + Math.random()}s`)
          torcida.append(el)
          setTimeout(() => el.remove(), 4500)
        }
      }

      // --- The stand -------------------------------------------------------------------------------
      function desenhar(p, chegando) {
        const el = document.createElement("div")
        el.className = "fa torcedor" + (chegando ? " chegando" : "")
        if (chegando) p.chegou = Date.now()
        el.dataset.comemoracao = aparencia(p.login).comemoracao
        el.innerHTML = `<span class="nome"></span><div class="pose"><div class="vivo">${Torcedor.figura(aparencia(p.login))}</div></div>`
        el.querySelector(".vivo").style.setProperty("--atraso", `${-Math.random() * 3}s`)
        el.addEventListener("animationend", (e) => {
          if (e.target === el) el.classList.remove("chegando")
          else if (e.target.classList.contains("pose")) {
            el.classList.remove("pula", "danca", "ola", "dedicado")
            if (!falas.some((f) => f.p.el === el)) el.classList.remove("foco")
          }
        })
        torcida.append(el)
        p.el = el
        rotular(p)
        return el
      }
      // The name over a fan, after their rank's emblem; the channel's name alone, so it fits.
      function rotular(p) {
        if (!p?.el) return
        const nome = p.el.querySelector(".nome")
        const src = p.login !== CHANNEL && (SIGMA_API || params.has("demo")) ? Sigma.ranque(sigma(p.login)).emblema : null
        const emblema = document.createElement("img")
        emblema.alt = ""
        if (src) emblema.src = src
        nome.replaceChildren(...(src ? [emblema] : []), p.nome)
        caber(nome)
      }

      // Who has been here longest stands in front (by Σ, once it exists); each takes the next place.
      function arrumar() {
        const lista = [...pessoas.values()].sort(
          (a, b) => (b.login === CHANNEL) - (a.login === CHANNEL) || sigma(b.login) - sigma(a.login) || a.desde - b.desde,
        )
        lista.forEach((p, i) => {
          const fila = Math.floor(i / POR_FILEIRA)
          if (fila >= FILEIRAS.length) {
            p.el?.remove()
            p.el = null
            return
          }
          const { s, base } = FILEIRAS[fila]
          const naFila = Math.min(POR_FILEIRA, lista.length - fila * POR_FILEIRA)
          const passo = LARGURA / POR_FILEIRA
          // Each row is centred; rows behind shift half a place so they show between the ones in front.
          const x = MARGEM + LARGURA / 2 + (i % POR_FILEIRA - (naFila - 1) / 2) * passo + (fila % 2 ? passo / 2 : 0)
          p.el ??= desenhar(p, Date.now() - conectouEm > ASSENTANDO_MS)
          p.el.style.left = `${x}px`
          p.el.style.bottom = `${base}px`
          p.el.style.zIndex = 30 - fila
          p.el.style.setProperty("--s", s)
          caber(p.el.querySelector(".nome"))
          p.el.style.setProperty("--x", Math.round(x))
          p.el.classList.toggle("atras", fila > 0)
        })
        $("convite").hidden = lista.length > 0
      }

      // A long name gets smaller before it gets cut: down to 10px, then the ellipsis.
      function caber(nome) {
        nome.style.fontSize = ""
        const cabe = (nome.clientWidth - 10) / (nome.scrollWidth - 10)
        if (cabe < 1) nome.style.fontSize = `${Math.max(10, Math.floor(parseFloat(getComputedStyle(nome).fontSize) * cabe * 2) / 2)}px`
      }
      document.fonts.ready.then(arrumar)

      function chegar(login, nome = login) {
        if (BOTS.has(login) || login.startsWith("justinfan")) return
        vistos.add(login)
        const p = pessoas.get(login)
        if (p) {
          if (nome !== login && p.nome !== nome) {
            p.nome = nome
            rotular(p)
          }
          return
        }
        pessoas.set(login, { login, nome, desde: Date.now() })
        arrumar()
        pedirEscolhas()
      }

      function sair(login) {
        const p = pessoas.get(login)
        if (!p) return
        pessoas.delete(login)
        const el = p.el
        if (!el) return arrumar()
        el.classList.add("saindo")
        setTimeout(() => (el.remove(), arrumar()), 600)
      }

      // --- Moments ---------------------------------------------------------------------------------
      function momento(classe, ms) {
        torcida.querySelectorAll(".fa").forEach((el) => el.classList.remove("pula", "danca", "ola", "foco"))
        torcida.classList.remove("festa", "luto", "defesa")
        void torcida.offsetWidth
        torcida.classList.add(classe)
        clearTimeout(momento.t)
        momento.t = setTimeout(() => torcida.classList.remove(classe), ms)
      }

      function confete() {
        for (let i = 0; i < 70; i++) {
          const c = document.createElement("i")
          c.className = "confete"
          c.style.left = `${80 + Math.random() * 800}px`
          c.style.bottom = "30px"
          c.style.background = Math.random() < 0.5 ? "var(--paper)" : "var(--klein-claro)"
          c.style.setProperty("--dx", `${(Math.random() - 0.5) * 260}px`)
          c.style.setProperty("--sobe", `${-160 - Math.random() * 220}px`)
          c.style.setProperty("--t", `${1.6 + Math.random() * 1.4}s`)
          torcida.append(c)
          setTimeout(() => c.remove(), 3200)
        }
      }

      function faixa(texto, detalhe, extra = "") {
        const f = document.createElement("div")
        f.className = "faixa " + extra
        const strong = document.createElement("strong")
        strong.textContent = texto
        f.append(strong)
        if (detalhe) {
          const span = document.createElement("span")
          span.textContent = detalhe
          f.append(span)
        }
        torcida.append(f)
        setTimeout(() => f.remove(), 5400)
      }

      // A goal is dedicated to someone in the stand, everyone with the same odds (by Σ, once it exists).
      function sortear() {
        const lista = [...pessoas.values()].filter((p) => p.el && p.login !== CHANNEL)
        let sorte = Math.random() * lista.reduce((soma, p) => soma + Sigma.peso(sigma(p.login)), 0)
        return lista.find((p) => (sorte -= Sigma.peso(sigma(p.login))) < 0) ?? lista.at(-1) ?? null
      }
      function dedicar(p) {
        setTimeout(() => {
          p.el?.classList.add("dedicado", "foco")
          setTimeout(() => p.el?.classList.remove("dedicado", "foco"), 5600)
          faixa(`Esse gol é do ${p.nome}!`, "", "dedicatoria")
        }, 2400)
      }

      // --- The narrator (scripts/narrador.py, on this PC): goals in the narrator's voice ---------------
      // OBS routes this source's sound to the stream's track only, never to the recording. The openers
      // are rendered when the page loads, so they play at once; the rest (the speed, the dedication)
      // renders while the opener plays. Without the narrator running, goals are just silent.
      // The dock switches it on and off.
      const NARRADOR = params.get("narrador") ?? "http://127.0.0.1:8788"
      // On only while the dock's "Galvão narrando os gols" is on (it says so every few seconds); always in the demo.
      let narradorLigado = params.has("demo")
      const ABERTURAS = [
        "Olha o que ele fez! É gol! É gol do Luan!",
        "Haja coração, amigo! É gol do Luan!",
        "Vai que é sua, Luan! E é gol!",
        "Que pancada! É gol, é gol, é gol do Luan!",
      ]
      const CONTRA = ["Ih, amigo... tomou. Bola pra frente, Luan.", "Não dá pra acreditar. Gol deles.", "Acontece. Respira e vamos pra cima!"]
      const som = new AudioContext()
      const prontas = new Map() // line → AudioBuffer
      function voz(texto) {
        if (NARRADOR === "0") return Promise.resolve(null)
        if (prontas.has(texto)) return Promise.resolve(prontas.get(texto))
        return fetch(`${NARRADOR}/falar`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ texto }) })
          .then((r) => (r.ok ? r.arrayBuffer() : null))
          .then((dados) => dados && som.decodeAudioData(dados))
          .then((buffer) => (buffer && prontas.set(texto, buffer), buffer))
          .catch(() => null)
      }
      // The openers, now and whenever the narrator comes up later.
      const preparar = () => [...ABERTURAS, ...CONTRA].filter((t) => !prontas.has(t)).forEach(voz)
      preparar()
      setInterval(preparar, 30000)

      let narrando = Promise.resolve()
      function narrar(...partes) {
        if (!narradorLigado) return
        narrando = narrando.then(async () => {
          for (const parte of partes) {
            const buffer = await parte
            if (!buffer) continue
            await new Promise((fim) => {
              const fonte = som.createBufferSource()
              fonte.buffer = buffer
              fonte.connect(som.destination)
              fonte.onended = fim
              fonte.start()
            })
          }
        })
      }
      const pick = (lista) => lista[Math.floor(Math.random() * lista.length)]
      // Logins read better without their dots and underscores: "bia.aerial" → "bia aerial".
      const falado = (nome) => nome.replace(/[._-]+/g, " ").trim()
      function narrarGol(kmh, dedicado) {
        const velocidade = kmh ? (kmh >= 100 ? `${kmh} quilômetros por hora, que bomba!` : `A bola entrou a ${kmh} quilômetros por hora!`) : ""
        const resto = [velocidade, dedicado && `Esse gol é do ${falado(dedicado.nome)}!`].filter(Boolean).join(" ")
        narrar(voz(pick(ABERTURAS)), resto && voz(resto))
      }

      const jogo = {
        gol({ nosso, kmh }) {
          if (!nosso) {
            narrar(voz(pick(CONTRA)))
            soltarStickers("contra")
            return momento("luto", 3300)
          }
          momento("festa", 3000)
          soltarStickers("gol")
          confete()
          faixa("GOOOL!", kmh ? `${kmh} km/h` : "")
          const dedicado = sortear()
          if (dedicado) dedicar(dedicado)
          narrarGol(kmh, dedicado)
        },
        noar({ ligado }) {
          noArAte = ligado ? Date.now() + 15000 : 0
        },
        narrador({ ligado }) {
          narradorLigado = !!ligado
        },
        defesa({ epica }) {
          momento("defesa", 800)
          if (epica) faixa("DEFESAÇA!")
        },
      }
      addEventListener("muanlartins-torcida", ({ detail }) => jogo[detail?.tipo]?.(detail))

      // --- From the chat ---------------------------------------------------------------------------
      const vez = new Map()
      let ultimaOla = 0
      const COMANDOS = {
        pula(p) {
          mexer(p, "pula")
        },
        danca(p) {
          mexer(p, "danca")
        },
        ola(p) {
          if (Date.now() - ultimaOla < OLA_MS) return
          ultimaOla = Date.now()
          const x0 = Number(p.el.style.getPropertyValue("--x"))
          p.el.classList.add("foco")
          for (const { el } of pessoas.values()) {
            if (!el) continue
            el.style.setProperty("--atraso-ola", `${Math.abs(Number(el.style.getPropertyValue("--x")) - x0) * 1.4}ms`)
            el.classList.remove("ola")
            void el.offsetWidth
            el.classList.add("ola")
          }
        },
      }
      // Balloons sit just over the highest row in use; one that would overlap another goes on top of it.
      const falas = [] // { el, p }
      function falar(p, texto) {
        if (!p?.el) return
        falas.filter((f) => f.p === p).forEach(calar)
        const el = document.createElement("span")
        el.className = "fala"
        const chars = Array.from(texto.trim())
        el.textContent = chars.length > FALA_MAX ? chars.slice(0, FALA_MAX - 1).join("") + "…" : chars.join("")
        torcida.append(el)
        const fileiras = Math.min(FILEIRAS.length, Math.ceil(pessoas.size / POR_FILEIRA))
        const { s, base } = FILEIRAS[Math.max(0, fileiras - 1)]
        const x = Number(p.el.style.getPropertyValue("--x"))
        const w = el.offsetWidth
        const left = Math.min(Math.max(x - w / 2, 0), 960 - w)
        let bottom = base + 60 * s + 30
        for (const outra of falas.filter((f) => !f.saindo)) {
          const o = outra.el
          if (left < o.offsetLeft + o.offsetWidth + 6 && o.offsetLeft < left + w + 6) bottom = Math.max(bottom, parseFloat(o.style.bottom) + o.offsetHeight + 12)
        }
        el.style.left = `${left}px`
        el.style.bottom = `${bottom}px`
        el.style.setProperty("--ponta", `${x - left}px`)
        p.el.classList.add("foco")
        const fala = { el, p }
        falas.push(fala)
        const ativas = falas.filter((f) => !f.saindo)
        if (ativas.length > FALAS) calar(ativas[0])
        setTimeout(() => calar(fala), FALA_MS)
      }
      function calar(fala) {
        if (fala.saindo) return
        fala.saindo = true
        fala.el.classList.add("some")
        setTimeout(() => {
          fala.el.remove()
          falas.splice(falas.indexOf(fala), 1)
          const el = fala.p.el
          if (el && !falas.some((f) => f.p === fala.p) && !el.matches(".pula, .danca, .ola, .dedicado")) el.classList.remove("foco")
        }, 400)
      }

      function mexer(p, classe) {
        p.el.classList.remove("pula", "danca", "ola")
        void p.el.offsetWidth
        p.el.classList.add(classe, "foco")
      }
      function comando(login, texto) {
        const nome = texto
          .trim()
          .split(/\s/)[0]
          .slice(1)
          .toLowerCase()
          .normalize("NFD")
          .replace(/\p{M}/gu, "")
        const p = pessoas.get(login)
        if (!COMANDOS[nome] || !p?.el || torcida.matches(".festa, .luto")) return
        if (nome !== "ola" && Date.now() - (vez.get(login) || 0) < ESPERA_MS) return
        vez.set(login, Date.now())
        COMANDOS[nome](p)
      }

      function apply(line) {
        const { tags, prefix, command, trailing } = parseIrc(line)
        const login = prefix.split("!")[0]
        if (command === "JOIN") chegar(login)
        else if (command === "PART") sair(login)
        // Someone who talks is there, even before their JOIN arrives; and now we know their display name.
        else if (command === "PRIVMSG") {
          chegar(login, tags["display-name"] || login)
          if (trailing.startsWith("!")) comando(login, trailing)
          else falar(pessoas.get(login), trailing.replace(/^\u0001ACTION (.*)\u0001$/, "$1"))
        } else if (command === "353") trailing.split(" ").forEach((name) => name && chegar(name))
      }

      if (params.has("demo")) demo()
      else
        irc(apply, {
          membership: true,
          // On reconnecting, Twitch lists who is there again; whoever it doesn't list left meanwhile.
          onStatus(connected) {
            if (!connected) return
            conectouEm = Date.now()
            vistos = new Set()
            setTimeout(() => [...pessoas.keys()].filter((login) => !vistos.has(login)).forEach(sair), ASSENTANDO_MS)
          },
        })

      function demo() {
        const nomes = ["rafa_rl", "Giovana_GC", "tiagoboost", "platinadinho", "lucas_ssl", "bia.aerial", "DuduFlip",
          "kickoff_king", "ceci_rl", "manomenezes", "zeroboost", "Ana_Ceiling", "otto_dribla", "jujuflick", "PedroDemo"]
        // Half of them chose their look on the site.
        const um = (lista) => lista[Math.floor(Math.random() * lista.length)]
        nomes.forEach((n, i) => i % 2 && escolhas.set(n.toLowerCase(), {
          cabeca: um(Torcedor.CABECAS), roupa: um(Torcedor.ROUPAS), acessorio: um(Torcedor.ACESSORIOS),
          comemoracao: um(Torcedor.COMEMORACOES), frase: um(["bora Luan!", "chegueeei", "hoje sobe!"]),
          stickers: { gol: [um(Torcedor.STICKERS.slice(0, 12)), um(Torcedor.STICKERS.slice(0, 12))], contra: [um(Torcedor.STICKERS.slice(12))] },
        }))
        // And each has some Σ, from a newcomer to a regular of a year.
        nomes.forEach((n, i) => sigmas.set(n.toLowerCase(), { sigma: Math.round(20000 * Math.random() ** 3) }))
        nomes.slice(0, 12).forEach((n) => chegar(n.toLowerCase(), n))
        conectouEm = Date.now() - ASSENTANDO_MS
        const FRASES = ["boa noite!!", "que golaço", "GG", "esse half flip foi limpo demais",
          "qual a sensibilidade do teu controle?", "bora subir pro diamante 3 hoje", "kkkkkkk", "salvou demais"]
        const say = (login, text) => apply(`@display-name=${login} :${login}!${login}@x PRIVMSG #${CHANNEL} :${text}`)
        const random = () => [...pessoas.keys()][Math.floor(Math.random() * pessoas.size)]
        const keys = {
          g: () => jogo.gol({ nosso: true, kmh: 80 + Math.round(Math.random() * 60) }),
          c: () => jogo.gol({ nosso: false }),
          d: () => jogo.defesa({}),
          e: () => jogo.defesa({ epica: true }),
          p: () => say(random(), "!pula"),
          n: () => say(random(), "!dança"),
          o: () => say(random(), "!ola"),
          j: () => {
            const novo = nomes.find((n) => !pessoas.has(n.toLowerCase())) || `pessoa${pessoas.size}`
            chegar(novo.toLowerCase(), novo)
            setTimeout(() => gritar(pessoas.get(novo.toLowerCase())), 1200)
          },
          s: () => sair(random()),
          m: () => say(random(), FRASES[Math.floor(Math.random() * FRASES.length)]),
        }
        addEventListener("keydown", (e) => keys[e.key]?.())
        if (params.get("demo") === "parado") return
        const roteiro = "gmpjmnomdcmsgejmpn"
        let i = 0
        setInterval(() => keys[roteiro[i++ % roteiro.length]](), 6000)
      }
    </script>
  </body>
