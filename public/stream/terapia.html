<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Momento terapia · muanlartins</title>
    <link rel="stylesheet" href="stream.css" />
    <!--
      OBS: Browser source, 1920×1080, over the camera, "Control audio via OBS" on (its music goes to the stream,
      the recording and Luan's headphones: it's made here, so there are no rights to clear). The "Terapia" scene,
      for a breather after a bad run: water in the channel's blues, a breathing guide (in for 4 s, hold for 4,
      out for 6), the camera small in its frame at (64, 64), 560×315, and the chat down the right.

      The music is generated as it plays, never the same twice: long chords on D, a few bells from its pentatonic
      scale and a soft breath that follows the guide. ?mudo silences it; ?canal= the chat's channel; ?demo fills
      the chat.
    -->
    <style>
      .ground {
        /* Everything but the camera's hole. */
        clip-path: path(evenodd, "M0 0H1920V1080H0Z M64 64H624V379H64Z");
        position: absolute;
        inset: 0;
      }
      #agua {
        position: absolute;
        inset: 0;
      }
      .hole {
        position: absolute;
        left: 64px;
        top: 64px;
        width: 560px;
        height: 315px;
      }
      #plate {
        left: 48px;
        top: 369px;
      }
      .breath {
        position: absolute;
        left: 120px;
        top: 440px;
        width: 1200px;
        height: 600px;
        display: grid;
        place-items: center;
      }
      .ring {
        position: absolute;
        top: 30px;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        border: 6px solid var(--klein-claro);
        background: radial-gradient(circle, rgb(133 167 255 / 0.28), rgb(133 167 255 / 0.06) 70%);
        box-shadow: 0 0 80px rgb(133 167 255 / 0.35);
        transform: scale(0.55);
      }
      .cue {
        position: absolute;
        top: 470px;
        margin: 0;
        font-size: 64px;
        font-weight: 500;
        letter-spacing: -0.03em;
        transition: opacity 0.6s var(--ease);
      }
      .title {
        position: absolute;
        left: 688px;
        top: 64px;
      }
      .title h1 {
        margin: 10px 0 0;
        font-size: 72px;
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .side {
        position: absolute;
        left: 1392px;
        top: 64px;
        width: 464px;
        height: 952px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .side .eyebrow {
        padding-bottom: 14px;
        border-bottom: 1px solid rgb(133 167 255 / 0.4);
      }
      #chat {
        position: relative;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="ground"><canvas id="agua" width="1920" height="1080"></canvas></div>
      <div class="hole"></div>
      <div id="plate"></div>
      <div class="title">
        <p class="eyebrow">Momento terapia</p>
        <h1>Respira.</h1>
      </div>
      <div class="breath">
        <div class="ring" id="ring"></div>
        <p class="cue" id="cue">Inspira…</p>
      </div>
      <aside class="side">
        <p class="eyebrow">Chat</p>
        <div id="chat"></div>
      </aside>
    </main>
    <script src="stream.js"></script>
    <script src="sons.js"></script>
    <script>
      const border = frame(document.querySelector(".hole"), { band: 12, fill: "#001447" })
      const attention = plate(document.getElementById("plate"), `muanlartins<span class="accent">.com.br</span>`)
      alternate(6, attention, border.glint)
      chat(document.getElementById("chat"))

      // --- The breath: in 4 s, hold 4 s, out 6 s --------------------------------------------------------------
      const STEPS = [
        ["Inspira…", 4, 0.55, 1],
        ["Segura…", 4, 1, 1],
        ["Solta…", 6, 1, 0.55],
      ]
      const CYCLE = STEPS.reduce((t, [, s]) => t + s, 0)
      const ring = document.getElementById("ring")
      const cue = document.getElementById("cue")
      const ease = (x) => 0.5 - Math.cos(Math.PI * x) / 2
      const start = performance.now()
      let shown = ""
      /** Where the breath is: its step, the ring's scale and how full the lungs are (0..1). */
      function breath(now) {
        let t = ((now - start) / 1000) % CYCLE
        for (const [text, seconds, from, to] of STEPS) {
          if (t < seconds) {
            const scale = from + (to - from) * ease(t / seconds)
            return { text, scale, full: (scale - 0.55) / 0.45 }
          }
          t -= seconds
        }
      }

      // --- The water: layers of slow waves, darker far away, with light drifting along the lattice's 45° ------
      const canvas = document.getElementById("agua")
      const g = canvas.getContext("2d")
      const LAYERS = [
        { y: 560, amp: 10, len: 520, speed: 0.06, color: "#00287f" },
        { y: 640, amp: 14, len: 640, speed: -0.08, color: "#002fa7" },
        { y: 730, amp: 18, len: 760, speed: 0.1, color: "#1a45b8" },
        { y: 830, amp: 22, len: 900, speed: -0.12, color: "#3a63cc" },
        { y: 940, amp: 26, len: 1100, speed: 0.15, color: "#5a80dd" },
      ]
      function water(seconds) {
        const sky = g.createLinearGradient(0, 0, 0, 1080)
        sky.addColorStop(0, "#001447")
        sky.addColorStop(0.55, "#002080")
        sky.addColorStop(1, "#002fa7")
        g.fillStyle = sky
        g.fillRect(0, 0, 1920, 1080)
        // Light at 45°, drifting.
        g.save()
        g.globalAlpha = 0.07
        g.strokeStyle = "#85a7ff"
        g.lineWidth = 40
        const shift = (seconds * 12) % 240
        for (let x = -1200; x < 1920 + 1080; x += 240) {
          g.beginPath()
          g.moveTo(x + shift, 0)
          g.lineTo(x + shift - 1080, 1080)
          g.stroke()
        }
        g.restore()
        for (const [i, l] of LAYERS.entries()) {
          g.beginPath()
          g.moveTo(0, 1080)
          for (let x = 0; x <= 1920; x += 16) {
            const phase = (x / l.len) * Math.PI * 2 + seconds * l.speed * Math.PI * 2
            const y = l.y + Math.sin(phase) * l.amp + Math.sin(phase * 0.47 + i) * l.amp * 0.6
            g.lineTo(x, y)
          }
          g.lineTo(1920, 1080)
          g.closePath()
          g.fillStyle = l.color
          g.globalAlpha = 0.92
          g.fill()
          g.globalAlpha = 1
        }
      }

      let last = 0
      function frameLoop(now) {
        requestAnimationFrame(frameLoop)
        const b = breath(now)
        ring.style.transform = `scale(${b.scale.toFixed(4)})`
        if (b.text !== shown) {
          shown = b.text
          cue.textContent = b.text
        }
        breathSound(b.full)
        // The water at 30 fps is plenty, and lighter on the stream PC.
        if (now - last < 33) return
        last = now
        water(now / 1000)
      }
      requestAnimationFrame(frameLoop)

      // --- The music ------------------------------------------------------------------------------------------
      const D = 146.83
      const note = (n) => D * 2 ** (n / 12)
      // Semitones from D3: Dmaj9, Bm7(11), Gmaj7, Asus2; nine seconds each.
      const CHORDS = [[0, 4, 7, 11, 14], [-3, 0, 4, 7, 14], [-7, -3, 0, 4, 7], [-5, 2, 7, 9, 14]]
      const BELLS = [12, 14, 16, 19, 21, 24, 26, 28]
      let ctx = null
      let breathGain = null
      function music() {
        ctx = new AudioContext()
        const master = ctx.createGain()
        master.gain.value = 0.5
        const comp = ctx.createDynamicsCompressor()
        master.connect(comp).connect(ctx.destination)
        const hall = Sons.room(ctx, master, { seconds: 4, wet: 0.55, decay: 2 })
        const pad = ctx.createBiquadFilter()
        pad.type = "lowpass"
        pad.frequency.value = 900
        const lfo = ctx.createOscillator()
        const depth = ctx.createGain()
        lfo.frequency.value = 0.05
        depth.gain.value = 300
        lfo.connect(depth).connect(pad.frequency)
        lfo.start()
        pad.connect(hall)

        let chord = 0
        function nextChord() {
          const t = ctx.currentTime
          for (const n of CHORDS[chord % CHORDS.length]) {
            for (const detune of [-5, 6]) {
              const osc = ctx.createOscillator()
              osc.type = "triangle"
              osc.frequency.value = note(n)
              osc.detune.value = detune
              const g = ctx.createGain()
              g.gain.setValueAtTime(0, t)
              g.gain.linearRampToValueAtTime(0.022, t + 3)
              g.gain.setValueAtTime(0.022, t + 8)
              g.gain.linearRampToValueAtTime(0, t + 13)
              osc.connect(g).connect(pad)
              osc.start(t)
              osc.stop(t + 13.1)
            }
          }
          chord++
          setTimeout(nextChord, 9000)
        }
        function bell() {
          const t = ctx.currentTime
          const f = note(BELLS[Math.floor(Math.random() * BELLS.length)])
          for (const [ratio, level] of [[1, 0.05], [2.01, 0.012]]) {
            const osc = ctx.createOscillator()
            osc.frequency.value = f * ratio
            const g = Sons.envelope(ctx, t, { attack: 0.02, release: 3.5, peak: level })
            osc.connect(g).connect(hall)
            osc.start(t)
            osc.stop(t + 3.6)
          }
          setTimeout(bell, 2500 + Math.random() * 4000)
        }
        // The breath: soft filtered noise, louder as the lungs fill.
        const src = ctx.createBufferSource()
        src.buffer = Sons.noise(ctx, 4)
        src.loop = true
        const lp = ctx.createBiquadFilter()
        lp.type = "lowpass"
        lp.frequency.value = 700
        breathGain = ctx.createGain()
        breathGain.gain.value = 0
        src.connect(lp).connect(breathGain).connect(hall)
        src.start()
        nextChord()
        setTimeout(bell, 3000)
      }
      function breathSound(full) {
        if (breathGain) breathGain.gain.setTargetAtTime(0.012 + full * 0.03, ctx.currentTime, 0.2)
      }
      if (!params.has("mudo")) {
        music()
        // A browser outside OBS starts sound only after a click.
        addEventListener("click", () => ctx?.resume())
      }
    </script>
  </body>
</html>
