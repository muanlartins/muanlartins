<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>VAR · muanlartins</title>
    <link rel="stylesheet" href="stream.css" />
    <!--
      OBS: Browser source "Efeito · VAR", 1920×1080, with its sound ("controlar áudio pelo OBS", in Luan's headphones
      too), in the VAR scenes ("VAR · Rocket League", "VAR · Valorant") over the camera and under the crowd, and in the
      game scenes ("RL + chat", "Valorant + chat") over the overlays, where it stays clear until a VAR opens there.

      It plays the clip itself, in a <video>: the replay the Efeitos dock (efeitos.html) had OBS save and
      scripts/replay.py serves on 127.0.0.1:8794 (the game alone, from the Source Record buffer on "Gravar jogo"; the
      stream as it went out when that one isn't there). Two layouts, picked in the dock:
      - "cabine", the video referee's booth (Valorant's default: Luan is dead, there's time): the Klein ground
        everywhere but the camera's hole (512×288 at (1344, 136)), the clip in the monitor (1216×684 at (64, 136)), each
        in the frame with a referee-yellow tab, the chat's vote under the camera; the scene is the game's VAR scene.
      - "mini" (Rocket League's default), like a tournament's: the game goes on full screen and the clip plays in a
        corner, top right, 640×360 at (1236, 92), with the vote under it, where the chat is (jogo.html fades its chat
        meanwhile); the scene stays the game's.
      Under the clip, its progress.

      An instant replay (the clip's last seconds, no looking for the play: Luan, 2026-11-12), playing on its own by the
      script the dock sends (`replay.roteiro`, ROTEIRO in stream.js; he doesn't steer it live): the stretch once at full
      speed, again at 50% (Valorant zooms on the crosshair meanwhile), and for the vote's last 8 s the closing screen,
      the clip frozen on the stretch's last frame with the seconds left, while the last votes come in; the verdict lands
      on it. Muted: the game's sound stays the live game's. If Luan touches the dock's player, the script drops and
      the clip follows his controls.

      The dock sends the VAR's whole state on every change, and every second while it plays, as obs-browser's
      emit_event "muanlartins-var" with the state as JSON text in `estado` (varDe() in stream.js): { fase: "votacao" |
      "empate" | "veredito" | "fechado", id, layout, pergunta, opcoes, votos, ate (when the vote ends, epoch ms), sorteio
      (the verdict was a tie's draw),
      duracao (the vote's), vencedora, empatadas, linha, replay: { url, duracao, fonte, zoom, roteiro, t, em, tocando,
      base, som, acao } }. `t` at epoch ms `em` is the dock's preview
      (or the script's, while there is one); this page carries it forward (replayPosicao() in stream.js) and only seeks
      when it drifts more than half a second, or to the frame when a pass starts or Luan presses a control. The
      line ([x0, y0, x1, y1] in the clip's 0–1 coordinates, dragged in the dock) crosses the whole clip, like TV's
      offside line. The booth's frame draws itself as each VAR opens: the referee drawing the screen in the air.

      Copy here is a draft for Luan. ?demo plays a whole VAR on its own, again and again (?voto= its seconds, 30 by default;
      ?demo=votacao, veredito, empate, mini, fim for one still frame), over a stand-in replay or ?replay=<a clip's URL>; ?fundo=<image> puts a game screenshot behind
      it, to see the mini over a game.
    -->
    <style>
      :root {
        --amarelo: #ffd23f;
        --preto: #2b2f38;
      }
      .booth {
        transition: opacity 0.35s var(--ease);
      }
      .booth.fechado {
        opacity: 0;
      }
      .fundo-demo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* The Klein ground with the lattice, everywhere but the camera (clip-path set by the script); the booth only. */
      .ground {
        position: absolute;
        inset: 0;
      }
      .mini .ground,
      .mini .camera-frame,
      .mini .tab-camera,
      .mini .gesto {
        display: none;
      }
      .camera {
        position: absolute;
        left: 1344px;
        top: 136px;
        width: 512px;
        height: 288px;
      }
      .demo-camera {
        position: absolute;
        background:
          linear-gradient(160deg, rgb(255 255 255 / 0.06), transparent 60%),
          repeating-linear-gradient(90deg, #1d6b3a 0 120px, #217a42 120px 240px);
      }

      /* The clip: in the monitor, or in the corner. */
      .tela {
        position: absolute;
        left: 64px;
        top: 136px;
        width: 1216px;
        height: 684px;
        overflow: hidden;
        background: #000;
        transition:
          left 0.5s var(--ease),
          top 0.5s var(--ease),
          width 0.5s var(--ease),
          height 0.5s var(--ease);
      }
      .mini .tela {
        left: 1236px;
        top: 92px;
        width: 640px;
        height: 360px;
        box-shadow: 0 18px 40px rgb(0 20 71 / 0.55);
      }
      .tela video,
      .tela .demo-replay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform-origin: 50% 50%;
      }
      .tela .demo-replay {
        background:
          linear-gradient(160deg, rgb(255 255 255 / 0.06), transparent 60%),
          repeating-linear-gradient(90deg, #1d6b3a 0 120px, #217a42 120px 240px);
      }
      .tela .linha {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      /* Slow motion: the picture cools a little and a band says so, like the games' own replays. */
      .tela .lenta {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 30%;
        background: linear-gradient(to top, rgb(0 20 71 / 0.55), transparent);
        opacity: 0;
        transition: opacity 0.3s var(--ease);
      }
      .em-lenta .tela .lenta {
        opacity: 1;
      }
      /* The closing screen: the clip frozen on the play, darkened, the seconds left while the last votes come in. */
      .tela .fim {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: rgb(0 20 71 / 0.74);
        color: #fff;
        text-align: center;
        opacity: 0;
        transition: opacity 0.4s var(--ease);
      }
      .no-fim .tela .fim {
        opacity: 1;
      }
      .tela .fim small {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: var(--amarelo);
      }
      .tela .fim strong {
        font-size: 88px;
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -0.03em;
      }
      .tela .fim span {
        font-size: 120px;
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: var(--amarelo);
      }
      .tela .fim span.texto {
        font-size: 40px;
        color: #fff;
      }
      .mini .tela .fim span.texto {
        font-size: 22px;
      }
      .mini .tela .fim small {
        font-size: 15px;
      }
      .mini .tela .fim strong {
        font-size: 46px;
      }
      .mini .tela .fim span {
        font-size: 64px;
      }
      /* Under the verdict's card, only the dark frozen frame. */
      .veredito .tela .fim > * {
        opacity: 0;
      }
      .frame-mini {
        display: none;
      }
      .mini .frame-mini {
        display: block;
      }
      .mini .monitor-frame {
        display: none;
      }

      /* The band across the top: the VAR's name and what it is. */
      .band {
        position: absolute;
        left: 64px;
        top: 40px;
        height: 64px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 72px 0 0;
        background: var(--paper);
        color: var(--klein);
        clip-path: polygon(0 0, 100% 0, calc(100% - 64px) 100%, 0 100%);
      }
      .band .sigla {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 100%;
        padding: 0 22px;
        background: var(--amarelo);
        color: var(--preto);
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .band .sigla svg {
        width: 44px;
        height: 30px;
      }
      .band .titulo {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .mini .band {
        left: 1226px;
        top: 36px;
        height: 40px;
        gap: 12px;
        padding-right: 48px;
        clip-path: polygon(0 0, 100% 0, calc(100% - 40px) 100%, 0 100%);
      }
      .mini .band .sigla {
        gap: 9px;
        padding: 0 14px;
        font-size: 24px;
      }
      .mini .band .sigla svg {
        width: 26px;
        height: 18px;
      }
      .mini .band .titulo {
        font-size: 18px;
      }
      .aberto .band {
        animation: wipe-in 0.7s var(--ease) 0.15s both;
      }

      /* The tabs on the frames' top edges: what each hole is. */
      .tab {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 36px;
        padding: 0 40px 0 14px;
        background: var(--amarelo);
        color: var(--preto);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.06em;
        clip-path: polygon(0 0, 100% 0, calc(100% - 36px) 100%, 0 100%);
        white-space: nowrap;
      }
      .tab .estado {
        font-weight: 500;
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
      }
      .tab .gravando {
        width: 10px;
        height: 10px;
        background: var(--preto);
        transform: rotate(45deg);
        animation: pisca 1.2s steps(1) infinite;
      }
      @keyframes pisca {
        50% {
          opacity: 0;
        }
      }
      .tab-monitor {
        left: 52px;
        top: 106px;
      }
      .tab-camera {
        left: 1332px;
        top: 106px;
      }
      .mini .tab-monitor {
        left: 1650px;
        top: 40px;
        height: 32px;
        font-size: 15px;
        padding-right: 34px;
        clip-path: polygon(0 0, 100% 0, calc(100% - 32px) 100%, 0 100%);
      }

      /* The referee drawing the screen: two strokes from the top's middle, round each side, meeting at the bottom. */
      .gesto {
        position: absolute;
        left: 40px;
        top: 112px;
        width: 1264px;
        height: 732px;
        overflow: visible;
        pointer-events: none;
      }
      .gesto path {
        fill: none;
        stroke: var(--paper);
        stroke-width: 6;
        stroke-linecap: square;
        stroke-dasharray: 1 1.1;
        stroke-dashoffset: 1.02;
        opacity: 0;
      }
      .aberto .gesto path {
        animation: desenha 1.6s var(--ease) 0.1s both;
      }
      @keyframes desenha {
        0% {
          opacity: 1;
        }
        55% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 0;
        }
      }

      /* The clip's progress, under it: where it is, the plays, the one in focus. */
      .trilha {
        position: absolute;
        left: 64px;
        top: 854px;
        width: 1216px;
        height: 8px;
        background: rgb(133 167 255 / 0.3);
      }
      .mini .trilha {
        left: 1236px;
        top: 468px;
        width: 640px;
        height: 6px;
      }
      .trilha .feito {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: var(--paper);
      }

      /* The chat's vote: under the camera, or under the mini player. */
      .votacao {
        position: absolute;
        left: 1332px;
        top: 456px;
        width: 536px;
        height: 364px;
        display: flex;
        flex-direction: column;
        padding: 22px 24px 20px;
        background: var(--navy);
        clip-path: polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px);
      }
      .mini .votacao {
        left: 1226px;
        top: 488px;
        width: 660px;
        height: auto;
        padding: 16px 20px 16px;
        background: rgb(0 20 71 / 0.92);
      }
      .aberto .votacao {
        animation: entra 0.6s var(--ease) 0.35s both;
      }
      @keyframes entra {
        from {
          transform: translateX(80px);
          opacity: 0;
        }
      }
      .pergunta {
        margin: 0 0 16px;
        font-size: 30px;
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.02em;
        overflow-wrap: anywhere;
      }
      .mini .pergunta {
        margin-bottom: 12px;
        font-size: 24px;
      }
      .opcoes {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .mini .opcoes {
        gap: 8px;
      }
      .opcao {
        position: relative;
        display: grid;
        grid-template-columns: 52px 1fr auto;
        align-items: center;
        gap: 12px;
        height: 54px;
        padding-right: 14px;
        background: rgb(0 47 167 / 0.55);
        font-size: 22px;
        font-weight: 500;
        transition: opacity 0.4s var(--ease);
      }
      .mini .opcao {
        grid-template-columns: 46px 1fr auto;
        height: 42px;
        font-size: 19px;
      }
      .opcao .barra {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: var(--klein);
        transition: width 0.45s var(--ease);
      }
      .opcao > :not(.barra) {
        position: relative;
      }
      .opcao .comando {
        display: grid;
        place-items: center;
        height: 100%;
        background: var(--amarelo);
        color: var(--preto);
        font-weight: 700;
        font-size: 20px;
      }
      .opcao .nome {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .opcao .conta {
        font-variant-numeric: tabular-nums;
        color: var(--klein-claro);
        font-weight: 600;
      }
      .empate .opcao.empatada {
        animation: empate 0.9s ease-in-out infinite alternate;
      }
      @keyframes empate {
        to {
          box-shadow: inset 0 0 0 2px var(--amarelo);
        }
      }
      .veredito .opcao:not(.vencedora) {
        opacity: 0.4;
      }
      .veredito .opcao.vencedora {
        box-shadow: inset 0 0 0 2px var(--amarelo);
      }
      .rodape {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: auto;
        font-size: 18px;
        color: rgb(244 245 247 / 0.75);
      }
      .mini .rodape {
        margin-top: 12px;
        font-size: 16px;
      }
      .relogio {
        flex: 1;
        height: 6px;
        background: rgb(133 167 255 / 0.25);
      }
      .relogio i {
        display: block;
        height: 100%;
        width: 100%;
        background: var(--amarelo);
        transform-origin: 0 50%;
      }
      .segundos {
        min-width: 3ch;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--paper);
        font-weight: 600;
      }

      /* The verdict: the winning option on a referee's card, slammed over the clip. */
      .cartao {
        position: absolute;
        left: 672px;
        top: 478px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        max-width: 920px;
        padding: 30px 64px 36px;
        background: var(--amarelo);
        color: var(--preto);
        border: 4px solid var(--navy);
        box-shadow: 18px 18px 0 rgb(0 20 71 / 0.55);
        transform: translate(-50%, -50%) rotate(-6deg);
        text-align: center;
      }
      .mini .cartao {
        left: 1556px;
        top: 272px;
        max-width: 560px;
        padding: 18px 36px 22px;
        box-shadow: 10px 10px 0 rgb(0 20 71 / 0.55);
      }
      .cartao[hidden] {
        display: none;
      }
      .cartao.bate {
        animation: bate 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
      @keyframes bate {
        from {
          transform: translate(-50%, -50%) rotate(-24deg) scale(2.4);
          opacity: 0;
        }
        60% {
          opacity: 1;
        }
      }
      .cartao small {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.14em;
      }
      .cartao strong {
        font-size: 96px;
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -0.03em;
        overflow-wrap: anywhere;
      }
      .mini .cartao strong {
        font-size: 56px;
      }
      .mini .cartao small,
      .mini .cartao span {
        font-size: 16px;
      }
      .cartao span {
        font-size: 22px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      @media (prefers-reduced-motion: reduce) {
        .aberto .band,
        .aberto .votacao,
        .aberto .gesto path,
        .cartao.bate {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage booth fechado" id="booth">
      <div class="ground" id="ground"></div>
      <div class="camera" id="camera"></div>

      <div class="tela" id="tela">
        <video id="video" playsinline loop preload="auto"></video>
        <div class="lenta"></div>
        <svg class="linha" id="linha" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
        <div class="fim" aria-hidden="true"><small>FIM DO REPLAY</small><strong id="fim-titulo">Últimos votos</strong><span id="fim-segundos"></span></div>
      </div>

      <div class="band">
        <span class="sigla"><svg viewBox="0 0 44 30" aria-hidden="true"><rect x="3" y="3" width="38" height="24" fill="none" stroke="currentColor" stroke-width="5" /></svg>VAR</span>
        <span class="titulo">Revisão do lance</span>
      </div>
      <div class="tab tab-monitor"><span class="gravando"></span><span id="rotulo-replay">REPLAY</span> <span class="estado" id="velocidade">100%</span></div>
      <div class="tab tab-camera">AO VIVO</div>

      <div class="trilha" id="trilha"><span class="feito" id="feito"></span></div>

      <svg class="gesto" viewBox="0 0 1264 732" aria-hidden="true">
        <path pathLength="1" d="M632 3H3V729H632" />
        <path pathLength="1" d="M632 3H1261V729H632" />
      </svg>

      <section class="votacao" id="votacao">
        <p class="pergunta" id="pergunta"></p>
        <ul class="opcoes" id="opcoes"></ul>
        <div class="rodape" id="rodape">
          <span id="dica">Vote no chat</span>
          <span class="relogio"><i id="relogio"></i></span>
          <span class="segundos" id="segundos"></span>
        </div>
      </section>

      <div class="cartao" id="cartao" hidden><small>VEREDITO</small><strong id="vencedora"></strong><span id="placar"></span></div>
    </main>
    <script src="stream.js"></script>
    <script>
      const $ = (id) => document.getElementById(id)
      const booth = $("booth")
      const video = $("video")
      const tela = $("tela")
      const BAND = 14
      const DERIVA = 0.5 // seconds of drift from the dock's clock before seeking (a play starts ~0.2 s late: below that it would seek again and again)

      // The booth's ground has one hole, where OBS puts the camera; the clip is this page's own.
      const rect = (el) => {
        const [x, y, w, h] = [el.offsetLeft, el.offsetTop, el.offsetWidth, el.offsetHeight]
        return `M${x} ${y}H${x + w}V${y + h}H${x}Z`
      }
      $("ground").style.clipPath = `path(evenodd, "M0 0H1920V1080H0Z${rect($("camera"))}")`
      // The frames: the monitor's and the camera's in the booth, a thinner one around the mini player.
      const molde = (left, top, width, height) => {
        const el = document.createElement("div")
        el.style.cssText = `position:absolute;left:${left}px;top:${top}px;width:${width}px;height:${height}px`
        booth.append(el)
        return el
      }
      const monitor = frame(molde(64, 136, 1216, 684), { band: BAND, fill: "#001447" })
      monitor.classList.add("monitor-frame")
      const camera = frame($("camera"), { band: BAND, fill: "#001447" })
      camera.classList.add("camera-frame")
      const mini = frame(molde(1236, 92, 640, 360), { band: 10, fill: "#001447" })
      mini.classList.add("frame-mini")
      // Under the band and the tabs, which sit on the frames' edges.
      for (const el of [monitor, camera, mini]) booth.insertBefore(el, document.querySelector(".band"))
      alternate(6, monitor.glint, camera.glint, mini.glint)

      let estado = { fase: "fechado" }
      let mostrado = null // the VAR id on screen, so each one's opening plays once
      let carimbado = null // and its verdict's card

      function desenhar(v) {
        estado = v
        const aberto = v.fase !== "fechado"
        booth.classList.toggle("fechado", !aberto)
        if (!aberto) {
          booth.classList.remove("aberto")
          mostrado = carimbado = null
          $("cartao").hidden = true
          video.pause()
          return
        }
        booth.classList.toggle("mini", v.layout === "mini")
        if (v.id !== mostrado) {
          mostrado = v.id
          carimbado = null
          booth.classList.remove("aberto")
          void booth.offsetWidth
          booth.classList.add("aberto")
          $("cartao").hidden = true
        }
        booth.classList.toggle("empate", v.fase === "empate")
        booth.classList.toggle("veredito", v.fase === "veredito")
        $("pergunta").textContent = v.pergunta ?? ""

        // The options, made again only when they change; the counts and bars update in place.
        const opcoes = v.opcoes ?? []
        const lista = $("opcoes")
        if (lista.dataset.de !== JSON.stringify(opcoes)) {
          lista.dataset.de = JSON.stringify(opcoes)
          lista.replaceChildren(
            ...opcoes.map((texto, i) => {
              const li = document.createElement("li")
              li.className = "opcao"
              li.innerHTML = `<span class="barra"></span><span class="comando">!${i + 1}</span><span class="nome"></span><span class="conta"></span>`
              li.querySelector(".nome").textContent = texto
              return li
            }),
          )
        }
        const votos = v.votos ?? opcoes.map(() => 0)
        const total = votos.reduce((a, b) => a + b, 0)
        ;[...lista.children].forEach((li, i) => {
          const n = votos[i] ?? 0
          li.querySelector(".barra").style.width = `${total ? (n / total) * 100 : 0}%`
          li.querySelector(".conta").textContent = total ? `${n} · ${Math.round((n / total) * 100)}%` : "0"
          li.classList.toggle("empatada", (v.empatadas ?? []).includes(i))
          li.classList.toggle("vencedora", v.fase === "veredito" && v.vencedora === i)
        })
        const comandos = opcoes.map((_, i) => `!${i + 1}`)
        $("dica").textContent =
          v.fase === "empate" ? "Empate: sorteio"
            : v.fase === "veredito" ? `${total} ${total === 1 ? "voto" : "votos"}`
              : `Vote no chat: ${comandos.slice(0, -1).join(", ")} ou ${comandos.at(-1)}`

        if (v.fase === "veredito" && carimbado !== v.id) {
          carimbado = v.id
          $("vencedora").textContent = opcoes[v.vencedora] ?? ""
          $("placar").textContent = v.sorteio
            ? total ? `Empate: no sorteio` : "Ninguém votou: no sorteio"
            : total ? `${votos[v.vencedora]} de ${total} ${total === 1 ? "voto" : "votos"}` : "Decisão do Luan"
          const c = $("cartao")
          c.hidden = false
          c.classList.remove("bate")
          void c.offsetWidth
          c.classList.add("bate")
        }

        // The line crosses the whole clip through the two points dragged in the dock.
        const svg = $("linha")
        svg.replaceChildren()
        if (v.linha) {
          let [x0, y0, x1, y1] = v.linha.map((n) => n * 1000)
          const dx = x1 - x0
          const dy = y1 - y0
          if (Math.hypot(dx, dy) > 4) {
            const k = 4000 / Math.hypot(dx, dy)
            const ponta = (s) => [x0 + dx * k * s, y0 + dy * k * s]
            const [a, b] = [ponta(-1), ponta(1)]
            svg.innerHTML = `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#001447" stroke-opacity="0.6" stroke-width="10" vector-effect="non-scaling-stroke"/>
              <line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#ffd23f" stroke-width="5" vector-effect="non-scaling-stroke"/>`
          }
        }
        replay(v.replay)
      }

      // --- The clip -------------------------------------------------------------------------------------------
      let r = null // the replay as the dock last sent it
      let acaoVista = null // the dock's last control press (`acao`) this page followed to the frame
      function replay(novo) {
        r = novo ?? null
        if (!r?.url) return
        if (video.dataset.url !== r.url) {
          video.dataset.url = r.url
          video.src = r.url
          acaoVista = null
        }
        // Muted unless the dock says so (off since 2026-11-12).
        video.muted = !r.som
        // To the frame only when Luan pressed something in the dock. The dock resends its clock every second and on
        // every vote; seeking on each of those froze the clip once a second (11-12 live: about 20 new frames a second
        // in the mini instead of 60, the clip's keyframes are 2 s apart), so those only correct drift past DERIVA.
        const acao = r.acao ?? 0
        seguir(acao !== acaoVista)
        acaoVista = acao
      }

      // Follows the dock's clock (or its script): play or pause as it does, seek only when off by more than DERIVA.
      function seguir(agora = false) {
        if (!r?.url || !video.readyState) return
        const alvo = replayPosicao(r)
        const tocando = replayTocando(r)
        // Playing, only past the drift allowed; paused, to the frame (a step is 1/60 s).
        const fora = Math.abs(video.currentTime - alvo)
        if (fora > (tocando && !agora ? DERIVA : 0.004)) video.currentTime = alvo
        if (tocando && video.paused) video.play().catch(() => {})
        if (!tocando && !video.paused) video.pause()
      }
      video.addEventListener("loadedmetadata", () => seguir(true))

      // Each frame: the script's pass (or, once Luan took over, the slow motion at the clip's time), its rate and zoom,
      // the progress, the tab. A new pass starts on its frame: the slow one goes back to the stretch's start.
      let faseVista = null
      function quadro() {
        const s = r?.url ? roteiroAgora(r) : null
        booth.classList.toggle("no-fim", s?.fase === "fim")
        if (r?.url && video.readyState) {
          if ((s?.fase ?? null) !== faseVista) {
            faseVista = s?.fase ?? null
            if (s) seguir(true)
          }
          const t = video.currentTime
          const w = s ? s.peso : 0
          const taxa = s ? s.taxa : (r.base ?? 1)
          if (Math.abs(video.playbackRate - taxa) > 0.005) video.playbackRate = taxa
          const z = r.zoom ? 1 + w * (ROTEIRO.zoom - 1) : 1
          video.style.transform = z > 1.001 ? `scale(${z})` : ""
          booth.classList.toggle("em-lenta", w > 0.5)
          $("feito").style.width = `${(t / (video.duration || r.duracao || 1)) * 100}%`
          const tocando = s ? s.tocando : r.tocando
          const lenta = s ? s.fase === "lenta" : w > 0.5
          $("rotulo-replay").textContent = s?.fase === "fim" ? "FIM DO REPLAY" : lenta && tocando ? "CÂMERA LENTA" : "REPLAY"
          $("velocidade").textContent = s?.fase === "fim" || s?.fase === "espera" ? "" : tocando ? `${Math.round(taxa * 100)}%` : "pausado"
        }
        requestAnimationFrame(quadro)
      }
      requestAnimationFrame(quadro)
      setInterval(() => replayTocando(r) && seguir(), 500)

      // The clock: the vote's time left, from `ate`.
      function relogio() {
        const v = estado
        const votando = v.fase === "votacao" && v.ate
        $("relogio").parentElement.hidden = !votando
        $("segundos").hidden = !votando
        if (votando) {
          const resta = Math.max(0, v.ate - Date.now())
          $("relogio").style.transform = `scaleX(${Math.min(1, resta / (v.duracao || 30000))})`
          $("segundos").textContent = `${Math.ceil(resta / 1000)}s`
        }
        $("fim-titulo").textContent = v.fase === "empate" ? "Empate!" : "Últimos votos"
        $("fim-segundos").textContent = votando ? Math.ceil(Math.max(0, v.ate - Date.now()) / 1000) : v.fase === "empate" ? "sorteando…" : ""
        $("fim-segundos").classList.toggle("texto", v.fase === "empate")
        requestAnimationFrame(relogio)
      }
      requestAnimationFrame(relogio)

      addEventListener("muanlartins-var", ({ detail }) => (detail = varDe(detail)) && desenhar(detail))

      if (params.has("demo")) {
        if (params.get("fundo")) {
          const img = document.createElement("img")
          img.className = "fundo-demo"
          img.src = params.get("fundo")
          document.body.prepend(img)
          document.body.style.background = "#000"
        }
        const cam = $("camera")
        const stand = document.createElement("div")
        stand.className = "demo-camera"
        stand.style.cssText = `left:${cam.offsetLeft}px;top:${cam.offsetTop}px;width:${cam.offsetWidth}px;height:${cam.offsetHeight}px`
        booth.prepend(stand)
        const clip = params.get("replay")
        if (!clip) {
          const falso = document.createElement("div")
          falso.className = "demo-replay"
          tela.prepend(falso)
        }
        const quadroDemo = params.get("demo")
        const layout = quadroDemo === "mini" || params.get("layout") === "mini" ? "mini" : "cabine"
        const rep = (extra = {}) => ({
          url: clip, duracao: 18.28, fonte: "jogo", base: 1, tocando: true, t: 9, em: Date.now(), som: false, zoom: false, ...extra,
        })
        const base = { pergunta: "Foi pênalti?", opcoes: ["Lance limpo", "Roubado", "Hack 👀"], layout }
        // The whole VAR as the dock runs it: the script's two passes, the closing screen, the verdict (?voto= seconds).
        const VOTO = Number(params.get("voto") ?? 30) * 1000
        const passos = (id) => {
          const ate = Date.now() + VOTO
          const votos = [0, 0, 0]
          const replayDemo = rep({ roteiro: roteiroPara(18.28, VOTO) })
          const t = []
          t.push([0, () => ({ ...base, id, fase: "votacao", votos: [...votos], ate, duracao: VOTO, replay: replayDemo })])
          for (let i = 1; i < VOTO / 1000; i++) t.push([i * 1000, () => (votos[Math.random() < 0.6 ? 1 : Math.random() < 0.7 ? 0 : 2]++, { ...base, id, fase: "votacao", votos: [...votos], ate, duracao: VOTO, replay: replayDemo })])
          t.push([VOTO + 200, () => ({ ...base, id, fase: "veredito", votos: [...votos], vencedora: votos.indexOf(Math.max(...votos)), replay: replayDemo })])
          t.push([VOTO + 7000, () => ({ fase: "fechado" })])
          for (const [ms, f] of t) setTimeout(() => desenhar(f()), ms)
        }
        const estatico = { id: "1", ...base, votos: [7, 11, 3], replay: rep({ tocando: false, t: Number(params.get("t") ?? 13.2) }) }
        if (quadroDemo === "veredito") desenhar({ ...estatico, fase: "veredito", votos: [7, 15, 3], vencedora: 1, linha: [0.62, 0.1, 0.48, 0.95] })
        else if (quadroDemo === "votacao" || quadroDemo === "mini") desenhar({ ...estatico, fase: "votacao", ate: Date.now() + 14000, duracao: 30000, linha: quadroDemo === "mini" ? null : [0.62, 0.1, 0.48, 0.95] })
        else if (quadroDemo === "fim") desenhar({ ...estatico, fase: "votacao", ate: Date.now() + 5400, duracao: 30000, replay: rep({ roteiro: { de: 9, ate: 18.23, inicio: 0, fim: 0 } }) })
        else if (quadroDemo === "empate") desenhar({ ...estatico, fase: "empate", pergunta: "Culpa de quem?", opcoes: ["Culpa minha", "Do parceiro", "Indefensável"], votos: [6, 6, 2], empatadas: [0, 1] })
        else {
          passos("1")
          setInterval(() => passos(String(Date.now())), VOTO + 10000)
        }
      }
    </script>
  </body>
</html>
