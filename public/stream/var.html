<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>VAR · muanlartins</title>
    <link rel="stylesheet" href="stream.css" />
    <!--
      OBS: Browser source, 1920×1080, in the "VAR · Rocket League" and "VAR · Valorant" scenes, over the media
      source "VAR · replay" (the play, from OBS's Replay Buffer: the stream as it went out) and the camera, and under
      the crowd. The video referee's booth: the Klein ground everywhere but two holes, the monitor where the replay
      plays (1216×684 at (64, 136)) and the camera (512×288 at (1344, 136)), each in the frame with a referee-yellow
      tab; the chat's vote beside them; on the verdict, the winning option on a yellow card slammed over the monitor.

      It draws what the "Efeitos" dock (efeitos.html) sends through obs-browser's emit_event, "muanlartins-var":
      the VAR's whole state on every change, { fase: "votacao" | "empate" | "veredito" | "fechado", id, pergunta,
      opcoes, votos, ate (when the vote ends, epoch ms), vencedora, empatadas, velocidade, pausado, linha }. The line
      ([x0, y0, x1, y1] in the replay's 0–1 coordinates, dragged in the dock) crosses the whole monitor, like TV's
      offside line. The monitor's frame draws itself as each VAR opens: the referee drawing the screen in the air.

      Copy here is a draft for Luan. ?demo plays a VAR on its own every 20 s, over a stand-in replay.
    -->
    <style>
      :root {
        --amarelo: #ffd23f;
        --preto: #2b2f38;
      }
      .booth {
        transition: opacity 0.35s var(--ease);
      }
      .booth.fechado {
        opacity: 0;
      }
      /* The Klein ground with the lattice, everywhere but the monitor and the camera (clip-path set by the script). */
      .ground {
        position: absolute;
        inset: 0;
      }
      .monitor,
      .camera {
        position: absolute;
      }
      .monitor {
        left: 64px;
        top: 136px;
        width: 1216px;
        height: 684px;
      }
      .camera {
        left: 1344px;
        top: 136px;
        width: 512px;
        height: 288px;
      }
      .demo-replay {
        position: absolute;
        background:
          linear-gradient(160deg, rgb(255 255 255 / 0.06), transparent 60%),
          repeating-linear-gradient(90deg, #1d6b3a 0 120px, #217a42 120px 240px);
      }

      /* The band across the top: the VAR's name and what it is. */
      .band {
        position: absolute;
        left: 64px;
        top: 40px;
        height: 64px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 72px 0 0;
        background: var(--paper);
        color: var(--klein);
        clip-path: polygon(0 0, 100% 0, calc(100% - 64px) 100%, 0 100%);
      }
      .band .sigla {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 100%;
        padding: 0 22px;
        background: var(--amarelo);
        color: var(--preto);
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .band .sigla svg {
        width: 44px;
        height: 30px;
      }
      .band .titulo {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .aberto .band {
        animation: wipe-in 0.7s var(--ease) 0.15s both;
      }

      /* The tabs on the frames' top edges: what each hole is. */
      .tab {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 36px;
        padding: 0 40px 0 14px;
        background: var(--amarelo);
        color: var(--preto);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.06em;
        clip-path: polygon(0 0, 100% 0, calc(100% - 36px) 100%, 0 100%);
        white-space: nowrap;
      }
      .tab .estado {
        font-weight: 500;
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
      }
      .tab .gravando {
        width: 10px;
        height: 10px;
        background: var(--preto);
        transform: rotate(45deg);
        animation: pisca 1.2s steps(1) infinite;
      }
      @keyframes pisca {
        50% {
          opacity: 0;
        }
      }
      .tab-monitor {
        left: 52px;
        top: 106px;
      }
      .tab-camera {
        left: 1332px;
        top: 106px;
      }

      /* The referee drawing the screen: two strokes from the top's middle, round each side, meeting at the bottom. */
      .gesto {
        position: absolute;
        left: 40px;
        top: 112px;
        width: 1264px;
        height: 732px;
        overflow: visible;
        pointer-events: none;
      }
      .gesto path {
        fill: none;
        stroke: var(--paper);
        stroke-width: 6;
        stroke-linecap: square;
        stroke-dasharray: 1 1.1;
        stroke-dashoffset: 1.02;
        opacity: 0;
      }
      .aberto .gesto path {
        animation: desenha 1.6s var(--ease) 0.1s both;
      }
      @keyframes desenha {
        0% {
          opacity: 1;
        }
        55% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 0;
        }
      }

      /* The line over the replay. */
      .linha {
        position: absolute;
        left: 64px;
        top: 136px;
        width: 1216px;
        height: 684px;
        overflow: hidden;
        pointer-events: none;
      }
      .linha line {
        stroke-linecap: butt;
      }

      /* The chat's vote, under the camera. */
      .votacao {
        position: absolute;
        left: 1332px;
        top: 456px;
        width: 536px;
        height: 364px;
        display: flex;
        flex-direction: column;
        padding: 22px 24px 20px;
        background: var(--navy);
        clip-path: polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px);
      }
      .aberto .votacao {
        animation: entra 0.6s var(--ease) 0.35s both;
      }
      @keyframes entra {
        from {
          transform: translateX(80px);
          opacity: 0;
        }
      }
      .pergunta {
        margin: 0 0 16px;
        font-size: 30px;
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.02em;
        overflow-wrap: anywhere;
      }
      .opcoes {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .opcao {
        position: relative;
        display: grid;
        grid-template-columns: 52px 1fr auto;
        align-items: center;
        gap: 12px;
        height: 54px;
        padding-right: 14px;
        background: rgb(0 47 167 / 0.55);
        font-size: 22px;
        font-weight: 500;
        transition: opacity 0.4s var(--ease);
      }
      .opcao .barra {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: var(--klein);
        transition: width 0.45s var(--ease);
      }
      .opcao > :not(.barra) {
        position: relative;
      }
      .opcao .comando {
        display: grid;
        place-items: center;
        height: 100%;
        background: var(--amarelo);
        color: var(--preto);
        font-weight: 700;
        font-size: 20px;
      }
      .opcao .nome {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .opcao .conta {
        font-variant-numeric: tabular-nums;
        color: var(--klein-claro);
        font-weight: 600;
      }
      .empate .opcao.empatada {
        animation: empate 0.9s ease-in-out infinite alternate;
      }
      @keyframes empate {
        to {
          box-shadow: inset 0 0 0 2px var(--amarelo);
        }
      }
      .veredito .opcao:not(.vencedora) {
        opacity: 0.4;
      }
      .veredito .opcao.vencedora {
        box-shadow: inset 0 0 0 2px var(--amarelo);
      }
      .rodape {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: auto;
        font-size: 18px;
        color: rgb(244 245 247 / 0.75);
      }
      .relogio {
        flex: 1;
        height: 6px;
        background: rgb(133 167 255 / 0.25);
      }
      .relogio i {
        display: block;
        height: 100%;
        width: 100%;
        background: var(--amarelo);
        transform-origin: 0 50%;
      }
      .segundos {
        min-width: 3ch;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--paper);
        font-weight: 600;
      }

      /* The verdict: the winning option on a referee's card, slammed over the monitor. */
      .cartao {
        position: absolute;
        left: 672px;
        top: 478px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        max-width: 920px;
        padding: 30px 64px 36px;
        background: var(--amarelo);
        color: var(--preto);
        border: 4px solid var(--navy);
        box-shadow: 18px 18px 0 rgb(0 20 71 / 0.55);
        transform: translate(-50%, -50%) rotate(-6deg);
        text-align: center;
      }
      .cartao[hidden] {
        display: none;
      }
      .cartao.bate {
        animation: bate 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
      @keyframes bate {
        from {
          transform: translate(-50%, -50%) rotate(-24deg) scale(2.4);
          opacity: 0;
        }
        60% {
          opacity: 1;
        }
      }
      .cartao small {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.14em;
      }
      .cartao strong {
        font-size: 96px;
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -0.03em;
        overflow-wrap: anywhere;
      }
      .cartao span {
        font-size: 22px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      @media (prefers-reduced-motion: reduce) {
        .aberto .band,
        .aberto .votacao,
        .aberto .gesto path,
        .cartao.bate {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage booth fechado" id="booth">
      <div class="ground" id="ground"></div>
      <div class="monitor" id="monitor"></div>
      <div class="camera" id="camera"></div>

      <div class="band">
        <span class="sigla"><svg viewBox="0 0 44 30" aria-hidden="true"><rect x="3" y="3" width="38" height="24" fill="none" stroke="currentColor" stroke-width="5" /></svg>VAR</span>
        <span class="titulo">Revisão do lance</span>
      </div>
      <div class="tab tab-monitor"><span class="gravando"></span>REPLAY <span class="estado" id="velocidade">100%</span></div>
      <div class="tab tab-camera">AO VIVO</div>

      <svg class="linha" id="linha" viewBox="0 0 1216 684" preserveAspectRatio="none"></svg>
      <svg class="gesto" viewBox="0 0 1264 732" aria-hidden="true">
        <path pathLength="1" d="M632 3H3V729H632" />
        <path pathLength="1" d="M632 3H1261V729H632" />
      </svg>

      <section class="votacao" id="votacao">
        <p class="pergunta" id="pergunta"></p>
        <ul class="opcoes" id="opcoes"></ul>
        <div class="rodape" id="rodape">
          <span id="dica">Vote no chat</span>
          <span class="relogio"><i id="relogio"></i></span>
          <span class="segundos" id="segundos"></span>
        </div>
      </section>

      <div class="cartao" id="cartao" hidden><small>VEREDITO</small><strong id="vencedora"></strong><span id="placar"></span></div>
    </main>
    <script src="stream.js"></script>
    <script>
      const $ = (id) => document.getElementById(id)
      const booth = $("booth")
      const BAND = 14

      // The ground has two holes, where OBS puts the replay and the camera.
      const rect = (el) => {
        const [x, y, w, h] = [el.offsetLeft, el.offsetTop, el.offsetWidth, el.offsetHeight]
        return `M${x} ${y}H${x + w}V${y + h}H${x}Z`
      }
      $("ground").style.clipPath = `path(evenodd, "M0 0H1920V1080H0Z${rect($("monitor"))}${rect($("camera"))}")`
      const telas = [frame($("monitor"), { band: BAND, fill: "#001447" }), frame($("camera"), { band: BAND, fill: "#001447" })]
      alternate(6, ...telas.map((t) => t.glint))

      let estado = { fase: "fechado" }
      let mostrado = null // the VAR id on screen, so each one's opening plays once
      let carimbado = null // and its verdict's card

      function desenhar(v) {
        estado = v
        const aberto = v.fase !== "fechado"
        booth.classList.toggle("fechado", !aberto)
        if (!aberto) {
          booth.classList.remove("aberto")
          mostrado = carimbado = null
          $("cartao").hidden = true
          return
        }
        if (v.id !== mostrado) {
          mostrado = v.id
          carimbado = null
          booth.classList.remove("aberto")
          void booth.offsetWidth
          booth.classList.add("aberto")
          $("cartao").hidden = true
        }
        booth.classList.toggle("empate", v.fase === "empate")
        booth.classList.toggle("veredito", v.fase === "veredito")

        $("velocidade").textContent = v.pausado ? "pausado" : `${v.velocidade ?? 100}%`
        $("pergunta").textContent = v.pergunta ?? ""

        // The options, made again only when they change; the counts and bars update in place.
        const opcoes = v.opcoes ?? []
        const lista = $("opcoes")
        if (lista.dataset.de !== JSON.stringify(opcoes)) {
          lista.dataset.de = JSON.stringify(opcoes)
          lista.replaceChildren(
            ...opcoes.map((texto, i) => {
              const li = document.createElement("li")
              li.className = "opcao"
              li.innerHTML = `<span class="barra"></span><span class="comando">!${i + 1}</span><span class="nome"></span><span class="conta"></span>`
              li.querySelector(".nome").textContent = texto
              return li
            }),
          )
        }
        const votos = v.votos ?? opcoes.map(() => 0)
        const total = votos.reduce((a, b) => a + b, 0)
        ;[...lista.children].forEach((li, i) => {
          const n = votos[i] ?? 0
          li.querySelector(".barra").style.width = `${total ? (n / total) * 100 : 0}%`
          li.querySelector(".conta").textContent = total ? `${n} · ${Math.round((n / total) * 100)}%` : "0"
          li.classList.toggle("empatada", (v.empatadas ?? []).includes(i))
          li.classList.toggle("vencedora", v.fase === "veredito" && v.vencedora === i)
        })
        $("dica").textContent = v.fase === "empate" ? "Empate: o Luan desempata" : v.fase === "veredito" ? `${total} ${total === 1 ? "voto" : "votos"}` : "Vote no chat"

        if (v.fase === "veredito" && carimbado !== v.id) {
          carimbado = v.id
          $("vencedora").textContent = opcoes[v.vencedora] ?? ""
          $("placar").textContent = total ? `${votos[v.vencedora]} de ${total} ${total === 1 ? "voto" : "votos"}` : "Decisão do Luan"
          const c = $("cartao")
          c.hidden = false
          c.classList.remove("bate")
          void c.offsetWidth
          c.classList.add("bate")
        }

        // The line crosses the whole monitor through the two points dragged in the dock.
        const svg = $("linha")
        svg.replaceChildren()
        if (v.linha) {
          let [x0, y0, x1, y1] = v.linha.map((n, i) => n * (i % 2 ? 684 : 1216))
          const dx = x1 - x0
          const dy = y1 - y0
          if (Math.hypot(dx, dy) > 4) {
            const k = 4000 / Math.hypot(dx, dy)
            const ponta = (s) => [x0 + dx * k * s, y0 + dy * k * s]
            const [a, b] = [ponta(-1), ponta(1)]
            svg.innerHTML = `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#001447" stroke-opacity="0.6" stroke-width="10"/>
              <line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#ffd23f" stroke-width="5"/>`
          }
        }
      }

      // The clock: the vote's time left, from `ate`.
      function relogio() {
        const v = estado
        const votando = v.fase === "votacao" && v.ate
        $("relogio").parentElement.hidden = !votando
        $("segundos").hidden = !votando
        if (votando) {
          const resta = Math.max(0, v.ate - Date.now())
          $("relogio").style.transform = `scaleX(${Math.min(1, resta / (v.duracao || 30000))})`
          $("segundos").textContent = `${Math.ceil(resta / 1000)}s`
        }
        requestAnimationFrame(relogio)
      }
      requestAnimationFrame(relogio)

      addEventListener("muanlartins-var", ({ detail }) => detail && desenhar(detail))

      if (params.has("demo")) {
        for (const id of ["monitor", "camera"]) {
          const el = $(id)
          const stand = document.createElement("div")
          stand.className = "demo-replay"
          stand.style.cssText = `left:${el.offsetLeft}px;top:${el.offsetTop}px;width:${el.offsetWidth}px;height:${el.offsetHeight}px`
          booth.prepend(stand)
        }
        const passos = (id) => {
          const base = { id, pergunta: "Foi pênalti?", opcoes: ["Lance limpo", "Roubado", "Hack 👀"], velocidade: 100, duracao: 12000 }
          const ate = Date.now() + 12000
          const votos = [0, 0, 0]
          const t = []
          t.push([0, () => ({ ...base, fase: "votacao", votos: [...votos], ate })])
          for (let i = 1; i <= 24; i++) t.push([i * 450, () => (votos[Math.random() < 0.6 ? 1 : Math.random() < 0.7 ? 0 : 2]++, { ...base, fase: "votacao", votos: [...votos], ate })])
          t.push([4000, () => ({ ...base, fase: "votacao", votos: [...votos], ate, velocidade: 50, linha: [0.62, 0.1, 0.48, 0.95] })])
          t.push([12200, () => ({ ...base, fase: "veredito", votos: [...votos], vencedora: votos.indexOf(Math.max(...votos)), velocidade: 50, linha: [0.62, 0.1, 0.48, 0.95] })])
          t.push([19000, () => ({ fase: "fechado" })])
          for (const [ms, f] of t) setTimeout(() => desenhar(f()), ms)
        }
        const quadro = params.get("demo")
        if (quadro === "veredito") desenhar({ id: "1", fase: "veredito", pergunta: "Foi pênalti?", opcoes: ["Lance limpo", "Roubado", "Hack 👀"], votos: [7, 15, 3], vencedora: 1, velocidade: 50, linha: [0.62, 0.1, 0.48, 0.95] })
        else if (quadro === "votacao") desenhar({ id: "1", fase: "votacao", pergunta: "Foi pênalti?", opcoes: ["Lance limpo", "Roubado", "Hack 👀"], votos: [7, 11, 3], ate: Date.now() + 14000, duracao: 30000, velocidade: 50, linha: [0.62, 0.1, 0.48, 0.95] })
        else if (quadro === "empate") desenhar({ id: "1", fase: "empate", pergunta: "Culpa de quem?", opcoes: ["Culpa minha", "Do parceiro", "Indefensável"], votos: [6, 6, 2], empatadas: [0, 1], velocidade: 100 })
        else {
          passos("1")
          setInterval(() => passos(String(Date.now())), 20000)
        }
      }
    </script>
  </body>
</html>
