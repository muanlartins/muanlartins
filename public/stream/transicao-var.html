<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Transição do VAR · muanlartins</title>
    <link rel="stylesheet" href="stream.css" />
    <!--
      The VAR's stinger, into and out of the VAR scenes (the Efeitos dock sets it as their override). The source of
      transicao-var.webm: `node brand/twitch/transicao.mjs 2560 transicao-var` renders it frame by frame through
      render(t). Opened on its own, it loops.

      transicao.html's panels, led by streaks in referee yellow and Branco, and in place of the mark the referee's
      gesture for the video review: a screen drawn in the air, two strokes from the top's middle meeting at the
      bottom, with "VAR" inside. Covered from 0.45 s to 0.8 s (OBS transition point: 600 ms).
    -->
    <style>
      .layer {
        position: absolute;
        inset: 0;
      }
      .panel {
        background: var(--klein);
      }
      .panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(45deg, transparent 0 calc(var(--unit) * 0.7071 - 1px), var(--lattice-line) 0 calc(var(--unit) * 0.7071)),
          repeating-linear-gradient(-45deg, transparent 0 calc(var(--unit) * 0.7071 - 1px), var(--lattice-line) 0 calc(var(--unit) * 0.7071));
      }
      .branco {
        background: var(--paper);
      }
      .claro {
        background: #ffd23f;
      }
      #mark {
        display: grid;
        place-items: center;
      }
      #mark svg {
        width: 720px;
        height: 450px;
        overflow: visible;
      }
      #mark path {
        fill: none;
        stroke: var(--paper);
        stroke-width: 22;
        stroke-linecap: square;
        stroke-dasharray: 1 1.1;
      }
      #mark text {
        fill: #ffd23f;
        font-size: 190px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="layer panel" id="a"></div>
      <div class="layer panel" id="b"></div>
      <div class="layer branco" id="a-streak"></div>
      <div class="layer claro" id="b-streak"></div>
      <div class="layer" id="mark">
        <svg viewBox="0 0 720 450" aria-hidden="true">
          <path id="esquerda" pathLength="1" d="M360 11H11V439H360" />
          <path id="direita" pathLength="1" d="M360 11H709V439H360" />
          <text id="sigla" x="360" y="292" text-anchor="middle">VAR</text>
        </svg>
      </div>
    </main>
    <script src="stream.js"></script>
    <script>
      const DURATION = 1.3
      // Distances are along the diagonal, in x + y: the screen runs from 0 (top left) to 3000 (bottom right).
      const FAR = 3000
      const SEAM = 1500
      const OVERLAP = 20

      const clamp = (x) => Math.min(1, Math.max(0, x))
      const easeOut = (x) => 1 - (1 - x) ** 3
      const easeIn = (x) => x ** 3

      // The strip of screen where lo < x + y < hi, as a clip-path.
      const BIG = 4000
      const strip = (lo, hi) =>
        hi <= lo
          ? "polygon(0 0, 0 0, 0 0)"
          : `polygon(${lo + BIG}px ${-BIG}px, ${hi + BIG}px ${-BIG}px, ${hi - BIG}px ${BIG}px, ${lo - BIG}px ${BIG}px)`

      // Panel A's edges at time t: it grows from the top-left corner to just past the seam, holds,
      // then its trailing edge follows it in. B is the same turned 180°.
      function edges(t) {
        const lead = (SEAM + OVERLAP) * easeOut(clamp(t / 0.45))
        const trail = (SEAM + OVERLAP) * easeIn(clamp((t - 0.8) / 0.5))
        return { lead, trail }
      }

      const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2)
      const $ = (id) => document.getElementById(id)

      function render(t) {
        const { lead, trail } = edges(t)
        // Streak width follows speed (the edge's travel over the next 1/60 s).
        const next = edges(t + 1 / 60)
        const width = (now, then) => Math.min(140, Math.abs(then - now) * 1.6)
        const leadWidth = width(lead, next.lead)
        const trailWidth = width(trail, next.trail)

        $("a").style.clipPath = strip(trail, lead)
        $("b").style.clipPath = strip(FAR - lead, FAR - trail)
        // Streaks ride the moving edges: the leading one in, the trailing one out.
        $("a-streak").style.clipPath = t < 0.8 ? strip(lead - leadWidth, lead) : strip(trail, trail + trailWidth)
        $("b-streak").style.clipPath = t < 0.8 ? strip(FAR - lead, FAR - lead + leadWidth) : strip(FAR - trail - trailWidth, FAR - trail)

        // The mark lives inside the panels, so it leaves with them.
        $("mark").style.clipPath = strip(trail, FAR - trail)
        // The screen drawn in the air, both hands at once; then the letters land in it.
        const drawn = ease(clamp((t - 0.3) / 0.38))
        for (const id of ["esquerda", "direita"]) $(id).style.strokeDashoffset = String(1.02 * (1 - drawn))
        const letters = ease(clamp((t - 0.58) / 0.16))
        $("sigla").style.opacity = String(letters)
        $("sigla").style.transform = `translateY(${(1 - letters) * 30}px)`
      }

      window.ready = Promise.resolve().then(() => render(0))
      window.render = render
      window.DURATION = DURATION

      // On its own (not rendering), loop with a pause between plays.
      if (!params.has("render")) {
        const start = performance.now()
        const loop = (now) => {
          render(Math.min(DURATION, ((now - start) / 1000) % (DURATION + 1)))
          requestAnimationFrame(loop)
        }
        requestAnimationFrame(loop)
      }
    </script>
  </body>
</html>
