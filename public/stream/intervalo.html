<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Intervalo · muanlartins</title>
    <link rel="stylesheet" href="stream.css" />
    <!--
      OBS: Browser source, 1920×1080, on its own. The screen before, during a
      break in and after the stream:
        ?tela=comecando (default) · ?tela=volto · ?tela=fim
      ?minutos=5 counts down on the "comecando" screen; ?titulo= replaces the
      headline; ?chat=0 hides the chat; ?canal= and ?demo as in conversa.html.
    -->
    <style>
      .center {
        position: absolute;
        left: 0;
        top: 0;
        width: 1392px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .solo .center {
        width: 1920px;
      }
      /* mark.svg is drawn with room around it; the negative margin takes that back. */
      .mark {
        width: 440px;
        height: 440px;
        margin: -80px 0 -64px;
      }
      .mark svg {
        width: 100%;
        height: 100%;
      }
      h1 {
        margin: 18px 0 0;
        font-size: 104px;
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .clock {
        margin: 28px 0 0;
        color: var(--klein-claro);
        font-size: 64px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }
      .site {
        position: absolute;
        left: 64px;
        bottom: 56px;
        margin: 0;
        font-size: 26px;
        font-weight: 500;
      }
      .site span {
        color: var(--klein-claro);
      }
      .side {
        position: absolute;
        left: 1392px;
        top: 64px;
        width: 464px;
        height: 952px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .side .eyebrow {
        padding-bottom: 14px;
        border-bottom: 1px solid rgb(133 167 255 / 0.4);
      }
      #chat {
        position: relative;
        flex: 1;
      }
      .rise {
        animation: rise 0.9s var(--ease) both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="ground"></div>
      <section class="center">
        <div class="mark" id="mark"></div>
        <p class="eyebrow rise" id="eyebrow" style="animation-delay: 0.5s"></p>
        <h1 class="rise" id="title" style="animation-delay: 0.6s"></h1>
        <p class="clock rise" id="clock" style="animation-delay: 0.7s" hidden></p>
      </section>
      <p class="site rise" style="animation-delay: 0.8s">muanlartins<span>.com.br</span></p>
      <aside class="side" id="side">
        <p class="eyebrow">Chat</p>
        <div id="chat"></div>
      </aside>
    </main>
    <script src="stream.js"></script>
    <script>
      const SCREENS = {
        comecando: { eyebrow: "Ao vivo em instantes", title: "Começando já já" },
        volto: { eyebrow: "Pausa rápida", title: "Já volto" },
        fim: { eyebrow: "Fim da live", title: "Valeu por assistir!" },
      }
      const screen = SCREENS[params.get("tela")] || SCREENS.comecando
      document.getElementById("eyebrow").textContent = screen.eyebrow
      document.getElementById("title").textContent = params.get("titulo") || screen.title

      if (params.get("chat") === "0") {
        document.getElementById("side").hidden = true
        document.body.classList.add("solo")
      } else chat(document.getElementById("chat"))

      // Countdown: counts to zero and stays there.
      const minutes = Number(params.get("minutos"))
      if (minutes > 0 && screen === SCREENS.comecando) {
        const clock = document.getElementById("clock")
        const end = Date.now() + minutes * 60000
        const tick = () => {
          const left = Math.max(0, Math.ceil((end - Date.now()) / 1000))
          clock.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`
        }
        clock.hidden = false
        tick()
        setInterval(tick, 250)
      }

      // The mark draws itself, the white copy first and the light-blue one
      // trailing it, and redraws every 12 s.
      mark(document.getElementById("mark")).then((copies) => {
        const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2)
        const clamp = (x) => Math.min(1, Math.max(0, x))
        const start = performance.now()
        const frame = (now) => {
          const t = ((now - start) / 1000) % 12
          // 0–1.2 s draw in; 11.2–12 s draw out, so the loop restarts from nothing.
          const out = clamp((t - 11.2) / 0.6)
          drawCopy(copies.branco, ease(clamp(t / 0.9)) * (1 - ease(out)))
          drawCopy(copies.claro, ease(clamp((t - 0.3) / 0.9)) * (1 - ease(clamp((t - 11.35) / 0.6))))
          requestAnimationFrame(frame)
        }
        requestAnimationFrame(frame)
      })
    </script>
  </body>
</html>
