<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Lance ruim · muanlartins</title>
    <link rel="stylesheet" href="stream.css" />
    <!--
      OBS: Browser source, 1920×1080, on top of the "Lance ruim" scene, "Restart when the source becomes active",
      so its moment plays from the start each time the scene goes live. The scene is the game's, with the camera on
      top: the "Efeitos" dock (efeitos.html) zooms the camera from its frame to the whole screen and, after
      ?segundos= (default 4), back, and returns to the scene before. This page is the film around it: navy bars
      closing in from top and bottom, a vignette, and a line in the bottom bar. Its sound, "dun dun duuun", is the
      scene's own media source (sons.js, lance). ?demo replays it every 6 s.
    -->
    <style>
      .bar {
        position: absolute;
        left: 0;
        width: 1920px;
        height: 120px;
        background: var(--navy);
        transition: transform 0.28s var(--ease);
      }
      .bar.top {
        top: 0;
        transform: translateY(-100%);
        box-shadow: inset 0 -4px 0 var(--klein-claro);
      }
      .bar.bottom {
        bottom: 0;
        transform: translateY(100%);
        box-shadow: inset 0 4px 0 var(--klein-claro);
      }
      .on .bar {
        transform: none;
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgb(0 10 36 / 0.75) 100%);
        opacity: 0;
        transition: opacity 0.4s var(--ease);
      }
      .on .vignette {
        opacity: 1;
      }
      .line {
        position: absolute;
        right: 64px;
        bottom: 34px;
        margin: 0;
        font-size: 40px;
        font-weight: 500;
        letter-spacing: -0.02em;
        opacity: 0;
        transform: translateY(12px);
        transition:
          opacity 0.3s var(--ease) 0.25s,
          transform 0.3s var(--ease) 0.25s;
      }
      .on .line {
        opacity: 1;
        transform: none;
      }
    </style>
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="vignette"></div>
      <div class="bar top"></div>
      <div class="bar bottom"></div>
      <p class="line" id="line"></p>
    </main>
    <script src="stream.js"></script>
    <script>
      // Draft lines for Luan to rewrite; one at random each time.
      const LINES = ["Ninguém viu nada.", "Isso não aconteceu.", "Faz parte do método.", "Hipótese refutada.", "Calma. Respira."]
      const SECONDS = Number(params.get("segundos")) || 4
      const el = document.getElementById("stage")
      function play() {
        document.getElementById("line").textContent = LINES[Math.floor(Math.random() * LINES.length)]
        requestAnimationFrame(() => el.classList.add("on"))
        setTimeout(() => el.classList.remove("on"), (SECONDS - 0.35) * 1000)
      }
      play()
      if (params.has("demo")) setInterval(play, 6000)
    </script>
  </body>
</html>
