<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Pix · painel · muanlartins</title>
    <link rel="stylesheet" href="stream.css" />
    <!--
      OBS: a custom browser dock (Docks → Custom Browser Docks), for Luan only:
      #chave=<the Σ key>, like the Pix overlay (?api= only to point it elsewhere).

      - Pix sem formulário: a Pix that arrived with no reservation for its
        value (paid straight to the key, or after its reservation ran out, or a
        personal one that has nothing to do with the live). Nothing shows on
        the stream until it's placed here: on an open reservation (a typo in
        the cents), as Anônimo, or ignored. Only the payer's first name is
        kept, for three days, so Luan knows who it was.
      - Registrar Pix: when the phone missed one. The value pays its
        reservation, like a notification would; with none, it shows with the
        name typed here.
      - Últimos Pix: repeat an alert; take one's name and message off the site's mural (its value stays, as anonymous).
        A song shows its state (being made, ready, refused and waiting for its sender's new text, couldn't be made,
        with why): Ouvir plays it here only (the dock's sound isn't on the stream), Pular música cuts it on the live
        (or leaves only the announcement), Gerar de novo makes it again (US$ 0,08) and plays it again once ready.
        A ready song says whether its lyrics are in time (the overlay shows them only then); Sincronizar letra asks
        Gemini again (a fraction of a cent, ~15 s), for a song made before it existed or one it missed.
      - Meta: the goal bar on the overlay, /pix and /mural; it counts from when it's set. A new one (or
        Encerrar) sends the one before to /mural's history; Ajustar changes the one on screen and keeps its count.
        Ticking "fora de meta", a new one (or Ajustar) counts from the first Pix since the last goal ended.
        "até" is its last day: it ends by itself at that day's midnight (Brasília), into the history as reached
        or not, and whatever comes past the target before then counts as extra. "de" a day ahead schedules it
        (Agendada, with Cancelar): it takes the screen at that day's midnight, ending the one before.
    -->
    <style>
      html,
      body {
        overflow: auto;
        background: var(--navy);
      }
      body {
        padding: 14px;
        font-size: 15px;
        line-height: 1.35;
      }
      h2 {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin: 18px 0 8px;
        color: var(--klein-claro);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h2 small {
        color: rgb(244 245 247 / 0.5);
        letter-spacing: 0;
        text-transform: none;
      }
      .status {
        margin: 0;
        color: rgb(244 245 247 / 0.6);
        font-size: 12px;
      }
      .status::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 6px;
        border-radius: 50%;
        background: #ff5a5a;
      }
      .status.on::before {
        background: var(--klein-claro);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .data {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
      }
      .data input {
        color-scheme: dark;
      }
      .dica {
        flex-basis: 100%;
        margin: 0;
        font-size: 12px;
        opacity: 0.6;
      }
      .avulsos {
        display: flex;
        flex-basis: 100%;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        opacity: 0.8;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        padding: 8px 0;
        border-bottom: 1px solid rgb(133 167 255 / 0.18);
      }
      li:last-child {
        border-bottom: 0;
      }
      li p {
        margin: 0 0 6px;
      }
      .valor {
        color: var(--klein-claro);
        font-variant-numeric: tabular-nums;
      }
      .quando,
      .vazio {
        color: rgb(244 245 247 / 0.5);
        font-size: 12px;
      }
      .msg {
        display: block;
        color: rgb(244 245 247 / 0.8);
        font-size: 13px;
      }
      .musica {
        display: block;
        margin-top: 2px;
        color: rgb(244 245 247 / 0.8);
        font-size: 13px;
      }
      .musica.ruim {
        color: #ffcc4d;
      }
      .pendente {
        border-left: 3px solid #ffcc4d;
        padding-left: 8px;
      }
      select,
      input,
      button {
        font: inherit;
        font-size: 14px;
        color: var(--paper);
        background: rgb(0 47 167 / 0.45);
        border: 1px solid rgb(133 167 255 / 0.4);
        padding: 5px 8px;
      }
      input::placeholder {
        color: rgb(244 245 247 / 0.5);
      }
      select option {
        background: var(--navy);
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: var(--klein-claro);
      }
      input.valor-in {
        width: 90px;
      }
      input.nome-in {
        width: 140px;
      }
    </style>
  </head>
  <body>
    <p class="status" id="status">Conectando…</p>

    <h2>Pix sem formulário <small id="n-pendentes"></small></h2>
    <ul id="pendentes"></ul>

    <h2>Registrar Pix</h2>
    <form class="row" id="registrar">
      <input class="valor-in" id="r-valor" inputmode="decimal" placeholder="R$ 5,00" required />
      <input class="nome-in" id="r-nome" maxlength="25" placeholder="Nome (opcional)" />
      <button>Registrar</button>
    </form>

    <h2>Últimos Pix <small id="n-reservas"></small></h2>
    <ul id="pix"></ul>

    <h2>Meta</h2>
    <p class="vazio" id="meta-agora"></p>
    <p class="row vazio" id="meta-proxima" hidden></p>
    <form class="row" id="meta">
      <input class="nome-in" id="m-titulo" maxlength="60" placeholder="Microfone novo" />
      <input class="valor-in" id="m-alvo" inputmode="decimal" placeholder="R$ 500" />
      <label class="data">de <input type="date" id="m-de" /></label>
      <label class="data">até <input type="date" id="m-ate" /></label>
      <p class="dica">"de" vazio ou hoje: começa agora; um dia adiante: fica agendada. "até": o último dia, fecha sozinha à meia-noite. No Ajustar, "até" vazio mantém a data.</p>
      <button>Nova meta</button>
      <button type="button" id="m-ajustar">Ajustar</button>
      <button type="button" id="m-tirar">Encerrar</button>
      <label class="avulsos"><input type="checkbox" id="m-avulsos" /> Contar os Pix que vieram fora de meta</label>
    </form>

    <script>
      const params = new URLSearchParams(location.search)
      // The stack's PixApiUrl; ?api= points it elsewhere (a local stand-in).
      const API = params.get("api") ?? "https://g2x6kdnhr0.execute-api.us-east-1.amazonaws.com"
      const CHAVE = new URLSearchParams(location.hash.slice(1)).get("chave")
      const $ = (id) => document.getElementById(id)
      const reais = (c) => (c / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
      const centavosDe = (t) => {
        const s = t.replace(/R\$|\s/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".")
        return /^\d+(\.\d{1,2})?$/.test(s) ? Math.round(Number(s) * 100) : NaN
      }
      // sk is "<ISO time>#<id>".
      const hora = (sk) => new Date(sk.slice(0, 24)).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
      const dia = (sk) => new Date(sk.slice(0, 24)).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })
      // A goal's dates are Brasília's days: `desde` is its first midnight, `prazo` the midnight after its last day.
      const BR = { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit" }
      const primeiroDia = (desde) => new Date(desde).toLocaleDateString("pt-BR", BR)
      const ultimoDia = (prazo) => new Date(Date.parse(prazo) - 1).toLocaleDateString("pt-BR", BR)
      const hoje = () => new Date().toLocaleDateString("sv-SE", { timeZone: "America/Sao_Paulo" })
      function el(tag, props = {}, ...filhos) {
        const e = Object.assign(document.createElement(tag), props)
        e.append(...filhos)
        return e
      }
      const botao = (texto, acao) => el("button", { type: "button", textContent: texto, onclick: acao })
      const ESTILOS = { funk: "Funk", sertanejo: "Sertanejo", pagode: "Pagode", forro: "Forró", rock: "Rock", rap: "Rap", eletronica: "Eletrônica", pop: "Pop" }
      const ESTADOS = { gerando: "fazendo…", pronta: "pronta", recusada: "recusada, esperando o texto novo de quem mandou", falhou: "não saiu: toca só o anúncio" }
      // A song's line: style, theme (or "letra própria"), state and, when it went wrong, why; ready, whether its lyrics are in time.
      const sincronizada = (m) => Array.isArray(m.tempos) && m.tempos.some(Boolean)
      function musica(m) {
        const ruim = m.estado === "recusada" || m.estado === "falhou"
        const letra = m.estado === "pronta" && m.letraCantada ? (sincronizada(m) ? " · letra sincronizada" : " · letra sem sincronia") : ""
        return el("span", { className: `musica${ruim ? " ruim" : ""}`, textContent: `♪ ${ESTILOS[m.estilo] ?? "Música"} · ${m.sobre || "letra própria"} · ${ESTADOS[m.estado] ?? m.estado}${letra}${ruim && m.motivo ? ` (${m.motivo})` : ""}` })
      }
      let ouvindo = null
      function ouvir(url) {
        const mesmo = ouvindo?.src === url && !ouvindo.paused
        ouvindo?.pause()
        ouvindo = mesmo ? null : new Audio(url)
        ouvindo?.play()
      }

      async function pedir(caminho, corpo) {
        const r = await fetch(API + caminho, {
          method: corpo ? "POST" : "GET",
          headers: { "x-chave": CHAVE, ...(corpo ? { "content-type": "application/json" } : {}) },
          body: corpo && JSON.stringify(corpo),
        })
        const j = await r.json().catch(() => ({}))
        if (!r.ok) throw new Error(j.erro || r.status)
        return j
      }
      async function agir(corpo) {
        try {
          await pedir("/canal", corpo)
        } catch (e) {
          alert(`Não deu: ${e.message}`)
        }
        ler()
      }

      // The lyrics' timing again: Gemini hears the song (~15 s), so the button says it's working meanwhile.
      async function sincronizar(b, sk) {
        b.disabled = true
        b.textContent = "Sincronizando…"
        try {
          const r = await pedir("/canal", { acao: "letra", pix: sk })
          b.textContent = `Letra sincronizada (${r.linhas} de ${r.de} linhas)`
        } catch (e) {
          alert(`Não deu: ${e.message}`)
        }
        ler()
      }

      let ultimo = ""
      let metaAgora = null
      function desenhar({ pix, pendentes, reservas, meta, proxima }) {
        metaAgora = meta
        const chave = JSON.stringify([pix, pendentes, reservas.map((r) => r.id), meta, proxima])
        if (chave === ultimo) return
        ultimo = chave

        $("n-pendentes").textContent = pendentes.length ? `${pendentes.length}` : ""
        $("pendentes").replaceChildren(
          ...(pendentes.length
            ? pendentes.map((p) => {
                const lista = el("select", {}, el("option", { value: "", textContent: "Ligar a uma reserva…" }), ...reservas.map((r) => el("option", { value: r.id, textContent: `R$ ${reais(r.centavos)} · ${r.nome || "Anônimo"}` })))
                lista.onchange = () => lista.value && agir({ acao: "ligar", pendente: p.sk, reserva: lista.value })
                return el(
                  "li",
                  { className: "pendente" },
                  el("p", {}, el("span", { className: "valor", textContent: `R$ ${reais(p.centavos)}` }), ` · ${p.primeiro || "?"} `, el("span", { className: "quando", textContent: `${dia(p.sk)} ${hora(p.sk)}` })),
                  el("div", { className: "row" }, botao("Mostrar como Anônimo", () => agir({ acao: "anonimo", pendente: p.sk })), reservas.length ? lista : "", botao("Ignorar", () => agir({ acao: "ignorar", pendente: p.sk }))),
                )
              })
            : [el("li", { className: "vazio", textContent: "Nenhum." })]),
        )

        $("n-reservas").textContent = reservas.length ? `${reservas.length} esperando pagamento` : ""
        $("pix").replaceChildren(
          ...(pix.length
            ? pix.slice(0, 12).map((p) =>
                el(
                  "li",
                  {},
                  el(
                    "p",
                    {},
                    el("span", { className: "valor", textContent: `R$ ${reais(p.centavos)}` }),
                    ` · ${p.nome || "Anônimo"} `,
                    el("span", { className: "quando", textContent: `${dia(p.sk)} ${hora(p.sk)}${p.exibido ? "" : " · na fila"}${p.quando === "entre" ? " · entre partidas" : ""}${p.origem === "manual" ? " · registrado" : ""}` }),
                    el("span", { className: "msg", textContent: p.mensagem || p.transcricao || (p.audio ? "(áudio)" : "") }),
                    p.musica ? musica(p.musica) : "",
                  ),
                  el(
                    "div",
                    { className: "row" },
                    botao("Repetir", () => agir({ acao: "repetir", pix: p.sk })),
                    p.musica?.url ? botao("Ouvir", () => ouvir(p.musica.url)) : "",
                    p.musica?.estado === "pronta" && !p.exibido && !p.pular ? botao("Pular música", () => agir({ acao: "pular", pix: p.sk })) : "",
                    p.musica?.estado === "pronta" && p.musica.letraCantada ? botao("Sincronizar letra", (e) => sincronizar(e.currentTarget, p.sk)) : "",
                    p.musica && p.musica.estado !== "gerando" ? botao("Gerar de novo", () => confirm("Gerar a música de novo? Custa uns R$ 0,45, e ela toca de novo quando ficar pronta.") && agir({ acao: "musica", pix: p.sk })) : "",
                    // Every Pix with a name or words shows them on the mural (an old one too, ticked or not); taking it off leaves its value, as anonymous.
                    p.nome || p.mensagem || p.transcricao ? botao(p.oculto ? "Voltar ao mural" : "Tirar do mural", () => agir({ acao: "ocultar", pix: p.sk, oculto: !p.oculto })) : "",
                  ),
                ),
              )
            : [el("li", { className: "vazio", textContent: "Nenhum ainda." })]),
        )

        $("meta-agora").textContent = meta
          ? `${meta.titulo || "Meta"}: R$ ${reais(meta.arrecadado)} de R$ ${reais(meta.alvo)}${meta.prazo ? ` · até ${ultimoDia(meta.prazo)}` : " · sem data pra acabar"}`
          : "Sem meta na tela."
        $("meta-proxima").hidden = !proxima
        $("meta-proxima").replaceChildren(
          ...(proxima
            ? [
                `Agendada: ${proxima.titulo || "Meta"}, R$ ${reais(proxima.alvo)}, de ${primeiroDia(proxima.desde)}${proxima.prazo ? ` a ${ultimoDia(proxima.prazo)}` : ""} `,
                botao("Cancelar", () => confirm(`Cancelar a meta agendada "${proxima.titulo || "Meta"}"?`) && agir({ acao: "meta", proxima: true, alvo: 0 })),
              ]
            : []),
        )
      }

      async function ler() {
        if (!API || !CHAVE) {
          $("status").textContent = !API ? "Falta ?api= na URL" : "Falta #chave= na URL"
          return
        }
        try {
          desenhar(await pedir("/canal"))
          $("status").className = "status on"
          $("status").textContent = `Pix ok · ${new Date().toLocaleTimeString("pt-BR")}`
        } catch (e) {
          $("status").className = "status"
          $("status").textContent = `Sem conexão com o Pix (${e.message})`
        }
      }

      $("registrar").onsubmit = (e) => {
        e.preventDefault()
        const centavos = centavosDe($("r-valor").value)
        if (!(centavos >= 1)) return alert("Valor inválido.")
        agir({ acao: "registrar", centavos, nome: $("r-nome").value })
        $("registrar").reset()
      }
      $("meta").onsubmit = (e) => {
        e.preventDefault()
        const alvo = centavosDe($("m-alvo").value)
        if (!(alvo >= 1)) return alert("Valor da meta inválido.")
        const de = $("m-de").value
        const ate = $("m-ate").value || undefined
        if (de && de > hoje()) {
          agir({ acao: "meta", proxima: true, titulo: $("m-titulo").value, alvo, de, ate })
        } else {
          if (metaAgora && !confirm(`Começar uma meta nova? "${metaAgora.titulo || "Meta"}" vai para o histórico do mural.`)) return
          agir({ acao: "meta", titulo: $("m-titulo").value, alvo, ate, avulsos: $("m-avulsos").checked })
        }
        $("meta").reset()
      }
      // Ajustar: what's typed replaces the title or the target; the count goes on.
      $("m-ajustar").onclick = () => {
        if (!metaAgora) return alert("Não há meta para ajustar.")
        const alvo = $("m-alvo").value ? centavosDe($("m-alvo").value) : metaAgora.alvo
        if (!(alvo >= 1)) return alert("Valor da meta inválido.")
        agir({ acao: "meta", ajustar: true, titulo: $("m-titulo").value || metaAgora.titulo, alvo, ate: $("m-ate").value || undefined, avulsos: $("m-avulsos").checked })
        $("meta").reset()
      }
      $("m-tirar").onclick = () => metaAgora && confirm("Encerrar a meta? Ela sai da tela e vai para o histórico do mural.") && agir({ acao: "meta", alvo: 0 })

      ler()
      setInterval(ler, 3000)
    </script>
  </body>
</html>
