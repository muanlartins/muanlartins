<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Corrida · muanlartins</title>
    <link rel="stylesheet" href="stream.css" />
    <link rel="stylesheet" href="torcedor.css" />
    <!--
      OBS: Browser source "Corrida", 1920×1080, in the "Conversa" scene (between matches), over everything. Silent.

      The marble race (Lucca's idea, lucca_3098; Luan's rules, 2026-11-17): when the scene goes on air, a race starts
      by itself with everyone in the chat, nobody joining or doing anything, one marble each in the colours of their fan
      (/perfil). The race is corrida-motor.js (deterministic: a seed and how many run); this page draws it in a box
      where the scene's topic is (the box takes its place while a race runs), with a camera that follows the leaders, a
      strip at the bottom with everyone's place along the track, the top five on the left and the podium at the end.
      One race each time the scene comes on; off the air (the scene left before the end) the race is dropped.

      The record: OBS's source URL holds the Σ key (#chave=…, as the stand's), and with it every race that ends while
      the stream is on (the Partidas dock says so) goes to the Σ API (POST /corrida), which runs it again from its seed
      and keeps the wins, podiums and the latest races for the site (/canal/minijogos and each viewer's page). Worth
      nothing else: no Σ, no crown (Luan's call).

      Who runs: the viewers logged in with the chat open (Twitch's membership events, as torcida.html and duelo.html),
      up to 40, drawn by the seed when there are more. Alone, the one viewer races the channel's marble; nobody, no race.

      The box is 696×216 at (64, 836), clear of the Pix call on its right; ?x= ?y= move it. ?api= the profile API,
      ?sigma= the Σ API, ?canal= the channel.
      ?demo fills the chat with sample people and races at once (keys: r a new race, n how many: 2, 8, 20, 40);
      ?semente= fixes the seed. ?fundo=<image> puts a screenshot behind.
      Copy is a draft for Luan.
    -->
    <style>
      :root {
        --caixa-x: 64px;
        --caixa-y: 836px;
      }
      .fundo-demo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .caixa {
        position: absolute;
        left: var(--caixa-x);
        top: var(--caixa-y);
        width: 696px;
        height: 216px;
        transition:
          opacity 0.5s var(--ease),
          transform 0.5s var(--ease);
      }
      .caixa.escondida {
        opacity: 0;
        transform: translateY(12px);
      }
      .chao {
        position: absolute;
        inset: 0;
        background: var(--navy);
        clip-path: polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px);
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 696px;
        height: 216px;
        clip-path: polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px);
      }
      .borda {
        position: absolute;
        inset: 0;
        overflow: visible;
      }
      .faixa-titulo {
        position: absolute;
        left: -10px;
        top: -24px;
        height: 30px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 36px 0 0;
        background: var(--paper);
        color: var(--klein);
        clip-path: polygon(0 0, 100% 0, calc(100% - 30px) 100%, 0 100%);
        font-size: 15px;
        font-weight: 600;
      }
      .faixa-titulo b {
        display: flex;
        align-items: center;
        height: 100%;
        padding: 0 12px;
        background: var(--klein);
        color: var(--paper);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      /* The top five in a column of their own on the left (the track runs right of it, LISTA in the script). */
      .lideres {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 160px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        margin: 0;
        padding: 6px 10px 0 12px;
        border-right: 1px solid rgb(133 167 255 / 0.3);
        background: rgb(0 8 36 / 0.5);
        list-style: none;
        font-size: 14px;
        font-weight: 600;
        color: var(--paper);
      }
      .lideres li {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .lideres li i {
        flex: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / 0.5);
      }
      .lideres li span {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .lideres li b {
        width: 18px;
        color: var(--klein-claro);
        text-align: right;
      }
      .lideres li.chegou b {
        color: #f2c14e;
      }
      /* The countdown, and each crossing called out. */
      .aviso {
        position: absolute;
        right: 24px;
        top: 12px;
        padding: 2px 12px;
        background: var(--paper);
        color: var(--klein);
        font-size: 20px;
        font-weight: 700;
        transition: opacity 0.3s var(--ease);
      }
      .aviso:empty {
        opacity: 0;
      }
      /* The podium at the end: the first three's fans on steps. */
      .podio {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 18px;
        padding: 0 24px 14px;
        background: rgb(0 20 71 / 0.92);
        clip-path: polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px);
        opacity: 0;
        transition: opacity 0.5s var(--ease);
      }
      .podio.visivel {
        opacity: 1;
      }
      .degrau {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 150px;
      }
      .degrau .nome {
        max-width: 150px;
        margin-bottom: 6px;
        padding: 1px 8px;
        overflow: hidden;
        background: rgb(0 20 71 / 0.8);
        color: var(--paper);
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      /* Room for the winner's celebration: a jump or a handstand lifts them up to 18px. */
      .degrau.p1 .nome {
        margin-bottom: 24px;
      }
      .degrau .fa {
        position: relative;
        width: 46px;
        height: 70px;
      }
      /* Sized, or the winner's celebration (a transform on .pose) shrinks the drawing to nothing. */
      .degrau .pose {
        position: absolute;
        inset: 0;
      }
      .degrau .base {
        display: grid;
        place-items: center;
        width: 100%;
        background: var(--paper);
        color: var(--klein);
        font-size: 26px;
        font-weight: 700;
      }
      .degrau.p1 .base {
        height: 58px;
      }
      .degrau.p2 .base {
        height: 40px;
      }
      .degrau.p3 .base {
        height: 28px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="caixa escondida">
        <div class="chao"></div>
        <canvas width="1392" height="432"></canvas>
        <svg class="borda" viewBox="0 0 696 216" width="696" height="216" aria-hidden="true">
          <path d="M24 0.75H695.25V192L671.25 215.25H0.75V24Z" fill="none" stroke="rgb(133 167 255 / 0.5)" stroke-width="1.5" />
        </svg>
        <div class="faixa-titulo"><b>CORRIDA</b><span>todo mundo do chat</span></div>
        <ol class="lideres"></ol>
        <div class="aviso"></div>
        <div class="podio"></div>
      </div>
    </div>
    <script src="stream.js"></script>
    <script src="torcedor.js"></script>
    <script src="sigma.js"></script>
    <script src="corrida-motor.js"></script>
    <script>
      const caixa = document.querySelector(".caixa")
      const canvas = document.querySelector("canvas")
      const ctx = canvas.getContext("2d")
      const lideres = document.querySelector(".lideres")
      const aviso = document.querySelector(".aviso")
      const podio = document.querySelector(".podio")
      if (params.has("x")) caixa.style.setProperty("--caixa-x", `${Number(params.get("x"))}px`)
      if (params.has("y")) caixa.style.setProperty("--caixa-y", `${Number(params.get("y"))}px`)
      if (params.get("fundo")) {
        const img = document.createElement("img")
        img.className = "fundo-demo"
        img.src = params.get("fundo")
        document.querySelector(".stage").prepend(img)
      }
      const DEMO = params.has("demo")
      const API = params.get("api") ?? "https://wtpv8afsak.execute-api.us-east-1.amazonaws.com"
      const SIGMA_API = params.get("sigma") ?? "https://p1rblei1o9.execute-api.us-east-1.amazonaws.com"
      const CHAVE = new URLSearchParams(location.hash.slice(1)).get("chave")
      const MAX = 40
      const W = 696
      const H = 216
      // The tube on screen: a little bigger than its units, right of the leaders' column, the strip below.
      const ESCALA = 1.12
      const FAIXA = 22
      const LISTA = 160
      const VISTA_W = (W - LISTA) / ESCALA
      const VISTA_H = (H - FAIXA) / ESCALA

      // --- Who's in the chat --------------------------------------------------------------------------------------
      const presentes = new Map() // login → display name
      const escolhas = new Map() // login → their fan, from the profile API
      const sigmas = new Map() // login → Σ
      function chegar(login, nome = login) {
        if (BOTS.has(login) || login.startsWith("justinfan")) return
        if (!presentes.has(login) || nome !== login) presentes.set(login, nome)
      }
      function apply(line) {
        const { tags, prefix, command, trailing } = parseIrc(line)
        const login = prefix.split("!")[0]
        if (command === "JOIN") chegar(login)
        else if (command === "PART") presentes.delete(login)
        else if (command === "PRIVMSG") chegar(login, tags["display-name"] || login)
        else if (command === "353") trailing.split(" ").forEach((name) => name && chegar(name))
      }
      async function pedir(logins) {
        if (DEMO || !logins.length) return
        const pedido = (url) => fetch(url).then((r) => (r.ok ? r.json() : null)).catch(() => null)
        for (let i = 0; i < logins.length; i += 100) {
          const lote = logins.slice(i, i + 100).join(",")
          const [fas, pontos] = await Promise.all([pedido(`${API}/torcedores?logins=${lote}`), pedido(`${SIGMA_API}/sigmas?logins=${lote}`)])
          for (const login of logins.slice(i, i + 100)) {
            if (fas?.[login]) escolhas.set(login, fas[login])
            if (pontos?.[login]) sigmas.set(login, pontos[login].sigma ?? 0)
          }
        }
      }
      const sigma = (login) => (login === CHANNEL ? Sigma.RL.at(-1)[0] : sigmas.get(login) ?? 0)
      // Their fan's colours, as the stand draws them (free colours only once their Σ unlocks them).
      function aparencia(login) {
        const a = Torcedor.normalizar(escolhas.get(login), login)
        return login === CHANNEL || sigma(login) >= Sigma.COR_LIVRE ? a : Torcedor.soPaleta(a, login)
      }

      // --- A race ---------------------------------------------------------------------------------------------------
      let corrida = null // the engine's state
      let corredores = [] // marble i → { login, nome, aparencia }
      let fase = "parada" // parada · contagem · correndo · podio
      let inicio = 0
      let acumulado = 0
      let ultimo = 0
      let camera = { x: 0, y: 0 }
      let chamadas = 0

      function sementeNova() {
        return params.has("semente") ? Number(params.get("semente")) : (Date.now() ^ (Math.random() * 0xffffffff)) >>> 0
      }

      async function largar() {
        if (fase !== "parada") return
        let logins = [...presentes.keys()].filter((l) => l !== CHANNEL)
        if (!logins.length) return
        const semente = sementeNova()
        // More than fit: drawn by the seed (the same draw the API can check).
        if (logins.length > MAX) {
          let a = semente
          const sorte = () => ((a = (a * 1103515245 + 12345) >>> 0) / 4294967296)
          logins = logins
            .map((l) => [sorte(), l])
            .sort((x, y) => x[0] - y[0])
            .slice(0, MAX)
            .map(([, l]) => l)
        }
        if (logins.length === 1) logins.push(CHANNEL)
        logins.sort()
        await pedir(logins.filter((l) => l !== CHANNEL))
        corredores = logins.map((login) => ({ login, nome: presentes.get(login) ?? login, aparencia: aparencia(login) }))
        corrida = Corrida.criar(semente, corredores.length)
        camera = { x: 0, y: Corrida.chaoEm(corrida.pista, 0) - VISTA_H * 0.72 }
        chamadas = 0
        fase = "contagem"
        inicio = performance.now()
        acumulado = 0
        podio.classList.remove("visivel")
        caixa.classList.remove("escondida")
      }

      function encerrar() {
        fase = "parada"
        corrida = null
        aviso.textContent = ""
        caixa.classList.add("escondida")
        setTimeout(() => podio.classList.remove("visivel"), 500)
      }

      function mostrarPodio() {
        fase = "podio"
        const top = corrida.ordem.slice(0, 3).map((i) => corredores[i])
        // Second, first, third, as podiums stand.
        const lugares = [
          [top[1], 2],
          [top[0], 1],
          [top[2], 3],
        ].filter(([c]) => c)
        podio.innerHTML = lugares
          .map(
            ([c, n]) => `<div class="degrau p${n}">
              <div class="nome"></div>
              <div class="fa torcedor${n === 1 ? " comemora" : ""}" data-comemoracao="${c.aparencia.comemoracao}"><div class="pose">${Torcedor.figura(c.aparencia)}</div></div>
              <div class="base">${n}º</div>
            </div>`,
          )
          .join("")
        podio.querySelectorAll(".degrau .nome").forEach((el, k) => (el.textContent = lugares[k][0].nome))
        podio.classList.add("visivel")
        aviso.textContent = ""
        registrar()
        setTimeout(encerrar, 9000)
      }

      // --- Drawing --------------------------------------------------------------------------------------------------
      ctx.scale(2, 2)
      function linha(pontos, cor, largura) {
        ctx.beginPath()
        pontos.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)))
        ctx.strokeStyle = cor
        ctx.lineWidth = largura
        ctx.lineJoin = "round"
        ctx.stroke()
      }

      function desenhar() {
        const c = corrida
        const p = c.pista
        ctx.clearRect(0, 0, W, H)
        const ordem = lugares()
        // The camera: the leading marble still running a little right of centre, its floor low in the view (the track
        // only runs downhill, so the ones behind sit higher up), and never the top five's highest out of the top.
        const vivos = c.bolas.filter((b) => !b.fora)
        const correndo = vivos.filter((b) => b.chegou === null)
        const lider = (correndo.length ? correndo : vivos).reduce((m, b) => (b.x > m.x ? b : m), vivos[0] ?? c.bolas[0])
        const alvoX = Math.min(Math.max(lider.x - VISTA_W * 0.62, 0), p.fim - VISTA_W)
        const chaoLider = Corrida.chaoEm(p, Math.min(lider.x, p.fim))
        let alvoY = chaoLider - VISTA_H * 0.72
        const primeiros = ordem
          .slice(0, 5)
          .map((i) => c.bolas[i])
          .filter((b) => !b.fora && b.chegou === null && b.x >= alvoX)
        if (primeiros.length) {
          const topo = Math.min(...primeiros.map((b) => b.y)) - Corrida.RAIO - 22
          alvoY = Math.max(Math.min(alvoY, topo), chaoLider - VISTA_H + 12)
        }
        camera.x += (alvoX - camera.x) * 0.12
        camera.y += (alvoY - camera.y) * 0.12
        ctx.save()
        ctx.beginPath()
        ctx.rect(LISTA, 0, W - LISTA, H)
        ctx.clip()
        ctx.translate(LISTA, 0)
        ctx.scale(ESCALA, ESCALA)
        ctx.translate(-camera.x, -camera.y)
        // The tube: the ceiling faint, the floor in Klein claro over a darker fill.
        const de = camera.x - 40
        const ate = camera.x + VISTA_W + 40
        // The stretch of a polyline in view, with a point past each side.
        const trecho = (pts) => {
          let i = 0
          while (i < pts.length - 1 && pts[i + 1][0] < de) i++
          let j = i
          while (j < pts.length - 1 && pts[j][0] <= ate) j++
          return pts.slice(i, j + 1)
        }
        const chao = trecho(p.chao)
        if (chao.length > 1) {
          ctx.beginPath()
          chao.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)))
          ctx.lineTo(chao.at(-1)[0], chao.at(-1)[1] + 400)
          ctx.lineTo(chao[0][0], chao[0][1] + 400)
          ctx.closePath()
          ctx.fillStyle = "rgb(0 47 167 / 0.55)"
          ctx.fill()
          linha(chao, "#85a7ff", 3)
        }
        const teto = trecho(p.teto)
        if (teto.length > 1) linha(teto, "rgb(133 167 255 / 0.35)", 2)
        // The finish: a chequered post.
        const fy = Corrida.chaoEm(p, p.chegada)
        for (let k = 0; k < 10; k++) {
          ctx.fillStyle = k % 2 ? "#f4f5f7" : "#001447"
          ctx.fillRect(p.chegada - 3, fy - Corrida.ALTURA + k * (Corrida.ALTURA / 10), 6, Corrida.ALTURA / 10)
        }
        for (const pino of p.pinos) {
          if (pino.x < de || pino.x > ate) continue
          ctx.beginPath()
          ctx.arc(pino.x, pino.y, pino.r, 0, Math.PI * 2)
          ctx.fillStyle = "#f4f5f7"
          ctx.fill()
        }
        // The marbles: their fan's colour, a band of its detail that rolls with them. The back lanes first, a little
        // smaller and darker, so one passing another goes behind or in front of it.
        const fundo = Corrida.FAIXAS - 1
        for (const b of [...c.bolas].sort((x, y) => y.faixa - x.faixa || x.i - y.i)) {
          if (b.x < de || b.x > ate) continue
          const a = corredores[b.i].aparencia
          const R = Corrida.RAIO * (1 - (0.12 * b.faixa) / fundo)
          if (b.fora) continue
          const sumindo = b.chegou !== null ? Math.max(0, 1 - (b.x - p.chegada) / Corrida.SAIDA) : 1
          ctx.save()
          ctx.globalAlpha = 0.25 + 0.75 * sumindo
          ctx.translate(b.x, b.y)
          ctx.rotate(b.giro)
          ctx.beginPath()
          ctx.arc(0, 0, R, 0, Math.PI * 2)
          ctx.fillStyle = a.cor
          ctx.fill()
          ctx.save()
          ctx.clip()
          ctx.fillStyle = a.detalhe
          ctx.fillRect(-R, -R * 0.32, R * 2, R * 0.64)
          ctx.restore()
          if (b.faixa) {
            ctx.fillStyle = `rgb(0 20 71 / ${((0.4 * b.faixa) / fundo).toFixed(2)})`
            ctx.fill()
          }
          ctx.lineWidth = 1.5
          ctx.strokeStyle = "rgb(255 255 255 / 0.55)"
          ctx.stroke()
          ctx.restore()
        }
        // The top three running get their name over them, the leader's first; a name that would cover one already
        // there goes a line up, with a tick down to its marble.
        ctx.font = "600 11px 'Space Grotesk', sans-serif"
        ctx.textAlign = "center"
        const rotulos = []
        for (const i of ordem.slice(0, 3)) {
          const b = c.bolas[i]
          if (b.fora || b.chegou !== null || b.x < de || b.x > ate) continue
          const nome = corredores[i].nome
          const w = ctx.measureText(nome).width + 8
          const base = b.y - Corrida.RAIO - 18
          let y = base
          while (rotulos.some((r) => Math.abs(r.x - b.x) < (r.w + w) / 2 + 2 && Math.abs(r.y - y) < 15)) y -= 15
          rotulos.push({ x: b.x, y, w })
          if (y < base) {
            ctx.fillStyle = "rgb(244 245 247 / 0.6)"
            ctx.fillRect(b.x - 0.5, y + 14, 1, base - y)
          }
          ctx.fillStyle = "rgb(0 20 71 / 0.8)"
          ctx.fillRect(b.x - w / 2, y, w, 14)
          ctx.fillStyle = "#f4f5f7"
          ctx.fillText(nome, b.x, y + 10.5)
        }
        ctx.restore()
        // The strip: everyone's place along the whole track, the line at its end.
        const y0 = H - FAIXA + 8
        const x0 = LISTA + 16
        const x1 = W - 36
        ctx.fillStyle = "rgb(133 167 255 / 0.25)"
        ctx.fillRect(x0, y0, x1 - x0, 3)
        ctx.fillStyle = "#f4f5f7"
        ctx.fillRect(x1 - 2, y0 - 5, 3, 13)
        for (const b of c.bolas) {
          const t = Math.min(1, b.x / p.chegada)
          ctx.beginPath()
          ctx.arc(x0 + (x1 - x0) * t, y0 + 1.5, 4, 0, Math.PI * 2)
          ctx.fillStyle = corredores[b.i].aparencia.cor
          ctx.fill()
        }
      }

      // The places now: who crossed, in order, then the rest by how far they are.
      function lugares() {
        const c = corrida
        const resto = c.bolas.filter((b) => b.chegou === null).sort((a, b) => b.x - a.x || a.i - b.i).map((b) => b.i)
        return [...c.ordem, ...resto.filter((i) => !c.ordem.includes(i))]
      }

      let lideresAntes = ""
      function desenharLideres() {
        const top = lugares().slice(0, 5)
        const chave = top.join(",") + "|" + corrida.ordem.length
        if (chave === lideresAntes) return
        lideresAntes = chave
        lideres.replaceChildren(
          ...top.map((i, k) => {
            const li = document.createElement("li")
            if (corrida.ordem.includes(i)) li.className = "chegou"
            const n = document.createElement("b")
            n.textContent = String(k + 1)
            const bola = document.createElement("i")
            bola.style.background = `linear-gradient(${corredores[i].aparencia.cor} 0 34%, ${corredores[i].aparencia.detalhe} 34% 66%, ${corredores[i].aparencia.cor} 66%)`
            const nome = document.createElement("span")
            nome.textContent = corredores[i].nome
            li.append(n, bola, nome)
            return li
          }),
        )
      }

      function quadro(agora) {
        requestAnimationFrame(quadro)
        if (!corrida) return
        const dt = Math.min(0.1, (agora - (ultimo || agora)) / 1000)
        ultimo = agora
        if (fase === "contagem") {
          const falta = 3 - Math.floor((agora - inicio) / 1000)
          aviso.textContent = falta > 0 ? String(falta) : "Já!"
          if (falta <= 0) {
            fase = "correndo"
            setTimeout(() => fase === "correndo" && (aviso.textContent = ""), 700)
          }
        } else if (fase === "correndo") {
          acumulado += dt
          while (acumulado >= Corrida.DT && !corrida.fim) {
            Corrida.passo(corrida)
            acumulado -= Corrida.DT
          }
          // Each of the first three called out as they cross.
          while (chamadas < Math.min(3, corrida.ordem.length) && corrida.bolas[corrida.ordem[chamadas]].chegou !== null) {
            aviso.textContent = `${chamadas + 1}º ${corredores[corrida.ordem[chamadas]].nome}`
            chamadas++
          }
          // Everyone in (or the time's up): a moment on the line, then the podium.
          if (corrida.fim) {
            fase = "chegada"
            setTimeout(() => fase === "chegada" && mostrarPodio(), 1500)
          }
        }
        if (corrida) {
          desenhar()
          desenharLideres()
        }
      }
      requestAnimationFrame(quadro)

      // --- The record: each race that ends while the stream is on, to the Σ API ---------------------------------
      let noArAte = 0
      function registrar() {
        if (DEMO || !CHAVE || !SIGMA_API || Date.now() > noArAte) return
        const corpo = {
          versao: Corrida.VERSAO,
          semente: corrida.semente,
          logins: corredores.map((c) => c.login),
          nomes: corredores.map((c) => c.nome),
          ordem: corrida.ordem,
        }
        fetch(`${SIGMA_API}/corrida`, { method: "POST", headers: { "content-type": "application/json", "x-chave": CHAVE }, body: JSON.stringify(corpo) }).catch(() => {
          // The API down: this race isn't counted.
        })
      }
      addEventListener("muanlartins-torcida", ({ detail }) => {
        if (detail?.tipo === "noar") noArAte = detail.ligado ? Date.now() + 15000 : 0
      })

      // --- On air: the scene coming on starts a race; leaving it drops one still running -----------------------
      let largada
      addEventListener("obsSourceActiveChanged", ({ detail }) => {
        clearTimeout(largada)
        if (detail?.active) largada = setTimeout(largar, 2500)
        else if (fase !== "parada") encerrar()
      })

      // --- The chat, or the demo's ------------------------------------------------------------------------------
      if (!DEMO) {
        irc(apply, { membership: true })
        setInterval(() => pedir([...presentes.keys()].slice(0, 100)), 120000)
      } else {
        const nomes = ["rafa", "Giovana_GC", "tiago.mendes", "marinamarina", "lucas_s", "bia.lima", "DuduSantos", "ceci", "otto", "jujuba"]
        const um_ = (lista) => lista[Math.floor(Math.random() * lista.length)]
        function povoar(n) {
          presentes.clear()
          for (let k = 0; k < n; k++) {
            const nome = k < nomes.length ? nomes[k] : `pessoa${k}`
            const login = nome.toLowerCase()
            presentes.set(login, nome)
            if (k % 2) escolhas.set(login, { cor: um_(Torcedor.CORES), detalhe: um_(Torcedor.CORES), roupa: um_(Torcedor.ROUPAS), cabeca: um_(Torcedor.CABECAS), comemoracao: um_(Torcedor.COMEMORACOES) })
          }
        }
        let quantos = Number(params.get("demo")) || 20
        povoar(quantos)
        const keys = {
          r: () => {
            fase = "parada"
            largar()
          },
          n: () => {
            quantos = { 2: 8, 8: 20, 20: 40, 40: 2 }[quantos] ?? 20
            povoar(quantos)
          },
        }
        addEventListener("keydown", (e) => keys[e.key]?.())
        setTimeout(largar, 300)
      }
    </script>
  </body>
</html>
