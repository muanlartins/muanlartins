<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Filtros · painel · muanlartins</title>
    <link rel="stylesheet" href="stream.css" />
    <!--
      OBS: Custom browser dock "Filtros" (brand/twitch/obs.py --apply adds it), off stream. It switches the camera
      filters of filtros.html, the "Filtros" browser source. At the top, the filter: a dropdown with every one of
      them by game (Valorant's agents with their faces from the site's public/valorant/agentes/, then Rocket League's
      Octane, Fennec and ball), and beside it the power button. Picking one turns it on; the power button turns the
      picked one off and on again. Under them, for the one that's on, its one-offs (each agent's abilities with their
      keys, the cars' Demolição and Flip), its switches (Sova's "Coruja sobrevoando": his drone flying behind Luan
      all the while) and its gestures. "Sons dos filtros" is for all of them.

      It's served like filtros.html, from this working copy on localhost:8126 ("Filtros muanlartins.vbs" in Startup),
      so a new filter needs no release: an entry in FILTROS here and its drawing there.

      It tells the page through obs-websocket, like the Efeitos dock: obs-browser's emit_event "muanlartins-filtro"
      with { filtro: "<id>", opcoes: { <switch>: true|false } } ("nenhum" for none), sent on each click and again
      every 4 s, so the page catches up after a reload; { acao: "<id>" } is a one-off. "Sons dos filtros" turns the
      abilities' sounds on and off for every filter (opcoes.mudo, on by default). The dock is where the choice
      lives and the filter isn't kept on: opening OBS always starts with none, with the last one picked ready in
      the dropdown (the switches are kept too). The OBS websocket password is kept in the dock's storage;
      #obs=<password> in the URL fills it.
    -->
    <style>
      html,
      body {
        overflow: auto;
        background: var(--navy);
      }
      body {
        padding: 14px;
        font-size: 15px;
        line-height: 1.35;
      }
      h2 {
        margin: 18px 0 8px;
        color: var(--klein-claro);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .status {
        margin: 0;
        color: rgb(244 245 247 / 0.6);
        font-size: 12px;
      }
      .status::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 6px;
        border-radius: 50%;
        background: #ff5a5a;
      }
      .status.on::before {
        background: var(--klein-claro);
      }
      button {
        font: inherit;
        font-size: 14px;
        color: var(--paper);
        background: rgb(0 47 167 / 0.45);
        border: 1px solid rgb(133 167 255 / 0.4);
        padding: 10px;
        cursor: pointer;
        text-align: left;
      }
      button:hover {
        border-color: var(--klein-claro);
      }
      button:focus-visible,
      [role="option"]:focus-visible {
        outline: 2px solid var(--paper);
        outline-offset: 1px;
      }
      button.active {
        background: var(--klein);
        border-color: var(--paper);
        box-shadow: 0 0 0 2px rgb(244 245 247 / 0.35);
      }

      /* The filter: the dropdown and the power button beside it. */
      .escolha {
        position: relative;
        display: flex;
        gap: 6px;
      }
      #filtro {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
      }
      #filtro .nome {
        flex: 1;
        min-width: 0;
      }
      #filtro .nome b {
        display: block;
        font-size: 17px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #filtro .nome small {
        display: block;
        color: rgb(244 245 247 / 0.6);
        font-size: 12px;
      }
      #filtro::after {
        content: "";
        flex: none;
        width: 8px;
        height: 8px;
        margin: 0 4px 4px;
        border-right: 2px solid var(--klein-claro);
        border-bottom: 2px solid var(--klein-claro);
        transform: rotate(45deg);
        transition: transform 0.15s;
      }
      #filtro[aria-expanded="true"]::after {
        transform: translateY(4px) rotate(225deg);
      }
      .escolha.desligado #filtro {
        background: rgb(0 47 167 / 0.2);
      }
      .escolha.desligado #filtro .icone {
        filter: grayscale(1);
        opacity: 0.55;
      }
      #ligar {
        flex: none;
        width: 64px;
        display: grid;
        place-items: center;
        gap: 2px;
        padding: 6px 4px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-align: center;
      }
      #ligar svg {
        width: 22px;
        height: 22px;
      }
      /* Each filter's picture: the agent's face, or a drawing for Rocket League's. */
      .icone {
        flex: none;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        background: rgb(244 245 247 / 0.08);
        overflow: hidden;
      }
      .icone img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .icone svg {
        width: 70%;
        height: 70%;
        color: var(--klein-claro);
      }
      .lista .icone {
        width: 30px;
        height: 30px;
      }

      /* The dropdown's list, grouped by game. */
      .lista {
        position: absolute;
        z-index: 2;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        max-height: min(60vh, 420px);
        overflow: auto;
        margin: 0;
        padding: 4px 0;
        list-style: none;
        background: var(--navy);
        border: 1px solid var(--klein-claro);
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.5);
      }
      .lista .jogo {
        padding: 8px 12px 4px;
        color: var(--klein-claro);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .lista [role="option"] {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .lista [role="option"]:hover,
      .lista [role="option"].foco {
        background: rgb(0 47 167 / 0.6);
      }
      .lista [role="option"][aria-selected="true"] {
        background: var(--klein);
      }
      .lista [role="option"] .no-ar {
        margin-left: auto;
        color: var(--klein-claro);
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 6px;
      }
      .grid button {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      kbd {
        flex: none;
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        color: var(--navy);
        background: var(--klein-claro);
      }
      /* Switches: on while lit. */
      .opcoes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .opcoes button {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 10px;
        font-size: 13px;
      }
      .opcoes button::before {
        content: "";
        flex: none;
        width: 26px;
        height: 14px;
        border-radius: 7px;
        background: rgb(244 245 247 / 0.25) radial-gradient(circle at 7px 50%, var(--paper) 5px, transparent 5.5px);
      }
      .opcoes button.active::before {
        background: var(--klein-claro) radial-gradient(circle at 19px 50%, var(--paper) 5px, transparent 5.5px);
      }
      button.disparou {
        border-color: var(--paper);
        background: rgb(133 167 255 / 0.35);
      }
      .note {
        margin: 10px 0 0;
        color: rgb(244 245 247 / 0.6);
        font-size: 12px;
      }
      .note b {
        color: var(--paper);
        font-weight: 500;
      }
      .note + .note {
        margin-top: 4px;
      }
      .geral {
        margin-top: 18px;
        padding-top: 12px;
        border-top: 1px solid rgb(133 167 255 / 0.2);
      }
      details {
        margin-top: 12px;
        font-size: 13px;
      }
      details input {
        font: inherit;
        color: var(--paper);
        background: rgb(0 47 167 / 0.45);
        border: 1px solid rgb(133 167 255 / 0.4);
        padding: 6px 9px;
        width: 100%;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <p class="status" id="obs">OBS desconectado</p>

    <h2 id="rotulo">Filtro da câmera</h2>
    <div class="escolha" id="escolha">
      <button id="filtro" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="rotulo filtro"></button>
      <button id="ligar" aria-pressed="false" title="Ligar ou desligar o filtro escolhido">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 3v8" />
          <path d="M6.3 6.8a8 8 0 1 0 11.4 0" />
        </svg>
        <span id="ligar-texto">Ligar</span>
      </button>
      <ul class="lista" id="lista" role="listbox" aria-labelledby="rotulo" tabindex="-1" hidden></ul>
    </div>

    <section id="painel" hidden>
      <h2 id="titulo"></h2>
      <div class="grid" id="acoes"></div>
      <div class="opcoes" id="opcoes"></div>
      <div id="dicas"></div>
    </section>

    <div class="geral">
      <div class="opcoes"><button id="sons">Sons dos filtros</button></div>
      <details>
        <summary>Conexão com o OBS</summary>
        <input id="password" type="password" placeholder="Senha do obs-websocket" autocomplete="off" />
      </details>
    </div>

    <script>
      // Every filter, in the dropdown's order, grouped by `jogo`: filtros.html's id, its picture (an agent's face
      // from the site, or a drawing in DESENHOS), its one-offs ([id, key, name]: the key is the ability's in
      // Valorant, or none), its switches ([id, name]) and its gestures ([ability, how]).
      const FILTROS = [
        {
          id: "phoenix",
          nome: "Phoenix",
          jogo: "Valorant",
          acoes: [
            ["blaze", "C", "Labareda"],
            ["flash", "Q", "Bola Curva"],
            ["molotov", "E", "Mãos Quentes"],
            ["ult", "X", "Ultimate"],
          ],
          gestos: [
            ["Fogo", "as duas palmas abertas, de frente uma para a outra."],
            ["Bola Curva", "um estalo girando a mão."],
          ],
        },
        {
          id: "sage",
          nome: "Sage",
          jogo: "Valorant",
          acoes: [
            ["barreira", "C", "Orbe de Barreira"],
            ["lentidao", "Q", "Orbe de Lentidão"],
            ["cura", "E", "Orbe Curativo"],
            ["ult", "X", "Ressurreição"],
          ],
          gestos: [["Orbe Curativo", "junte as duas palmas na frente do peito, como numa prece."]],
        },
        {
          id: "sova",
          nome: "Sova",
          jogo: "Valorant",
          acoes: [
            ["drone", "C", "Drone Coruja"],
            ["choque", "Q", "Flecha de Choque"],
            ["recon", "E", "Flecha de Reconhecimento"],
            ["ult", "X", "Ultimate"],
          ],
          opcoes: [["patrulha", "Coruja sobrevoando"]],
          gestos: [
            ["Arco", "feche as duas mãos e encoste um punho no outro; afaste as mãos para puxar a corda e abra a mão da corda para atirar a Flecha de Reconhecimento."],
            ["Drone Coruja", "mostre as duas palmas abertas para a câmera, lado a lado."],
          ],
        },
        { id: "octane", nome: "Octane", jogo: "Rocket League", desenho: "carro", acoes: [["demo", "", "Demolição"], ["flip", "", "Flip"]] },
        { id: "fennec", nome: "Fennec", jogo: "Rocket League", desenho: "carro", acoes: [["demo", "", "Demolição"], ["flip", "", "Flip"]] },
        { id: "bola", nome: "Bola", jogo: "Rocket League", desenho: "bola" },
      ]
      // Rocket League's pictures: a car from the side and a ball, drawn here.
      const DESENHOS = {
        carro:
          '<svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M4 21v-4.5l4-1.5 4.5-4.5h7.5l5 5 3 .8V21h-2.2a3.3 3.3 0 0 0-6.6 0h-7.4a3.3 3.3 0 0 0-6.6 0Z"/><circle cx="9" cy="21.5" r="2.4"/><circle cx="22.4" cy="21.5" r="2.4"/></svg>',
        bola: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="16" cy="16" r="11"/><path d="M16 9.5l5 3.6-1.9 5.9h-6.2L11 13.1Z" fill="currentColor"/><path d="M16 9.5V5M21 13.1l4.6-1.5M19.1 19l2.8 3.9M12.9 19l-2.8 3.9M11 13.1l-4.6-1.5"/></svg>',
      }

      const $ = (id) => document.getElementById(id)
      const KEY = "filtros"
      // Kept: the password, the last filter picked (what the power button turns on) and the switches.
      const state = { obsPassword: "", ultimo: FILTROS[0].id, opcoes: {}, ...JSON.parse(localStorage.getItem(KEY) || "{}") }
      if (!FILTROS.some((f) => f.id === state.ultimo)) state.ultimo = FILTROS[0].id
      const save = () => localStorage.setItem(KEY, JSON.stringify(state))
      const fromHash = new URLSearchParams(location.hash.slice(1)).get("obs")
      if (fromHash) {
        state.obsPassword = fromHash
        save()
        history.replaceState(null, "", location.pathname + location.search)
      }
      $("password").value = state.obsPassword
      $("password").onchange = (e) => {
        state.obsPassword = e.target.value
        save()
        obs?.close()
      }

      // --- obs-websocket --------------------------------------------------------------------------------------
      let obs = null
      let ready = false
      let requests = 0
      const sha256 = async (text) => btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)))))
      function connect() {
        const ws = new WebSocket("ws://127.0.0.1:4455")
        obs = ws
        ws.onmessage = async ({ data }) => {
          const { op, d } = JSON.parse(data)
          if (op === 0) {
            const identify = { rpcVersion: 1, eventSubscriptions: 0 }
            if (d.authentication) {
              const { challenge, salt } = d.authentication
              identify.authentication = await sha256((await sha256(state.obsPassword + salt)) + challenge)
            }
            ws.send(JSON.stringify({ op: 1, d: identify }))
          } else if (op === 2) {
            ready = true
            status()
            send({ filtro: atual, opcoes: state.opcoes })
          }
        }
        ws.onerror = () => ws.close()
        ws.onclose = () => {
          ready = false
          status()
          setTimeout(connect, 3000)
        }
      }
      function send(data) {
        if (!ready) return
        const requestData = { vendorName: "obs-browser", requestType: "emit_event", requestData: { event_name: "muanlartins-filtro", event_data: data } }
        obs.send(JSON.stringify({ op: 6, d: { requestType: "CallVendorRequest", requestId: String(++requests), requestData } }))
      }
      function status() {
        $("obs").className = ready ? "status on" : "status"
        $("obs").textContent = ready ? "OBS conectado" : state.obsPassword ? "OBS desconectado" : "OBS desconectado: falta a senha (abaixo)"
      }

      // --- the filters ----------------------------------------------------------------------------------------
      let atual = "nenhum"
      const filtroDe = (id) => FILTROS.find((f) => f.id === id)
      const texto = (t) => t.replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`)
      const icone = (f) =>
        `<span class="icone">${f.desenho ? DESENHOS[f.desenho] : `<img src="../valorant/agentes/${f.id}.webp" alt="" />`}</span>`
      function ligar(id) {
        atual = id
        if (id !== "nenhum") {
          state.ultimo = id
          save()
        }
        send({ filtro: atual, opcoes: state.opcoes })
        desenhar()
      }
      const botao = (html, onclick) => {
        const b = document.createElement("button")
        b.innerHTML = html
        b.onclick = onclick
        return b
      }

      // The dropdown: a button showing the picked filter, and its list by game. Arrows move, Enter or a click
      // picks (and turns it on), Esc or a click outside closes.
      let foco = -1
      const opcoesDaLista = () => [...$("lista").querySelectorAll('[role="option"]')]
      function abrir() {
        const jogos = [...new Set(FILTROS.map((f) => f.jogo))]
        $("lista").replaceChildren(
          ...jogos.flatMap((jogo) => {
            const titulo = document.createElement("li")
            titulo.className = "jogo"
            titulo.setAttribute("role", "presentation")
            titulo.textContent = jogo
            return [
              titulo,
              ...FILTROS.filter((f) => f.jogo === jogo).map((f) => {
                const li = document.createElement("li")
                li.setAttribute("role", "option")
                li.id = `op-${f.id}`
                li.dataset.id = f.id
                li.setAttribute("aria-selected", String(f.id === state.ultimo))
                li.innerHTML = `${icone(f)}<span>${texto(f.nome)}</span>${f.id === atual ? '<span class="no-ar">no ar</span>' : ""}`
                li.onclick = () => escolher(f.id)
                return li
              }),
            ]
          }),
        )
        $("lista").hidden = false
        $("filtro").setAttribute("aria-expanded", "true")
        const ops = opcoesDaLista()
        mover(ops.findIndex((o) => o.dataset.id === state.ultimo))
        $("lista").focus()
      }
      function fechar(voltar = true) {
        if ($("lista").hidden) return
        $("lista").hidden = true
        $("filtro").setAttribute("aria-expanded", "false")
        if (voltar) $("filtro").focus()
      }
      function mover(i) {
        const ops = opcoesDaLista()
        foco = (i + ops.length) % ops.length
        ops.forEach((o, k) => o.classList.toggle("foco", k === foco))
        $("lista").setAttribute("aria-activedescendant", ops[foco].id)
        ops[foco].scrollIntoView({ block: "nearest" })
      }
      function escolher(id) {
        fechar()
        ligar(id)
      }
      $("filtro").onclick = () => ($("lista").hidden ? abrir() : fechar())
      $("filtro").onkeydown = (e) => {
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault()
          abrir()
        }
      }
      $("lista").onkeydown = (e) => {
        if (e.key === "ArrowDown") mover(foco + 1)
        else if (e.key === "ArrowUp") mover(foco - 1)
        else if (e.key === "Home") mover(0)
        else if (e.key === "End") mover(-1)
        else if (e.key === "Enter" || e.key === " ") escolher(opcoesDaLista()[foco].dataset.id)
        else if (e.key === "Escape" || e.key === "Tab") fechar(e.key === "Escape")
        else return
        e.preventDefault()
      }
      addEventListener("pointerdown", (e) => {
        if (!$("escolha").contains(e.target)) fechar(false)
      })
      // The power button: off, or the last one picked back on.
      $("ligar").onclick = () => ligar(atual === "nenhum" ? state.ultimo : "nenhum")

      function desenhar() {
        const f = filtroDe(state.ultimo)
        const on = atual !== "nenhum"
        $("filtro").innerHTML = `${icone(f)}<span class="nome"><b>${texto(f.nome)}</b><small>${texto(f.jogo)}</small></span>`
        $("escolha").classList.toggle("desligado", !on)
        $("ligar").classList.toggle("active", on)
        $("ligar").setAttribute("aria-pressed", String(on))
        $("ligar-texto").textContent = on ? "Ligado" : "Ligar"
        const ativo = filtroDe(atual)
        $("painel").hidden = !ativo
        if (!ativo) return
        $("titulo").textContent = ativo.jogo === "Valorant" ? `Habilidades de ${ativo.nome}` : ativo.nome
        $("acoes").replaceChildren(
          ...(ativo.acoes || []).map(([acao, tecla, nome]) => {
            const b = botao(`${tecla ? `<kbd>${texto(tecla)}</kbd>` : ""}<span>${texto(nome)}</span>`, () => {
              send({ acao })
              // A short flash on the button: the click went out.
              b.classList.add("disparou")
              setTimeout(() => b.classList.remove("disparou"), 250)
            })
            return b
          }),
        )
        $("opcoes").replaceChildren(
          ...(ativo.opcoes || []).map(([id, nome]) => {
            const b = botao(texto(nome), () => {
              state.opcoes[id] = !state.opcoes[id]
              save()
              send({ filtro: atual, opcoes: state.opcoes })
              b.classList.toggle("active", !!state.opcoes[id])
            })
            b.classList.toggle("active", !!state.opcoes[id])
            return b
          }),
        )
        $("dicas").replaceChildren(
          ...(ativo.gestos || []).map(([nome, como]) => {
            const p = document.createElement("p")
            p.className = "note"
            p.innerHTML = `<b>Gesto · ${texto(nome)}:</b> ${texto(como)}`
            return p
          }),
        )
      }
      // The filters' sounds, for all of them: on unless muted.
      const sons = () => $("sons").classList.toggle("active", !state.opcoes.mudo)
      $("sons").onclick = () => {
        state.opcoes.mudo = !state.opcoes.mudo
        save()
        send({ filtro: atual, opcoes: state.opcoes })
        sons()
      }
      sons()
      setInterval(() => send({ filtro: atual, opcoes: state.opcoes }), 4000)
      desenhar()
      status()
      connect()
    </script>
  </body>
</html>
