    <!--
      OBS: since 2026-11-20 in the "Conversa" scene, inside its overlay: conversa.html holds this page in an iframe
      (?vez) and has it take turns with the marble race in one box under the camera, one duel each turn, stopping
      where it is while the scene is off the air and passing the turn when its duel is over or nobody's there.
      Until then it was the browser source "Duelo" in the game scenes, over the overlays and under the VAR's mini
      player. Silent.

      The ball duel (Lucca's idea, lucca_3098; Luan's rules, 2026-11-15): in the corner of the VAR's mini player, two
      viewers in the chat drawn at random fight as balls with weapons, one duel after another, forever, with nobody
      joining or doing anything. The fight is duelo-motor.js (deterministic: a seed and two classes; the genre's
      physics since 2026-11-16, gravity and bounces in a square box); this page draws it. On the live (since
      2026-11-17, Luan: "só o quadrado do jogo com o jogo rolando") the box is the arena alone: the two names, their
      life bars and classes in a strip over it, the clock on its band and each ball's life inside it, as the genre's
      videos show it; nothing crosses its wall. With the columns (the site's player, or ?completo), the arena sits in
      the middle of a wider box with each fighter in a column by it (their fan, life, class, what its ability has
      grown to and what it does). Either way every ability shows on the balls themselves (the poison's bubbles, the
      stun's stars, the katana's slices, the Punho's trail, the Martelo's glowing head). Each ball wears its viewer's
      shirt from their 3D fan (/perfil; fas3d.js's camisaPlana, any colour since the 3D fan) and fights with the class they picked on
      /canal/minijogos (the profile API's /duelistas), or one drawn each duel if they didn't. Its weapon's material is
      their Σ rank, or a lower one they picked there: Σ never makes a ball stronger, only better looking.

      The record: OBS's source URL holds the Σ key (#chave=…, as the stand's), and with it every fight shown while the
      stream is on (the Partidas dock says so) goes to the Σ API (POST /duelo), which plays it again from its seed and
      keeps the wins, the ranking and the latest fights for the site.

      Who fights: the viewers logged in with the chat open (Twitch's membership events, as torcida.html), drawn like
      the goal's dedication (more Σ, a little more chance: Sigma.peso), never the two of the duel before when there
      are four or more. Alone, the one viewer fights the channel's ball; nobody, the corner stays empty.

      The VAR comes first: while one is open (the Efeitos dock's "muanlartins-var"), the duel stops where it is and
      the corner is the VAR's; it carries on when the VAR closes. It also stops while the source is off the air.

      The box sits in the mini player's corner, 640×360 at (1236, 92): on the live, the arena of 280 (?tamanho= from
      200 to 420) and its strip, 292×342 with its right edge on the mini player's, so at (1584, 92); with the columns,
      the mini player's whole box. ?x= and ?y= move it (in Valorant OBS sets the source 238 px lower, under the
      killfeed). ?api= the profile API, ?sigma= the Σ API, ?canal= the channel. ?demo fills the chat with sample
      people (keys: v the VAR opens and closes, n next duel, s someone leaves, j someone arrives); ?demo=1v1 has a
      single viewer; ?semente= fixes the first fight's seed, ?classes=machado,arco the classes (to try one; a blank
      side, as in ",arco", keeps its own); ?fundo=<image> puts a game screenshot behind.

      The site's player (/canal/minijogos): ?lutadores=a,b fights those two instead of the chat's, and records
      nothing; with ?semente= and ?repetir, the same fight over and over (a replay). ?nomes=A,B their names,
      ?materiais=gold,diamond their weapons' materials (a recorded fight's, or a preview's); "*" in either list is the
      default (a class drawn, the rank's material) whatever they saved. ?site lays the box out
      alone on a navy page of 660×390, scaled to the frame's width.
      Copy is a draft for Luan.
    -->

    <style>

      }

      .lado .cresce {

        font-weight: 700;

      /* Above the arena: the clock. */
      .relogio {

      /* The cards over the box: who's about to fight, and who won. */
      .cartao {
        position: absolute;
        left: 8px;
        top: 8px;
        width: 624px;
        height: 344px;
        display: flex;
        align-items: center;

      .cartao .lutador span {

      .cartao .lutador span em {

        font-weight: 500;
        color: rgb(244 245 247 / 0.6);
      }
      .cartao .lutador small {
        max-width: 210px;
        min-height: 2.5em;
        text-align: center;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.25;
        color: rgb(244 245 247 / 0.72);
      }
      .cartao .x {
        font-size: 44px;
        font-weight: 700;
        color: var(--klein-claro);
      }
      .cartao .vitoria {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        text-align: center;
      }
      .cartao .vitoria strong {
        max-width: 560px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 34px;
        line-height: 1.1;
      }
      .cartao .vitoria small {

      /* The live's box since 2026-11-17 (Luan: "só o quadrado do jogo com o jogo rolando"): the arena alone, with the
         two names, their life and their class in a strip over it, the clock on the band and each ball's life inside it,
         as the genre's videos show it. Its right edge is the mini player's (x 1876). --arena is the square's side on
         screen (?tamanho=, 280 by default); ?completo brings the columns back. The site's player is this box too. */
      body.compacto .caixa {
        --arena: 280px;
        --caixa-x: calc(1876px - var(--arena) - 12px);
        width: calc(var(--arena) + 12px);
        height: calc(var(--arena) + 62px);
      }
      body.site.compacto .caixa {
        --caixa-x: 10px;
        --caixa-y: 26px;
      }
      body.compacto .chao {
        clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
      }
      body.compacto .caixa > canvas {
        top: 50px;
        width: calc(var(--arena) + 12px);
        height: calc(var(--arena) + 12px);
      }
      body.compacto .faixa-titulo {
        left: -8px;
        top: -20px;
        height: 24px;
        gap: 8px;
        padding-right: 28px;
        clip-path: polygon(0 0, 100% 0, calc(100% - 24px) 100%, 0 100%);
        font-size: 14px;
      }
      body.compacto .faixa-titulo b {
        padding: 0 9px;
        font-size: 14px;
      }
      body.compacto .faixa-titulo span {
        display: none;
      }
      body.compacto .faixa-titulo .relogio {
        position: static;
        width: auto;
        font-size: 14px;
        line-height: inherit;
        color: var(--klein);
      }
      body.compacto .faixa-titulo .relogio.subita {
        color: #d62828;
      }
      body.compacto .lado {
        top: 7px;
        width: calc(var(--arena) / 2 - 8px);
        gap: 4px;
      }
      body.compacto .lado.esquerda {
        left: 6px;
      }
      body.compacto .lado.direita {
        right: 6px;
      }
      body.compacto .lado .fa,
      body.compacto .lado .hp,
      body.compacto .lado .cresce,
      body.compacto .lado .resumo,
      body.compacto .lado .classe em {
        display: none;
      }
      body.compacto .lado .nome {
        flex-direction: row;
        align-items: center;
        gap: 4px;
      }
      body.compacto .lado.direita .nome {
        flex-direction: row-reverse;
      }
      body.compacto .lado .nome span {
        max-width: calc(var(--arena) / 2 - 30px);
        font-size: 15px;
      }
      body.compacto .lado .nome img {
        width: 15px;
        height: 15px;
      }
      body.compacto .barra {
        height: 6px;
      }
      body.compacto .lado .classe {
        margin-top: 0;
        font-size: 12px;
      }
      /* The cards cover the arena. */
      body.compacto .cartao {
        left: 6px;
        top: 56px;
        width: var(--arena);
        height: var(--arena);
        gap: 4px;
        background: rgb(0 20 71 / 0.92);
      }
      body.compacto .cartao .lutador {

      body.compacto .cartao .lutador .fa {

      body.compacto .cartao .lutador strong {

        font-size: 17px;

      }
      body.compacto .cartao .lutador small {

      }
      body.compacto .cartao .x {

      }
      body.compacto .cartao .vitoria {

      }
      body.compacto .cartao .vitoria .fa {

        height: 84px;
      }
    </style>
  </head>

    <script type="module">
      import { camisaPlana, lookDe, poseDaFesta, retrato } from "./fas3d.js"
      import { MODELOS, sortear as dado } from "./torcedor3d/esquema.js"

      const caixa = document.querySelector(".caixa")
      const canvas = document.querySelector("canvas")
      const ctx = canvas.getContext("2d")
      const cartao = document.querySelector(".cartao")
      const relogio = document.querySelector(".relogio")
      const lados = [...document.querySelectorAll(".caixa > .lado")]
      if (params.has("x")) caixa.style.setProperty("--caixa-x", `${Number(params.get("x"))}px`)
      if (params.has("y")) caixa.style.setProperty("--caixa-y", `${Number(params.get("y"))}px`)
      if (params.get("fundo")) {
        const img = document.createElement("img")
        img.className = "fundo-demo"
        img.src = params.get("fundo")
        document.querySelector(".stage").prepend(img)
      }

      const API = params.get("api") ?? "https://wtpv8afsak.execute-api.us-east-1.amazonaws.com"
      const SIGMA_API = params.get("sigma") ?? "https://p1rblei1o9.execute-api.us-east-1.amazonaws.com"
      const DEMO = params.has("demo")
      const LOGIN = /^[a-z0-9_]{1,25}$/
      // The site's player: two given viewers, a fixed fight to replay, the page alone.
      const FIXOS = (params.get("lutadores") ?? "").toLowerCase().split(",").filter((l) => LOGIN.test(l)).slice(0, 2)
      const TREINO = FIXOS.length === 2 && FIXOS[0] !== FIXOS[1]
      const REPETIR = TREINO && params.has("repetir") && params.has("semente")
      // Positional lists from the address: ?classes=,arco leaves the left side as it would be.
      const posicional = (nome) => (params.get(nome) ?? "").split(",").map((x) => x.trim())
      // The live's box: the arena alone (the CSS above), and so the site's player since 2026-11-17 (Luan: the replay
      // should be the compact duel too), the arena at the engine's own size there; ?completo keeps the columns.
      const COMPACTO = !params.has("completo")
      const ARENA_TELA = COMPACTO ? (params.has("site") ? Duelo.LADO : Math.min(420, Math.max(200, Number(params.get("tamanho")) || 280))) : Duelo.LADO
      if (params.has("site")) {
        document.body.classList.add("site")
        const stage = document.querySelector(".stage")
        // The box with room for its band above it, scaled to the frame's width.
        const largura = COMPACTO ? ARENA_TELA + 32 : 660
        stage.style.width = `${largura}px`
        stage.style.height = `${COMPACTO ? ARENA_TELA + 92 : 390}px`
        const fit = () => (stage.style.transform = `scale(${innerWidth / largura})`)
        fit()
        addEventListener("resize", fit)
      }
      if (TREINO) document.querySelector(".faixa-titulo span").textContent = REPETIR ? "replay" : "treino"
      if (COMPACTO) {
        document.body.classList.add("compacto")
        caixa.style.setProperty("--arena", `${ARENA_TELA}px`)
        document.querySelector(".faixa-titulo").append(relogio)
        const w = ARENA_TELA + 12
        const h = ARENA_TELA + 62
        const borda = document.querySelector(".borda")
        borda.setAttribute("viewBox", `0 0 ${w} ${h}`)
        borda.setAttribute("width", w)
        borda.setAttribute("height", h)
        borda.querySelector("path").setAttribute("d", `M14 0.75H${w - 0.75}V${h - 14}L${w - 14} ${h - 0.75}H0.75V14Z`)
        canvas.width = canvas.height = w * 2
      }
      // The Σ key, in OBS's source URL only (#chave=…): with it, the fights shown while the stream is on are recorded.
      const CHAVE = new URLSearchParams(location.hash.slice(1)).get("chave")
      let noArAte = 0

      // --- Who's in the chat --------------------------------------------------------------------------------------
      const presentes = new Map() // login → display name
      const escolhas = new Map() // login → their fan, from the profile API
      const duelistas = new Map() // login → their ball ({ classe, material }), from the profile API
      const sigmas = new Map() // login → Σ
      function chegar(login, nome = login) {
        if (BOTS.has(login) || login.startsWith("justinfan")) return
        if (!presentes.has(login) || nome !== login) presentes.set(login, nome)
      }
      function apply(line) {
        const { tags, prefix, command, trailing } = parseIrc(line)
        const login = prefix.split("!")[0]
        if (command === "JOIN") chegar(login)
        else if (command === "PART") presentes.delete(login)
        else if (command === "PRIVMSG") chegar(login, tags["display-name"] || login)
        else if (command === "353") trailing.split(" ").forEach((name) => name && chegar(name))
      }

      // Their fan, ball and Σ, asked just before each duel for the two drawn (and the pool's, for the draw's weights,
      // every two minutes).
      async function pedir(logins) {
        if (DEMO || !logins.length) return
        const pedido = (url) => fetch(url).then((r) => (r.ok ? r.json() : null)).catch(() => null)
        const [fas, pontos, bolas] = await Promise.all([
          pedido(`${API}/torcedores?logins=${logins.join(",")}`),
          pedido(`${SIGMA_API}/sigmas?logins=${logins.join(",")}`),
          pedido(`${API}/duelistas?logins=${logins.join(",")}`),
        ])
        // Offline: they fight with the look from their login and a class drawn.
        for (const login of logins) {
          if (fas?.[login]) escolhas.set(login, fas[login])
          if (pontos?.[login]) sigmas.set(login, pontos[login].sigma ?? 0)
          if (bolas) bolas[login] ? duelistas.set(login, bolas[login]) : duelistas.delete(login)
        }
      }
      setInterval(() => pedir([...presentes.keys()].slice(0, 100)), 120000)

      const sigma = (login) => (login === CHANNEL ? Sigma.RL.at(-1)[0] : sigmas.get(login) ?? 0)
      // Their 3D fan (their look from /perfil, or their 2D one turned 3D; in December, or with ?natal, Santa's hat, as
      // in the stand and the credits), and its shirt flat for the ball.
      const fa = (login) => lookDe(escolhas.get(login) ?? null, login)

      const MATERIAIS = DueloArte.MATERIAIS
      const tier = (id) => id.replace(/-\d$/, "")
      const ORDEM = Object.keys(MATERIAIS)
      const temMaterial = (id) => typeof id === "string" && Object.hasOwn(MATERIAIS, id)
      // Their rank's, or a lower one they picked on the site; on the site's player, the one it gives.
      function materialDe(login, i) {
        const dado = posicional("materiais")[i]
        if (TREINO && temMaterial(dado)) return dado
        const seu = temMaterial(tier(Sigma.ranque(sigma(login)).id)) ? tier(Sigma.ranque(sigma(login)).id) : "bronze"
        const quer = TREINO && dado === "*" ? null : duelistas.get(login)?.material
        return temMaterial(quer) && ORDEM.indexOf(quer) <= ORDEM.indexOf(seu) ? quer : seu
      }
      // Their class: the one given (a test, a replay), the one they picked, or none (one is drawn).
      const temClasse = (id) => typeof id === "string" && Object.hasOwn(Duelo.CLASSES, id)
      function classeDe(login, i) {
        const dada = posicional("classes")[i]
        if (temClasse(dada)) return dada
        if (dada === "*") return null
        const sua = duelistas.get(login)?.classe
        return temClasse(sua) ? sua : null
      }

      // --- The draw -----------------------------------------------------------------------------------------------
      // Like the goal's dedication: more Σ, a little more chance (Sigma.peso). Never the two from the duel before when
      // there are four or more to choose from; with three, the one who sat out comes in.
      let anteriores = []
      function sortear() {
        const todos = [...presentes.keys()].filter((login) => login !== CHANNEL)
        if (!todos.length) return null
        if (todos.length === 1) return [todos[0], CHANNEL]
        let lista = todos.length >= 4 ? todos.filter((l) => !anteriores.includes(l)) : todos
        if (todos.length === 3) {
          const fora = todos.find((l) => !anteriores.includes(l))
          if (fora) {
            const outro = um(todos.filter((l) => l !== fora))
            return Math.random() < 0.5 ? [fora, outro] : [outro, fora]
          }
        }
        const a = um(lista)
        lista = lista.filter((l) => l !== a)
        const b = um(lista.length ? lista : todos.filter((l) => l !== a))
        return [a, b]
      }
      function um(lista) {
        let sorte = Math.random() * lista.reduce((soma, l) => soma + Sigma.peso(sigma(l)), 0)
        return lista.find((l) => (sorte -= Sigma.peso(sigma(l))) < 0) ?? lista.at(-1)
      }

      // --- The cycle: the card with the two, the fight, the winner, a breath, again --------------------------------
      const APRESENTA_MS = 3200
      const RESULTADO_MS = 4500
      const PAUSA_MS = 1500
      let luta = null // the fight going on
      let lutadores = null // [{ login, nome, classe, sorteada, look, aparencia (the ball's shirt), material }]
      let fase = "vazio" // "apresenta" | "luta" | "resultado" | "vazio"
      let faseAte = 0
      let varAberto = false
      let noAr = true
      // Taking turns with the race in the "Conversa" scene (conversa.html holds this page in an iframe, ?vez): it says
      // when this page's turn comes and when to stop where it is; this one says when its duel is over ("fim") or that
      // there's nobody to fight ("vazio"), and waits, hidden, for its next turn.
      const VEZ = params.has("vez") && parent !== window
      let minhaVez = !VEZ
      const avisar = (minijogo) => VEZ && parent.postMessage({ minijogo }, location.origin)
      const pausado = () => varAberto || !noAr || !minhaVez

      let pedidos = false
      async function proximo() {
        const par = TREINO ? FIXOS : sortear()
        if (!par) {
          fase = "vazio"
          caixa.classList.add("escondida")
          faseAte = performance.now() + 5000
          if (VEZ) {
            fase = "espera"
            minhaVez = false
            avisar("vazio")
          }
          return
        }
        anteriores = par
        fase = "carregando"
        // The site's player asks once; the chat's two, before each duel.
        if (!TREINO || !pedidos) await pedir(par)
        pedidos = true
        const semente = params.has("semente") && (REPETIR || !luta) ? Number(params.get("semente")) >>> 0 : crypto.getRandomValues(new Uint32Array(1))[0]
        // No class picked: one at random, each duel, from the browser's secure generator (11-20: Katana came up 18 times
        // in 60 drawn sides with Math.random, about one chance in 100,000 by luck; this rules the generator out).
        const escolhidas = par.map(classeDe)
        const sorteio = crypto.getRandomValues(new Uint32Array(2))
        const classes = escolhidas.map((c, i) => c ?? Duelo.IDS[sorteio[i] % Duelo.IDS.length])
        const nomes = posicional("nomes")
        lutadores = par.map((login, i) => ({
          login,
          nome: (TREINO && nomes[i]) || (presentes.get(login) ?? (login === CHANNEL ? "muanlartins" : login)),
          classe: classes[i],
          sorteada: !escolhidas[i],
          look: fa(login),
          aparencia: camisaPlana(fa(login)),
          materialId: materialDe(login, i),
          ranque: Sigma.ranque(sigma(login)),
        }))
        for (const l of lutadores) l.material = MATERIAIS[l.materialId]
        luta = Duelo.criar(semente, classes[0], classes[1])
        vestirPlacar()
        mostrarApresentacao()
        caixa.classList.remove("escondida")
        fase = "apresenta"
        faseAte = performance.now() + APRESENTA_MS
        efeitos.length = 0
        rastros = [[], []]
      }

      // The fans' pictures now on the page, closed when the next ones come.
      let noPlacar = []
      let noCartao = []
      const largar = (lista) => lista.forEach((r) => r.largar())
      function vestirPlacar() {
        largar(noPlacar)
        noPlacar = []
        lutadores.forEach((l, i) => {
          const lado = lados[i]
          // The columns' fans (hidden in the live's compact box: nothing baked for them there).
          if (!COMPACTO) noPlacar.push(retrato(lado.querySelector(".fa"), l.look, { altura: 54 }))
          lado.querySelector(".nome span").textContent = l.nome
          const img = lado.querySelector(".nome img")
          img.hidden = l.login === CHANNEL
          img.src = l.ranque.emblema
          lado.querySelector(".vida").style.width = "100%"
          lado.querySelector(".rastro").style.width = "100%"
          lado.querySelector(".classe b").textContent = Duelo.CLASSES[l.classe].nome
          lado.querySelector(".classe em").hidden = !l.sorteada
          lado.querySelector(".resumo").textContent = Duelo.CLASSES[l.classe].resumo
        })
        atualizarPlacar()
      }
      function atualizarPlacar() {
        luta.bolas.forEach((bola, i) => {
          const lado = lados[i]
          const p = `${(bola.hp / bola.hpMax) * 100}%`
          lado.querySelector(".vida").style.width = p
          lado.querySelector(".rastro").style.width = p
          lado.querySelector(".hp").innerHTML = `${Math.ceil(bola.hp)}<small> / ${bola.hpMax}</small>`
          lado.querySelector(".cresce").textContent = Duelo.contador(bola, luta)
        })
        const t = Math.floor(luta.t)
        relogio.textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`
        relogio.classList.toggle("subita", luta.t >= Duelo.MORTE_SUBITA)
      }

      const texto = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
      function mostrarApresentacao() {
        const lutador = (l, i) => `<div class="lutador ${i ? "direita" : "esquerda"}">
          <div class="fa torcedor"></div>
          <strong>${texto(l.nome)}</strong>
          <span>${Duelo.CLASSES[l.classe].nome}${l.sorteada ? " <em>sorteada</em>" : ""}</span>
          <small>${Duelo.CLASSES[l.classe].resumo}</small>
        </div>`
        cartao.innerHTML = `${lutador(lutadores[0], 0)}<div class="x">×</div>${lutador(lutadores[1], 1)}`
        largar(noCartao)
        noCartao = [...cartao.querySelectorAll(".lutador .fa")].map((el, i) => retrato(el, lutadores[i].look, { altura: COMPACTO ? 60 : 96 }))
        cartao.classList.remove("entra")
        void cartao.offsetWidth
        cartao.classList.add("visivel", "entra")
      }
      function mostrarResultado(fim) {
        const l = lutadores[fim.vencedor]
        const outro = luta.bolas[1 - fim.vencedor]
        const s = Math.round(fim.t)
        const como = fim.motivo === "nocaute" ? `nocaute em ${s}\u00a0s` : fim.motivo === "tempo" ? `no tempo, com ${Math.ceil(luta.bolas[fim.vencedor].hp)}\u00a0de vida` : "no sorteio, empatados"
        cartao.innerHTML = `<div class="vitoria ${fim.vencedor ? "direita" : "esquerda"}">
          <div class="fa torcedor comemora" data-comemoracao="${l.look.fes}"><div class="pose"></div></div>
          <strong>${texto(l.nome)} venceu!</strong>
          <small>${Duelo.CLASSES[l.classe].nome} contra ${Duelo.CLASSES[outro.classe].nome}, ${como}</small>
        </div>`
        largar(noCartao)
        const festa = retrato(cartao.querySelector(".vitoria .fa"), l.look, { altura: COMPACTO ? 84 : 108, poses: ["parado", poseDaFesta(l.look.fes), "cima", "palmas"] })
        festa.festa(Infinity)
        noCartao = [festa]
        cartao.classList.remove("entra")
        cartao.classList.add("visivel")
      }

      // --- Drawing ------------------------------------------------------------------------------------------------
      // The canvas is drawn at twice its size on screen. With the columns it is the whole box: the arena (Duelo.LADO
      // square) sits in its middle, between them, and a weapon may swing past its wall. In the live's box it is the
      // arena with a margin of 6 px, scaled to ARENA_TELA, and the weapons end at the wall.
      const efeitos = [] // damage numbers, sparks, words: { tipo, x, y, ate, ... }
      let rastros = [[], []]
      let tremor = 0
      const ESCALA = 2 // canvas pixels per pixel on screen
      const UNIDADE = ARENA_TELA / Duelo.LADO // pixels on screen per unit of the engine
      const ARENA_X = COMPACTO ? 6 : 170
      const ARENA_Y = COMPACTO ? 6 : 50
      const COR_LADO = [getComputedStyle(document.documentElement).getPropertyValue("--esquerda").trim(), getComputedStyle(document.documentElement).getPropertyValue("--direita").trim()]
      const { CONTORNO, VENENO } = DueloArte

      function ouvir(eventos, agora) {
        for (const e of eventos) {
          if (e.tipo === "golpe" || e.tipo === "critico" || e.tipo === "flecha" || e.tipo === "veneno" || e.tipo === "corte") {
            // Numbers close together merge, so a dagger's flurry or a katana's slices are one number going up.
            const junto = efeitos.find((f) => f.tipo === "numero" && f.alvo === e.alvo && agora - f.desde < 350 && e.tipo !== "critico" && !f.critico && (f.veneno === (e.tipo === "veneno")))
            if (junto) {
              junto.valor += e.dano
              junto.ate = agora + 900
            } else efeitos.push({ tipo: "numero", alvo: e.alvo, valor: e.dano, x: e.x, y: e.y, desde: agora, ate: agora + 900, critico: e.tipo === "critico", veneno: e.tipo === "veneno" })
            if (e.tipo === "golpe" || e.tipo === "flecha") tremor = Math.max(tremor, 2.5)
            if (e.tipo === "critico") {
              tremor = Math.max(tremor, 7)
              efeitos.push({ tipo: "palavra", texto: "CRÍTICO!", x: e.x, y: e.y - 26, desde: agora, ate: agora + 1100, cor: "#ffd23f" })
            }
            if (e.tipo === "corte" || (e.tipo === "golpe" && luta.bolas[e.de]?.classe === "katana")) {
              const ang = Math.random() * Math.PI
              efeitos.push({ tipo: "corte", alvo: e.alvo, ang, desde: agora, ate: agora + 220 })
            }
            if (e.tipo === "veneno") efeitos.push({ tipo: "nuvem", alvo: e.alvo, desde: agora, ate: agora + 500 })
          } else if (e.tipo === "atordoa") {
            efeitos.push({ tipo: "palavra", texto: "ATORDOADO!", x: luta.bolas[e.alvo].x, y: luta.bolas[e.alvo].y - 44, desde: agora, ate: agora + 1000, cor: "#ffe08a" })
          } else if (e.tipo === "aparada" || e.tipo === "bloqueio") {
            efeitos.push({ tipo: "faisca", x: e.x, y: e.y, desde: agora, ate: agora + 260, grande: e.tipo === "aparada" })
          } else if (e.tipo === "morte-subita") {
            efeitos.push({ tipo: "faixa", texto: "MORTE SÚBITA", desde: agora, ate: agora + 1800 })
          }
        }
      }

      // The weapons, drawn along +x from the body's edge, in the ball's turn.
      function desenharArma(bola, l, agora) {
        DueloArte.arma(ctx, bola, l.material, agora, Duelo.parada(luta, bola))
      }

      function desenharBola(bola, i, agora) {
        const l = lutadores[i]
        const a = l.aparencia
        const parada = Duelo.parada(luta, bola)
        // The trail, from Diamante up; the Punho always leaves one, longer the faster it goes.
        const v = Math.sqrt(bola.vx * bola.vx + bola.vy * bola.vy)
        const punho = bola.classe === "punho"
        if ((l.material.rastro || punho) && !parada) {
          const r = rastros[i]
          r.push([bola.x, bola.y])
          const max = punho ? Math.round(4 + v / 40) : 14
          while (r.length > max) r.shift()
          r.forEach(([x, y], k) => {
            ctx.globalAlpha = (k / r.length) * (punho ? 0.35 : 0.28)
            ctx.fillStyle = l.material.arco ? `hsl(${(agora / 8 + k * 20) % 360} 90% 70%)` : punho ? COR_LADO[i] : l.material.cor
            ctx.beginPath()
            ctx.arc(x, y, bola.r * (0.4 + (0.6 * k) / r.length), 0, Math.PI * 2)
            ctx.fill()
          })
          ctx.globalAlpha = 1
        }
        desenharArma(bola, l, agora)
        // Stunned, it shakes where it stands.
        const tx = parada ? (Math.random() - 0.5) * 3 : 0
        // The body: their fan's colours, ringed in their side's.
        ctx.save()
        ctx.translate(bola.x + tx, bola.y)
        // The Punho, near its top speed: a white ring, the faster the brighter.
        if (punho) {
          const k = Math.min(1, v / Math.max(1, bola.vmax))
          if (k > 0.5) {
            ctx.beginPath()
            ctx.arc(0, 0, bola.r + 4, 0, Math.PI * 2)
            ctx.strokeStyle = `rgb(255 255 255 / ${(k - 0.5) * 1.4})`
            ctx.lineWidth = 2.5
            ctx.stroke()
          }
        }
        ctx.beginPath()
        ctx.arc(0, 0, bola.r, 0, Math.PI * 2)
        ctx.fillStyle = a.cor
        ctx.fill()
        ctx.save()
        ctx.clip()
        DueloArte.padrao(ctx, bola.r, a)
        ctx.restore()
        // Poisoned: a purple tint, deeper with each stack.
        if (bola.envenenado) {
          ctx.globalAlpha = Math.min(0.5, 0.12 + bola.envenenado * 0.04)
          ctx.fillStyle = VENENO
          ctx.beginPath()
          ctx.arc(0, 0, bola.r, 0, Math.PI * 2)
          ctx.fill()
          ctx.globalAlpha = 1
        }
        if (parada) {
          ctx.globalAlpha = 0.35
          ctx.fillStyle = "#c8cbd6"
          ctx.beginPath()
          ctx.arc(0, 0, bola.r, 0, Math.PI * 2)
          ctx.fill()
          ctx.globalAlpha = 1
        }
        if (bola.flash > 0) {
          ctx.globalAlpha = Math.min(1, bola.flash / 0.12) * 0.85
          ctx.fillStyle = "#ffffff"
          ctx.beginPath()
          ctx.arc(0, 0, bola.r, 0, Math.PI * 2)
          ctx.fill()
          ctx.globalAlpha = 1
        }
        ctx.lineWidth = 3.5
        ctx.strokeStyle = COR_LADO[i]
        ctx.beginPath()
        ctx.arc(0, 0, bola.r - 1, 0, Math.PI * 2)
        ctx.stroke()
        // In the live's box, its life inside it, as the genre's videos show it.
        if (COMPACTO) {
          const vida = String(Math.max(0, Math.ceil(bola.hp)))
          ctx.font = `700 ${vida.length > 2 ? 14 : 17}px "Space Grotesk"`
          ctx.textAlign = "center"
          ctx.textBaseline = "middle"
          ctx.lineJoin = "round"
          ctx.lineWidth = 4
          ctx.strokeStyle = CONTORNO
          ctx.strokeText(vida, 0, 1)
          ctx.fillStyle = "#f4f5f7"
          ctx.fillText(vida, 0, 1)
          ctx.textBaseline = "alphabetic"
        }
        ctx.restore()
        // Poison: bubbles rising, one per stack (up to six).
        if (bola.envenenado) {
          for (let k = 0; k < Math.min(6, bola.envenenado); k++) {
            const fase = (agora / 900 + k / 6) % 1
            ctx.fillStyle = `rgb(183 123 255 / ${1 - fase})`
            ctx.beginPath()
            ctx.arc(bola.x + Math.sin(k * 2.4 + agora / 300) * 10, bola.y - bola.r - fase * 18, 2.2 + (k % 2), 0, Math.PI * 2)
            ctx.fill()
          }
        }
        // Stunned: stars going round its head.
        if (parada) {
          for (let k = 0; k < 3; k++) {
            const ang = agora / 180 + (k * Math.PI * 2) / 3
            estrela(bola.x + Math.cos(ang) * 16, bola.y - bola.r - 6 + Math.sin(ang) * 5, 5, "#ffe08a")
          }
        }
        // Sparks off the weapon, from Campeão up.
        if (l.material.faiscas && bola.c.arma && Math.random() < 0.35) {
          const w = Duelo.arma(bola)
          efeitos.push({ tipo: "brilho", x: w.x1, y: w.y1, vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40, desde: agora, ate: agora + 400, cor: l.material.arco ? `hsl(${Math.random() * 360} 90% 75%)` : l.material.luz })
        }
      }

      function estrela(x, y, r, cor) {
        ctx.beginPath()
        for (let k = 0; k < 10; k++) {
          const ang = -Math.PI / 2 + (k * Math.PI) / 5
          const rr = k % 2 ? r * 0.45 : r
          ctx.lineTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr)
        }
        ctx.closePath()
        ctx.fillStyle = cor
        ctx.fill()
        ctx.lineWidth = 1.2
        ctx.strokeStyle = CONTORNO
        ctx.stroke()
      }

      function desenhar(agora) {
        ctx.setTransform(1, 0, 0, 1, 0, 0)
        ctx.clearRect(0, 0, canvas.width, canvas.height)
        if (!luta) return
        const sx = tremor ? (Math.random() - 0.5) * tremor : 0
        const sy = tremor ? (Math.random() - 0.5) * tremor : 0
        tremor = Math.max(0, tremor - 0.6)
        ctx.setTransform(ESCALA * UNIDADE, 0, 0, ESCALA * UNIDADE, (ARENA_X + sx) * ESCALA, (ARENA_Y + sy) * ESCALA)
        // The arena: its floor and walls (closing in during sudden death).
        const p = luta.paredes
        ctx.fillStyle = "rgb(0 12 46 / 0.6)"
        ctx.fillRect(0, 0, Duelo.LADO, Duelo.LADO)
        if (p.x0 > 0) {
          ctx.fillStyle = "rgb(200 40 40 / 0.18)"
          ctx.fillRect(0, 0, Duelo.LADO, p.y0)
          ctx.fillRect(0, p.y1, Duelo.LADO, Duelo.LADO - p.y1)
          ctx.fillRect(0, p.y0, p.x0, p.y1 - p.y0)
          ctx.fillRect(p.x1, p.y0, Duelo.LADO - p.x1, p.y1 - p.y0)
        }
        ctx.lineWidth = 2.5
        ctx.strokeStyle = luta.t >= Duelo.MORTE_SUBITA ? "#ff6b6b" : "rgb(133 167 255 / 0.6)"
        ctx.strokeRect(p.x0 - 1.25, p.y0 - 1.25, p.x1 - p.x0 + 2.5, p.y1 - p.y0 + 2.5)
        // In the live's box nothing crosses the wall: the arrows, balls and weapons are cut at its outer edge.
        if (COMPACTO) {
          ctx.save()
          ctx.beginPath()
          ctx.rect(-2.5, -2.5, Duelo.LADO + 5, Duelo.LADO + 5)
          ctx.clip()
        }
        // Arrows.
        for (const f of luta.flechas) {
          const v = Math.sqrt(f.vx * f.vx + f.vy * f.vy)
          const dx = (f.vx / v) * 12, dy = (f.vy / v) * 12
          ctx.lineCap = "round"
          ctx.lineWidth = 5
          ctx.strokeStyle = CONTORNO
          ctx.beginPath()
          ctx.moveTo(f.x - dx, f.y - dy)
          ctx.lineTo(f.x, f.y)
          ctx.stroke()
          ctx.lineWidth = 2.5
          ctx.strokeStyle = COR_LADO[f.dono]
          ctx.stroke()
        }
        luta.bolas.forEach((bola, i) => desenharBola(bola, i, agora))
        if (COMPACTO) ctx.restore()
        // Numbers, sparks, words (in the live's box, words and numbers kept inside the arena).
        const dentro = (txt, x, y) => {
          if (!COMPACTO) return [x, y]
          const meia = ctx.measureText(txt).width / 2 + 3
          return [Math.min(Duelo.LADO - meia, Math.max(meia, x)), Math.max(24, y)]
        }
        for (let k = efeitos.length - 1; k >= 0; k--) {
          const e = efeitos[k]
          if (agora > e.ate) {
            efeitos.splice(k, 1)
            continue
          }
          const t = (agora - e.desde) / (e.ate - e.desde)
          if (e.tipo === "numero") {
            if (e.valor < 0.5) continue
            ctx.font = `700 ${e.critico ? 26 : 18}px "Space Grotesk"`
            ctx.textAlign = "center"
            ctx.lineWidth = 4
            ctx.strokeStyle = CONTORNO
            ctx.globalAlpha = 1 - Math.max(0, t - 0.6) / 0.4
            const y = e.y - 10 - t * 18
            const valor = e.valor >= 10 ? Math.round(e.valor) : Math.round(e.valor * 10) / 10
            const txt = String(valor).replace(".", ",")
            const [nx, ny] = dentro(txt, e.x, y)
            ctx.strokeText(txt, nx, ny)
            ctx.fillStyle = e.critico ? "#ffd23f" : e.veneno ? VENENO : "#f4f5f7"
            ctx.fillText(txt, nx, ny)
            ctx.globalAlpha = 1
          } else if (e.tipo === "palavra") {
            ctx.font = `700 22px "Space Grotesk"`
            ctx.textAlign = "center"
            ctx.lineWidth = 4
            ctx.strokeStyle = CONTORNO
            ctx.globalAlpha = 1 - Math.max(0, t - 0.7) / 0.3
            const [px, py] = dentro(e.texto, e.x, e.y - t * 10)
            ctx.strokeText(e.texto, px, py)
            ctx.fillStyle = e.cor
            ctx.fillText(e.texto, px, py)
            ctx.globalAlpha = 1
          } else if (e.tipo === "corte") {
            // A katana's slice: a white line across the ball, gone in a blink.
            const b = luta.bolas[e.alvo]
            const c = Math.cos(e.ang) * (b.r + 8), s = Math.sin(e.ang) * (b.r + 8)
            ctx.globalAlpha = 1 - t
            ctx.lineCap = "round"
            ctx.lineWidth = 3
            ctx.strokeStyle = "#ffffff"
            ctx.beginPath()
            ctx.moveTo(b.x - c, b.y - s)
            ctx.lineTo(b.x + c, b.y + s)
            ctx.stroke()
            ctx.globalAlpha = 1
          } else if (e.tipo === "nuvem") {
            const b = luta.bolas[e.alvo]
            ctx.globalAlpha = (1 - t) * 0.5
            ctx.fillStyle = VENENO
            ctx.beginPath()
            ctx.arc(b.x, b.y, b.r + 4 + t * 14, 0, Math.PI * 2)
            ctx.fill()
            ctx.globalAlpha = 1
          } else if (e.tipo === "faisca") {
            ctx.strokeStyle = `rgb(255 255 255 / ${1 - t})`
            ctx.lineWidth = 2.5
            const n = e.grande ? 8 : 5
            const raio = (e.grande ? 6 : 3) + t * (e.grande ? 18 : 9)
            for (let j = 0; j < n; j++) {
              const ang = (j / n) * Math.PI * 2
              ctx.beginPath()
              ctx.moveTo(e.x + Math.cos(ang) * raio * 0.4, e.y + Math.sin(ang) * raio * 0.4)
              ctx.lineTo(e.x + Math.cos(ang) * raio, e.y + Math.sin(ang) * raio)
              ctx.stroke()
            }
          } else if (e.tipo === "brilho") {
            ctx.fillStyle = e.cor
            ctx.globalAlpha = 1 - t
            ctx.fillRect(e.x + e.vx * t - 1.5, e.y + e.vy * t - 1.5, 3, 3)
            ctx.globalAlpha = 1
          } else if (e.tipo === "faixa") {
            ctx.globalAlpha = t < 0.15 ? t / 0.15 : t > 0.8 ? (1 - t) / 0.2 : 1
            ctx.fillStyle = "rgb(200 40 40 / 0.85)"
            ctx.fillRect(0, Duelo.LADO / 2 - 22, Duelo.LADO, 44)
            ctx.font = `700 28px "Space Grotesk"`
            ctx.textAlign = "center"
            ctx.fillStyle = "#f4f5f7"
            ctx.fillText(e.texto, Duelo.LADO / 2, Duelo.LADO / 2 + 10)
            ctx.globalAlpha = 1
          }
        }
      }

      // --- The clock: fixed steps of the engine, drawn every frame -----------------------------------------------
      let antes = performance.now()
      let sobra = 0
      function quadro(agora) {
        const dt = Math.min(0.1, (agora - antes) / 1000)
        antes = agora
        if (!pausado()) {
          if (fase === "luta") {
            sobra += dt
            while (sobra >= Duelo.DT && !luta.fim) {
              Duelo.passo(luta)
              ouvir(luta.eventos, agora)
              sobra -= Duelo.DT
            }
            atualizarPlacar()
            if (luta.fim) {
              fase = "resultado"
              faseAte = agora + RESULTADO_MS
              setTimeout(() => mostrarResultado(luta.fim), 700)
              registrar()
            }
          } else if (fase === "apresenta" && agora >= faseAte) {
            cartao.classList.remove("visivel")
            fase = "luta"
            sobra = 0
          } else if (fase === "resultado" && agora >= faseAte && VEZ) {
            // One duel a turn: the box goes and the race comes.
            cartao.classList.remove("visivel")
            caixa.classList.add("escondida")
            fase = "espera"
            faseAte = 0
            minhaVez = false
            avisar("fim")
          } else if (fase === "resultado" && agora >= faseAte) {
            cartao.classList.remove("visivel")
            fase = "pausa"
            faseAte = agora + PAUSA_MS
          } else if ((fase === "pausa" || fase === "vazio" || fase === "espera") && agora >= faseAte) proximo()
          else if (fase === "inicio") proximo()
        } else faseAte += dt * 1000
        desenhar(agora)
        requestAnimationFrame(quadro)
      }
      fase = "inicio"
      requestAnimationFrame(quadro)

      // --- The record: each fight shown while the stream is on, to the Σ API ------------------------------------
      // The API plays it again from its seed to know who won; a sample or the site's player records nothing.
      function registrar() {
        if (DEMO || TREINO || !CHAVE || !SIGMA_API || Date.now() > noArAte) return
        const corpo = {
          versao: Duelo.VERSAO,
          semente: luta.semente,
          classes: lutadores.map((l) => l.classe),
          sorteadas: lutadores.map((l) => l.sorteada),
          logins: lutadores.map((l) => l.login),
          nomes: lutadores.map((l) => l.nome),
          materiais: lutadores.map((l) => l.materialId),
        }
        fetch(`${SIGMA_API}/duelo`, { method: "POST", headers: { "content-type": "application/json", "x-chave": CHAVE }, body: JSON.stringify(corpo) }).catch(() => {
          // The API down: this fight isn't counted.
        })
      }
      // The Partidas dock says every few seconds whether the stream is on, as it does for the stand's Σ.
      addEventListener("muanlartins-torcida", ({ detail }) => {
        if (detail?.tipo === "noar") noArAte = detail.ligado ? Date.now() + 15000 : 0
      })

      // --- The VAR comes first, and off the air nothing runs ------------------------------------------------------
      addEventListener("muanlartins-var", ({ detail }) => {
        const v = varDe(detail)
        if (!v) return
        varAberto = v.fase !== "fechado"
        caixa.classList.toggle("escondida", varAberto || fase === "vazio" || fase === "espera")
      })
      addEventListener("obsSourceActiveChanged", ({ detail }) => (noAr = !!detail?.active))
      if (VEZ) {
        addEventListener("message", ({ data, origin, source }) => {
          if (origin !== location.origin || source !== parent) return
          if (data?.minijogo === "vez") {
            minhaVez = true
            if (fase === "espera") faseAte = 0
          }
          if (data?.minijogo === "pausa") minhaVez = false
        })
        avisar("pronto")
      }

      // --- The chat, or the demo's ------------------------------------------------------------------------------
      if (TREINO || (params.has("site") && !DEMO)) {
        // The site's player: no chat, and no VAR. Given the same login twice it shows nothing, never the live's chat.
      } else if (!DEMO) irc(apply, { membership: true })
      else {
        // Invented people.
        const nomes = ["Bia", "torcedor_da_madrugada_10", "Duda", "Tobias", "Nina", "Raul", "Malu", "capivara_cansada", "Teca", "Breno"]
        const um_ = (lista) => lista[Math.floor(Math.random() * lista.length)]
        const quantos = params.get("demo") === "1v1" ? 1 : nomes.length
        nomes.slice(0, quantos).forEach((n, i) => {
          const login = n.toLowerCase()
          presentes.set(login, n)
          // A third made their 3D fan, a third kept their 2D one; Σ from a newcomer to a regular of a year, so every
          // material shows up.
          if (i % 3 === 0) escolhas.set(login, { t3: { ...(i % 6 === 0 ? MODELOS[i % MODELOS.length][1] : dado(7919 * i + 13)), fes: um_(["pula", "danca", "gira", "acena", "palmas", "bananeira"]) } })
          else if (i % 3 === 1)
            escolhas.set(login, { cor: um_(["#85a7ff", "#3ddc97", "#ffd23f", "#ff6b57", "#c792ea"]), detalhe: um_(["#f4f5f7", "#2b2f38", "#4dd4ff"]), roupa: um_(["listra", "faixa", "meio", "numero", "gola", "listras", "listrado", "tricolor"]),
              cabeca: um_(["losango", "redonda", "quadrada", "hexagono", "triangulo"]), comemoracao: um_(["pula", "danca", "gira", "acena", "bananeira"]) })
          sigmas.set(login, [0, 40, 150, 420, 1000, 2200, 4800, 10000, 16000, 21000][i])
        })
        presentes.set(CHANNEL, CHANNEL)
        let varTeste = false
        const keys = {
          v: () => dispatchEvent(new CustomEvent("muanlartins-var", { detail: { fase: (varTeste = !varTeste) ? "votacao" : "fechado", layout: "mini" } })),
          n: () => luta && !luta.fim && (luta.bolas[1].hp = 0),
          s: () => presentes.delete(um_([...presentes.keys()].filter((l) => l !== CHANNEL))),
          j: () => presentes.set(`pessoa${presentes.size}`, `pessoa${presentes.size}`),
        }
        addEventListener("keydown", (e) => keys[e.key]?.())
      }
    </script>
  </body>
