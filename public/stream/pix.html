<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Pix · muanlartins</title>
    <link rel="stylesheet" href="stream.css" />
    <!--
      OBS: Browser source, 1920×1080, over everything in the game scenes, its
      sound on the stream's track only (like the crowd's narrator). The Pix
      sent on the site's /pix: a Klein band under the scoreboard with the name,
      the amount and the message, a chime, and the message read by the voice
      the viewer chose (or their recording, in that voice). And the goal, if
      the dock set one: a small bar at the top left. Above it, always, the
      call: a QR code to the site's /pix (public/stream/pix-qr.svg, drawn by
      scripts/pix-qr.mjs, chamada() in stream.js) so whoever watches knows they
      can send one;
      ?chamada=0 leaves it out. In Valorant's scenes (by the scene's name, as
      the source is the same in every scene) the call and the goal go down to
      y 380, under the camera's plate; ?canto=baixo forces it, to place it.
      In "Celeste + chat · Diversos" they go into that scene's left column
      (celeste.html) and the band is centred on its game (?canto=coluna).

      It reads the Pix API (infra/pix) every 2 s with the stream's key, the Σ
      key: #chave=<key> (?api= only to point it elsewhere). The voices come from
      scripts/narrador.py on this PC (?narrador= its address); each open
      reservation is rendered while the viewer pays, so the alert never waits.
      Without the narrator, the band still shows, silent but for the chime.

      A song (from R$ 5, made by the Pix API with Google's Lyria) waits in the
      queue until it's ready, letting the others by; then the band announces
      it ("Fulano mandou 5 reais e uma música!"), shrinks, and the song plays
      under it, at most 60 s, faded out at the end, a little quieter than it
      comes (about −16 LUFS, like the effects). Under the shrunk band, its
      lyrics in time, Spotify-style: the line being sung and the next one,
      fainter (a ♪ between lines), from the API's `tempos` (when each line of
      `letraCantada` is sung, by Gemini); a song without them shows no lyrics.
      All of it stays inside the band's crop in Conversa and Terapia
      (PIX_BAND in brand/twitch/obs.py: x 410–1510, y 110–420). The dock's
      "Pular música" fades it out (or, before it starts, leaves only the
      announcement). A song that couldn't be made plays as a plain alert,
      name and amount.

      "Entre partidas" holds a Pix until the match ends, as the Partidas dock
      says (partidas.html, through obs-browser's emit_event); an alert never
      plays twice, and the dock can ask for one again.

      A Christmas goal (tema "natal", from the dock): the goal's box gets its
      tree (presente.js), its lights lit as far as the goal has come and its
      star once it's reached, with a present from each of its Pix; a Pix's
      present shows in the band where the mark is, and drops onto the tree when
      the band goes. Under the amount, how far the next gift sub is; the call
      says it's Christmas. A sub drawn by the dock ("Sortear sub") plays in the
      band like a Pix, in the queue: the names of who was in the stand spin and
      stop on the winner, the voice says it, and the crowd's stand (torcida.html)
      hears it through this site's storage (natal:sorteio).

      ?demo: a made-up Pix every 12 s, without the API, to place the source;
      ?demo=letra: the lyrics alone, frozen on a line, to place them;
      ?demo=natal: a Christmas goal with its tree, a present every 12 s and a sub drawn every third.
    -->
    <style>
      .alerta {
        position: absolute;
        top: 132px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        visibility: hidden;
      }
      .alerta.tocando {
        visibility: visible;
        animation:
          wipe 0.9s var(--ease) both,
          sair var(--dura, 8s) linear forwards;
      }
      .faixa {
        position: relative;
        display: flex;
        align-items: center;
        gap: 28px;
        min-height: 150px;
        max-width: 1280px;
        padding: 24px 72px 24px 36px;
        background: var(--klein);
        clip-path: polygon(44px 0, 100% 0, 100% calc(100% - 44px), calc(100% - 44px) 100%, 0 100%, 0 44px);
        overflow: hidden;
      }
      .faixa::before {
        content: "";
        position: absolute;
        inset: -48px;
        background:
          repeating-linear-gradient(45deg, transparent 0 calc(var(--unit) * 0.7071 - 1px), var(--lattice-line) 0 calc(var(--unit) * 0.7071)),
          repeating-linear-gradient(-45deg, transparent 0 calc(var(--unit) * 0.7071 - 1px), var(--lattice-line) 0 calc(var(--unit) * 0.7071));
        animation: drift 12s linear infinite;
      }
      .faixa::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(45deg, transparent 42%, rgb(133 167 255 / 0.45) 50%, transparent 58%);
        transform: translateX(-100%);
      }
      .tocando .faixa::after {
        animation: brilho 1.4s var(--ease) 0.7s both;
      }
      .marca {
        position: relative;
        width: 92px;
        height: 92px;
        flex: none;
      }
      .texto {
        position: relative;
        min-width: 0;
      }
      .rotulo {
        margin: 0;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--klein-claro);
      }
      .nome {
        max-width: 1000px;
        margin: 6px 0 0;
        overflow: hidden;
        font-size: 58px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.03em;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .mensagem {
        max-width: 1000px;
        /* Four lines at most (a typed message's 200 characters fit); a longer one, a minute's recording, scrolls
           through them while it's spoken (rolar). */
        max-height: calc(30px * 1.25 * 4);
        margin: 12px 0 0;
        overflow: hidden;
        font-size: 30px;
        line-height: 1.25;
      }
      .mensagem.rolando {
        mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
      }
      .mensagem:empty {
        display: none;
      }
      /* A song: once announced, the band shrinks up out of the way while it plays. */
      .faixa {
        transform-origin: top center;
        transition: transform 0.7s var(--ease);
      }
      .alerta.mini .faixa {
        transform: scale(0.55);
      }
      @keyframes wipe {
        from {
          clip-path: polygon(0 0, 0 0, -200px 100%, -200px 100%);
        }
        to {
          clip-path: polygon(0 0, calc(100% + 200px) 0, 100% 100%, -200px 100%);
        }
      }
      @keyframes sair {
        0%,
        94% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes brilho {
        to {
          transform: translateX(100%);
        }
      }

      /* A song's lyrics in time, under the shrunk band (--topo, set when it starts): the line being sung, the next one
         fainter. 1060 px at most, so it stays inside the band's crop in Conversa and Terapia (x 410–1510, y ≤ 420). */
      .letra {
        position: absolute;
        top: var(--topo, 250px);
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.5s var(--ease);
      }
      .letra.ativa {
        opacity: 1;
      }
      .letra .placa {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        max-width: 1060px;
        padding: 12px 34px 14px;
        background: rgb(0 20 71 / 0.82);
        clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
        text-align: center;
      }
      .letra p {
        margin: 0;
      }
      .letra .agora {
        font-size: 40px;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      .letra .agora.troca {
        animation: subir 0.35s var(--ease) both;
      }
      .letra .depois {
        font-size: 24px;
        font-weight: 500;
        line-height: 1.2;
        color: var(--klein-claro);
      }
      .letra .depois:empty {
        display: none;
      }
      @keyframes subir {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
      }

      /* Top left, clear of the scoreboard (top centre): the call, and the goal under it. */
      .canto {
        position: absolute;
        top: 28px;
        left: 28px;
        width: 380px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      /* Valorant's scenes have the camera at the top left, over the minimap: the corner goes under its plate. */
      .canto.baixo {
        top: 380px;
      }
      /* Celeste's scene (celeste.html): the corner inside its 320 px column, the band over the game beside it. */
      .coluna .canto {
        top: 16px;
        left: 16px;
        width: 288px;
        gap: 8px;
      }
      .coluna .chamada {
        --qr: 84px;
        gap: 10px;
        padding: 8px 10px 8px 8px;
      }
      .coluna .chamada .convite {
        font-size: 19px;
      }
      .coluna .chamada .pix,
      .coluna .chamada .site {
        font-size: 14.5px;
        letter-spacing: 0;
      }
      .coluna .meta .arvore {
        width: 88px;
      }
      .coluna .alerta,
      .coluna .letra {
        left: 320px;
      }
      .meta {
        padding: 14px 18px 16px;
        background: rgb(0 20 71 / 0.82);
        clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
      }
      .meta p {
        margin: 0;
      }
      /* The title gets its own line (two at most), so a long one isn't cut; the amount goes under the bar. */
      .meta .titulo {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: 19px;
        font-weight: 500;
        line-height: 1.25;
      }
      .meta .quanto {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 8px;
        color: var(--klein-claro);
        font-size: 17px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      /* Until when, under the amount: the goal's last day and the days left (Brasília's). */
      .meta .prazo {
        margin-top: 4px;
        color: rgb(244 245 247 / 0.7);
        font-size: 15px;
        font-variant-numeric: tabular-nums;
      }
      .barra {
        height: 10px;
        margin-top: 10px;
        background: rgb(133 167 255 / 0.25);
      }
      .barra div {
        height: 100%;
        width: 0;
        background: var(--paper);
        transition: width 1.2s var(--ease);
      }
      /* A Christmas goal: its tree beside the numbers (presente.js), every Pix's present on it. */
      .meta.natal {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px 12px 8px;
      }
      .meta.natal[hidden] {
        display: none;
      }
      .meta .arvore {
        width: 136px;
        flex: none;
      }
      .meta .arvore svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .meta .info {
        flex: 1;
        min-width: 0;
      }
      .meta.natal .quanto {
        flex-wrap: wrap;
        gap: 0 10px;
        font-size: 16px;
      }
      .meta .sub {
        margin-top: 8px;
        color: #ffd23f;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.25;
        font-variant-numeric: tabular-nums;
      }
      /* A Christmas Pix's present in the band, where the mark is for the others. */
      .presente {
        position: relative;
        width: 108px;
        height: 108px;
        flex: none;
      }
      .presente svg {
        width: 100%;
        height: 100%;
      }
      .aviso {
        position: absolute;
        right: 16px;
        bottom: 12px;
        margin: 0;
        padding: 8px 14px;
        background: var(--paper);
        color: var(--klein);
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="canto">
        <div id="chamada"></div>
        <div class="meta" hidden>
          <div class="arvore" hidden></div>
          <div class="info">
            <p class="titulo"></p>
            <div class="barra"><div></div></div>
            <p class="quanto"><span class="valor"></span><span class="pct"></span></p>
            <p class="prazo" hidden></p>
            <p class="sub" hidden></p>
          </div>
        </div>
      </div>
      <div class="alerta">
        <div class="faixa">
          <img class="marca" src="/brand/mark-small-clear.svg" alt="" />
          <div class="presente" hidden></div>
          <div class="texto">
            <p class="rotulo"></p>
            <p class="nome"></p>
            <p class="mensagem"></p>
          </div>
        </div>
      </div>
      <div class="letra" aria-hidden="true">
        <div class="placa">
          <p class="agora"></p>
          <p class="depois"></p>
        </div>
      </div>
      <p class="aviso" hidden></p>
    </main>
    <script src="stream.js"></script>
    <script src="presente.js"></script>
    <script>
      // The stack's PixApiUrl; ?api= points it elsewhere (a local stand-in).
      const API = params.get("api") ?? "https://g2x6kdnhr0.execute-api.us-east-1.amazonaws.com"
      const CHAVE = new URLSearchParams(location.hash.slice(1)).get("chave")
      const NARRADOR = params.get("narrador") ?? "http://127.0.0.1:8788"
      const DEMO = params.has("demo")
      const $ = (s) => document.querySelector(s)
      if (params.get("chamada") !== "0") chamada($("#chamada"))
      // In Conversa this source is cropped to its band, over the camera's lower third, and conversa.html has its own
      // call: there the corner (the call and the goal) would show its edge on the camera, so it hides. In Valorant's
      // scenes the camera is where the corner was (top left, over the minimap), so the corner goes under it.
      const canto = document.querySelector(".canto")
      const VALORANT = ["Valorant + chat", "Lance ruim · Valorant"]
      const CELESTE = "Celeste + chat · Diversos"
      const cena = (nome) => {
        $(".stage").classList.toggle("coluna", nome === CELESTE || params.get("canto") === "coluna")
        canto.style.visibility = nome === "Conversa" ? "hidden" : ""
        canto.classList.toggle("baixo", VALORANT.includes(nome) || params.get("canto") === "baixo")
      }
      cena()
      window.obsstudio?.getCurrentScene?.((scene) => cena(scene?.name))
      addEventListener("obsSceneChanged", (event) => cena(event.detail?.name))

      const reais = (c) => (c / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
      // How the voice says an amount: "5 reais e 50 centavos".
      function falado(c) {
        const r = Math.floor(c / 100)
        const ct = c % 100
        return [r && `${r} ${r === 1 ? "real" : "reais"}`, ct && `${ct} ${ct === 1 ? "centavo" : "centavos"}`].filter(Boolean).join(" e ")
      }
      // The masked words aren't read out.
      const legivel = (t) => t.replace(/•••/g, " ").replace(/\s+/g, " ").trim()
      // A song: at most 60 s on the live, faded out over the last 3, at 0.6 (Lyria's ~−12 LUFS to ~−16).
      const MUSICA_MAX = 60
      const MUSICA_FADE = 3
      const MUSICA_GANHO = 0.6
      const ESTILOS = { funk: "Funk", sertanejo: "Sertanejo", pagode: "Pagode", forro: "Forró", rock: "Rock", rap: "Rap", eletronica: "Eletrônica", pop: "Pop" }
      // Ready to play: a plain Pix, a song made, or one that couldn't be (it plays as a plain alert).
      const pronto = (p) => !p.musica || p.musica.estado === "pronta" || p.musica.estado === "falhou"

      // Chrome only plays after a click (OBS needs none): the page says so while it's muted.
      const som = new AudioContext()
      const aviso = $(".aviso")
      function avisar() {
        const falta = som.state !== "running" ? "Som desligado: clique na página" : !CHAVE && !DEMO ? "Falta #chave= na URL" : !API && !DEMO ? "Falta ?api= na URL" : ""
        aviso.textContent = falta
        aviso.hidden = !falta
      }
      som.onstatechange = avisar
      addEventListener("click", () => som.resume())
      avisar()

      function chime() {
        ;[784, 1175].forEach((f, i) => {
          const o = som.createOscillator()
          const g = som.createGain()
          const t = som.currentTime + i * 0.14
          o.frequency.value = f
          g.gain.setValueAtTime(0.0001, t)
          g.gain.exponentialRampToValueAtTime(0.22, t + 0.02)
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5)
          o.connect(g).connect(som.destination)
          o.start(t)
          o.stop(t + 0.5)
        })
      }
      function tocar(buffer) {
        return new Promise((fim) => {
          if (!buffer) return fim()
          const fonte = som.createBufferSource()
          fonte.buffer = buffer
          fonte.connect(som.destination)
          fonte.onended = fim
          fonte.start()
        })
      }
      const decodificar = (dados) => som.decodeAudioData(dados).catch(() => null)
      // --- A song's lyrics in time -----------------------------------------------------------------------
      // `tempos` is one [start, end] (seconds) or null per non-blank line of `letraCantada`. A line shows a little
      // before it's sung, stays until the next starts (a ♪ when the gap after it is long), with the next one under it.
      const ADIANTA = 0.15
      const PAUSA = 1.5
      const letra = $(".letra")
      function mostrarLinha(agora, depois, troca) {
        const el = letra.querySelector(".agora")
        el.textContent = agora
        letra.querySelector(".depois").textContent = depois
        if (troca) {
          el.classList.remove("troca")
          void el.offsetWidth
          el.classList.add("troca")
        }
      }
      function acompanhar(m, t0, dura) {
        const linhas = String(m?.letraCantada ?? "").split("\n").map((l) => l.trim()).filter(Boolean)
        if (!Array.isArray(m?.tempos) || m.tempos.length !== linhas.length) return () => {}
        const postas = linhas.flatMap((texto, i) => (Array.isArray(m.tempos[i]) ? [{ texto, de: m.tempos[i][0], ate: m.tempos[i][1] }] : []))
        if (!postas.length) return () => {}
        // Under the band once it has shrunk (scale 0.55 from its top, at 132), as wide as the song's longest line, so
        // the plate doesn't change size with each line.
        letra.style.setProperty("--topo", `${Math.round(132 + $(".faixa").offsetHeight * 0.55 + 14)}px`)
        const placa = letra.querySelector(".placa")
        placa.style.width = ""
        let largura = 0
        for (const l of postas) {
          mostrarLinha(l.texto, "")
          largura = Math.max(largura, placa.offsetWidth)
        }
        placa.style.width = `${Math.min(1060, largura)}px`
        let mostrada = ""
        let quadro = 0
        const passo = () => {
          const s = som.currentTime - t0 + ADIANTA
          let k = -1
          while (k + 1 < postas.length && postas[k + 1].de <= s) k++
          const cantando = k >= 0 && s <= postas[k].ate + PAUSA
          const fim = s >= dura || (k === postas.length - 1 && !cantando)
          const chave = fim ? "fim" : `${k}:${cantando}`
          if (chave !== mostrada) {
            if (!fim) mostrarLinha(cantando ? postas[k].texto : "♪", postas[k + 1]?.texto ?? "", true)
            letra.classList.toggle("ativa", !fim)
            mostrada = chave
          }
          quadro = requestAnimationFrame(passo)
        }
        passo()
        return () => {
          cancelAnimationFrame(quadro)
          letra.classList.remove("ativa")
        }
      }

      let pararMusica = null // fades the song playing out, for the dock's "Pular música"
      function tocarMusica(buffer, m) {
        return new Promise((fim) => {
          const fonte = som.createBufferSource()
          const ganho = som.createGain()
          fonte.buffer = buffer
          fonte.connect(ganho).connect(som.destination)
          const t0 = som.currentTime
          const dura = Math.min(buffer.duration, MUSICA_MAX)
          ganho.gain.setValueAtTime(MUSICA_GANHO, t0)
          ganho.gain.setValueAtTime(MUSICA_GANHO, t0 + Math.max(0, dura - MUSICA_FADE))
          ganho.gain.linearRampToValueAtTime(0.0001, t0 + dura)
          let largar = () => {}
          fonte.onended = () => {
            pararMusica = null
            largar()
            fim()
          }
          pararMusica = () => {
            const t = som.currentTime
            ganho.gain.cancelScheduledValues(t)
            ganho.gain.setValueAtTime(ganho.gain.value, t)
            ganho.gain.linearRampToValueAtTime(0.0001, t + 1)
            fonte.stop(t + 1)
          }
          fonte.start(t0)
          fonte.stop(t0 + dura)
          largar = acompanhar(m, t0, dura)
        })
      }

      // --- The voices, rendered ahead: one entry per reservation (or per Pix without one) ---------------
      const prontas = new Map() // id → Promise<{ fala: AudioBuffer[], texto }>
      async function falar(texto, voz) {
        if (NARRADOR === "0" || !texto) return null
        const r = await fetch(`${NARRADOR}/falar`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ texto, voz }) }).catch(() => null)
        return r?.ok ? decodificar(await r.arrayBuffer()) : null
      }
      const pedir = (caminho, corpo) =>
        fetch(API + caminho, {
          method: corpo ? "POST" : "GET",
          headers: { "x-chave": CHAVE, ...(corpo ? { "content-type": "application/json" } : {}) },
          body: corpo && JSON.stringify(corpo),
        }).then((r) => (r.ok ? r.json() : null))

      // r: a reservation or a Pix ({ id or reserva, nome, centavos, mensagem, audio, voz, transcricao, sujo }).
      async function render(r, pix) {
        const nome = r.nome || "Anônimo"
        const abertura = `${nome} mandou ${falado(r.centavos)}.`
        const voz = r.voz && r.voz !== "propria" ? r.voz : "antonio"
        const id = r.id ?? r.reserva
        // A song: the announcement, and the song itself from the site; one that couldn't be made, the amount alone.
        if (r.musica) {
          if (r.musica.estado !== "pronta" || !r.musica.url) return { fala: [await falar(abertura, voz)], texto: "" }
          const [fala, musica] = await Promise.all([
            falar(`${nome} mandou ${falado(r.centavos)} e uma música!`, voz),
            fetch(r.musica.url)
              .then((x) => (x.ok ? x.arrayBuffer() : null))
              .then((b) => b && decodificar(b))
              .catch(() => null),
          ])
          return { fala: [fala], texto: `♪ ${ESTILOS[r.musica.estilo] ?? "Música"}${r.musica.sobre ? ` · ${r.musica.sobre}` : ""}`, musica }
        }
        if (!r.audio) return { fala: [await falar(legivel(`${abertura} ${r.mensagem || ""}`), voz)], texto: r.mensagem || "" }
        // A recording: whisper's transcript goes on screen (and to the mural, filtered by the API); the
        // recording plays in the voice, unless the filter caught something, then the voice reads the rest.
        let texto = r.transcricao ?? ""
        let sujo = !!r.sujo
        let gravacao = null
        const audio = await pedir(`/audio?id=${encodeURIComponent(id)}`).catch(() => null)
        if (audio && NARRADOR !== "0") {
          const g = await fetch(`${NARRADOR}/gravacao`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, dados: audio.dados, voz: r.voz }) })
            .then((x) => (x.ok ? x.json() : null))
            .catch(() => null)
          if (g) {
            const filtrado = await pedir("/canal", { acao: "transcricao", reserva: id, pix, texto: g.texto }).catch(() => null)
            texto = filtrado?.texto ?? texto
            sujo = filtrado ? filtrado.sujo : sujo
            gravacao = await decodificar(Uint8Array.from(atob(g.audio), (c) => c.charCodeAt(0)).buffer)
          }
        }
        const fala = sujo || !gravacao ? [await falar(legivel(`${abertura} ${texto}`), voz)] : [await falar(abertura, voz), gravacao]
        return { fala, texto }
      }
      function preparar(r, pix) {
        // A song made again is a new file, so it's rendered again.
        const id = `${r.id ?? r.reserva ?? r.sk}${r.musica ? `:${r.musica.arquivo ?? r.musica.estado}` : ""}`
        if (!prontas.has(id)) prontas.set(id, render(r, pix).catch(() => ({ fala: [], texto: r.mensagem || "" })))
        return prontas.get(id)
      }

      // --- The queue -------------------------------------------------------------------------------------
      const fila = [] // Pix waiting, in the order they were paid
      const vistos = new Map() // sk → when it was queued or played, so it plays once until the dock asks again
      // The Pix on screen now: the API has it as not shown until it ends, and a long one (a held Pix, or a voice
      // of 40 s) outlasts its 30 s in vistos, so without this it went back in the queue and played twice (11-10).
      let atual = null
      let tocando = false
      let emPartida = false
      let partidaVista = 0
      addEventListener("muanlartins-partidas", ({ detail }) => {
        emPartida = !!detail?.emPartida
        partidaVista = Date.now()
        proximo()
      })
      // Without word from the dock for a while, no match is holding anyone.
      const segurando = () => emPartida && Date.now() - partidaVista < 20000

      async function proximo() {
        if (tocando) return
        const i = fila.findIndex((p) => pronto(p) && (p.quando !== "entre" || !segurando()))
        if (i < 0) return
        const [pix] = fila.splice(i, 1)
        tocando = true
        atual = pix.sk
        try {
          if (pix.sorteio) {
            await mostrarSorteio(pix.sorteio)
            vistos.set(pix.sk, Date.now())
            return
          }
          // A Pix of the Christmas goal shows its present in the band, and hangs it on the tree when the band goes.
          const em = pix.sk.slice(0, 24)
          const comPresente = !!natalDesde && pix.sk >= natalDesde
          mostrarPresente(comPresente && pix.presente, comPresente ? em : null)
          // Rendered while its reservation waited, as a rule; a minute's recording rendered only now takes ~20 s.
          const pronta = await Promise.race([preparar(pix, pix.sk), new Promise((r) => setTimeout(() => r(null), pix.audio ? 30000 : 15000))])
          const texto = pronta?.texto ?? pix.mensagem ?? ""
          // A recording transcribed while its reservation waited: the paid Pix keeps the words for the mural.
          if (pix.audio && !pix.transcricao && texto && !DEMO) pedir("/canal", { acao: "transcricao", pix: pix.sk, texto }).catch(() => {})
          $(".rotulo").textContent = `${pix.musica?.estado === "pronta" && !pix.pular ? "Música" : "Pix"} · R$ ${reais(pix.centavos)}`
          $(".nome").textContent = pix.nome || "Anônimo"
          $(".mensagem").textContent = texto
          $(".mensagem").scrollTop = 0
          $(".mensagem").classList.remove("rolando")
          const falas = (pronta?.fala ?? []).filter(Boolean)
          const musica = pix.pular ? null : pronta?.musica
          const falando = falas.reduce((t, b) => t + b.duration, 0)
          const segundos = musica
            ? 1.2 + falando + Math.min(musica.duration, MUSICA_MAX) + 1
            : Math.max(7, Math.min(75, 1.2 + falando + 1.5), Math.min(20, 6 + texto.length * 0.05))
          const alerta = $(".alerta")
          alerta.style.setProperty("--dura", `${segundos}s`)
          alerta.classList.remove("tocando")
          void alerta.offsetWidth
          alerta.classList.add("tocando")
          chime()
          await new Promise((r) => setTimeout(r, 1200))
          for (const [i, b] of falas.entries()) {
            if (i === falas.length - 1 && !musica) rolar($(".mensagem"), b.duration)
            await tocar(b)
          }
          if (musica) {
            alerta.classList.add("mini")
            await tocarMusica(musica, pix.musica)
          } else await new Promise((r) => setTimeout(r, Math.max(0, segundos * 1000 - 1200 - falando * 1000)))
          alerta.classList.remove("tocando", "mini")
          $(".mensagem").classList.remove("rolando")
          if (comPresente) soltar(em)
          vistos.set(pix.sk, Date.now())
          if (!DEMO) await pedir("/canal", { acao: "exibido", pix: pix.sk, reserva: pix.reserva }).catch(() => {})
        } finally {
          tocando = false
          atual = null
          setTimeout(proximo, 800)
        }
      }

      // A text taller than its four lines (a minute's recording) scrolls through them, evenly, while it's spoken.
      function rolar(el, segundos) {
        el.scrollTop = 0
        const sobra = el.scrollHeight - el.clientHeight
        if (sobra <= 0 || !segundos) return
        el.classList.add("rolando")
        const inicio = performance.now()
        const passo = (agora) => {
          const f = Math.min(1, (agora - inicio) / (segundos * 1000))
          el.scrollTop = sobra * f
          if (f < 1) requestAnimationFrame(passo)
        }
        requestAnimationFrame(passo)
      }

      // --- Christmas (a goal with tema "natal") ---------------------------------------------------------------
      let natalDesde = null // the Christmas goal's start while one is on screen: its Pix carry a present
      let arvoreItens = [] // its Pix, { em, presente, centavos }, oldest first
      let arvoreProgresso = 0
      let arvoreDesenhada = ""
      const escondidos = new Set() // the moments of its Pix whose band hasn't played: their present waits for it
      function desenharArvore(novo = null) {
        const lista = arvoreItens.filter((p) => !escondidos.has(p.em)).map((p) => ({ id: p.em, presente: p.presente, centavos: p.centavos }))
        // Drawn again only when something changed (or a present drops in), so the lights don't start over.
        const chave = JSON.stringify([lista.map((p) => p.id), arvoreProgresso])
        if (chave === arvoreDesenhada && !novo) return
        arvoreDesenhada = chave
        $(".meta .arvore").innerHTML = Presente.arvore(lista, { progresso: arvoreProgresso, novo })
      }
      function soltar(em) {
        if (escondidos.delete(em)) desenharArvore(em)
      }
      // The call says it's Christmas while the goal is on; its own words come back after.
      function chamadaDeNatal(ligado) {
        const textos = { pix: "Pix de Natal", convite: "Seu presente na árvore da live" }
        for (const [classe, natalino] of Object.entries(textos)) {
          const el = document.querySelector(`#chamada .${classe}`)
          if (!el) continue
          el.dataset.texto ??= el.textContent
          const texto = ligado ? natalino : el.dataset.texto
          if (el.textContent !== texto) el.textContent = texto
        }
      }
      function natal(estado) {
        const m = estado.meta
        const ligado = m?.tema === "natal" && !!window.Presente
        natalDesde = ligado ? m.desde : null
        $(".meta").classList.toggle("natal", ligado)
        $(".meta .arvore").hidden = !ligado
        chamadaDeNatal(ligado)
        const subs = ligado && estado.subs?.desde === m.desde ? estado.subs : null
        $(".meta .sub").hidden = !subs
        if (subs) $(".meta .sub").textContent = `Próximo sub de presente com mais R$ ${reais(subs.cada * (subs.devidos + 1) - m.arrecadado)}`
        if (!ligado) return
        arvoreItens = estado.arvore ?? []
        arvoreProgresso = m.alvo ? m.arrecadado / m.alvo : 0
        desenharArvore()
      }
      function mostrarPresente(presente, em) {
        $(".marca").hidden = !!em
        $(".presente").hidden = !em
        if (em) $(".presente").innerHTML = Presente.figura(Presente.normalizar(presente, em))
      }
      const esperar = (ms) => new Promise((r) => setTimeout(r, ms))
      // A gift sub drawn by the dock: who was in the stand spins in the band, slowing down, and stops on the winner.
      async function mostrarSorteio(s) {
        const nomes = [...new Set(s.candidatos?.length ? s.candidatos : [s.login])].sort(() => Math.random() - 0.5)
        const fala = falar(`O sub de presente vai para ${s.login.replace(/_/g, " ")}!`, "antonio")
        mostrarPresente({ formato: "caixa", cor: "#e03131", detalhe: "#ffd23f", padrao: "liso" }, "sorteio")
        $(".rotulo").textContent = "Sorteio · sub de presente"
        $(".mensagem").textContent = "Quem está na arquibancada concorre"
        const alerta = $(".alerta")
        alerta.style.setProperty("--dura", "12s")
        alerta.classList.remove("tocando")
        void alerta.offsetWidth
        alerta.classList.add("tocando")
        chime()
        await esperar(900)
        let passo = 55
        for (let t = 0, i = 0; t < 4200; t += passo, passo *= 1.13) {
          $(".nome").textContent = nomes[i++ % nomes.length]
          await esperar(passo)
        }
        $(".nome").textContent = s.login
        $(".mensagem").textContent = "Ganhou um sub de presente! Feliz Natal!"
        chime()
        // The stand (torcida.html) puts the winner's fan forward, if they're there: OBS's sources share this storage.
        try {
          localStorage.setItem("natal:sorteio", JSON.stringify({ login: s.login, em: Date.now() }))
        } catch {}
        const inicio = Date.now()
        const voz = await Promise.race([fala, esperar(4000).then(() => null)])
        if (voz) await tocar(voz)
        await esperar(Math.max(0, 6000 - (Date.now() - inicio)))
        alerta.classList.remove("tocando")
        if (!DEMO) await pedir("/canal", { acao: "sorteio", sk: s.sk, exibido: true }).catch(() => {})
      }

      function meta(m) {
        $(".meta").hidden = !m
        if (!m) return
        $(".meta .titulo").textContent = m.titulo || "Meta"
        $(".meta .valor").textContent = `R$ ${reais(m.arrecadado)} de R$ ${reais(m.alvo)}`
        $(".meta .pct").textContent = `${Math.floor((m.arrecadado / m.alvo) * 100)}%`
        $(".barra div").style.width = `${Math.min(100, (m.arrecadado / m.alvo) * 100)}%`
        $(".meta .prazo").hidden = !m.prazo
        if (m.prazo) $(".meta .prazo").textContent = prazo(m)
      }

      // "até 30/11 · faltam 16 dias": the goal's last day is the day before its `prazo` (a Brasília midnight). Past the
      // target, what still comes in is extra.
      const diaBR = (t) => new Date(t).toLocaleDateString("sv-SE", { timeZone: "America/Sao_Paulo" })
      function prazo(m) {
        const ultimo = diaBR(Date.parse(m.prazo) - 1)
        const faltam = Math.round((Date.parse(ultimo) - Date.parse(diaBR(Date.now()))) / 86_400_000)
        const ate = `até ${ultimo.slice(8)}/${ultimo.slice(5, 7)}`
        if (m.arrecadado >= m.alvo) return `Batida! O que vier ${ate} é extra`
        return `${ate} · ${faltam <= 0 ? "último dia" : faltam === 1 ? "falta 1 dia" : `faltam ${faltam} dias`}`
      }

      async function ler() {
        const estado = await pedir("/canal").catch(() => null)
        if (!estado) return
        meta(estado.meta)
        // A song's announcement waits for the song.
        for (const r of estado.reservas) if (!r.musica) preparar(r)
        const recente = new Date(estado.agora - 6 * 3600 * 1000).toISOString()
        // Oldest first, so they play in the order they came.
        for (const p of [...estado.pix].reverse()) {
          // What changed since it was queued: a song made, a skip from the dock.
          const naFila = fila.find((f) => f.sk === p.sk)
          if (naFila) Object.assign(naFila, p)
          if (p.sk === atual && p.pular) pararMusica?.()
          const visto = vistos.get(p.sk)
          if (p.exibido || p.sk === atual || p.sk < recente || fila.some((f) => f.sk === p.sk) || (visto && Date.now() - visto < 30000)) continue
          vistos.set(p.sk, Date.now())
          fila.push(p)
          if (estado.meta?.tema === "natal" && p.sk >= estado.meta.desde) escondidos.add(p.sk.slice(0, 24))
        }
        // The gift subs the dock drew, in the same queue: each plays once.
        for (const sorteio of estado.subs?.sorteios ?? []) {
          const id = `sorteio:${sorteio.sk}`
          const visto = vistos.get(id)
          if (sorteio.exibido || sorteio.em < recente || id === atual || fila.some((f) => f.sk === id) || (visto && Date.now() - visto < 30000)) continue
          vistos.set(id, Date.now())
          fila.push({ sk: id, quando: "agora", sorteio })
        }
        natal(estado)
        proximo()
      }

      if (params.get("demo") === "letra") {
        // The lyrics alone, frozen on a line, to place them (and for pictures).
        $(".rotulo").textContent = "Música · R$ 5,00"
        $(".nome").textContent = "Ana"
        $(".mensagem").textContent = "♪ Funk · o Luan perdendo gol feito"
        $(".alerta").classList.add("tocando", "mini")
        $(".alerta").style.animation = "none"
        letra.style.setProperty("--topo", `${Math.round(132 + $(".faixa").offsetHeight * 0.55 + 14)}px`)
        mostrarLinha("Presta atenção na jogada que o Luan vai fazer!", "Ele tá com a bola, tá livre o caminho!")
        letra.classList.add("ativa")
      } else if (params.get("demo") === "natal") {
        // A Christmas goal with its tree, a Pix every 12 s hanging its present, and a gift sub drawn every third.
        const agora = Date.now()
        const desde = new Date(agora - 5 * 86_400_000).toISOString()
        const prazo = new Date(agora + 20 * 86_400_000).toISOString()
        const itens = Array.from({ length: 16 }, (_, i) => ({ em: new Date(agora - (16 - i) * 3_600_000).toISOString(), centavos: [100, 300, 200, 500][i % 4] }))
        let arrecadado = itens.reduce((t, p) => t + p.centavos, 0)
        const estado = () => ({
          meta: { titulo: "Natal na live", alvo: 10000, arrecadado, desde, prazo, tema: "natal" },
          arvore: itens,
          subs: { desde, cada: 1000, devidos: Math.floor(arrecadado / 1000), sorteios: [] },
        })
        const atualizar = () => (meta(estado().meta), natal(estado()))
        atualizar()
        const NOMES = ["Ana", "pedrinho_rl", "", "Duda"]
        const MSGS = ["Feliz Natal, Luan!", "Bora bater a meta!", "", "Presente pra árvore!"]
        const PRESENTES = [{ formato: "sino", cor: "#e03131", detalhe: "#ffd23f", padrao: "listras" }, { formato: "caixa", cor: "#85a7ff", detalhe: "#f4f5f7", padrao: "bolinhas" }, undefined, { formato: "estrela", cor: "#ffd23f", detalhe: "#e03131", padrao: "bolinhas" }]
        let n = 0
        const um = () => {
          if (++n % 3 === 0) {
            fila.push({ sk: `sorteio:demo${n}`, quando: "agora", sorteio: { sk: `demo${n}`, login: "pedrinho_rl", candidatos: ["ana", "pedrinho_rl", "duda_gamer", "exp0nja", "o_jkxss", "eduzeras07", "leila_m_30"] } })
            return proximo()
          }
          const i = (n - 1) % 4
          const em = new Date().toISOString()
          const p = { sk: `${em}#demo${n}`, nome: NOMES[i], mensagem: MSGS[i], centavos: [500, 1000, 201, 2000][i], voz: "antonio", quando: "agora", presente: PRESENTES[i] }
          itens.push({ em, centavos: p.centavos, presente: p.presente })
          arrecadado += p.centavos
          escondidos.add(em)
          atualizar()
          fila.push(p)
          proximo()
        }
        um()
        setInterval(um, 12000)
      } else if (DEMO) {
        const nomes = ["Ana", "pedrinho_rl", "", "Duda"]
        const msgs = ["Que gol, Luan!", "Bora subir pra Campeão", "", "Manda um abraço pra galera do Discord!"]
        let n = 0
        meta({ titulo: "Microfone novo", alvo: 50000, arrecadado: 12345, prazo: new Date(Date.now() + 9 * 86_400_000).toISOString() })
        const um = () => {
          const i = n++ % nomes.length
          fila.push({ sk: `demo${n}`, nome: nomes[i], mensagem: msgs[i], centavos: [500, 1000, 201, 2000][i], voz: "antonio", quando: "agora" })
          proximo()
        }
        um()
        setInterval(um, 12000)
      } else if (API && CHAVE) {
        ler()
        setInterval(ler, 2000)
      }
    </script>
  </body>
</html>
