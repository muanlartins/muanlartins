<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Jogo · muanlartins</title>
    <link rel="stylesheet" href="stream.css" />
    <!--
      OBS: Browser source, 1920×1080, above the game capture. Transparent
      except for the camera frame. The camera goes under it, 480×270 at
      (44, 740): bottom left, clear of Rocket League's boost meter and
      scoreboard. ?lado=direita moves it to the right, ?altura=cima to the top
      (the positions are in brand/README.md). ?chat=1 adds the Twitch chat on
      the other side, above the boost meter, on a translucent pane while it has
      messages (?canal= and ?demo as in conversa.html); with ?jogo=valorant it
      starts at y 340, under Valorant's killfeed. The rank and the day's record sit on the frame's top edge
      while the "Partidas" dock (partidas.html) sends them; ?placar=0 leaves them out (the commented videos, recorded
      after the live: the frame and the site, not the day's record).
    -->
    <style>
      .hole {
        position: absolute;
        width: 480px;
        height: 270px;
        left: 44px;
        top: 740px;
      }
      .hole.right {
        left: auto;
        right: 44px;
      }
      .hole.top {
        top: 44px;
      }
      .game-chat {
        top: 96px;
        right: 44px;
        width: 420px;
        height: 640px;
      }
      /* Valorant's killfeed is at the top right: there the chat starts under it. */
      .game-chat.valorant {
        top: 340px;
        height: 420px;
      }
      .game-chat.left {
        right: auto;
        left: 44px;
      }
      /* The chat's ground: a navy pane behind the messages, cut at 45° like the camera frame, as tall as
         they are, so the chat reads on any arena without covering the game when it's quiet. */
      .chat-pane {
        position: absolute;
        top: 84px;
        right: 32px;
        width: 444px;
        bottom: 332px;
        background: rgb(0 20 71 / 0.5);
        clip-path: polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px);
        transition:
          opacity 0.6s var(--ease),
          top 0.5s var(--ease);
      }
      .chat-pane.valorant {
        bottom: 308px;
      }
      .chat-pane.left {
        right: auto;
        left: 32px;
      }
      .chat-pane.empty {
        opacity: 0;
      }
      /* While the VAR's mini player is up (var.html, top right), its vote takes the chat's place. */
      .game-chat {
        transition: opacity 0.5s var(--ease);
      }
      .var-mini .game-chat,
      .var-mini .chat-pane {
        opacity: 0;
      }
      /* Over the game the cards need more ground to read on any arena. */
      .game-chat .message {
        background: rgb(0 20 71 / 0.82);
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="hole"></div>
      <div id="plate"></div>
      <div id="record"></div>
      <div class="chat-pane empty" id="chat-pane" hidden></div>
      <div class="game-chat" id="chat" hidden></div>
    </main>
    <script src="stream.js"></script>
    <script>
      const BAND = 12
      const hole = document.querySelector(".hole")
      hole.classList.toggle("right", params.get("lado") === "direita")
      hole.classList.toggle("top", params.get("altura") === "cima")
      const border = frame(hole, { band: BAND })

      // The plate straddles the frame's bottom edge, flush with its left side.
      const tab = document.getElementById("plate")
      const attention = plate(tab, `muanlartins<span class="accent">.com.br</span>`)
      tab.style.left = `${hole.offsetLeft - BAND}px`
      tab.style.top = `${hole.offsetTop + hole.offsetHeight + BAND - 26}px`

      // Every 5 s, in turn: the plate's line wipes, or the frame catches the light.
      alternate(5, attention, border.glint)

      // The rank and the day's record, from the "Partidas" dock; hidden until it sends them. In Valorant's scene
      // (?jogo=valorant), from scripts/valorant.py instead (?valorant= its address).
      if (params.get("placar") !== "0") {
        if (params.get("jogo") === "valorant") valorantPlate(document.getElementById("record"), hole, BAND, params.get("valorant") ?? "http://127.0.0.1:8792")
        else recordPlate(document.getElementById("record"), hole, BAND)
      }

      // Opposite the camera; messages leave after 45 s so a quiet chat leaves the game clear.
      if (params.get("chat") === "1") {
        const box = document.getElementById("chat")
        box.hidden = false
        box.classList.toggle("left", params.get("lado") === "direita")
        const pane = document.getElementById("chat-pane")
        pane.hidden = false
        pane.classList.toggle("left", params.get("lado") === "direita")
        // In Valorant, under its killfeed.
        box.classList.toggle("valorant", params.get("jogo") === "valorant")
        pane.classList.toggle("valorant", params.get("jogo") === "valorant")
        // From the oldest message still there (or the column's faded top) down. Messages fading out still count.
        const fit = () => {
          pane.classList.toggle("empty", !box.children.length)
          const first = [...box.children].find((el) => el.offsetTop + el.offsetHeight > 0)
          if (first) pane.style.top = `${box.offsetTop + Math.max(0, first.offsetTop) - 12}px`
        }
        new MutationObserver(() => requestAnimationFrame(fit)).observe(box, { childList: true })
        chat(box, { keep: 45, max: 10 })
        addEventListener("muanlartins-var", ({ detail }) => {
          const v = varDe(detail)
          if (v) document.querySelector(".stage").classList.toggle("var-mini", v.fase !== "fechado" && v.layout === "mini")
        })
      }
    </script>
  </body>
</html>
