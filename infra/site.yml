AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  muanlartins.com.br (pt) and muanlartins.com (en): one private S3 bucket
  holding both static builds, one CloudFront distribution per domain, and the
  role GitHub Actions assumes to deploy. Both domains also serve RLR, the
  replay player, at /rlr/ from its own GitHub Pages site. The viewers'
  profiles (how their fan looks in the stream's crowd) live in a DynamoDB
  table behind a small HTTP API, signed in with Twitch; their Σ (points
  earned watching the lives) in another, behind its own; the Pix sent during
  the lives in a third, behind a function CI deploys. Create in us-east-1,
  where CloudFront certificates must live.

Parameters:
  ZoneIdPt:
    Type: AWS::Route53::HostedZone::Id
    Description: Hosted zone of muanlartins.com.br
  ZoneIdEn:
    Type: AWS::Route53::HostedZone::Id
    Description: Hosted zone of muanlartins.com
  GitHubRepo:
    Type: String
    Default: muanlartins/muanlartins
    Description: owner/repo allowed to deploy, from its main branch only
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: '"false" if the account already trusts token.actions.githubusercontent.com'

  TwitchClientId:
    Type: String
    Default: ""
    Description: Client ID of the Twitch app the profile page signs in with (dev.twitch.tv/console)
  SigmaChave:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: The key the stream's crowd overlay sends to credit Σ; it lives only here and in OBS's source URL
  PixChave:
    Type: String
    NoEcho: true
    Description: The Pix key the viewers pay to, as the bank's own QR carries it (a random key, chave aleatória)
  PixNome:
    Type: String
    MaxLength: 25
    Description: The receiver's name exactly as the bank's own QR carries it (field 59)
  PixCidade:
    Type: String
    MaxLength: 15
    Description: The receiver's city exactly as the bank's own QR carries it (field 60)
  PixToken:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: The token the phone sends with each bank notification; it lives only here and in MacroDroid

Conditions:
  CreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  # ListBucket lets S3 answer 404 instead of 403 for missing pages.
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: [s3:GetObject, s3:ListBucket]
            Resource:
              - !GetAtt Bucket.Arn
              - !Sub ${Bucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn:
                  - !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionPt}
                  - !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionEn}

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: muanlartins.com.br
      SubjectAlternativeNames:
        - www.muanlartins.com.br
        - muanlartins.com
        - www.muanlartins.com
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: muanlartins.com.br
          HostedZoneId: !Ref ZoneIdPt
        - DomainName: www.muanlartins.com.br
          HostedZoneId: !Ref ZoneIdPt
        - DomainName: muanlartins.com
          HostedZoneId: !Ref ZoneIdEn
        - DomainName: www.muanlartins.com
          HostedZoneId: !Ref ZoneIdEn

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Next exports /profissional as profissional.html; www and trailing
  # slashes redirect to the one canonical URL. RLR's pages, under /rlr/,
  # go to GitHub Pages as they are, after the www redirect.
  UrlFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-urls
      AutoPublish: true
      FunctionConfig:
        Comment: www and trailing-slash redirects, extensionless pages
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function redirect(location) {
          return { statusCode: 301, statusDescription: "Moved Permanently", headers: { location: { value: location } } }
        }

        function handler(event) {
          var request = event.request
          var host = request.headers.host.value
          var uri = request.uri

          if (host.startsWith("www.")) return redirect("https://" + host.slice(4) + uri)
          if (uri === "/rlr") return redirect("/rlr/")
          if (uri.startsWith("/rlr/")) return request
          if (uri.length > 1 && uri.endsWith("/")) return redirect(uri.slice(0, -1))

          if (uri === "/") request.uri = "/index.html"
          else if (!uri.split("/").pop().includes(".")) request.uri = uri + ".html"
          return request
        }

  DistributionPt:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: muanlartins.com.br
        Aliases: [muanlartins.com.br, www.muanlartins.com.br]
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginPath: /pt
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: rlr
            DomainName: muanlartins.github.io
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlFunction.FunctionMetadata.FunctionARN
        # RLR as GitHub Pages serves it (github.com/muanlartins/rlr).
        CacheBehaviors:
          - PathPattern: /rlr/*
            TargetOriginId: rlr
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt UrlFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html

  DistributionEn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: muanlartins.com
        Aliases: [muanlartins.com, www.muanlartins.com]
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginPath: /en
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: rlr
            DomainName: muanlartins.github.io
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlFunction.FunctionMetadata.FunctionARN
        # RLR as GitHub Pages serves it (github.com/muanlartins/rlr).
        CacheBehaviors:
          - PathPattern: /rlr/*
            TargetOriginId: rlr
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt UrlFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html

  # Z2FDTNDATAQYW2 is the fixed hosted zone of every CloudFront distribution.
  RecordsPt:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref ZoneIdPt
      RecordSets:
        - { Name: muanlartins.com.br, Type: A, AliasTarget: { DNSName: !GetAtt DistributionPt.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
        - { Name: muanlartins.com.br, Type: AAAA, AliasTarget: { DNSName: !GetAtt DistributionPt.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
        - { Name: www.muanlartins.com.br, Type: A, AliasTarget: { DNSName: !GetAtt DistributionPt.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
        - { Name: www.muanlartins.com.br, Type: AAAA, AliasTarget: { DNSName: !GetAtt DistributionPt.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }

  RecordsEn:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref ZoneIdEn
      RecordSets:
        - { Name: muanlartins.com, Type: A, AliasTarget: { DNSName: !GetAtt DistributionEn.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
        - { Name: muanlartins.com, Type: AAAA, AliasTarget: { DNSName: !GetAtt DistributionEn.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
        - { Name: www.muanlartins.com, Type: A, AliasTarget: { DNSName: !GetAtt DistributionEn.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
        - { Name: www.muanlartins.com, Type: AAAA, AliasTarget: { DNSName: !GetAtt DistributionEn.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  # No keys stored in GitHub: the workflow trades its OIDC token for this role.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub ${Bucket.Arn}/*
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource:
                  - !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionPt}
                  - !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionEn}
              # The Pix function's code lives in infra/pix and ships with each push, like the site.
              - Effect: Allow
                Action: lambda:UpdateFunctionCode
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-pix

  # --- Viewer profiles: /perfil on the site saves each viewer's fan; the stream's crowd reads them ---------

  Torcedores:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: login, AttributeType: S }]
      KeySchema: [{ AttributeName: login, KeyType: HASH }]

  PerfilRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: torcedores
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:BatchGetItem]
                Resource: !GetAtt Torcedores.Arn

  # GET /torcedores?logins=a,b is public: the looks of whoever is in the stand. GET, PUT and DELETE /eu
  # take the viewer's Twitch token, checked with Twitch on each call; what's saved is only what the
  # fan looks like, under their login, and the overlay ignores anything it doesn't know.
  Perfil:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt PerfilRole.Arn
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE: !Ref Torcedores
          TWITCH_CLIENT_ID: !Ref TwitchClientId
      Code:
        ZipFile: |
          const { DynamoDBClient } = require("@aws-sdk/client-dynamodb")
          const { DynamoDBDocumentClient, GetCommand, PutCommand, DeleteCommand, BatchGetCommand } = require("@aws-sdk/lib-dynamodb")
          const db = DynamoDBDocumentClient.from(new DynamoDBClient({}))
          const T = process.env.TABLE
          const ID = /^[a-z0-9-]{1,16}$/
          const COR = /^#[0-9a-f]{6}$/
          const LOGIN = /^[a-z0-9_]{1,25}$/
          const EMOJI = /^\p{Extended_Pictographic}[\p{Extended_Pictographic}\p{Emoji_Modifier}\u200d\ufe0f]*$/u
          const out = (statusCode, body) => ({ statusCode, headers: { "content-type": "application/json" }, body: JSON.stringify(body) })

          // Who is calling: their Twitch token, issued to this site's app.
          async function quem(headers) {
            const token = (headers.authorization || "").replace(/^Bearer /, "")
            if (!token) return null
            const r = await fetch("https://id.twitch.tv/oauth2/validate", { headers: { Authorization: "OAuth " + token } })
            if (!r.ok) return null
            const v = await r.json()
            return v.client_id === process.env.TWITCH_CLIENT_ID && LOGIN.test(v.login) ? v : null
          }

          // Only the shape of each choice is checked; torcedor.js knows the options and drops the rest.
          function limpa(a) {
            const o = {}
            if (!a || typeof a !== "object") return o
            for (const k of ["cabeca", "roupa", "acessorio", "comemoracao"]) if (ID.test(a[k])) o[k] = a[k]
            for (const k of ["cor", "detalhe"]) if (typeof a[k] === "string" && COR.test(a[k].toLowerCase())) o[k] = a[k].toLowerCase()
            if (Number.isInteger(a.numero) && a.numero >= 0 && a.numero <= 99) o.numero = a.numero
            if (typeof a.frase === "string") o.frase = [...a.frase.replace(/\s+/g, " ").trim()].slice(0, 30).join("").trim()
            const st = (l) => (Array.isArray(l) ? l.filter((e) => typeof e === "string" && e.length <= 16 && EMOJI.test(e)).slice(0, 3) : [])
            if (a.stickers && typeof a.stickers === "object") o.stickers = { gol: st(a.stickers.gol), contra: st(a.stickers.contra) }
            return o
          }

          exports.handler = async (event) => {
            const metodo = event.requestContext.http.method
            const caminho = event.rawPath
            // The $default route takes the browser's preflight too; API Gateway adds the CORS headers.
            if (metodo === "OPTIONS") return { statusCode: 204 }
            if (metodo === "GET" && caminho === "/torcedores") {
              const logins = [...new Set((event.queryStringParameters?.logins || "").toLowerCase().split(","))].filter((l) => LOGIN.test(l)).slice(0, 100)
              if (!logins.length) return out(200, {})
              const r = await db.send(new BatchGetCommand({ RequestItems: { [T]: { Keys: logins.map((login) => ({ login })) } } }))
              return out(200, Object.fromEntries((r.Responses?.[T] || []).map((i) => [i.login, i.aparencia])))
            }
            if (caminho !== "/eu") return out(404, {})
            const v = await quem(event.headers || {})
            if (!v) return out(401, { erro: "Entre com a Twitch de novo." })
            const Key = { login: v.login }
            if (metodo === "GET") {
              const r = await db.send(new GetCommand({ TableName: T, Key }))
              return out(200, { login: v.login, aparencia: r.Item?.aparencia ?? null })
            }
            if (metodo === "PUT") {
              let corpo = event.body || "{}"
              if (event.isBase64Encoded) corpo = Buffer.from(corpo, "base64").toString()
              let aparencia
              try { aparencia = limpa(JSON.parse(corpo)) } catch { return out(400, {}) }
              await db.send(new PutCommand({ TableName: T, Item: { login: v.login, id: v.user_id, aparencia, em: new Date().toISOString() } }))
              return out(200, { login: v.login, aparencia })
            }
            if (metodo === "DELETE") {
              await db.send(new DeleteCommand({ TableName: T, Key }))
              return out(200, { login: v.login, aparencia: null })
            }
            return out(405, {})
          }

  PerfilApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-perfil
      ProtocolType: HTTP
      Target: !GetAtt Perfil.Arn
      CorsConfiguration:
        AllowOrigins:
          - https://muanlartins.com.br
          - https://muanlartins.com
          - http://localhost:3000
          - http://localhost:3001
          - http://localhost:8130
        AllowMethods: [GET, PUT, DELETE]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600

  PerfilApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Perfil
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PerfilApi}/*

  # Each API is public, so each caps its requests: past the limit API Gateway answers 429 without calling
  # (or billing) the function.
  PerfilApiLimite:
    Type: AWS::ApiGatewayV2::ApiGatewayManagedOverrides
    Properties:
      ApiId: !Ref PerfilApi
      Stage:
        DefaultRouteSettings: { ThrottlingRateLimit: 20, ThrottlingBurstLimit: 40 }

  # --- Σ: the viewers' points, one total each, earned in the lives and never spent ------------------------

  Sigmas:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: login, AttributeType: S }]
      KeySchema: [{ AttributeName: login, KeyType: HASH }]

  SigmaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: sigmas
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:BatchGetItem, dynamodb:UpdateItem]
                Resource: !GetAtt Sigmas.Arn

  # GET /sigmas?logins=a,b is public: each one's Σ, minutes watched, lives and streak. POST /presenca comes
  # from the crowd overlay once a minute while the stream is on, with who's in the chat and the key: each
  # gets 1 Σ a minute (once, however many calls), and on their first minute of a live 10 Σ plus 5 for each
  # live in a row before it, up to 50. A live is a day, in Luan's time; the item "#canal" keeps the last
  # two, which is how a streak knows it wasn't broken.
  Sigma:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt SigmaRole.Arn
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE: !Ref Sigmas
          CHAVE: !Ref SigmaChave
      Code:
        ZipFile: |
          const { DynamoDBClient } = require("@aws-sdk/client-dynamodb")
          const { DynamoDBDocumentClient, BatchGetCommand, UpdateCommand } = require("@aws-sdk/lib-dynamodb")
          const db = DynamoDBDocumentClient.from(new DynamoDBClient({}))
          const T = process.env.TABLE
          const LOGIN = /^[a-z0-9_]{1,25}$/
          const CANAL = "#canal"
          const out = (statusCode, body) => ({ statusCode, headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
          const lista = (l) => [...new Set(l.map((x) => String(x).toLowerCase()))].filter((x) => LOGIN.test(x)).slice(0, 100)
          async function ler(logins) {
            const r = await db.send(new BatchGetCommand({ RequestItems: { [T]: { Keys: logins.map((login) => ({ login })) } } }))
            return Object.fromEntries((r.Responses?.[T] || []).map((i) => [i.login, i]))
          }

          exports.handler = async (event) => {
            const metodo = event.requestContext.http.method
            const caminho = event.rawPath
            // The $default route takes the browser's preflight too; API Gateway adds the CORS headers.
            if (metodo === "OPTIONS") return { statusCode: 204 }
            if (metodo === "GET" && caminho === "/sigmas") {
              const logins = lista((event.queryStringParameters?.logins || "").split(","))
              if (!logins.length) return out(200, {})
              const itens = await ler(logins)
              return out(200, Object.fromEntries(Object.values(itens).map(({ login, sigma, minutos, lives, sequencia }) => [login, { sigma, minutos, lives, sequencia }])))
            }
            if (metodo !== "POST" || caminho !== "/presenca") return out(404, {})
            if (!process.env.CHAVE || event.headers?.["x-chave"] !== process.env.CHAVE) return out(401, {})
            let corpo = event.body || "{}"
            if (event.isBase64Encoded) corpo = Buffer.from(corpo, "base64").toString()
            let logins
            try { logins = lista(JSON.parse(corpo).logins || []) } catch { return out(400, {}) }
            const minuto = Math.floor(Date.now() / 60000)
            const hoje = new Date().toLocaleDateString("sv", { timeZone: "America/Sao_Paulo" })
            const canal = (await ler([CANAL]))[CANAL] || {}
            if (canal.ultima !== hoje) {
              await db.send(new UpdateCommand({ TableName: T, Key: { login: CANAL }, UpdateExpression: "SET ultima = :h, anterior = :a", ExpressionAttributeValues: { ":h": hoje, ":a": canal.ultima ?? null } }))
            }
            const anterior = canal.ultima !== hoje ? canal.ultima : canal.anterior
            const itens = logins.length ? await ler(logins) : {}
            let creditados = 0
            await Promise.all(logins.map(async (login) => {
              const i = itens[login] || {}
              const nova = i.ultimaLive !== hoje
              const sequencia = !nova ? i.sequencia || 1 : anterior && i.ultimaLive === anterior ? (i.sequencia || 0) + 1 : 1
              const ganho = 1 + (nova ? 10 + 5 * Math.min(sequencia - 1, 10) : 0)
              try {
                await db.send(new UpdateCommand({
                  TableName: T, Key: { login },
                  ConditionExpression: "attribute_not_exists(minuto) OR minuto < :m",
                  UpdateExpression: "SET minuto = :m, ultimaLive = :h, sequencia = :s ADD sigma :g, minutos :um, lives :l",
                  ExpressionAttributeValues: { ":m": minuto, ":h": hoje, ":s": sequencia, ":g": ganho, ":um": 1, ":l": nova ? 1 : 0 },
                }))
                creditados++
              } catch (e) {
                if (e.name !== "ConditionalCheckFailedException") throw e
              }
            }))
            return out(200, { creditados })
          }

  SigmaApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-sigma
      ProtocolType: HTTP
      Target: !GetAtt Sigma.Arn
      CorsConfiguration:
        AllowOrigins:
          - https://muanlartins.com.br
          - https://muanlartins.com
          - http://localhost:3000
          - http://localhost:3001
          - http://localhost:8130
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type, x-chave]
        MaxAge: 3600

  SigmaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Sigma
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SigmaApi}/*

  SigmaApiLimite:
    Type: AWS::ApiGatewayV2::ApiGatewayManagedOverrides
    Properties:
      ApiId: !Ref SigmaApi
      Stage:
        DefaultRouteSettings: { ThrottlingRateLimit: 20, ThrottlingBurstLimit: 40 }

  # --- Live Pix: /pix on the site reserves a value, the phone forwards the bank's notification, the stream
  # shows what's paid. The code is infra/pix/index.mjs (its header tells the whole story); CI deploys it into
  # this function on every push to main, so the code below is only what answers until the first deploy. --

  Pix:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  PixRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: pix
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource: !GetAtt Pix.Arn
              # A Pix sent signed in with Twitch earns its sender Σ.
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt Sigmas.Arn

  PixFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-pix
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt PixRole.Arn
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE: !Ref Pix
          SIGMAS: !Ref Sigmas
          CHAVE: !Ref SigmaChave
          PIX_CHAVE: !Ref PixChave
          PIX_NOME: !Ref PixNome
          PIX_CIDADE: !Ref PixCidade
          PIX_TOKEN: !Ref PixToken
          TWITCH_CLIENT_ID: !Ref TwitchClientId
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 503, headers: { "content-type": "application/json" }, body: '{"erro":"O Pix ainda não foi publicado."}' })

  PixApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-pix
      ProtocolType: HTTP
      Target: !GetAtt PixFunction.Arn
      CorsConfiguration:
        AllowOrigins:
          - https://muanlartins.com.br
          - https://muanlartins.com
          - http://localhost:3000
          - http://localhost:3001
          - http://localhost:8130
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type, authorization, x-chave]
        MaxAge: 3600

  PixApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PixFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PixApi}/*

  # Higher: every viewer paying polls their reservation every 2 s. /reservar also caps each IP (index.mjs).
  PixApiLimite:
    Type: AWS::ApiGatewayV2::ApiGatewayManagedOverrides
    Properties:
      ApiId: !Ref PixApi
      Stage:
        DefaultRouteSettings: { ThrottlingRateLimit: 50, ThrottlingBurstLimit: 100 }

Outputs:
  PerfilApiUrl:
    Value: !GetAtt PerfilApi.ApiEndpoint
  SigmaApiUrl:
    Value: !GetAtt SigmaApi.ApiEndpoint
  PixApiUrl:
    Value: !GetAtt PixApi.ApiEndpoint
  PixFunction:
    Value: !Ref PixFunction
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  Bucket:
    Value: !Ref Bucket
  DistributionPt:
    Value: !Ref DistributionPt
  DistributionEn:
    Value: !Ref DistributionEn
