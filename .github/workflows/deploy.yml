name: Deploy

# Pull requests build both sites; a push to main also publishes them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # The profile API's routes against a table in memory; the 3D fan's shared module (and its drift from the 2D fan's
      # torcedor.js) and the agents' kit on it (scripts/torcedor, with its Python CLI); the Pix API (songs above all)
      # against DynamoDB, S3 and Lambda in memory (infra/pix/local) and a fake Google.
      - run: node --test infra/perfil/index.test.mjs infra/perfil/discord.test.mjs infra/comum/agenda.test.mjs infra/sigma/texto.test.mjs infra/sigma/duelo.test.mjs infra/sigma/dedicatorias.test.mjs infra/sigma/corrida.test.mjs scripts/duelo-motor.test.mjs scripts/corrida-motor.test.mjs scripts/torcedor3d.test.mjs scripts/torcedor/torcedor.test.mjs
      - run: node --import ./infra/pix/local/registrar.mjs --test infra/pix/index.test.mjs

      - name: Build
        run: |
          pnpm build && mv out out-pt
          pnpm build:en && mv out out-en

      - if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Hashed assets never change; pages are re-fetched by browsers and
      # held by CloudFront until the invalidation below. musicas/ and replays/
      # aren't the build's: the Pix songs, which the Pix API writes there, and
      # the lives' replays, which replays.yml copies there. valorant/falas/ is
      # Universo Valorant's voice lines, which falas.yml copies there.
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          BUCKET: ${{ vars.SITE_BUCKET }}
        run: |
          for locale in pt en; do
            aws s3 sync "out-$locale/_next/static" "s3://$BUCKET/$locale/_next/static" \
              --cache-control "public, max-age=31536000, immutable"
            aws s3 sync "out-$locale" "s3://$BUCKET/$locale" --delete --exclude "_next/static/*" --exclude "musicas/*" --exclude "replays/*" --exclude "valorant/falas/*" \
              --cache-control "public, max-age=0, s-maxage=31536000, must-revalidate"
          done
          aws cloudfront create-invalidation --distribution-id "${{ vars.DISTRIBUTION_PT }}" --paths "/*"
          aws cloudfront create-invalidation --distribution-id "${{ vars.DISTRIBUTION_EN }}" --paths "/*"

      # The APIs' functions (infra/<name>, each with infra/comum linked in as ./comum): each is deployed once the
      # repository variable naming it (the stack's output) is set. cp -L turns the link into the files themselves;
      # tests and local/ (the Pix API's stand-ins for running it on a laptop) stay out of the zip. The profile API's
      # zip also gets the Discord bot's token from the secret DISCORD_BOT (infra/perfil/index.mjs reads it), as this
      # role may change a function's code but not its settings.
      - name: Publish the functions
        if: env.PUBLISH == 'true'
        env:
          PERFIL: ${{ vars.PERFIL_FUNCTION }}
          SIGMA: ${{ vars.SIGMA_FUNCTION }}
          PIX: ${{ vars.PIX_FUNCTION }}
          DISCORD_BOT: ${{ secrets.DISCORD_BOT }}
        run: |
          publish() {
            if [ -z "$2" ]; then echo "$1: no function named yet, skipped"; return; fi
            rm -rf "build/$1" && mkdir -p build && cp -rL "infra/$1" "build/$1"
            if [ "$1" = perfil ] && [ -n "$DISCORD_BOT" ]; then printf %s "$DISCORD_BOT" > build/perfil/discord-bot.txt; fi
            (cd "build/$1" && zip -q -r "../$1.zip" . -x '*.test.*' 'local/*')
            aws lambda update-function-code --function-name "$2" --zip-file "fileb://build/$1.zip" > /dev/null
            echo "$1: published"
          }
          publish perfil "$PERFIL"
          publish sigma "$SIGMA"
          publish pix "$PIX"
